    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      #app:not([data-v-app]) {
        height: 100%;
      }
      .app-loading-spinner {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .app-loading-spinner .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .app-loading-spinner .loader {
        display: flex;
        gap: 1rem;
      }

      .app-loading-spinner .loader .dot {
        width: 1.5rem;
        height: 1.5rem;
        background-color: #757575;
        border-radius: 100%;
        animation: 1s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite dot-grow;
        animation-delay: 0.1s;
      }

      .app-loading-spinner .loader .dot:first-child {
        animation-delay: 0s;
      }

      .app-loading-spinner .loader .dot:last-child {
        animation-delay: 0.2s;
      }

      @media (max-width: 920px) {
        .app-loading-spinner .loader {
          gap: 0.5rem;
        }
        .app-loading-spinner .loader .dot {
          width: 1rem;
          height: 1rem;
        }
      }

      @keyframes dot-grow {
        0% {
          transform: scale(0);
        }
        50% {
          transform: scale(1);
        }
      }
    </style>
