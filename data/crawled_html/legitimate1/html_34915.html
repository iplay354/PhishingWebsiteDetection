<script>
$(document).ready(function() {
	// Change background depending on user's time
	function applyclass(){
		var d = new Date();
		var n = d.getHours();
		if (n > 0 && n < 9)
		// Midnight-9:00 AM
		$('#banner').addClass('sunrise');
		else if (n > 8 && n < 11 )
		// 8:00 AM-11:00 AM
		$('#banner').addClass('morning');
		else if (n > 10 && n < 15 )
		// 11:00 AM-3:00 PM
		$('#banner').addClass('day');
		else if (n > 14 && n < 18 )
		// 3:00 PM-5:00 PM
		$('#banner').addClass('evening');
		else
		// 5:00 PM-Midnight
		$('#banner').addClass('sunset');
		}
		window.onload = applyclass;	
	
		// returning visit?
		var visited = jQuery.cookie('visited');
		if (visited == undefined){
			$('#home-wrapper .logo').addClass('ready');
			$('#home-wrapper .tagline').addClass('ready');
			$('#global-nav').addClass('ready');
			$('#bottom-row').addClass('ready');
			var date = new Date();
			var mins = 60;
			date.setTime(date.getTime() + (mins * 60 * 1000));
			$.cookie('visited', 'paused', { expires: date });
		}
		else{
			$('#home').addClass('paused');
		}

	});	
</script>
