<body>
<div class="container"></div>
<div class="message">
    <div class="logo"><img src="/errors/postbeeld/images/logo.png"/></div>
    <form id="recpatcha-form" method="POST">
    <button id="verify" class="g-recaptcha" data-sitekey="6Lcax00UAAAAAAIztedA5DvduYZbWGNQ_A4pperY" data-callback="onSubmit">Submit</button>
</form>
<div id="main" class="col-main">
    <div class="page-title">
        <h1>Processing your request...</h1>
    </div>
    <p>We are trying to figure out if you are a human or a computer program.</p>
    <p>A test may follow.</p>
</div>
<div class="loadingbar">
    <div class="bar" id="loading"></div>
</div>
<script src="https://www.recaptcha.net/recaptcha/api.js" async defer></script>
<script type="text/javascript">
    verify = function (){
        document.getElementById("verify").click();
    };
    var onSubmit = function(response) {
        document.getElementById("recpatcha-form").submit();
    };
    setTimeout(function(){
        verify();
    }, 1000);

    var start = new Date();
    var maxTime = 20000;
    var timeoutVal = Math.floor(maxTime / 100);
    animateUpdate();

    function updateProgress (percentage) {
        var div = document.getElementById('loading');
        div.style.width = percentage + '%';
    }

    function animateUpdate () {
        var now = new Date();
        var timeDiff = now.getTime() - start.getTime();
        var perc = Math.round((timeDiff / maxTime) * 100);
        if (perc <= 100) {
            updateProgress(perc);
            setTimeout(animateUpdate, timeoutVal);
        }
    }
</script>
</div>
</body>
