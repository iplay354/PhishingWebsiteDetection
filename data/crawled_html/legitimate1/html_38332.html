<meta name="description" content="Leslie Tonkonow Artworks + Projects is a contemporary art gallery located in New York City at 401 Broadway in the Tribeca art gallery district. The gallery specializes in modern and contemporary art from the 1960s to the present, created in a wide range of mediums including drawings, prints, paintings, sculpture, photography, and video. The gallery represents a roster of internationally recognized artists and Estates. It organizes group and solo exhibitions, selling works by gallery artists and others, and promotes the careers of represented artists by placing works in museum and private collections, through advertising, press outreach, and working to secure public art commissions." />
