<script type="text/javascript">
  function svSetItem(data)
  {
    if (data)
    {
      var titleDiv=data.TextHeight>0?'<div class="title" style="width:'+(data.ImageWidth-10)+'px;line-height:'+data.TextHeight+'px;">'+data.ArtistName+'</div>':'<div class="title-overlay" style="width:'+(data.ImageWidth-20)+'px;height:'+(data.ImageHeight-20)+'px;"><div class="title-overlay-content"><div class="artist-name">'+data.ArtistName+'</div><div>&darr;</div><div class="product-name">'+data.ProductName+'</div></div></div>';
      return '<a href="'+data.ItemUrl+data.Id+'"><div class="image" style="width:'+data.ImageWidth+'px;height:'+data.ImageHeight+'px;background-image:url('+data.ImageUrl+');"></div>'+titleDiv+'</a>';
    }
    return '';
  }
  function svChangeItem(e)
  {
    e.preventDefault();
    var posMult=e.currentPage==0&&(e.currentPage-e.nextPage==0)?-1:e.nextPage-e.currentPage;
    var currentIndex=parseInt(e.sender.element.prop('currentIndex'));
    if ((currentIndex==0&&posMult<0)||(currentIndex==e.sender.dataSource.data().length-e.sender.options.itemsPerPage&&posMult>0))
      return;
    e.sender.element.prop('currentIndex',currentIndex+posMult);
    var nextPos=parseInt(e.sender.element.css('text-indent'))+parseInt($('#'+e.sender.element.attr('id')+' .scroll-item .image').css('width'))*-1*posMult;
    e.sender.element.animate(
    {
      textIndent: nextPos
    },
    {
      step: function(go)
      {
        $(this).children('div:first-child').css('transform','translate3d('+go+'px,0,0)');
      },
      duration: 400,
      start: function()
      {
        $('#'+$(this).attr('id')+' ~ #prev,#'+$(this).attr('id')+' ~ #next').off();
      },
      complete: function()
      {
        if (Math.abs(nextPos)<$('.scrollview-container').width())
        {
          $(this).css('text-indent',nextPos);
          e.sender.trigger('change');
        }
        else
        {
          $(this).css('text-indent',0);
          $(this).children('div:first-child').css('transform','translate3d(0,0,0)');
          e.sender.scrollTo(e.nextPage);
        }
        svBindNav($(this).attr('id'));
      }
    });
  }
  function svBindNav(id)
  {
    $('#'+id+' ~ #prev').click(function(e)
    {
      $('#'+id).data('kendoMobileScrollView').prev();
    });
    $('#'+id+' ~ #next').click(function(e)
    {
      $('#'+id).data('kendoMobileScrollView').next();
    });
  }
</script>
<div class="section">
  
<div class="scrollview-container">
  <div class="k-loading-2"></div>

<script type="text/javascript">
  var featuredArtistsScrollViewTimer=null;
  $(function()
  {
    
    featuredArtistsScrollViewCreate();
    svBindNav('featuredArtistsScrollView');
  });
  function featuredArtistsScrollViewCreate()
  {
    var featuredArtistsScrollViewIPP=$(window).width()>$(window).height()?3:3;
    var featuredArtistsScrollViewIW=400;
    var featuredArtistsScrollViewIH=225;
    var featuredArtistsScrollViewTH=40;
    $('#featuredArtistsScrollView').kendoMobileScrollView({
      autoBind: false,
      contentHeight: featuredArtistsScrollViewIH+featuredArtistsScrollViewTH,
      dataSource: new kendo.data.DataSource({
        transport:
        {
          read:
          {
            url:"/Api/GetFeaturedArtists/"
          }
        },
        serverPaging: false,
        change: function(e)
        {
          if (e.items.length==0)
            $('#featuredArtistsScrollView').hide();
          else if (e.items.length<featuredArtistsScrollViewIPP)
          {
            $('#featuredArtistsScrollView').parent('.scrollview-container').width(e.items.length*featuredArtistsScrollViewIW);
            $('#featuredArtistsScrollView').find('.km-virtual-page').width(e.items.length*featuredArtistsScrollViewIW);
            $('#featuredArtistsScrollView ~ .scrollview-button').hide();
          }
          $(e.items).each(function()
          {
            $(this).prop('ImageWidth',featuredArtistsScrollViewIW);
            $(this).prop('ImageHeight',featuredArtistsScrollViewIH);
            $(this).prop('TextHeight',featuredArtistsScrollViewTH);
            $(this).prop('ItemUrl','/Artist/');
          });
          $('#featuredArtistsScrollView').prop('lastIndex',e.items.length>featuredArtistsScrollViewIPP?e.items.length-featuredArtistsScrollViewIPP:0);
          $('#featuredArtistsScrollView').prop('scrollDirection',1);
        }
      }),
      enablePager: false,
      itemsPerPage: featuredArtistsScrollViewIPP,
      template: kendo.template(featuredArtistsScrollViewIPP==1?$("#ScrollViewTemplate1").html():$("#ScrollViewTemplate2").html()),
      duration: 0,
      changing: function(e) { if ($('#featuredArtistsScrollView').prop('currentIndex')!=0&&$('#featuredArtistsScrollView').prop('currentIndex')!=$('#featuredArtistsScrollView').prop('lastIndex')) clearTimeout(featuredArtistsScrollViewTimer);svChangeItem(e); },
      change: function(e) { featuredArtistsScrollViewTimer=setTimeout(featuredArtistsScrollViewTimeout,10000); }
    });
    $('#featuredArtistsScrollView').prop('currentIndex',0);
    $('#featuredArtistsScrollView').css('text-indent',0);
    $('#featuredArtistsScrollView ~ .scrollview-button').css('height',featuredArtistsScrollViewIH);
    $('#featuredArtistsScrollView').data('kendoMobileScrollView').pane.userEvents.bind('start',function() { this.cancel(); });
    $('#featuredArtistsScrollView').data('kendoMobileScrollView').dataSource.fetch();
  }
  function featuredArtistsScrollViewRefresh()
  {
    $('#featuredArtistsScrollView').data('kendoMobileScrollView').destroy();
    $('#featuredArtistsScrollView').empty();
    featuredArtistsScrollViewCreate();
  }
  function featuredArtistsScrollViewTimeout()
  {
    if ($('#featuredArtistsScrollView').prop('currentIndex')==0)
      $('#featuredArtistsScrollView').prop('scrollDirection',1);
    else if ($('#featuredArtistsScrollView').prop('currentIndex')==$('#featuredArtistsScrollView').prop('lastIndex'))
      $('#featuredArtistsScrollView').prop('scrollDirection',-1);
    if ($('#featuredArtistsScrollView').prop('scrollDirection')==1)
      $('#featuredArtistsScrollView').data("kendoMobileScrollView").next();
    else
      $('#featuredArtistsScrollView').data("kendoMobileScrollView").prev();
  }
</script>
