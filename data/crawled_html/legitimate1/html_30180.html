jQuery(document).ready(function ($) {
	$("#gesaffelstein-email-sign-up-self-hosted").on("submit", function (e) {
		// Prevent default browser actions on form submission.
		e.preventDefault();
		$("#submit").html("submitting...").prop('disabled', true).css('color','#808080');
		// Get all the form user submitted data and get it ready to be sent.
		var data = $(this).serialize();
		// POST all the data to the SMF submission endpoint URL.
		$.ajax({
			type: "POST",
			url: "https://subs.sonymusicfans.com/submit",
			dataType: "json",
			data: data,
			xhrFields: {
				withCredentials: false
			},
			success: function (data) {
				// Do things on successful submission.
				
				$("#gesaffelstein-email-sign-up-self-hosted").hide();
				$("#thankyou").show();
			},
			error: function (err) {
				// Do things when submission has an error.
				alert("An error has occured!");
				$("#submit").html("submit").prop('disabled', false).css('color','#000000');
			}
		});
	});	
});
