      @keyframes rotate {
        0% {
          transform: rotate(0deg);
          -webkit-transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
          -webkit-transform: rotate(360deg);
        }
      }

      @-webkit-keyframes rotate {
        0% {
          transform: rotate(0deg);
          -webkit-transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
          -webkit-transform: rotate(360deg);
        }
      }

      @keyframes fade-in {
        0% {
          opacity: 0;
        }
        100% {
          opacity: 1;
        }
      }

      @-webkit-keyframes fade-in {
        0% {
          opacity: 0;
        }
        100% {
