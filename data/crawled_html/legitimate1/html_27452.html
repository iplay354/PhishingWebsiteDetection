/* FORMAT CHECKBOXES & RADIO BTNS */

label.checkbox {
	font-size: 15px;
    display: inline-block;
    position: relative;
    padding-left: 25px;
	padding-right: 15px;
    cursor: pointer;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
}

.form-checkboxes {
	position:relative;
}

/* Hide the browser's default radio button */
label.checkbox input {
    position: absolute;
    opacity: 0;
    cursor: pointer;
}
/* Create a custom radio button */
.blu-radio {
    position: absolute;
    top: 6px;
    left: 0;
    height: 14px;
    width: 14px;
    background-color: #ffffff;
	border:1px solid #8a8787;
    border-radius: 20%;
}

/* Create a custom checkbox button */
.blu-checkbox {
    position: absolute;
    top: 6px;
    left: 0;
    height: 14px;
    width: 14px;
    background-color: #ffffff;
	border:1px solid #8a8787;
    border-radius: 30%;
}

.blu-checkbox.opaque {
    position: absolute;
    top: 6px;
    left: 0;
    height: 14px;
    width: 14px;
    background-color: #8a8787;
	border:1px solid #ffffff;
    border-radius: 30%;
}

/* On mouse-over, add a grey background color */
label.checkbox:hover input ~ .blu-radio,
label.checkbox:hover input ~ .blu-checkbox {
    opacity:0.8;
}

/* When the radio button is checked, add a blue background */

label.checkbox input:checked ~ .blu-checkbox {
    background-color: #8a8787;
}

label.checkbox input:checked ~ .blu-radio {
	 background-color: #ffffff;
}

/* Create the indicator (the dot/circle - hidden when not checked) */
.blu-radio:after,
.blu-checkbox:after {
    content: "";
    position: absolute;
    display: none;
}

/* Show the indicator (dot/circle) when checked */
label.checkbox  input:checked ~ .blu-radio:after,
label.checkbox  input:checked ~ .blu-checkbox:after {
    display: block;
}

/* Style the indicator (dot/circle) */
label.checkbox .blu-radio:after {
 	top: 3px;
	left: 3px;
	width: 7px;
	height: 7px;
	border-radius: 30%;
	background: #8a8787;
}

label.checkbox .blu-checkbox:after {
 	left: 4px;
    top: 2px;
    width: 5px;

}
.sk-folding-cube .sk-cube:before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: #333;
  -webkit-animation: sk-foldCubeAngle 2.4s infinite linear both;
          animation: sk-foldCubeAngle 2.4s infinite linear both;
  -webkit-transform-origin: 100% 100%;
      -ms-transform-origin: 100% 100%;
          transform-origin: 100% 100%;
}

  -webkit-transform: scale(1.1) rotateZ(180deg);

@-webkit-keyframes sk-foldCubeAngle {
  0%, 10% {

  } 25%, 75% {

/* Arrows */
.slick-prev,
.slick-next
{
    font-size: 0pt;
    line-height: 0;

    position: absolute;
    top: 50%;

    display: block;

    width: 40px;
    height: 40px;
    margin-top: -10px;
    padding: 0;

    cursor: pointer;

    color: transparent;
    border: none;
    outline: none;
    background: transparent;


	font-family: 'Glyphicons Halflings';
	font-style: normal;
	font-weight: normal;
	line-height: 1;
	-webkit-font-smoothing: antialiased;
	-moz-osx-font-smoothing: grayscale;


}
.slick-prev:hover,
.slick-prev:focus,
.slick-next:hover,
.slick-next:focus
{
    color: transparent;
    outline: none;
    background: transparent;
}
.slick-prev:hover:before,
.slick-prev:focus:before,
.slick-next:hover:before,
.slick-next:focus:before
{
    opacity: 1;
}
.slick-prev.slick-disabled:before,
.slick-next.slick-disabled:before
{
    opacity: .25;
}

.slick-prev:before,
.slick-next:before
{
   /* font-family: 'slick';*/
    font-size: 20pt;
    line-height: 1;

    opacity: .75;
    color: #8a8787;

    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

.slick-prev
{
    left: -40px;
	z-index:900000;
}
[dir='rtl'] .slick-prev
{
    right: -40px;
    left: auto;
}
.slick-prev:before
{
    content: "\e257";
}
[dir='rtl'] .slick-prev:before
{
    content: "\e257";
}

.slick-next
{
    right: -40px;
	z-index:900001;
}
[dir='rtl'] .slick-next
{
    right: auto;
    left: -25px;
}
.slick-next:before
{
    content: "\e258";
}
[dir='rtl'] .slick-next:before
{
    content: "\e258";
}

/* Slider */
.slick-loading .slick-list
{
    background: #fff url('https://www.petalforest.com/blu_source/plugins/slick/ajax-loader.gif') center center no-repeat;
}


/* Dots */
.slick-slider
{
    margin-bottom: 0px;

}

.slick-dots
{
    position: absolute;
  	bottom: 0px;

    display: block;

    width: 100%;
    padding: 0;

    list-style: none;

    text-align: center;

	font-style: normal;
	font-weight: normal;

}
.slick-dots li
{
    position: relative;

    display: inline-block;

    width: 20px;
    height: 20px;
    margin: 0 5px;
    padding: 0;

    cursor: pointer;
}
.slick-dots li button
{
    font-size: 0px;
    line-height: 0;

    display: block;

    width: 20px;
    height: 20px;
    padding: 5px;

    cursor: pointer;

    color: transparent;
    border: 0;
    outline: none;
    background: transparent;
}
.slick-dots li button:hover,
.slick-dots li button:focus
{
    outline: none;
}
.slick-dots li button:hover:before,
.slick-dots li button:focus:before
{
    opacity: 1;
}
.slick-dots li button:before
{
    /*font-family: 'slick';*/
	font-family: Arial, Helvetica, sans-serif;
    font-size: 20pt;
    line-height: 20px;

    position: absolute;
    top: 0;
    left: 0;

    width: 20px;
    height: 20px;

    /*content: '•';*/
	content: "\2022";
    text-align: center;

    opacity: .5;
    color: white;

    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}
.slick-dots li.slick-active button:before
{
    opacity: .75;
    color: white;
}

				});

function positionHome(){

		$('.blu-home-wrapper').css({
			"margin-top": 0 /*($('.blu-header').height() + 2)*/
		})


		if ($('.blu-fullscreen-bg-video').length){
			bluScaleVideo();
		} else {
			//$('.home-wrapper').width(vars.win_w);
			//$('.home-wrapper').height(vars.win_h);



							var carousel_h = Math.round(vars.win_h - $('.blu-header').height()) - 20;
				//var carousel_h = Math.round(vars.win_w/1.5);


				if (carousel_h > 666){
					//carousel_h = 666;
				}

				var carousel_h = Math.round(vars.content_w/1.5);
				var carousel_h = vars.win_h - $('.blu-header').height() - $('.blu-social-bar').height() - 40;

				var max_h = vars.win_h - $('.blu-header').height() - $('.blu-social-bar').height() - 40 - $('.blu-home-desc').height() - 80;
				var min_h = 600;

				if(carousel_h > max_h) {
					carousel_h = max_h;
				}



				if (carousel_h > 666){
					carousel_h = 666;
				}

				if(carousel_h < min_h) {
					carousel_h = min_h;
				}

				//console.log('carousel_h = ' + carousel_h);

							
			$('.slick-slide').height(carousel_h);
			$('.slick-track').height(carousel_h);
			$('.slick-list').height(carousel_h);

			//$('.slick-slide').find('img').height($('.slick-slide').height());
			//set size

			var r, w, h, tag_size_per, tag_size, tag_y_per, tag_y, tag_x_per, tag_x, admin_w, admin_h, img_w, img_h, img_w_per;
			$('.blu-carousel').find('.blu-carousel-img').each(function(){
				r = $(this).data('img-w') / $(this).data('img-h');
									w = vars.content_w; //vars.win_w;
					h =  vars.content_w / r;
								if (h > carousel_h){
					h = carousel_h;
					w = h * r;
				}
				//$(this).height(carousel_h);
				$(this).width(w);
				$(this).height(h);

				//set tag
				if ($(this).parent().find('.blu-carousel-img-tag').length){
					$(this).parent().find('.blu-carousel-img-tag').each(function(){
						admin_w = $(this).data('admin-w');
						admin_h = $(this).data('admin-h');

						if ($(this).data('type') == 'text'){
							tag_size_per = $(this).data('size')/admin_h;
							tag_size = Math.round(tag_size_per * h);
							$(this).css({
								'font-size':tag_size + 'px'
							})
						} else if ($(this).data('type') == 'img'){
							img_w_per = $(this).data('w')/admin_w;
							r = $(this).data('w')/$(this).data('h');
							img_w = Math.round(img_w_per * w);
							img_h = img_w/r;
							$(this).width(img_w);
							$(this).height(img_h);
							$(this).find('img').width(img_w)
							$(this).find('img').height(img_h)

						}
						tag_y_per = $(this).data('y')/admin_h;
						tag_y = Math.round(tag_y_per * h);
						tag_x_per = $(this).data('x')/admin_w;
						tag_x = Math.round(tag_x_per * w);
						$(this).css({
							'top':tag_y,
							'left':tag_x
						})
					})
				}

			})
			$('.slick-next').css({
				"left": (vars.win_w - 90)
			});
			$('.slick-prev').css({
				"right": (vars.win_w - 50)
			});
		}

	}

	function bluMoveCaretToStart(el) {
		if (typeof el.selectionStart == "number") {
			el.selectionStart = el.selectionEnd = 0;
		} else if (typeof el.createTextRange != "undefined") {
			el.focus();
			var range = el.createTextRange();
			range.collapse(true);
			range.select();
		}
	}

	$.fn.bluHeight = function(){

        // find the closest visible parent and get it's hidden children
		var visibleParent = this.closest(':visible').children(), h;

		// set a temporary class on the hidden parent of the element
		visibleParent.addClass('blu-temp-show');

		// get the height
		h = this.height();

		// remove the temporary class
		visibleParent.removeClass('blu-temp-show');

		return h;

	};

	$.fn.bluWidth = function(){

        // find the closest visible parent and get it's hidden children
		var visibleParent = this.closest(':visible').children(), h;

		// set a temporary class on the hidden parent of the element
		visibleParent.addClass('blu-temp-show');

		// get the height
		w = this.width();

		// remove the temporary class
		visibleParent.removeClass('blu-temp-show');

		return w;

	};






	$.fn.bluSetForm = function(action, after_action, reset_form, use_enter){
		var tabindex = 0;
		var $form = this.find('form');
		$form.submit(false);
		var focused = true;
		//format all fields
		this.find('input[type=text], input[type=password], textarea').each(function(){
			tabindex++;
			$(this).attr('tabindex', tabindex);
			$(this).blur(function(){
				if ($(this).val() == ''){
					$(this).parent().addClass("blu-input-default");
					$(this).val($(this).data('default_value'))
					$(this).data('default', true);

					if ($(this).data('class') == 'blu-input-pass'){
						$(this).removeAttr('type');
						$(this).attr('type', 'text');
					}

				}

			})



			//set password field behavior
			if ($(this).data('class') == 'blu-input-pass'){
				//$(this).focus(function(){
					///$(this).val('');
				//})

			//set text fields behavior
			}

			var elem = $(this);
			$(this).focus(function(){
				var id = $(this).attr('id');

				var elem = document.getElementById(id);
				bluMoveCaretToStart(elem);
				window.setTimeout(function() {
					bluMoveCaretToStart(elem);
				}, 1);
			})



			$(this).keydown(function(){

				if ($(this).data('default')){
					$(this).parent().removeClass("blu-input-default");
					$(this).data('default', false);
					if ($(this).data('class') == 'blu-input-pass'){
						$(this).removeAttr('type');
						$(this).attr('type', 'password');
					}
					$(this).val('');
				}
			})

			if (!focused){
				$(this).focus();
				focused = true;
			}

		})


		var $btn = this.find('input[type=submit], input[data-type="submit"]');
		tabindex++;
		$btn.attr('tabindex', tabindex);
		$btn.click(function(){
			var validated = true;
			var invalid_str = '';

			//validate
			$form.find('input[type=text], textarea').each(function(){
				if (($(this).val() == '' || $(this).val() == $(this).data('default_value')) && $(this).data('required')){
					validated = false;
					invalid_str += $(this).data('default_value') + 	', ';
				}
			});

			if (invalid_str != ''){
				invalid_str = invalid_str.replace(/,\s*$/, "");
			}

			if (validated){

				var post = 'data=' + JSON.stringify($form.bluSerializeObject());

				$form.fadeTo('fast', 0.3);
				$btn.val('sending...');
				//alert(post);

				$.post(action, post, function(data){
					//alert(data);
					var success = data.substring(0, 1);
					var data = data.substring(1, data.length);
					$form.fadeTo('fast', 1);

					$btn.val($btn.data('default_value'));
					if (success == '0'){
						$form.find('.blu-form-msg').html(data);
						if(data == "Please log into your profile first."){
							$('#blu_shop_link_profile').click();
						}
					} else {
						if (reset_form){
							bluResetForm($form);
						}
						$(after_action).data('data', data);
						$(after_action).click();
					}
				});
			} else {
				$('.blu-form-msg').html('Please enter the following: ' + invalid_str);
			}
		})

		$form.bind('keypress', function(e){
			if ( e.keyCode == 13  && ($btn.is(":focus") || use_enter)) {
				$btn.click();
			}
		});

		return this;
	}

	$.fn.bluSerializeObject = function(){
		var o = {};
		var a = this.serializeArray();
		$.each(a, function() {
			if (o[this.name] !== undefined) {
				if (!o[this.name].push) {
					o[this.name] = [o[this.name]];
				}
				o[this.name].push(this.value || '');
			} else {
				o[this.name] = this.value || '';
			}
		});

	/* resize background images */
	function bluParallaxBgResize(){
		var windowH = $(window).height();
		var windowW = $(window).width();
		var parallax_h = vars.win_h/1.5;
		if (parallax_h < 750 ){
			parallax_h = 750;
		}
		if (vars.win_h > vars.win_w ){
			parallax_h = Math.round(vars.win_h/1.5);
		}
		$(".blu-parallax-bg").each(function(i){
			var path = $(this);

			// variables
			var contW = path.width();
			var contH = path.height();

			var imgW = path.attr("data-img-width");
			var imgH = path.attr("data-img-height");
			var ratio = imgW / imgH;

			if (!path.hasClass('blu-no-parallax')){
				// overflowing difference
				var diff = parseFloat(path.attr("data-diff"));
				diff = diff ? diff : 0;



				// remaining height to have fullscreen image only on parallax
				var remainingH = 0;
				if(path.hasClass("blu-parallax") && !$("html").hasClass("touch")){
					var maxH = contH > windowH ? contH : windowH;
					remainingH = windowH - contH;
				}
				// set img values depending on cont
				imgH = contH + remainingH + diff;
				imgW = imgH * ratio;
				// fix when too large
				if(contW > imgW){
					imgW = contW;
					imgH = imgW / ratio;
				}

				//
			} else {
				imgW = windowW;
				imgH = imgW / ratio;
			}

			path.data("resized-imgW", imgW);
			path.data("resized-imgH", imgH);

			path.css("background-size", imgW + "px " + imgH + "px");
			//alert(imgH);
			if (!path.hasClass('blu-no-parallax')){
				path.height(parallax_h);
			} else {

				path.height(imgH);
			}


		});



	}


	/* set parallax background-position */
	function bluParallaxPosition(e){


			var heightWindow = $(window).height();
			var topWindow = $(window).scrollTop();
			var bottomWindow = topWindow + heightWindow;
			var currentWindow = (topWindow + bottomWindow) / 2;

			$(".blu-parallax").each(function(i){
				var path = $(this);
				if (!path.hasClass('blu-no-parallax') && '' == 'yes' ){
					var height = path.height();
					var top = path.offset().top;
					var bottom = top + height;
					// only when in range
					if(bottomWindow > top && topWindow < bottom){
						var imgW = path.data("resized-imgW");
						var imgH = path.data("resized-imgH");

						// min when image touch top of window
						var min = 0;
						// max when image touch bottom of window
						var max = - imgH + heightWindow;
						// overflow changes parallax
						var overflowH = height < heightWindow ? imgH - height : imgH - heightWindow; // fix height on overflow
						top = top - overflowH;
						bottom = bottom + overflowH;
						// value with linear interpolation
						var value = min + (max - min) * (currentWindow - top) / (bottom - top);
						// set background-position
						var orizontalPosition = path.attr("data-oriz-pos");
						orizontalPosition = orizontalPosition ? orizontalPosition : "50%";
						$(this).css("background-position", orizontalPosition + " " + value + "px");
					}
				}
			});

	}

	function bluShowTooltip(txt, $trigger){
				var $tooltip = $trigger.find('.blu-tooltip');

		if (txt == ''){
			//$tooltip.data('opened', false);
			//$tooltip.stop().fadeOut(0);
			$('.blu-tooltip').remove()	;
		} else {
			if (!$tooltip.length){
				$('.blu-tooltip-main').clone().appendTo($trigger);
				$trigger.find('.blu-tooltip-main').addClass('blu-tooltip');
				$trigger.find('.blu-tooltip').removeClass('blu-tooltip-main');
				$tooltip = $trigger.find('.blu-tooltip');
				$tooltip.removeClass('blu-tooltip-main');

			}
			$tooltip.stop().fadeOut(0);

			$tooltip.html(txt);
			$tooltip.css({
				'top': -35,
				'left': $trigger.bluWidth() - $tooltip.bluWidth()
			})
			$tooltip.data('opened', true);
			$tooltip.stop().fadeIn('fast');
		}
			}

		var val = parseFloat(str).toFixed(2);
