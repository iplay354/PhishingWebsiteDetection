, while championing the preservation of Indigenous artistic traditions. Nestled at the foothills of Oregon\u2019s Blue Mountains on the traditional homelands of the Umatilla, Walla Walla, and Cayuse people (CTUIR), CSIA stands as a beacon for artistic innovation and cultural continuity. Its Traditional Arts program sustains the deep heritage of practices such as beadwork, basketry, and garment-making, offering artists a rare space to explore both ancestral techniques and contemporary forms.\n\u200b\nCSIA\u2019s unique commitment to Native perspectives in fine art has established it as a vital force within the arts community, where tradition and innovation converge in service to a vibrant, relevant, and ever-evolving cultural legacy.\n"}]}}},"image":{"figure":{"name":"CSIA-Exterior.jpg","width":1200,"height":896,"source":"\/uploads\/b\/1d016a233af3942ab57932844ec27153918190b57d68d5cc82c61adbafc53dff\/CSIA-Exterior_1733441559.jpg","altText":"","original":"\/uploads\/b\/1d016a233af3942ab57932844ec27153918190b57d68d5cc82c61adbafc53dff\/CSIA-Exterior_1733441559.jpg","sourceSet":{},"attribution":{},"cropOptions":null},"hidden":false},"title":{"tag":"h2","content":{"quill":{"ops":[{"insert":"About Us\n"}]}},"fontSize":"medium","textStyle":"title"},"button":{"label":"View products","hidden":true},"callout":{"tag":"h3","hidden":true,"content":"Quality Craftsmanship","fontSize":"medium","textStyle":"title"},"secondaryButton":{"label":"Learn more","hidden":true}}]}}},{"id":"78eefe70-b357-11ef-be95-9556a7b1d7c6","type":"cell","content":{"id":"78eefe71-b357-11ef-be95-9556a7b1d7c6","type":"block","layout":"featured-products-1","purpose":"featured-products@^1.0.0","elements":[{"id":"78fd0830-b357-11ef-aa3a-395e527310be","purpose":"title","properties":{"title":{"quill":{"ops":[{"insert":"Newest Releases\n"}]}}}},{"id":"78fd0831-b357-11ef-aa3a-395e527310be","purpose":"text","properties":{}}],"properties":{"shortID":"dzybnA","products":["6EIHPVX7VZK2S46IUNNBKFM7","QSSBR5ZNGCDPO2EDPBF
