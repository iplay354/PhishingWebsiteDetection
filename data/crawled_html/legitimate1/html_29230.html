wsers:\u003c/span\u003e\u003c/div\u003e\n\u003cul\u003e\n\t\u003cli \u003e\u003cspan style=\"color: rgb(0, 58, 250);\"\u003e\u003ca href=\"https://support.google.com/chrome/answer/95647#zippy=%2Callow-or-block-cookies\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e\u003cspan data-custom-class=\"link\"\u003eChrome\u003c/span\u003e\u003c/a\u003e\u003c/span\u003e\u003c/li\u003e\n\t\u003cli \u003e\u003cspan style=\"color: rgb(0, 58, 250);\"\u003e\u003ca href=\"https://support.microsoft.com/en-us/windows/delete-and-manage-cookies-168dab11-0753-043d-7c16-ede5947fc64d\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e\u003cspan data-custom-class=\"link\"\u003eInternet Explorer\u003c/span\u003e\u003c/a\u003e\u003c/span\u003e\u003c/li\u003e\n\t\u003cli \u003e\u003cspan style=\"color: rgb(0, 58, 250);\"\u003e\u003ca href=\"https://support.mozilla.org/en-US/kb/enhanced-tracking-protection-firefox-desktop?redirectslug=enable-and-disable-cookies-website-preferences\u0026redirectlocale=en-US\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e\u003cspan data-custom-class=\"link\"\u003eFirefox\u003c/span\u003e\u003c/a\u003e\u003c/span\u003e\u003c/li\u003e\n\t\u003cli \u003e\u003cspan style=\"color: rgb(0, 58, 250);\"\u003e\u003ca href=\"https://support.apple.com/en-ie/guide/safari/sfri11471/mac\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e\u003cspan data-custom-class=\"link\"\u003eSafari\u003c/span\u003e\u003c/a\u003e\u003c/span\u003e\u003c/li\u003e\n\t\u003cli \u003e\u003cspan style=\"color: rgb(0, 58, 250);\"\u003e\u003ca href=\"https://support.microsoft.com/en-us/windows/microsoft-edge-browsing-data-and-privacy-bb8174ba-9d73-dcf2-9b4a-c582b4e640dd\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e\u003cspan data-custom-class=\"link\"\u003eEdge\u003c/span\u003e\u003c/a\u003e\u003c/span\u003e\u003c/li\u003e\n\t\u003cli \u003e\u003cspan style=\"color: rgb(0, 58, 250);\"\u003e\u003ca href=\"https://help.opera.com/en/latest/web-preferences/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e\u003cspan data-custom-class=\"link\"\u003eOpera\u003c/span\u003e\u003c/a\u003e\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cdiv \u003e\u003cspan data-custom-class=\"body_text\"\u003eIn addition, most advertising networks offer you a way to opt out of targeted advertising. If you would like to find out more information, please visit:\u003c/span\u003e\u003c/div\u003e\n\u003cul\u003e\n\t\u003cli \u003e\u003cspan style=\"color: rgb(0, 58, 250);\"\u003e\u003ca href=\"http://www.aboutads.info/choices/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e\u003cspan data-custom-class=\"link\"\u003eDigital Advertising Alliance\u003c/span\u003e\u003c/a\u003e\u003c/span\u003e\u003c/li\u003e\n\t\u003cli \u003e\u003cspan style=\"color: rgb(0, 58, 250);\"\u003e\u003ca href=\"https://youradchoices.ca/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e\u003cspan data-custom-class=\"link\"\u003eDigital Advertising Alliance of Canada\u003c/span\u003e\u003c/a\u003e\u003c/span\u003e\u003c/li\u003e\n\t\u003cli \u003e\u003cspan style=\"color: rgb(0, 58, 250);\"\u003e\u003ca href=\"http://www.youronlinechoices.com/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e\u003cspan data-custom-class=\"body_text\"\u003e\u003cspan data-custom-class=\"link\"\u003eEuropean Interactive Digital Advertising Alliance\u003c/span\u003e\u003c/span\u003e\u003c/a\u003e\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cdiv \u003e\u003cbr\u003e\u003c/div\u003e\n\u003cdiv \u003e\u003cspan\u003e\u003cspan \u003e\u003cstrong\u003e\u003cspan data-custom-class=\"heading_1\"\u003eWhat about other tracking technologies, like web beacons?\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/span\u003e\u003c/div\u003e\n\u003cdiv \u003e\u003cbr\u003e\u003c/div\u003e\n\u003cdiv \u003e\n\t\u003cspan\u003e\n\t\t\u003cspan \u003e\n\t\t\t\u003cspan data-custom-class=\"body_text\"\u003eCookies are not the only way \u003c/span\u003e\n\t\t\t\u003cspan \u003e\n\t\t\t\t\u003cspan data-custom-class=\"body_text\"\u003e\n\t\t\t\t\tto recognize or track visitors to a website. We may use other, similar technologies from time to time, like web beacons (sometimes called \"tracking pixels\" or \"clear gifs\"). These are tiny graphics files that contain a unique identifier that enables us to recognize when someone has visited our Website\n\t\t\t\t\t\u003cbdt class=\"block-component\"\u003e\u003c/bdt\u003e\n\t\t\t\t\tor opened an email including them\n\t\t\t\t\t\u003cbdt class=\"statement-end-if-in-editor\"\u003e\u003c/bdt\u003e\n\t\t\t\t\t. This allows us, for example, to monitor \n\t\t\t\t\u003c/span\u003e\n\t\t\t\t\u003cspan \u003e\n\t\t\t\t\t\u003cspan \u003e\n\t\t\t\t\t\t\u003cspan data-custom-class=\"body_text\"\u003ethe traffic patterns of users from one page within a website to another, to deliver or communicate with cookies, to understand whether you have come to the website from an online advertisement displayed on a third-party website, to improve site performance, and to measure the success of email marketing campaigns. In many instances, these technologies are reliant on cookies to function properly, and so declining cookies will impair their functioning.\u003c/span\u003e\n\t\t\t\t\t\t\u003cbdt class=\"block-component\"\u003e\u003c/bdt\u003e\n\t\t\t\t\t\u003c/span\u003e\n\t\t\t\t\u003c/span\u003e\n\t\t\t\u003c/span\u003e\n\t\t\u003c/span\u003e\n\t\u003c/span\u003e\n\u003c/div\u003e\n\u003cdiv \u003e\u003cbr\u003e\u003c/div\u003e\n\u003cdiv \u003e\u003cspan\u003e\u003cspan \u003e\u003cspan \u003e\u003cspan \u003e\u003cspan\u003e\u003cstrong\u003e\u003cspan data-custom-class=\"heading_1\"\u003eDo you use Flash cookies or Local Shared Objects?\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/div\u003e\n\u003cdiv \u003e\u003cbr\u003e\u003c/div\u003e\n\u003cdiv \u003e\u003cspan \u003e\u003cspan data-custom-class=\"body_text\"\u003eWebsites may also use so-called \"Flash Cookies\" (also known as Local Shared Objects or \"LSOs\") to, among other things, collect and store information about your use of our services, fraud prevention, and for other site operations.\u003c/span\u003e\u003c/span\u003e\u003c/div\u003e\n\u003cdiv \u003e\u003cbr\u003e\u003c/div\u003e\n\u003cdiv \u003e\u003cspan \u003e\u003cspan data-custom-class=\"body_text\"\u003eIf you do not want Flash Cookies stored on your computer, you can adjust the settings of your Flash player to block Flash Cookies storage using the tools contained in the \u003c/span\u003e\u003c/span\u003e\u003cspan data-custom-class=\"body_text\"\u003e\u003cspan style=\"color: rgb(0, 58, 250);\"\u003e\u003ca data-custom-class=\"link\" href=\"http://www.macromedia.com/support/documentation/en/flashplayer/help/settings_manager07.html\" target=\"_BLANK\"\u003e\u003cspan \u003eWebsite Storage Settings Panel\u003c/span\u003e\u003c/a\u003e\u003c/span\u003e\u003cspan \u003e. You can also control Flash Cookies by going to the \u003c/span\u003e\u003cspan style=\"color: rgb(0, 58, 250);\"\u003e\u003ca data-custom-class=\"link\" href=\"http://www.macromedia.com/support/documentation/en/flashplayer/help/settings_manager03.html\" target=\"_BLANK\"\u003e\u003cspan \u003eGlobal Storage Settings Panel\u003c/span\u003e\u003c/a\u003e\u003c/span\u003e\u003c/span\u003e\u003cspan \u003e\u003cspan data-custom-class=\"body_text\"\u003e and \u003c/span\u003e\u003cspan \u003e\u003cspan data-custom-class=\"body_text\"\u003efollowing the instructions (which may include instructions that explain, for example, how to delete existing Flash Cookies (referred to \"information\" on the Macromedia site), how to prevent Flash LSOs from being placed on your computer without your being asked, and (for Flash Player 8 and later) how to block Flash Cookies that are not being delivered by the operator of the page you are on at the time).\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/div\u003e\n\u003cdiv \u003e\u ong\u003eBlumhouse\u003c/strong\u003e\u0026rdquo; or \u0026ldquo;\u003cstrong\u003ewe\u003c/strong\u003e,\u0026rdquo; \u0026ldquo;\u003cstrong\u003eus\u003c/strong\u003e,\u0026rdquo; or \u0026ldquo;\u003cstrong\u003eour\u003c/strong\u003e\u0026rdquo;) respects your privacy. This Privacy Policy (the \u0026ldquo;\u003cstrong\u003ePolicy\u003c/strong\u003e\u0026rdquo;) explains the collection, use, and sharing of information from or about you, the consumer, and certain choices offered with respect to that information, in connection with your use of this website, its features, related email communications, and any other digital offerings that link to this Privacy Policy (collectively, the \u0026ldquo;\u003cstrong\u003eService\u003c/strong\u003e\u0026rdquo;), regardless of how you access it (whether via personal computers, mobile devices or otherwise). Any updates or modifications to this Policy will be posted to the Service and the updated date will be indicated above. For certain aspects of the Service, there may be additional notices about information practices and choices provided to you, which you should read carefully when provided.\u003c/p\u003e\n\u003cp\u003eBy accessing, using, or otherwise interacting with any part of the Service, you acknowledge you have read and understand this Policy, consent to the practices it describes, and agree to the Service\u0026rsquo;s \u003ca href=\"../terms\"\u003eTerms of Use\u003c/a\u003e, which you should review carefully as well. If you do not agree and consent, please discontinue use of the Service.\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eHIGHLIGHTS\u003c/strong\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eThis is a short summary of some key elements of this Policy, but please review our full policy below. To see the full text, including definitions of capitalized terms, you may click on the links to each section or scroll to the end. \u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cdiv class='leftColumn'\u003e\n\u003cp\u003e\u003ca href=\"#collect\"\u003eWHAT MAY WE COLLECT?\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eWe and/or our Service Providers may collect information such as the following, some of which may be considered \u0026ldquo;personal information\u0026rdquo; under law:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInformation you provide, such as your name, email, or other contact information for our mailing list or in direct communications to us, any user-generated content or promotion registrations, or survey data you choose to share with us.\u003c/li\u003e\n\u003cli\u003eInformation collected automatically from you as you access the Service (e.g., device, usage, approximate geolocation). This may involve the use of strictly necessary, functional, and/or performance cookies and similar technologies, such as those used by our Service Providers.\u003c/li\u003e\n\u003cli\u003eInformation from other sources, such as our Service Providers, social media and other public sources where you engage with us, our licensees and other business partners, and affiliates.\u003c/li\u003e\n\u003cli\u003eThird Party Services accessed or used through the Service have their own privacy policies and terms of use, which you should review. We do not endorse or take responsibility for them.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u003ca href=\"#use\"\u003eHOW MAY WE USE IT?\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eYour information may be used for business and commercial purposes such as:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTo communicate with you and allow you to participate in various features.\u003c/li\u003e\n\u003cli\u003eTo provide, maintain, improve, and secure the Service and its content.\u003c/li\u003e\n\u003cli\u003eTo understand our audience in order to create and market the best content.\u003c/li\u003e\n\u003cli\u003eTo protect and enforce rights, and as otherwise permitted by law.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u003ca href=\"#share\"\u003eHOW MAY WE SHARE IT?\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eYour information may be shared, without limitation, with:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eService Providers for our business purposes such as marketing emails, analytics, cloud storage, website maintenance, and security.\u003c/li\u003e\n\u003cli\u003eAffiliates and for corporate transactions (e.g\u003cem\u003e.\u003c/em\u003e, merger or sale).\u003c/li\u003e\n\u003cli\u003eLaw enforcement or others to comply with law or legal process.\u003c/li\u003e\n\u003cli\u003ePromotional partners and/or the public if you enter promotions.\u003c/li\u003e\n\u003cli\u003eYour consent or as otherwise permitted by law.\u003c/li\u003e\n\u003cli\u003eOthers in aggregated and/or deidentified manner.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class='rightColumn'\u003e\n\u003cp\u003e\u003ca href=\"#choices\"\u003eYOUR CHOICES\u003c/a\u003e AND \u003ca href=\"#ca-privacy\"\u003eYOUR CA PRIVACY RIGHTS\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eYou have certain choices regarding information collection and communications options explained\u0026nbsp;\u003ca href=\"#choices\"\u003ehere\u003c/a\u003e, including:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eYou may unsubscribe from marketing emails at any time.\u003c/li\u003e\n\u003cli\u003eYou may be able to control certain cookies through browsers and devices, but we do not respond to \u0026ldquo;Do Not Track\u0026rdquo; signals.\u003c/li\u003e\n\u003cli\u003eCalifornia residents may have certain privacy rights as detailed \u003ca href=\"#ca-privacy\"\u003ehere\u003c/a\u003e, including\n\u003cul\u003e\n\u003cli\u003eA) The right to know what personal information the business has collected about the consumer, including the categories of personal information, the categories of sources from which the personal information is collected, the business or commercial purpose for collecting, selling, or sharing personal information, the categories of third parties to whom the business discloses personal information, and the specific pieces of personal information the business has collected about the consumer;\u003c/li\u003e\n\u003cli\u003e(B) The right to delete personal information that the business has collected from the consumer, subject to certain exceptions;\u003c/li\u003e\n\u003cli\u003e(C) The right to correct inaccurate personal information that a business maintains about a consumer;\u003c/li\u003e\n\u003cli\u003e(D) If the business sells or shares personal information, the right to opt-out of the sale or sharing of their personal information by the business (Blumhouse does not sell personal information);\u003c/li\u003e\n\u003cli\u003e(E) If the business uses or discloses sensitive personal information for reasons other than those set forth in section 7027, subsection (lm), the right to limit the use or disclosure of sensitive personal information by the business; and\u003c/li\u003e\n\u003cli\u003e(F) The right not to receive discriminatory treatment by the business for the exercise of privacy rights conferred by the CCPA, including an employee\u0026rsquo;s, applicant\u0026rsquo;s, or independent contractor\u0026rsquo;s right not to be retaliated against for the exercise of their CCPA rights.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eCalifornia residents are provided with certain disclosures regarding information collected during the last 12 months, as detailed \u003ca href=\"#disclosures\"\u003ehere.\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u003ca href=\"#children\"\u003eADDITIONAL INFORMATION\u003c/a\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eWe do not collect information from minors, as the Service is only available to adults age 18 and up.\u003c/li\u003e  considered Personal Information. Certain publicly available data and other information may be excluded from Personal Information under applicable law as well.\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u003cu\u003eInformation You Provide.\u003c/u\u003e\u003c/p\u003e\n\u003cp\u003eWe and/or our Service Providers may collect certain information, including Personal Information, that you choose to provide directly, such as:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eContact information (e.g., name, email address) you may provide if you choose to subscribe to our marketing communications.\u003c/li\u003e\n\u003cli\u003eOther registration information (e.g., name, email and/or mailing address, phone, social media handle) should you choose to participate in any contests, sweepstakes, or other promotions we may offer (\u0026ldquo;\u003cstrong\u003ePromotions\u003c/strong\u003e\u0026rdquo;), or any future opportunities to create an account to access certain features of the Service.\u003c/li\u003e\n\u003cli\u003eAny contact or other information you may share should you choose to contact us via email, mail, or other means.\u003c/li\u003e\n\u003cli\u003eUser-generated content (e.g., photos, video, audio, written materials) and/or other information you choose to share when entering any applicable Promotions, participating in any other opportunities to share such content if ever permitted through the Service, or sharing with us on social media. Please keep in mind that such sharing may be public and you should not have any expectations of privacy if you elect to share anything in such manner. Please consult the \u003ca href=\"../terms\"\u003eTerms of Service\u003c/a\u003e for other conditions relating to user content and the submission of certain materials to us.\u003c/li\u003e\n\u003cli\u003eCertain non-identifying information about your favorite Blumhouse projects, viewing habits, interests, demographics, and other information you may choose to share should you elect to participate in optional surveys or similar features (collectively, \u0026ldquo;\u003cstrong\u003eSurvey Data\u003c/strong\u003e\u0026rdquo;).\u0026nbsp;\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u003cu\u003eCookies and Information Collected Automatically.\u003c/u\u003e\u003c/p\u003e\n\u003cp\u003eWe and/or our Service Providers may use a variety of technologies that automatically or passively collect certain information about you or your device when you use the Service or certain optional features of the Service (collectively, \u0026ldquo;\u003cstrong\u003eUsage Information\u003c/strong\u003e\u0026rdquo;), such as:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eDevice information such as IP address, device type, client ID, type of browser and/or operating system, browser ID, internet service provider, language preference, and other device or browser settings.\u003c/li\u003e\n\u003cli\u003eUsage data related to how you use and navigate the\u0026nbsp;Service such as the pages you visit, content you access, clicks and other actions within the Service, date, and time stamps, whether you open an email, and diagnostic, crash, error, and other reports.\u003c/li\u003e\n\u003cli\u003eGeolocation information, such as approximate general location (such as your city) estimated from your IP address.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUsage Information is primarily collected by our Service Providers and processed on an aggregated basis but may constitute Personal Information where applicable.\u003c/p\u003e\n\u003cp\u003eTechnologies used when collecting information automatically may include the following customary methods, depending on the features you access on the Service and the Service Providers involved:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eCookies, which are small data files stored on your browser or device that may be served by us (\u0026ldquo;first-party cookies\u0026rdquo;) or by our Service Providers (\u0026ldquo;third-party cookies\u0026rdquo;) and may be \u0026ldquo;session\u0026rdquo; or \u0026ldquo;persistent\u0026rdquo; cookies.\u003c/li\u003e\n\u003cli\u003eLocal storage, which similarly stores browser or device data locally and may include so-called \u0026ldquo;flash cookies\u0026rdquo;, HTML5 local storage, or browser cache.\u003c/li\u003e\n\u003cli\u003eEmbedded scripts, which is programming code that may be temporarily downloaded and used by our Service Provider while you are on the Service to collect Usage Information.\u003c/li\u003e\n\u003cli\u003eWeb beacons are small images which may be used in emails sent by our Service Provider to provide information on the effectiveness of our email campaigns.\u003c/li\u003e\n\u003cli\u003eSDKs are blocks of code installed on the Service that may be used by our Service Provider to collect Usage Information for aggregated reporting.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eThese technologies are used solely for the following types of purposes:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u0026ldquo;Strictly necessary\u0026rdquo; or \u0026ldquo;essential\u0026rdquo; (e.g., essential to the functioning of the Service).\u003c/li\u003e\n\u003cli\u003e\u0026ldquo;Functional\u0026rdquo; (e.g., to improve functionality, remember settings and preferences, such as disabling a pop up).\u003c/li\u003e\n\u003cli\u003e\u0026ldquo;Performance\u0026rdquo; or \u0026ldquo;Analytics\u0026rdquo; (e.g., to understand general usage patterns on the Service).\u003c/li\u003e\n\u003cli\u003eGeolocation cookies allow us to determine your location in order to provide you with information you request.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eThe above technologies are primarily used by these Service Providers:\u003c/p\u003e\n\u003cp\u003eGoogle Analytics, which uses cookies and similar technologies above to collect and analyze aggregated information about use of the Service (such as what pages were viewed and for how long) and report on activities and trends. This helps us improve the user experience and determine site effectiveness. You can learn about Google\u0026rsquo;s practices by going to\u0026nbsp;\u003ca href=\"http://www.google.com/policies/privacy/partners\"\u003egoogle.com/policies/privacy/partners\u003c/a\u003e, and opt out of them by downloading the Google Analytics opt-out browser add-on, available at\u0026nbsp;\u003ca href=\"https://tools.google.com/dlpage/gaoptout\"\u003etools.google.com/dlpage/gaoptout\u003c/a\u003e. We do not use Google Analytics to identify any individual users or to provide targeted advertising.\u003c/p\u003e\n\u003cp\u003eWe also use Mailchimp as our marketing platform for sending emails, hosting surveys, and storing certain data. They use certain technologies as described above. You may learn more about their practices at \u003ca href=\"https://mailchimp.com/legal/privacy/#3._Privacy_for_Contacts\"\u003ehttps://mailchimp.com/legal/privacy/#3._Privacy_for_Contacts\u003c/a\u003e.\u003cbr /\u003e\u003cbr /\u003e\u003c/p\u003e\n\u003cp\u003eMore information about our Cookie Policy can be found \u003ca href=\"../cookie-policy\" target=\"_blank\" rel=\"noopener\"\u003ehere.\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u003cu\u003eInformation from Other Sources.\u003c/u\u003e\u003c/p\u003e\n\u003cp\u003eWe may obtain information about you from other sources, such as:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eService Providers, such as our analytics and marketing platforms described above or social media vendors.\u003c/li\u003e\n\u003cli\u003eOther Sources, such as social media platforms, third party blogs, and other publicly available sources, such as when you post, comment, tag, or otherwise interact with us or our content.\u003c/li\u003e\n\u003cli\u003eBusiness Partners, such as merchandising licensees who may share aggregated analytics.\u003c/li\u003e\n\u003cli\u003eAffiliates, such as Blumhouse Television.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eSome of this information may be treated as Personal Information we collect under certain circumstances in accordance with applicable law.\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u003cu\u003eA NOTE ABOUT THIRD PARTY SERVICES\u003c/u\u003e\u003c/p\u003e\n\u003cp\u003eThe Service may feature functionality offered by, and/or include hyperlinks to, certain Service Providers, Business Partners, and other third parties and their websites, landing pages, social media platforms, applications, portals, or other services and features owned and/or operated by them (collectively, \u0026ldquo;\u003cstrong\u003eThird Party Services\u0026rdquo;\u003c/strong\u003e). Should you choose to post information on a Third Party Service, it may be viewed publicly, and if it references the Service (e.g., by using a hashtag associated with us in a tweet or status update), your post may be used in connection with the Service. Further, these Third Party Services may collect or receive certain information, which may include Personal Information, about your use of the Service or the Third Party Service (as applicable), including through the use of their cookies, web beacons, and similar technologies as described generally above, direct collection from you, or otherwise. We have no control over these Third Party Services and are not responsible for them or their privacy practices. Any information collected by a Third Party Service will be governed under the terms of its own privacy policy and terms of use. We encourage you to review such policies thoroughly before disclosing any information to them. The inclusion of links to, or functionality by, Third Party Services on our Service in no way constitutes an endorsement of their content, actions, or policies.\u003c/p\u003e\n\u003cp\u003e\u003ca style=\"padding-top: 50px;\" name=\"use\"\u003e\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eHOW MAY WE USE IT?\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eWe may use your information, including Personal Information, for the following types of business and commercial purposes:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cu\u003eCommunications\u003c/u\u003e: We may use your contact information and other identifiers to (a) provide you with communications you elect to receive about us, our projects, and any promotions, (b) respond to your requests, feedback, or questions if you reach out to us, and (c) contact you with regard to your use of the Service and, in our discretion, changes to the Service and/or our policies.\u003c/li\u003e\n\u003cli\u003e\u003cu\u003eService Operations\u003c/u\u003e: We and/or our Service Providers may use your Usage Information and other aggregated information to ensure that the Service functions properly, to monitor and improve the operation, delivery, and general accessibility on our Service, identify popular areas or features, and otherwise provide, maintain, and improve the Service.\u003c/li\u003e\n\u003cli\u003e\u003cu\u003eResearch\u003c/u\u003e: We may use information such as geolocation information from our marketing platform, Survey Data, and publicly available social media engagement data from Third Party Services and other sources, to help us understand our audience generally. This facilitates our ability to develop and produce the best content and market it effectively.\u003c/li\u003e\n\u003cli\u003e\u003cu\u003eOptional Features\u003c/u\u003e: When applicable, we may use information to enable you to participate in any future Promotions, user-generated content, or other optional features of the Service that may be made available. Such use in connection with Promotions may include verifying your entry and eligibility, announcing you as the winner, providing any prizes, and such other uses as may be disclosed in the applicable rules governing that Promotion.\u003c/li\u003e\n\u003cli\u003e\u003cu\u003eSecurity, Enforcement, Etc.\u003c/u\u003e: We may use information to (a) maintain the safety and security of our Service, (b) to protect the rights and property of Blumhouse and others, (c) to detect, investigate, and prevent security breaches or fraud and other illegal activities, (d) to enforce our Terms of Use and other agreements and resolve disputes, (e) as may be required to comply with our legal obligations, and (f) as may otherwise be permitted by law.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eWe will retain any Personal Information collected as long as it is needed for the above purposes and in accordance with applicable law.\u003c/p\u003e\n\u003cp\u003e\u003ca style=\"padding-top: 50px;\" name=\"share\"\u003e\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eHOW MAY WE SHARE IT?\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eWe may share the information described above with other parties as follows:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cu\u003eService Providers\u003c/u\u003e: We may share information with our Service Providers (e.g. analytics, marketing, website, cloud, and other technical service providers, professional services firms, etc.) as needed for business and commercial purposes such as storing data you choose to share, providing marketing communications you opt to receive, generating analytics information for our aggregated use, developing, hosting, delivering, securing, and/or maintaining the Service, providing certain functionalities or features on the Service, or other uses of information as described above. We endeavor to limit the Personal Information we provide to such providers to the minimum needed to deliver the service.\u003c/li\u003e\n\u003cli\u003e\u003cu\u003eCorporate Transactions\u003c/u\u003e: We may share information with other third parties in connection with corporate transactions (e.g., merger, acquisition, sale, or financing)\u003c/li\u003e\n\u003cli\u003e\u003cu\u003eAffiliates\u003c/u\u003e: We may share information with our affiliated entities.\u003c/li\u003e\n\u003cli\u003e\u003cu\u003eLaw Enforcement\u003c/u\u003e: We may share information with law enforcement, certain Service Providers providing investigative or other relevant services, rights holders, or others when it is necessary for us to comply with applicable law, legal process, or government requests, to respond to legal claims, or to protect our rights or the property or personal safety of Blumhouse, its employees and contractors, licensors, licensees, other third parties, or the public.\u003c/li\u003e\n\u003cli\u003e\u003cu\u003ePromotions\u003c/u\u003e: We may share with sponsors and other promotional partners if you consent to do so when entering any Promotion, as well as with the public in accordance with the appliable rules and applicable law (such as winners' lists).\u003c/li\u003e\n\u003cli\u003e\u003cu\u003eConsent, etc.\u003c/u\u003e: We may otherwise share information about you with third parties for any other purpose properly disclosed to you (as may be required pursuant to applicable law), at your consent or direction, or as may be otherwise permitted by law.\u003c/li\u003e\n\u003cli\u003e\u003cu\u003eAggregate/Deidentified\u003c/u\u003e: We may share aggregated and/or deidentified information with distributors and other licensees, licensors, business partners, and other third parties.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eInformation shared with third parties may be used as described in their respective privacy policies. Some of this information may be deemed Personal Information. Please rest assured we do not sell, trade, or license Personal Information for direct marketing purposes, and would not do so in the future without your consent in accordance with applicable law.\u003c/p\u003e\n\u003cp\u003e\u003ca style=\"padding-top: 50px;\" name=\"choices\"\u003e\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eWHAT CHOICES AND CONTROLS DO YOU HAVE?\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cu\u003eCommunications: \u003c/u\u003eYou may elect to unsubscribe from promotional communications at any time by following the instructions in any marketing email you get from us. Please note that your opt out is limited to the email address used and will not affect subsequent subscriptions or non-promotional communications, such as replies to any communications from you or any notifications we may send regarding changes to this Privacy Policy or Terms of Service.\u003c/li\u003e\n\u003cli\u003e\u003cu\u003eRegistration Data\u003c/u\u003e: Should we ever offer you the opportunity to create an account to access certain features, it may include functionality allowing you to view, update, and/or edit the registration data you provide.\u003c/li\u003e\n\u003cli\u003e\u003cu\u003eCookies\u003c/u\u003e: You may be able to exercise certain controls through the settings available to you through your web browser or device or certain third-party browser extensions. If you elect to reject certain cookies, please note that you may not be able to take full advantage of all of the features and functions of the Service. You may also learn how to opt out of Google Analytics using the link provided above.\u003c/li\u003e\n\u003cli\u003e\u003cu\u003eDo Not Track\u003c/u\u003e: Certain web browsers may allow you to send \u0026ldquo;Do Not Track\u0026rdquo; requests. We do not currently take actions to respond to Do Not Track signals because there is no current industry standard concerning what, if anything, websites should do when they receive such signals. We continue to review new technologies and may adopt a standard if and when one is created. More information about \u0026ldquo;Do Not Track\u0026rdquo; is available at \u003ca href=\"https://allaboutdnt.com//\"\u003ehttps://allaboutdnt.com//\u003c/a\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003e\u003cem\u003e\u0026nbsp;\u003c/em\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cdiv id='ca-privacy'\u003e\u003ca name=\"ca-privacy\"\u003e\u003c/a\u003e\u003c/div\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eYOUR CALIFORNIA PRIVACY RIGHTS\u003c/strong\u003e\u003cstrong\u003e\u003cem\u003e\u0026nbsp;\u003c/em\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cu\u003eCCPA\u003c/u\u003e\u003c/p\u003e\n\u003cp\u003eIf you are a California resident, then under the California Consumer Privacy Act of 2018 and its implementing regulations (collectively, as it may be amended, \u0026ldquo;\u003cstrong\u003eCCPA\u003c/strong\u003e\u0026rdquo;), California law provides you with specific rights regarding your Personal Information (as defined under the CCPA). These involve information that identifies, relates to, describes, is reasonably capable of being associated with, or could reasonably be linked to, directly or indirectly, a particular consumer or household, subject to certain exclusions such as certain publicly available, aggregated, or deidentified information, and with certain exemptions such as information collected in an employment/contractor or business-to-business context. These rights include:\u003c/p\u003e\n\u003cp\u003e(A) The right to know what personal information the business has collected about the consumer, including the categories of personal information, the categories of sources from which the personal information is collected, the business or commercial purpose for collecting, selling, or sharing personal information, the categories of third parties to whom the business discloses personal information, and the specific pieces of personal information the business has collected about the consumer;\u003c/p\u003e\n\u003cp\u003e(B) The right to delete personal information that the business has collected from the consumer, subject to certain exceptions;\u003c/p\u003e\n\u003cp\u003e(C) The right to correct inaccurate personal information that a business maintains about a consumer;\u003c/p\u003e\n\u003cp\u003e(D) If the business sells or shares personal information, the right to \u003ca href=\"https://app.termly.io/notify/7adcf11c-f882-41ff-a283-dee764a0b886\" target=\"_blank\" rel=\"noopener\"\u003eopt-out\u003c/a\u003e of the sale or sharing of their personal information by the business; (Blumhouse does not sell personal information.)\u003c/p\u003e\n\u003cp\u003e(E) If the business uses or discloses sensitive personal information for reasons other than those set forth in section 7027, subsection (lm), the right to limit the use or disclosure of sensitive personal information by the business; (Blumhouse does not use or disclose sensitive personal information for such other reasons) and\u003c/p\u003e\n\u003cp\u003e(F) The right not to receive discriminatory treatment by the business for the exercise of privacy rights conferred by the CCPA, including an employee\u0026rsquo;s, applicant\u0026rsquo;s, or independent contractor\u0026rsquo;s right not to be retaliated against for the exercise of their CCPA rights.\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eRequests to Know or Delete\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003eIf you are a California consumer, you or your authorized agent may exercise these rights or request information about the Personal Information we have collected about you in the prior 12 months (as described under (a) above) or to request that we delete your information (as described under (b) above) by contacting us via the form provided \u003ca href=\"https://app.termly.io/notify/7adcf11c-f882-41ff-a283-dee764a0b886\" target=\"_blank\" rel=\"noopener\"\u003ehere\u003c/a\u003e\u0026nbsp;or by mail to Blumhouse Holdings, LLC, 2401 Beverly Blvd., Los Angeles, CA 90057, Attn: Privacy.\u0026nbsp;\u0026nbsp; In the request, please specify which right(s) you are seeking to exercise and the scope of the request.\u0026nbsp;In accordance with the CCPA, we may require additional information to verify your identity (or to verify that your authorized agent has the authority to make the request on your behalf) before responding to a CCPA rights request. If we are unable to so verify, we may deny your requests. We will confirm receipt and respond to all verified requests in accordance with applicable timelines required by the CCPA.\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eDisclosures\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003eFor purposes of California consumers, please see the following disclosures regarding how we (including our Service Providers on our behalf) may have collected, used, and disclosed your Personal Information collected in the previous 12 months in accordance with the CCPA. This will depend on how you have interacted with us and other factors. \u003cem\u003eNote: though the Service has not been operational prior to the effective date of this Privacy Policy (which coincides with its launch date), we will describe categories of Personal Information enumerated in the CCPA which may have been collected by prior means in the prior 12 months, and indicate where practices are likely to change.\u0026nbsp;\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eThe following categories of Personal Information enumerated in the CCPA may have been collected in the past 12 months from the following potential sources (as such information and sources may be more fully described in the \u0026ldquo;\u003ca href=\"#collect\"\u003eWhat May We Collect?\u003c/a\u003e\u0026rdquo; section above):\u003c/p\u003e\n\u003cul \u003e\n\u003cli\u003eIdentifiers, such as your name, email, mailing address, and similar identifiers.\n\u003cul \u003e\n\u003cli\u003e\u003cu\u003eSources\u003c/u\u003e: We may have collected identifiers from: You (e.g., through direct communications), Service Providers\u003cem\u003e, \u003c/em\u003e(e.g., social media vendors), Other Sources (e.g., social media), Business Partners (e.g., licensees), Affiliates.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eLegally Protected Characteristics, such as age, gender, marital status\u003cem\u003e.\u003c/em\u003e\n\u003cul \u003e\n\u003cli\u003e\u003cu\u003eSources\u003c/u\u003e: Other Sources (e.g., social media), Service Providers, You (e.g., through direct communications).\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eCommercial information, such as purchasing histories or tendencies or consumer preferences.\n\u003cul\u003e\n\u003cli\u003e\u003cu\u003eSources\u003c/u\u003e: Business Partners (e.g., licensees), Other Sources (e.g., social media), Affiliates, You (e.g., through direct communications).\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eAudio, electronic, visual, or other similar information (e.g., in any user-generated content)\n\u003cul\u003e\n\u003cli\u003e\u003cu\u003eSources\u003c/u\u003e: Other Sources (e.g., social media), Affiliates, You (e.g., through direct communications).\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eProfessional or employment-related information (e.g., employment status or other information shared on social media)\n\u003cul\u003e\n\u003cli\u003e\u003cu\u003eSources\u003c/u\u003e: Other Sources (e.g., social media), You (e.g., through direct communications).\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eThese additional categories and sources may apply to information collected in the future:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eIdentifiers, such as your IP address\n\u003cul \u003e\n\u003cli\u003e\u003cu\u003eSources\u003c/u\u003e: Automatically, Service Providers\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eInternet or other electronic network activity, such as Usage Information as described above.\n\u003cul \u00
