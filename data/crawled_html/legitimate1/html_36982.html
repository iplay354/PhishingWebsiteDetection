E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#x201C;We will be able to bring the innovative tools of the SARAI Project closer to our farmers in the region,\u0026#x201D; he said. \u0026#x201C;We need to treat agriculture as a business, where the overall system and efforts are geared towards maximizing the profit for our farmers.\u0026#x201D;\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EDirector Sicat added that SARAI CeNTRO is especially vital to Central Luzon, the country\u0026#x2019;s \u0026#x201C;rice granary\u0026#x201D;, as it strengthens support for food production and smart agriculture.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#x201C;SARAI will be a big help to provide proper guidance to our farmers, especially as Central Luzon continues to support the food requirements of Metro Manila,\u0026#x201D; Sicat emphasized.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: center;\u0022\u003E\u003Cimg src=\u0022\/storage\/appnews\/2ac75f6ac45175b90736d8086a99658d.jpeg\u0022 alt=\u0022\u0022 title=\u0022\u0022 width=\u0022880\u0022 height=\u0022364\u0022 data-display=\u0022inline\u0022\u003E\u003C\/p\u003E\u003Cp\u003E\u003Cem\u003EiHub aims to provide a workspace where researchers can collaborate with mentors and investors to accelerate the development of their projects.\u003C\/em\u003E\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp\u003EOn the other hand, the Innovation Hub (iHub), serves as a collaborative workspace for innovators, students, researchers, and entrepreneurs.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#x201C;The iHub has a lot of opportunities for us to provide space for innovators, especially young learners, to leverage innovation,\u0026#x201D; said Solidum. \u0026#x201C;We hope this facility will become the birthplace of technology-based products here in Central Luzon.\u0026#x201D;\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EUndersecretary Mabborang explained that iHub is part of the DOST growing innovation ecosystem, with Central Luzon\u0026#x2019;s hub being the 64th Innovation Hub established nationwide.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#xA0;\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#xA0;\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#x201C;This is a physical space where researchers, inventor-students, and the business community can interact; from ideation, incubation, and inspiration, up to startup creation,\u0026#x201D; Mabborang said.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EHe added that DOST envisions these hubs to eventually attract venture capitalists, angel investors, and technology entrepreneurs, and that P148 million in funding has been approved for iHub development in provinces next year.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#x201C;I am very happy that DOST Region 3 has curated the Innovation Hub. This will deliver cutting-edge technologies and empower the countryside,\u0026#x201D; he said.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: center;\u0022\u003E\u003Cimg src=\u0022\/storage\/appnews\/cf6c2888a1f6a44786c8b20176676a9e.jpeg\u0022 alt=\u0022\u0022 title=\u0022\u0022 width=\u0022972\u0022 height=\u0022365\u0022 data-display=\u0022inline\u0022\u003E\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp\u003EFinally, the AMCEN was inaugurated to support the growth of the manufacturing and industrial sectors of the region. The facility is equipped with state-of-the-art 3D printing and Industry 4.0 tools, which enable industries, students, and universities to create prototypes and develop advanced products using various advanced tools including 3D printing technologies.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#x201C;With industrialization ramping up here in Central Luzon, particularly in manufacturing, DOST aims to contribute to its growth by establishing a hub where we can strengthen the research and technological capability of our industries,\u0026#x201D; Solidum said.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EMabborang emphasized how 3D printing revolutionizes product design and prototyping.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#x201C;Before, it would take a week or a month to make a prototype. Now, you can program it on a computer, print it with a 3D printer, and create the prototype in several minutes,\u0026#x201D; he explained. \u0026#x201C;This transforms not only the way we do things, but it will also have an impact on the industry.\u0026#x201D;\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EFurther, Sicat also shared that Central Luzon\u0026#x2019;s AMCEN\u0026#x2019;s additive manufacturing laboratory has begun partnerships with Jose B. Lingad Memorial General Hospital to use 3D printing in medical applications.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EThe launch of SARAI, iHub, and AMCEN encapsulates the DOST\u0026#x2019;s guiding vision of \u0026#x201C;Agham na Ramdam,\u0026#x201D; science that is genuinely felt by the people.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#x201C;These three initiatives are anchored on a simple yet meaningful goal in DOST: To provide solutions and opportunities for everyone, opportunities to upgrade their lives,\u0026#x201D; Solidum said. \u0026#x201C;Through science, technology, and innovation, and our spirit of collaboration and faith, we can show that science will really create an impact for our people, especially in the regions and provinces.\u0026#x201D;\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003ESicat expressed his gratitude to the DOST leadership for their strong regional support saying, \u0026#x201C;it\u0026#x2019;s not every day that we have a secretary and undersecretary who wholeheartedly support our regional operations. Let us take this opportunity to strengthen science-based development for our people.\u0026#x201D;\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EAs DOST continues its efforts to decentralize innovation and empower local communities, the launch of these three facilities in Pampanga serves as a powerful statement that science and technology are not confined to laboratories or offices in Manila but are tools for progress available to every Filipino across the nation.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#x201C;They are not merely concrete and steel or plastic features,\u0026#x201D; Solidum concluded. \u0026#x201C;They are doors to new possibilities created by innovation, platforms of change and transformation where we can turn the dreams and hopes of the Filipino people into realities from ideas for a brighter future that benefits everyone.\u0026#x201D;\u003C\/p\u003E\u003Cp\u003EThe establishment of SARAI, iHub, and AMCEN in Central Luzon is one of the many initiatives of the Department of Science and Technology (DOST) aimed at providing science-based, innovative, and inclusive solutions across four strategic pillars: human well-being, wealth creation, wealth protection, and sustainability. These pillars embody the mantra OneDOST4U: Solutions and Opportunities for All. For more information, visit \u003Ca href=\u0022http:\/\/www.dost.gov.ph\u0022 ref=\u0022nofollow\u0022\u003Ewww.dost.gov.ph\u003C\/a\u003E\u003Cstrong\u003E\u003Cem\u003E. (By Abigael S. Oma\u0026#xF1;a, DOST-STII)\u003C\/em\u003E\u003C\/strong\u003E\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\n","region":"REGION 3","created":"2025-11-19 09:26:00","created_by_alias":"Abigael S. Omana, DOST-STII","publish_date":"2025-11-19 09:26:00","is_press_release":1}]'
            prop-tk="283oW8iUgj6TjXidnGOkpZadJKe1GORQT7rxWmtu"></latest-news>

    <!-- Most Visited -->
    <most-visited-article :prop-most-visited-articles='[{"article_id":621862,"title":"Lower cost, big gains: Here\u2019s why businesses should shift to renewable energy","alias":"lower-cost-big-gains-heres-why-businesses-should-shift-to-renewable-energy","content":"\u003Cp\u003ESolar energy is increasingly being used in the country either to lower electric consumption on households or to reduce operational costs for businesses.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003EAccording to the Solar Energy Industries Association (SEIA), solar energy is a radiant energy from the sun that can be converted into electricity or heat using technologies like photovoltaics (PV) and solar thermal systems. It is the cleanest and most abundant renewable energy source available.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003EThrough the Department of Science and Technology\u0026#x2019;s (DOST) Small Enterprise Technology Upgrading Program (SETUP), businesses are encouraged to adopt green technologies such as renewable energy, not just to lower electricity bills but to also help reduce carbon dioxide emissions.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003E\u0026#x201C;So, what we are saying is that the DOST is focused on helping people and the planet.\u0026#xA0; Ang \u003Cem\u003Epeople\u003C\/em\u003E sa trabaho, ang \u003Cem\u003Eplanet\u003C\/em\u003E, sa climate resilience, climate mitigation in greenhouse gas,\u0026#x201D; DOST Secretary Renato U. Solidum said.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003EOne of the beneficiaries of the program is Anthony Caleon, the owner of AACaleon Realty Corporation, operating under the name of Casa Jardin by Zen, located at Purok 1, Bonfal Proper Bayombong, Nueva Vizcaya.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003E\u0026#x201C;Gaya nga nang nasabi ko po kanina, makakabawas ako sa demand ng kuryente. Lalo na ang [Nueva] Vizcaya, napakamahal ng kuryente. Kaya sa operation namin, ang laki ng effect niyan. Dati kasi ang laki ng bill namin, 500,000 mahigit. Ngayon less than 300,000 na lang\u0026#x201D;, Caleon said in an interview, during a project visit.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003EAccording to Caleon, Nueva Vizcaya\u0026#x2019;s current electric price is at around P14.00 per kilowatt hour (kWh) which he said is lower than Isabela\u0026#x2019;s at P10 per kWh.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003ECaleon was granted a Php3 million assistance from the DOST-Region 2 through the SETUP Innovation Fund (iFund) program, for the installation of one unit of 100kw On-Grid\/Grid-tie Solar PV System. It was recently installed in the last week of June 2025.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003EThe solar panels were housed at Zen Hotel Bayombong, where DOST officials, including Solidum, stayed during the 2025 Regional Science, Technology and Innovation Week (RSTW) in Cagayan Valley.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003EiFund program provides financial and technical assistance to micro, small, and medium enterprises (MSMEs) to adopt technological innovations and improve their competitiveness. It offers support like seed funds for technology acquisition, equipment upgrading, training, and consultancy services, helping MSMEs enhance product quality, increase productivity, and streamline operations.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003EThis funding is a mechanism for technology transfer, requiring MSMEs to repay the financial assistance with low or zero interest over an extended period.\u0026#xA0;\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003EBased on the data provided by the DOST 2, the total project cost of the solar system installed at Zen Hotel Bayombong is at Php27 million.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003E\u0026#x201C;So, ang ating focus, syempre noong unang panahon ang mga MSME naka focus lang sa production. Mas maraming production, mas maraming kita. Now, with the renewable energy, yung cost of production sa kuryente, gusto rin nilang mabawasan para lumaki yung kita. Kaya ang pagpapalaki ng kita, hindi lang production, kundi to lower the cost in expenses,\u0026#x201D; Solidum said.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003ECaleon said they are hoping to achieve \u0026#x2018;zero\u0026#x2019; electric bill, especially once they fully operationalize the battery energy storage systems (BESS) they installed.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003EBESS are commonly used in solar energy systems to store excess energy [from the sun] for later use.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003EAside from promoting the use of solar energy, the DOST is also assisting Cagayan State University in electric mobility research and development where it produces converted traditional tricycles to electric tricycles.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003E\u0026#x201C;We want to say that we are happy because that is already being recognized by the government and up to Mindanao, many are interested. So, what we are doing is we are looking for people who can invest in the spin-off of Cagayan State so that we can produce [converted tricycles] and reduce carbon dioxide emissions and generate a lot of jobs here,\u0026#x201D; Solidum said.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003EThe project visit is among the activities of the 2025 RSTW held in Cagayan Valley on October 9-11.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003EThe 2025 RSTW is one of the initiatives of the Department of Science and Technology (DOST) aimed at providing science-based, innovative, and inclusive solutions across four strategic pillars: human well-being, wealth creation, wealth protection, and sustainability. These pillars embody the mantra OneDOST4U: Solutions and Opportunities for All. For more information, visit \u003Ca href=\u0022http:\/\/www.dost.gov.ph\/\u0022 ref=\u0022nofollow\u0022\u003Ewww.dost.gov.ph\u003C\/a\u003E. \u003Cstrong\u003E\u003Cem\u003E(By Claire Bernadette A. Mondares, DOST-STII and photos by Allan Mauro V. Marfal, DOST-STII)\u003C\/em\u003E\u003C\/strong\u003E\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: center;\u0022\u003E\u003Cimg src=\u0022\/storage\/appnews\/859d525d6783a47d029615714358f29a.jpeg\u0022 alt=\u0022\u0022 title=\u0022\u0022 width=\u0022754\u0022 height=\u0022386\u0022 data-display=\u0022inline\u0022\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: center;\u0022\u003EThis battery energy storage systems (BESS) installed at Zen Hotel Bayombong, Nueva Vizcaya is expected to help reduce the company\u0026#x2019;s electric bill by 50% to zero.\u003C\/p\u003E\u003Cp style=\u0022text-align: center;\u0022\u003E\u003Cimg src=\u0022\/storage\/appnews\/29b55224b3ae16005fbfabb93cc97d6e.jpeg\u0022 alt=\u0022\u0022 title=\u0022\u0022 width=\u0022756\u0022 height=\u0022348\u0022 data-display=\u0022inline\u0022\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: center;\u0022\u003E(From left to right) DOST Secretary Renato U. Solidum Jr., along with DOST-2 Regional Director Dr. Virginia D. Bilgera, and DOST Undersecretary for Regional Operations Engr. Sancho A. Mabborang (right side on blue polo) visits Anthony Caleon (middle) to check the progress of newly installed solar systems at Zen Hotel Bayombong, Nueva Vizcaya.\u003C\/p\u003E\n","region":"REGION 2","created":"2025-10-27 17:26:00","created_by_alias":"By Claire Bernadette A. Mondares, DOST-STII","publish_date":"2025-10-19 17:26:00","is_press_release":1},{"article_id":621898,"title":"NSTW 2025 to feature eco-friendly fragrances; invites local perfumers and MSMEs to scents forum","alias":"nstw-2025-to-feature-eco-friendly-fragrances-invites-local-perfumers-and-msmes-to-scents-forum","content":"\u003Cp\u003EThe Department of Science and Technology (DOST) through the Forest Products Research and Development Institute (DOST-FPRDI) is bringing various aromatic scents and fragrances to this year\u0026#x2019;s celebration of National Science, Technology and Innovation Week (NSTW) to be held in Laoag City, Ilocos Norte on November 18-21.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EWith the goal to transform the essential oils industry in the country, DOST-FPRDI introduces an eco-friendly approach through its \u0026#x2018;Green Fragrance with Purpose\u0026#x2019; initiative.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EThis project uses Supercritical Fluid Extraction (SFE), a green extraction technique designed to extract pure, high-quality essential oils without degrading volatile components.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EIt also aims to reduce the environmental impact by minimizing material and energy usage.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EWhat sets apart this Green Fragrance collection is that it is rooted in scientific expertise and cultural appreciation as it uses advanced tools and sensory evaluation by industry experts to ensure premium quality and distinctive fragrance profiles.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EAccording to DOST-FPRDI, essential oils are important in aromatherapy products, fragrances, and herbal remedies.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EHowever, it said that essential oils extraction in the Philippines mainly relies on traditional methods such as hydro-distillation and steam distillation, which face challenges such as increased heat sensitivity, low yield, high input cost, and sustainability concerns.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003ETo provide an avenue for local perfumers, essential oil producers and the MSMEs to learn more about this technology, the DOST-FPRDI will be organizing a forum titled \u0026#x201C;Scents and Sounds: Forest Products Innovations for the Creative Industry\u0026#x201D; on November 20, Thursday, from 9:00 a.m. to 4:00 p.m., at Northwestern University, Laoag City.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EThe event aims to highlight science-based innovations in green fragrances and essential oils, promote inclusive livelihood opportunities, which integrate science, technology, and local artistry to strengthen the creative economy and preserve Filipino cultural identity.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#xA0;\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EThe \u0026#x2018;Green Fragrance with Purpose\u0026#x2019; initiative is one of the programs to be featured in this year\u0026#x2019;s 2025 NSTW celebration. Aside from this, the week-long event will also showcase activities, forums, and interactive exhibits anchored on the sub-theme: Building Smart and Sustainable Communities, which aims to showcase several R\u0026amp;D based and scientific services that would offer long-term solutions to different communities\u0026#x2019; pressing challenges and existing limitations.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EThe 2025 NSTW is open to the public. For the complete list of activities and schedule, follow the NSTW Facebook page at \u003Ca href=\u0022https:\/\/www.facebook.com\/nstwdost\u0022 target=\u0022_blank\u0022 ref=\u0022nofollow noopener noreferrer\u0022\u003Ehttps:\/\/www.facebook.com\/nstwdost\u003C\/a\u003E or visit the NSTW website at \u003Ca href=\u0022http:\/\/nstw.dost.gov.ph\u0022 target=\u0022_blank\u0022 ref=\u0022nofollow noopener noreferrer\u0022\u003Ehttp:\/\/nstw.dost.gov.ph\u003C\/a\u003E\u003Cstrong\u003E\u003Cem\u003E. (By Claire Bernadette Mondares, DOST-STII)\u003C\/em\u003E\u003C\/strong\u003E\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: center;\u0022\u003E\u003Cimg src=\u0022\/storage\/appnews\/18114f795f1f283bc5a67994b5f56e1d.jpeg\u0022 alt=\u0022\u0022 title=\u0022\u0022 width=\u0022879\u0022 height=\u0022336\u0022 data-display=\u0022inline\u0022\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: center;\u0022\u003ESample photo of the Green Fragrance collection of the DOST-FPRDI. These essential oils will be featured at the NSTW 2025 in Laoag City, Ilocos Norte on November 18-21.\u003C\/p\u003E\n","region":"REGION 1","created":"2025-11-13 08:16:00","created_by_alias":"Claire Bernadette A. Mondares, DOST-STII","publish_date":"2025-11-13 08:16:00","is_press_release":1},{"article_id":621892,"title":"DOST Davao scholars turn science into solutions in technopreneurship training program","alias":"dost-davao-scholars-turn-science-into-solutions-in-technopreneurship-training-program","content":"\u003Cp style=\u0022text-align: center;\u0022\u003E\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: center;\u0022\u003E\u003Cimg src=\u0022\/storage\/appnews\/82c8991ba13f0022393a4ff8836b4018.png\u0022 alt=\u0022\u0022 title=\u0022\u0022 width=\u0022853\u0022 height=\u0022642\u0022 data-display=\u0022inline\u0022\u003E\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EFrom improving math learning to promoting sustainable sanitation and protecting agricultural livelihoods, young Filipino innovators from the Davao Region are showing how Science, Technology, and Innovation (STI) can inspire ideas that change lives and communities.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003EAfter months of mentorship, collaboration, and hands-on learning, twelve DOST scholar-led teams from the Region completed the 2025 Scholars Technopreneurship Training Program (STTP) and presented their concept innovations during the program\u0026#x2019;s Demo Day. The event marked the culmination of their six-month training journey under the Department of Science and Technology \u0026#x2013; Science Education Institute (DOST-SEI), in partnership with DOST Davao and Leave a Nest Philippines.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003EThe STTP aims to nurture the entrepreneurial mindset of DOST scholars, guiding them to transform research-based ideas into potential solutions for real-world\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003Eproblems. While the projects are still at the conceptual stage, they represent early steps toward a future where young scientists and innovators can create technologies that address community challenges.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003EAccording to DOST Davao Regional Director Anthony C. Sales, the program highlights the importance of investing in youth-led innovation as a driver of national development.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003E\u0026#x201C;These ideas show what is possible when we combine curiosity, science, and compassion for the community,\u0026#x201D; said Director Sales.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003E\u0026#x201C;Even at the concept stage, our scholars are already thinking about how technology can improve lives, and that is exactly the kind of mindset DOST seeks to cultivate.\u0026#x201D;\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003E\u003Cstrong\u003E\u003Cem\u003EALLYMath: Making Math Learning Engaging and Accessible\u003C\/em\u003E\u003C\/strong\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003ETaking the top spot was ALLYMath, a conceptual design for a mobile learning application that aims to make mathematics more interactive, personalized, and engaging for Filipino students.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003EInspired by the continuing challenge of low math proficiency among learners, as reflected in global assessments such as Program for International Student Assessment, the team behind ALLYMath envisions an app that uses gamified lessons, adaptive learning, and localized content to help students understand math concepts more effectively.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003EThe concept also includes dashboards for teachers and parents, allowing them to monitor learning progress and tailor support for students. Once developed, the app could help make learning more inclusive and data-driven, particularly in schools with limited access to traditional resources.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003E\u003Cstrong\u003EecoKUBETA: Redefining Sanitation in Coastal Communities\u003C\/strong\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003EThe first runner-up, presented ecoKUBETA, a concept for a modular, compost-generating toilet system designed to improve sanitation in coastal communities.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003EThe idea was inspired by the conditions in Barangay 23-C, Davao City, where many residents lack access to safe and hygienic toilets. ecoKUBETA proposes a sustainable design that converts human waste into compost without the need for running water or sewage systems. The system also emphasizes portability, privacy, and environmental protection.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003EIf further developed and tested, ecoKUBETA could offer an alternative sanitation model for local governments and organizations working in resource-limited or disaster-prone communities.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003E\u003Cstrong\u003ETrichoMend+: Protecting the Banana Industry through Biotechnology\u003C\/strong\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003EThe second runner-up, Team TrichoMend+, conceptualized an innovative biotechnology solution to help farmers detect and control Panama disease, a fungal infection that continues to threaten the country\u0026#x2019;s banana plantations.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003ETheir idea integrates two complementary components: Trichoderma Pellets, which release beneficial fungi to protect soil health, and a Panama Early Detection Device, designed to sense infection before symptoms appear using volatile organic compound (VOC) sensors.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003EThough still a concept, the team envisions that once developed, TrichoMend+ could help banana growers reduce losses, improve yields, and lessen dependence on chemical fungicides, contributing to more sustainable and resilient agriculture.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003E\u003Cstrong\u003EEmpowering the Next Generation of Filipino Innovators\u003C\/strong\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003EThrough the STTP, DOST continues to invest in young talents who have the potential to lead in research, innovation, and entrepreneurship. The program encourages scholars to apply scientific thinking not only in laboratories but also in creating solutions for pressing community and national challenges.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003EThe 2025 Scholars Technopreneurship Training Program is one of the many initiatives of the Department of Science and Technology (DOST) aimed at providing science-based, innovative, and inclusive solutions across four strategic pillars: human well-being, wealth creation, wealth protection, and sustainability. These pillars embody the mantra OneDOST4U: Solutions and Opportunities for All. For more information, visit \u003Ca href=\u0022http:\/\/www.dost.gov.ph\/\u0022 ref=\u0022nofollow\u0022\u003Ewww.dost.gov.ph\u003C\/a\u003E \u003Cstrong\u003E\u003Cem\u003E(By Vener Zygmond O. Rebuelta, DOST-11)\u003C\/em\u003E\u003C\/strong\u003E\u003C\/p\u003E\n","region":"REGION 11","created":"2025-11-12 07:07:00","created_by_alias":"Vener Zygmond O. Rebuelta","publish_date":"2025-11-12 07:07:00","is_press_release":1},{"article_id":621894,"title":"\u2018Proven in the Philippines, Trusted by the World\u2019: DOST charts bold course to make PH a global hub for credible technologies","alias":"proven-in-the-philippines-trusted-by-the-world-dost-charts-bold-course-to-make-ph-a-global-hub-for-credible-technologies","content":"\u003Cp style=\u0022text-align: center;\u0022\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: center;\u0022\u003E\u003Cimg src=\u0022\/storage\/appnews\/71c3ff625ecd7f244b59a032ec14062b.png\u0022 alt=\u0022\u0022 title=\u0022\u0022 width=\u0022880\u0022 height=\u0022665\u0022 data-display=\u0022inline\u0022\u003E\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EThe Department of Science and Technology (DOST) envisions a future where the words \u003Cem\u003E\u0026#x201C;Proven in the Philippines. Trusted by the World.\u0026#x201D;\u003C\/em\u003E stand as the seal of quality for every Filipino-made innovation.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003EAt the first-ever culmination of Inno.Venta 2025: Transforming Discoveries into Economic Impact, DOST Assistant Secretary for Technology Transfer, Communications, and Commercialization (TTCC) Dr. Napoleon K. Juanillo Jr. revealed the Department\u0026#x2019;s plan to make the Philippines a trusted home for validated and globally competitive technologies.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003ECentral to this vision is PHI-TEST, short for the \u003Cem\u003EPhilippine Higher Education Validation and Innovation Testbed\u003C\/em\u003E\u0026#x2014;a pioneering collaboration between DOST and the Commission on Higher Education (CHED). It will serve as a nationwide testing and certification mechanism that ensures every Filipino innovation is not only functional but \u003Cem\u003Escientifically sound, ethically verified, and globally credible\u003C\/em\u003E.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003E\u0026#x201C;The pursuit of credibility is really a numbers game,\u0026#x201D; Juanillo said. \u0026#x201C;If we can scientifically demonstrate, through rigorous methods and large-scale testing, that tens of thousands of users or adopters have validated a technology, then we can confidently tell investors and regulators that it works. That\u0026#x2019;s credibility.\u0026#x201D;\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003EUnder PHI-TEST, technologies developed by universities, research institutes, and even independent innovators will undergo standardized protocols and validation processes aligned with global benchmarks such as ISO, CE, JIS, and KS. Through this system, Filipino innovations can achieve certification comparable to international standards, allowing them to compete in foreign markets with greater confidence.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003E\u0026#x201C;When a product earns PHI-TEST certification, it won\u0026#x2019;t just say \u0026#x2018;Made in the Philippines,\u0026#x2019;\u0026#x201D; Juanillo emphasized. \u0026#x201C;It will proudly declare, \u0026#x2018;Proven in the Philippines.\u0026#x2019;\u0026#x201D;\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003EDOST Secretary Renato U. Solidum Jr. highlighted how the country\u0026#x2019;s network of state universities and colleges (SUCs) could play a key role in this effort. \u0026#x201C;Many SUCs focus on training and extension work, but beyond that, the real finish line is commercialization,\u0026#x201D; he said. \u0026#x201C;We see them as vital partners in testing and validating technologies alongside developers. That\u0026#x2019;s the essence of PHI-TEST.\u0026#x201D;\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003EThrough the DOST\u0026#x2013;CHED partnership, PHI-TEST will mobilize the expertise and facilities of higher education institutions nationwide, creating a unified ecosystem where\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003Einnovation meets accountability. This framework, Juanillo explained, could transform isolated research projects into evidence-backed technologies ready for large-scale deployment and export.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003E\u0026#x201C;With PHI-TEST, we are building trust at scale,\u0026#x201D; he said. \u0026#x201C;We\u0026#x2019;re turning the Philippines into a regional hub for innovation validation and certification\u0026#x2014;where credibility becomes our most powerful export.\u0026#x201D;\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003EOnce operational, PHI-TEST is expected to accelerate the adoption of Filipino technologies in high-impact industries such as health, agriculture, manufacturing, and energy. It aims to open new global market pathways for local innovations, strengthen public-private collaboration, and generate billions of pesos in commercialization revenue. In doing so, it is also expected to contribute to improving the country\u0026#x2019;s ranking in the Global Innovation Index and other international benchmarks.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003EUltimately, PHI-TEST represents more than just a testing framework\u0026#x2014;it is a strategic economic enabler. By institutionalizing rigorous technology validation, the Philippines can transform homegrown R\u0026amp;D outputs into high-value commercial solutions, creating thousands of quality jobs and establishing the country\u0026#x2019;s credibility in the global science and technology arena.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003EHeld at Batangas State University (The National Engineering University) from October 23 to 25, 2025, Inno.Venta 2025 served as a vibrant marketplace of ideas and innovations. The event, funded under Program PROPEL, brought together scientists, entrepreneurs, investors, and industry leaders to bridge the gap between research and commercialization.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003EInno.Venta also reflected DOST\u0026#x2019;s broader commitment to advancing innovation for national development\u0026#x2014;anchored on four strategic pillars: human well-being, wealth creation, wealth protection, and sustainability\u0026#x2014;embodying its unifying mantra, OneDOST4U: Solutions and Opportunities for All.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003E\u0026#x201C;The Philippines can be the region\u0026#x2019;s proving ground for science-based technologies,\u0026#x201D; Juanillo concluded. \u0026#x201C;With PHI-TEST, we are not only validating innovations\u0026#x2014;we are validating the country\u0026#x2019;s future. \u003Cstrong\u003E\u003Cem\u003E(With information from Claire Bernadette A. Mondares, DOST\u0026#x2013;STII)\u003C\/em\u003E\u003C\/strong\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u003Cbr\u003E\u003C\/p\u003E\n","region":"NCR","created":"2025-11-12 07:32:00","created_by_alias":"Claire Bernadette A. Mondares, DOST-STII","publish_date":"2025-11-12 07:32:00","is_press_release":1},{"article_id":621893,"title":"DOST Davao showcases smart farming techs for sustainable agriculture","alias":"dost-davao-showcases-smart-farming-techs-for-sustainable-agriculture","content":"\u003Cp style=\u0022text-align: center;\u0022\u003E\u003Cbr\u003E\u003Cimg src=\u0022\/storage\/appnews\/afd986522b256ab33eb87e1296bb6db3.png\u0022 alt=\u0022\u0022 title=\u0022\u0022 width=\u0022947\u0022 height=\u0022664\u0022 data-display=\u0022inline\u0022\u003E\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EThe farms of the future are no longer built on guesswork; they are powered by Science, Technology, and Innovation.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003EThrough the Southern Mindanao Agriculture, Aquatic and Resources Research and Development Consortium (SMAARRDEC), the Department of Science and Technology (DOST) Davao is bringing this vision closer to reality by introducing local farmers to technologies that combine data, automation, and artificial intelligence for smarter, more sustainable agriculture.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003EAmong the featured breakthroughs is Zappify, an Internet of Things (IoT)-based pest control device that automates pest detection and management. By using sensors and connectivity, Zappify can identify pest activity and activate control mechanisms only when needed, reducing the use of chemical pesticides and cutting operational costs. This allows farmers to protect their crops more efficiently while minimizing environmental impact.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003EAnother innovation focuses on the use of multispectral data for precision agriculture. By capturing light beyond what the human eye can see, multispectral imaging provides detailed information on plant health, soil condition, and moisture levels. With this data, farmers can make more informed decisions such as when and where to irrigate, fertilize, or harvest, resulting in higher yields and better resource management.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003EMeanwhile, INDAI (INspection of Durian using AI) showcases how artificial intelligence is transforming one of Davao\u0026#x2019;s most iconic products. The system uses non-invasive imaging and AI algorithms to assess the quality of durian fruits without cutting them open. This ensures consistency and quality assurance, helping durian growers meet market standards, reduce waste, and increase income.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003E\u0026#x201C;These technologies are proof that Science and Innovation are not abstract concepts but real, practical tools that can transform the way our farmers work,\u0026#x201D; said DOST Davao Regional Director Anthony C. Sales.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003E\u0026#x201C;By empowering our agriculture sector with smart technologies, we are securing not only better harvests but also a more sustainable and competitive future for Mindanao,\u0026#x201D; he added.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003EBeyond showcasing technology, DOST Davao\u0026#x2019;s efforts emphasize the growing importance of data-driven and sustainable practices in local farming. As challenges such as climate change, market demands, and resource constraints reshape agriculture, innovations like Zappify, multispectral imaging, and INDAI demonstrate how Filipino creativity, guided by Science, Technology, and Innovation, can help farmers thrive in a modern and competitive world.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003EThrough these initiatives, DOST Davao continues to bridge the gap between research and application, ensuring that scientific advancements reach the hands of farmers and rural communities where they can make the greatest impact.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 160%;\u0022\u003EThe smart farming technologies are some of the many initiatives of the Department of Science and Technology (DOST) aimed at providing science-based, innovative, and inclusive solutions across four strategic pillars: human well-being, wealth creation, wealth protection, and sustainability. These pillars embody the mantra OneDOST4U: Solutions and Opportunities for All. For more information, visit \u003Ca href=\u0022http:\/\/www.dost.gov.ph\/\u0022 ref=\u0022nofollow\u0022\u003Ewww.dost.gov.ph\u003C\/a\u003E \u003Cstrong\u003E\u003Cem\u003E(By Vener Zygmond O. Rebuelta, DOST-11)\u003C\/em\u003E\u003C\/strong\u003E\u003C\/p\u003E\n","region":"REGION 11","created":"2025-11-12 07:30:00","created_by_alias":"Vener Zygmond O. Rebuelta","publish_date":"2025-11-12 07:30:00","is_press_release":1},{"article_id":621911,"title":"Carmona, Baguio City are DOST \u2018smart and sustainable communities\u2019 champions","alias":"carmona-baguio-city-are-dost-smart-and-sustainable-communities-champions","content":"\u003Cp style=\u0022text-align: center;\u0022\u003E\u003Cimg src=\u0022\/storage\/appnews\/4a0af433fdec823e8592505383156558.jpeg\u0022 alt=\u0022\u0022 title=\u0022\u0022 width=\u0022645\u0022 height=\u0022599\u0022 data-display=\u0022inline\u0022\u003E\u003C\/p\u003E\u003Cp\u003EThe Department of Science and Technology (DOST) announced its first-ever champions of the Philippine Smart and Sustainable Communities Award (PSSCA) during the closing ceremony of the National Science, Technology, and Innovation Week (2025 NSTW), in Laoag City, Ilocos Norte.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EThe award recognizes the efforts of the local government units (LGUs) in developing their communities and improving the quality of life through science, technology and innovation-driven solutions.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EReceived entries were grouped into four thematic categories namely Human Well-being, Wealth Creation, Wealth Protection, and Sustainability.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EThe Human Well-being Award recognizes LGUs who have exemplified smart and sustainable solutions to ensure health and nutrition, food safety and security, access to clean water, clothing, shelter, and efficient transport systems.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EMoreover, the Wealth Creation Award is for LGUs who have successfully generated economic growth by integrating smart solutions to create value-adding products, services and other solutions towards national and regional development.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EFor the Wealth Protection Award, it was given to LGUs who have deployed smart solutions that focus on enhancing resilience through climate-adaptive technologies and science-driven disaster preparedness to safeguard communities and resources from environmental risks.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003ELastly, LGUs promoting environment stewardship and climate-resilient community were given the Sustainability Award.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EAfter a thorough evaluation of the entries received, Baguio City bagged the Wealth Protection Award, Wealth Creation Award, and Sustainability Award.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#x201C;We are very thankful to DOST for recognizing the efforts and initiatives of the City Government of Baguio in awarding us the several champions of Smart City Components. This will be a big boost for us in trying to gain more and achieve more in terms of sustainability and smart city programs,\u0026#x201D; Baguio City Administrator VJ Cawis said in a chance interview with DOST.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EBaguio City has implemented BMRSys: Building on a Health-Secure Baguio with Data, Dignity and Digital Compassion under the Human Wellbeing category; TERRA \u0026#x2014;a system that bridges technology and nature for resilient living under the Sustainability category; RAIN-GUARD\u0026#x2014;a smart rainfall and flood resilience system for real-time preparedness and climate protection; and WORKPASS\u0026#x2014;a digital leap in enabling jobs and regulating workforce mobility.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#x201C;We are, in a way, lucky in Baguio City because our constituents there, the level of literacy and acceptance in smart city initiatives has become easier recently. But at first, of course, there were birth pains. Like I said, in other LGUs, smart cities are not yet understood,\u0026#x201D; Cawis explained.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EHe added that when the Smart and Sustainable Communities Program (SSCP) was first introduced in the city, its constituents thought it was just an eye in the sky and CCTVs.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EHowever, residents have gradually realized its benefits, like the air quality monitoring system that guides the city administration in deciding how to reroute traffic, and the like.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EMeanwhile, Carmona City in Cavite declared as champion in the Human Well-Being category through its One Digitized Carmona: Building Smart, Inclusive, and Sustainable Communities Through Data-Driven Governance program.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EAmong the 29 nominees, DOST awarded Emerging SSC Award\u003Cstrong\u003E \u003C\/strong\u003E(Level 1); Expanding SSC Award (Level 2); Sustained SSC Award (Level 3); and Transformative SSC Award (Level 4) on November 21, 2025, at Centennial Arena, Laoag City.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#xA0;\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EAccording to DOST-Cordillera Administrative Region (DOST-CAR) Regional Director Nancy A. Bantog, entries were evaluated based on the level of maturity or readiness of technologies implemented and deployed in the cities.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EHowever, Bantog said none of the nominees achieved the highest level of award, which is the Transformative SSC Award or Level 4. This means that none of the projects implemented in cities have influenced policy frameworks on a larger scale and have been replicated by other LGUs.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#xA0;\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#x201C;Projects are evaluated according to their level of readiness and maturity in implementation.\u0026#xA0; This is to ensure that LGUs at different stages of progress are given equal opportunity to be recognized.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#xA0;\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EThe DOST-CAR heads the 2025 PSSC Awards secretariat.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EWinning entries received a plaque of recognition and P500,000 worth of proposal-driven project fund.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#xA0;\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EAs defined by the DOST, a \u0026#x2018;smart city\u0026#x2019; is a community that leverages technology and innovation to enhance urban functionality, sustainability, and livability, making it more responsive to its inhabitants.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#xA0;\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003ESmart city uses Information and Communications Technology (ICT) to improve the quality of life for citizens, enhance service delivery, foster a competitive economy, and promote a sustainable environment.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EThe Smart and Sustainable Communities Program (SSCP) is one of the many initiatives of the Department of Science and Technology (DOST) aimed at providing science-based, innovative, and inclusive solutions across four strategic pillars: human well-being, wealth creation, wealth protection, and sustainability. These pillars embody the mantra OneDOST4U: Solutions and Opportunities for All. For more information, visit \u003Ca href=\u0022http:\/\/www.dost.gov.ph\u0022 ref=\u0022nofollow\u0022\u003Ewww.dost.gov.ph\u003C\/a\u003E\u003Cstrong\u003E\u003Cem\u003E. (By Claire Bernadette A. Mondares, DOST-STII)\u003C\/em\u003E\u003C\/strong\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u003Cstrong\u003E\u003Cem\u003E\u0026#xA0;\u003C\/em\u003E\u003C\/strong\u003E\u003C\/p\u003E\n","region":"REGION 1","created":"2025-11-27 08:31:00","created_by_alias":"Claire Bernadette A. Mondares, DOST-STII","publish_date":"2025-11-27 08:31:00","is_press_release":1}]'></most-visited-article>
