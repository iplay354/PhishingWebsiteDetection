        <latest-news :prop-top-news-articles='[{"article_id":621915,"title":"DOST-NCR caps off 2025 RSTW with awards for local innovation and community impact","alias":"dost-ncr-caps-off-2025-rstw-with-awards-for-local-innovation-and-community-impact","content":"\u003Cp style=\u0022text-align: center;\u0022\u003E\u003Cimg src=\u0022\/storage\/appnews\/dbfb130eb73bd3c6f04db1610b696db9.jpeg\u0022 alt=\u0022\u0022 title=\u0022\u0022 width=\u0022842\u0022 height=\u0022578\u0022 data-display=\u0022inline\u0022\u003E\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp\u003EThis year\u0026#x2019;s Regional Science, Technology, and Innovation Week in the National Capital Region culminates with a recognition of local ingenuity, excellence, and impact of the Department of Science and Technology-National Capital Region\u0026#x2019;s (DOST-NCR) flagship programs and initiatives such as the SETUP 4.0 Awards, Best CEST Awards, Best Grassroot Innovation and Circular Economy Award.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EHere is the list of awardees for each award:\u003C\/p\u003E\u003Cp\u003E\u0026#x25CF;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0; \u003Cstrong\u003E2025 SETUP 4.0 Awards\u003C\/strong\u003E\u003C\/p\u003E\u003Cp\u003E\u003Cu\u003EI-READY Award Regional Winner\u003C\/u\u003E: COGNITIF Inc.\u003C\/p\u003E\u003Cp\u003E\u003Cu\u003ERegional ICON Awardee\u003C\/u\u003E: Premier Physic Metrologie Co.\u003C\/p\u003E\u003Cp\u003E\u003Cu\u003ERegional 2025 CIRCLE Awardees:\u003C\/u\u003E\u003C\/p\u003E\u003Cp\u003E\u0026#x25CF;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0; Patchmed Cosmetic Trading\u003C\/p\u003E\u003Cp\u003E\u0026#x25CF;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0; Fruit Magic Company, Inc.\u003C\/p\u003E\u003Cp\u003E\u0026#x25CF;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0; Danilyn\u0026#x2019;s Enterprises Inc.\u003C\/p\u003E\u003Cp\u003E\u0026#x25CF;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0; \u003Cstrong\u003ESETUP Praise Award:\u003C\/strong\u003E\u003C\/p\u003E\u003Cp\u003E\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0; 2nd Runner Up: Pao Ying Food Inc.\u003C\/p\u003E\u003Cp\u003E\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0; 1st Runner Up: Miracle Soybean Food International Corporation\u003C\/p\u003E\u003Cp\u003E\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0; Regional Winner: The Merry Cooks, Inc.\u003C\/p\u003E\u003Cp\u003E\u0026#x25CF;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0; \u003Cstrong\u003ECEST Community Award:\u003C\/strong\u003E\u003C\/p\u003E\u003Cp\u003E\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0; \u003Cu\u003ESpecial Award for Sustainable Livelihoods\u003C\/u\u003E: Brgy. Putatan, Muntinlupa City\u003C\/p\u003E\u003Cp\u003E\u003Cu\u003ESpecial Award for Sustainable Science and Technology Culture and Education\u003C\/u\u003E:\u003C\/p\u003E\u003Cp\u003EBrgy. Payatas, Quezon City\u003C\/p\u003E\u003Cp\u003E\u003Cu\u003ESpecial Award for Sustainable Health and Nutrition\u003C\/u\u003E: Brgy. Fortune, Marikina City\u003C\/p\u003E\u003Cp\u003E\u003Cu\u003ESpecial Award for Sustainable Circular Economy Initiative\u003C\/u\u003E: Brgy. Potrero,\u003C\/p\u003E\u003Cp\u003EMalabon City\u003C\/p\u003E\u003Cp\u003E\u003Cu\u003EBest CEST Regional Award and 1st Runner Up in the National Awarding\u003C\/u\u003E: Brgy.\u003C\/p\u003E\u003Cp\u003EPotrero, Malabon City\u003C\/p\u003E\u003Cp\u003E\u0026#x25CF;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0; \u003Cstrong\u003E2025 Best GI and CE Solutions\u003C\/strong\u003E\u003C\/p\u003E\u003Cp\u003E\u003Cstrong\u003E\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0; \u003C\/strong\u003E\u003Cu\u003EGrassroot Innovation Category\u003C\/u\u003E\u003C\/p\u003E\u003Cp\u003EThird Place: Samahang Pantawid Pamilya Mushroom ng Maybunga \/ Improvised Mushroom Pasteurization Drum\u003C\/p\u003E\u003Cp\u003ESecond Place: Samahan ng Mandaragat ng Isla Puting Bato \/ Like a Flipper (Tabla sa Paa)\u003C\/p\u003E\u003Cp\u003E\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0; First Place: MRF Balangkas Community Garden \/ Banana Peel Burger Patties\u003C\/p\u003E\u003Cp\u003E\u003Cstrong\u003E\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0; \u003C\/strong\u003E\u003Cu\u003ECircular Economy Category\u003C\/u\u003E\u003C\/p\u003E\u003Cp\u003EThird Place: Ricardo P. Cruz, Sr. Elementary School (Risk Reduction Alarm Facility)\u003C\/p\u003E\u003Cp\u003ESecond Place: Dr. Jose N. Rodriguez Memorial Hospital and Sanitarium \u0026amp; Naglalala Weavers (Weaved Wire Cables)\u003C\/p\u003E\u003Cp\u003E\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0; First Place: Caybiga High School (P.A.P.E.R Wi-Fi)\u003C\/p\u003E\u003Cp\u003E\u003Cstrong\u003E\u0026#xA0;\u003C\/strong\u003E\u003C\/p\u003E\u003Cp\u003E\u003Cstrong\u003E2025 Project SARAI CeNTRO Partner\u003C\/strong\u003E\u003C\/p\u003E\u003Cp\u003ELyceum of Alabang\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EDOST-NCR\u0026#x2019;s Assistant Regional Director for Technical Support Services Bianca Claudette R. Canlas, highlighted in her closing remarks how innovation thrives when everyone works together.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#x201C;It thrives when government provides support, when industries open opportunities, when educators cultivate curiosity, and when researchers and innovators dare to imagine something better and create solutions for real-world problems,\u0026#x201D; she said.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EShe also thanked the Technological Institute of the Philippines for hosting the said celebration and all the partners, collaborators, exhibitors, speakers, judges, and participants for making it meaningful and impactful.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#x201C;Your presence and your passion affirm that we can move Metro Manila forward for it to continue to be a dynamic hub for science, technology, and innovation,\u0026#x201D; she ended.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EKey programs and services, such as PROPEL and TECHGROW, were also presented to help innovators, start-ups, and enterprises transform research outputs into viable products and services.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EPROPEL is the DOST\u0027s flagship commercialization initiative as its key strategies include accelerating technology transfer.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EMoreover, TECHGROW, short for Technology Transfer and Entrepreneurship Collaboration and Harmonization of Growing Regional Opportunities on Wealth Creation, is a three-year program that is designed to enhance competencies and expand technology transfer and commercialization initiatives among Local Universities and Colleges, State Universities and Colleges, Higher Education Institutions, and Research and Development Institutes across the country. Participants also gained insights from IPOPHL on intellectual property management, protection, and licensing\u0026#x2014;critical elements for maximizing the commercial value of innovations.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EThe 2025 RSTW celebration is one of the many initiatives of the Department of Science and Technology (DOST) aimed at providing science-based, innovative, and inclusive solutions across four strategic pillars: human well-being, wealth creation, wealth protection, and sustainability. These pillars embody the mantra OneDOST4U: Solutions and Opportunities for All. For more information, visit \u003Ca href=\u0022http:\/\/www.dost.gov.ph\u0022 ref=\u0022nofollow\u0022\u003Ewww.dost.gov.ph\u003C\/a\u003E. \u003Cstrong\u003E\u003Cem\u003E(By Rosemarie C. Se\u0026#xF1;ora, DOST-STII)\u003C\/em\u003E\u003C\/strong\u003E\u003C\/p\u003E\n","region":"REGION 1","created":"2025-12-04 10:33:00","created_by_alias":"Rosemarie C. Se\u00f1ora, DOST-STII","publish_date":"2025-12-04 10:33:00","is_press_release":1},{"article_id":621914,"title":"PH boasts 1st prototype house made of plastic materials strengthened through radiation","alias":"ph-boasts-1st-prototype-house-made-of-plastic-materials-strengthened-through-radiation","content":"\u003Cp\u003EIn the fight against global plastic pollution, the Philippines, through the Department of Science and Technology-Philippine Nuclear Research Institute (DOST-PNRI) showcased the first-of-its-kind prototype house built with radiation-processed plastic tiles and panels.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EDOST Secretary Renato U. Solidum Jr. said this common Filipino residential house model is a concrete example of the country\u0026#x2019;s achievement in leveraging nuclear science and radiation technology as an \u0026#x201C;innovative yet realistic solution for reprocessing plastic wastes.\u0026#x201D;\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#x201C;Thanks to the IAEA NUTEC Plastics initiative, and the collaboration of scientists from the DOST-Philippine Nuclear Research Institute, Industrial Technology Development Institute and their counterpart, Envirotech. I am proud to say that we have made great progress since then,\u0026#x201D; Solidum said.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EThe Nuclear Technology for Controlling Plastic Pollution (NUTEC Plastics) is an initiative launched by the International Atomic Energy Agency (IAEA) to help countries use nuclear science to monitor and reduce plastic pollution. The Philippines is one of the nine pilot countries leading the world in the plastics upcycle component of NUTEC Plastics initiative.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EThrough the Post-Radiation Reactive Extrusion (PREx) project, researchers of DOST-PNRI were able to show that low-value plastic waste can be transformed into durable construction materials like tiles, bricks, and panels.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#x201C;A lot of them [plastics] are coming from sachets. These are quite common in the Philippines. They are treated with radiation. What does the radiation do? It enables the bonding of the plastics to be modified, so that there will be stronger bonds. If you did not apply the radiation, the product, even if you heat it, will not be very sustainable,\u0026#x201D; DOST-PNRI Director Carlo A. Arcilla said, explaining how plastic wastes are turned into useful materials.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EHe added that radiation-induced processing can only be done using an electron beam or gamma radiation, however, he clarified that the radiation does not make the plastics radioactive, making the technology safe for handling and everyday use.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#xA0;\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#xA0;\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EMoreover, aside from its significant contribution to circular-economy innovation, upcycling plastic waste materials can also be a business opportunity, according to Solidum.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#x201C;We also wanted to change the mindset of our people at the community level. One of the things that we need to change is when people see plastic, they don\u0027t see plastic, but they see money. If you think that what you see is money, you won\u0027t throw it away. So essentially what we\u0027re trying to do now is really combine science, technology, innovation, and business,\u0026#x201D; Solidum said.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EDisplayed at the DOST-PNRI compound, the PREx model house is the first prototype physically demonstrated exclusively in the country during the first visit of the IAEA Director General Rafael Mariano Grossi on November 26, 2025.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EHis visit is also part of the first International High-Level Forum on NUTEC Plastics convened at Conrad Hotel, Pasay City on November 25.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EThe forum aimed to serve as a platform to gather ministers, scientists, regulators, innovators, and industry leaders to tackle international perspectives, opportunities, and challenges in addressing global plastic pollution.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#x201C;The Philippines is honored to convene this high-level forum at the moment when nations are redefining how science and technology shape their development and protect. Across the world, environmental pressures are converging with rapid technological changes. Leadership today demands not only political will, but an ability to integrate scientific evidence, cutting-edge research, and strategic foresight into national and global decision-making,\u0026#x201D; President Ferdinand Marcos Jr. said.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EMarcos led the opening ceremony of the forum at Conrad Hotel Pasay City.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EThe PREx model house is one of the many initiatives of the Department of Science and Technology (DOST) aimed at providing science-based, innovative, and inclusive solutions across four strategic pillars: human well-being, wealth creation, wealth protection, and sustainability. These pillars embody the mantra OneDOST4U: Solutions and Opportunities for All.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EFor more information, visit \u003Ca href=\u0022http:\/\/www.dost.gov.ph\u0022 ref=\u0022nofollow\u0022\u003Ewww.pnri.dost.gov.ph\u003C\/a\u003E\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EThe International Atomic Energy Agency (IAEA) is the world\u0026#x2019;s central organization for nuclear cooperation, safety, security, and verification. Established in 1957 and headquartered in Vienna, IAEA operates under the motto \u0026#x201C;Atoms for Peace and Development\u0026#x201D; and serves as the global steward for the peaceful, safe, and secure use of nuclear science and technology. \u003Cstrong\u003E\u003Cem\u003E(By Claire Bernadette A. Mondares, DOST-STII)\u003C\/em\u003E\u003C\/strong\u003E\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: center;\u0022\u003E\u003Cimg src=\u0022\/storage\/appnews\/60087cd5eaac83150efad08de32ce9c8.jpeg\u0022 alt=\u0022\u0022 title=\u0022\u0022 width=\u0022786\u0022 height=\u0022437\u0022 data-display=\u0022inline\u0022\u003E\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u003Cstrong\u003E\u003Cem\u003E\u0026#xA0;\u003C\/em\u003E\u003C\/strong\u003EThis residential house prototype is the first-of-its-kind model of a house built with radiation-processed plastic tiles, panels, and bricks. It\u0026#x2019;s a product of a study that low-value plastic wastes can be turned into durable construction materials\u003Cstrong\u003E. \u003C\/strong\u003E\u003Cem\u003E(Photo by John Louver Patriarcha, DOSTv)\u003C\/em\u003E\u003C\/p\u003E\n","region":"NCR","created":"2025-12-04 10:11:00","created_by_alias":"Claire Bernadette A. Mondares, DOST-STII","publish_date":"2025-12-04 10:11:00","is_press_release":1},{"article_id":621913,"title":"\u2018SETUP\u2019 to inspire as nine outstanding Filipino MSMEs took centerstage at the 2025 NSTW","alias":"setup-to-inspire-as-nine-outstanding-filipino-msmes-took-centerstage-at-the-2025-nstw","content":"\u003Cp style=\u0022text-align: center;\u0022\u003E\u003Cimg src=\u0022\/storage\/appnews\/5268e9d690af1bfe8f9b554278decb9d.jpeg\u0022 alt=\u0022\u0022 title=\u0022\u0022 width=\u0022747\u0022 height=\u0022450\u0022 data-display=\u0022inline\u0022\u003E\u003C\/p\u003E\u003Cp\u003EThe 2025 National Science, Technology, Innovation Week (NSTW) may have ended, but the gains of the micro, small, and medium Filipino enterprises (MSMEs) continues to inspire would be entrepreneurs as the Department of Science and Technology (DOST) recognized the nine outstanding MSMEs assisted under the Small Enterprise Technology Upgrading Program (SETUP) in a ceremony held in November 20, 2025 at the 2025 NSTW held in Laoag City.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EThe following are the nine MSMEs recognized by DOST this year in their respective categories:\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#xA0;\u003C\/p\u003E\u003Col\u003E\u003Cli style=\u0022text-align: justifyline-height: 195.5%;\u0022\u003E\u003Cp\u003ELlouisse and Ai Souvenir Shop from Region VIII-\u003Cstrong\u003EChampioning Innovation and Resource Circularity for Local Enterprises or the CIRCLE Award\u003C\/strong\u003E\u003C\/p\u003E\u003C\/li\u003E\u003C\/ol\u003E\u003Cp style=\u0022text-align: justify;line-height: 115.00000000000001%;\u0022\u003E\u0026#xA0;\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 115.00000000000001%;\u0022\u003EThe CIRCLE Award recognizes the enterprise that champions innovation and resource circularity, demonstrating scalable, impactful solutions that are aligned with environmental and social goals.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 115.00000000000001%;\u0022\u003E\u0026#xA0;\u003C\/p\u003E\u003Col start=\u00222\u0022\u003E\u003Cli style=\u0022text-align: justifyline-height: 195.5%;\u0022\u003E\u003Cp\u003ECognitif Inc. from NCR- \u003Cstrong\u003EMost Industry 4.0-Ready Award or the I-READY Award\u003C\/strong\u003E\u003C\/p\u003E\u003C\/li\u003E\u003C\/ol\u003E\u003Cp style=\u0022text-align: justify;line-height: 115.00000000000001%;\u0022\u003EThe i-READY Award is given to distinguish the enterprise that has demonstrated commendable progress in its preparation and is the most poised in the integration and transformation process towards Industry 4.0 in its operations.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 115.00000000000001%;\u0022\u003E\u0026#xA0;\u003C\/p\u003E\u003Col start=\u00223\u0022\u003E\u003Cli style=\u0022text-align: justifyline-height: 195.5%;\u0022\u003E\u003Cp\u003EBAUERTEK Farmaceutical Technologies Corporation from Region III- \u003Cstrong\u003EMost Industry 4.0 Champion of Innovation Award or the ICON Award\u003C\/strong\u003E\u003C\/p\u003E\u003C\/li\u003E\u003C\/ol\u003E\u003Cp style=\u0022text-align: justify;line-height: 115.00000000000001%;\u0022\u003EICON Award is given to highlight the enterprise that has demonstrated outstanding ability to utilize and capitalize the use of Industry 4.0 in its operations and create value to customers and business.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 115.00000000000001%;\u0022\u003E\u0026#xA0;\u003C\/p\u003E\u003Col start=\u00224\u0022\u003E\u003Cli style=\u0022text-align: justifyline-height: 195.5%;\u0022\u003E\u003Cp\u003ENutridense Food Manufacturing Corporation from Region I- \u003Cstrong\u003ESETUP PRAISE Award\u003C\/strong\u003E\u003C\/p\u003E\u003C\/li\u003E\u003C\/ol\u003E\u003Cp style=\u0022text-align: justify;line-height: 115.00000000000001%;\u0022\u003ESETUP PRAISE Award is given to recognize the enterprise that has excelled in their business in terms of productivity, resilience, agility, innovativeness, sustainability, and excellence in adopting science, technology, and innovations through DOST-SETUP.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 115.00000000000001%;\u0022\u003E\u0026#xA0;\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 115.00000000000001%;\u0022\u003E\u003Cem\u003ESETUP Praise Award (Special Awards)\u003C\/em\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 115.00000000000001%;\u0022\u003E\u0026#xA0;\u003C\/p\u003E\u003Col start=\u00225\u0022\u003E\u003Cli style=\u0022text-align: justifyline-height: 195.5%;\u0022\u003E\u003Cp\u003EAlto Peak Chocolates from Region VIII- \u003Cstrong\u003EMost Productive Enterprise\u003C\/strong\u003E\u003C\/p\u003E\u003C\/li\u003E\u003Cli style=\u0022text-align: justifyline-height: 195.5%;\u0022\u003E\u003Cp\u003ENutridense Food Manufacturing Corporation from Region I-\u003Cstrong\u003EMost Resilient Enterprise\u003C\/strong\u003E\u003C\/p\u003E\u003C\/li\u003E\u003Cli style=\u0022text-align: justifyline-height: 195.5%;\u0022\u003E\u003Cp\u003EJNC Specialty Food Ventures Inc. from NIR-\u003Cstrong\u003EMost Agile Enterprise\u003C\/strong\u003E\u003C\/p\u003E\u003C\/li\u003E\u003Cli style=\u0022text-align: justifyline-height: 195.5%;\u0022\u003E\u003Cp\u003ELorna\u0026#x2019;s Processed Food Manufacturing from Region VI-\u003Cstrong\u003EMost Innovative Enterprise\u003C\/strong\u003E\u003C\/p\u003E\u003C\/li\u003E\u003Cli style=\u0022text-align: justifyline-height: 195.5%;\u0022\u003E\u003Cp\u003EGolden Crown Petals and Herbs from Region III- \u003Cstrong\u003EMost Sustainable Enterprise\u003C\/strong\u003E\u003C\/p\u003E\u003C\/li\u003E\u003C\/ol\u003E\u003Cp style=\u0022text-align: justify;line-height: 115.00000000000001%;\u0022\u003E\u0026#xA0;\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: 115.00000000000001%;\u0022\u003ESETUP is a nationwide strategy to encourage and support MSMEs in adopting technological innovations to improve operations, boost productivity, and competitiveness. Specifically, the program provides MSMEs with equipment and technical assistance to increase sales and production, streamline and improve overall company operations, enhance product and service quality, conform to national and international standards of excellence, and remain competitive in their respective fields.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EThrough this program, countless Filipino entrepreneurs have transformed their businesses, adopted sustainable practices, and reached new heights of success.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;line-height: NaN%;\u0022\u003ESETUP is one of the many initiatives of the Department of Science and Technology (DOST) aimed at providing science-based, innovative, and inclusive solutions across four strategic pillars: human well-being, wealth creation, wealth protection, and sustainability. These pillars embody the mantra OneDOST4U: Solutions and Opportunities for All. For more information, visit \u003Ca href=\u0022http:\/\/www.dost.gov.ph\u0022 ref=\u0022nofollow\u0022\u003Ewww.dost.gov.ph\u003C\/a\u003E\u003Cstrong\u003E\u003Cem\u003E. (By Rosemarie C. Se\u0026#xF1;ora, DOST-STII)\u003C\/em\u003E\u003C\/strong\u003E\u003C\/p\u003E\n","region":"REGION 1","created":"2025-12-04 10:08:00","created_by_alias":"Rosemarie C. Se\u00f1ora, DOST-STII","publish_date":"2025-12-04 10:08:00","is_press_release":1},{"article_id":621911,"title":"Carmona, Baguio City are DOST \u2018smart and sustainable communities\u2019 champions","alias":"carmona-baguio-city-are-dost-smart-and-sustainable-communities-champions","content":"\u003Cp style=\u0022text-align: center;\u0022\u003E\u003Cimg src=\u0022\/storage\/appnews\/4a0af433fdec823e8592505383156558.jpeg\u0022 alt=\u0022\u0022 title=\u0022\u0022 width=\u0022645\u0022 height=\u0022599\u0022 data-display=\u0022inline\u0022\u003E\u003C\/p\u003E\u003Cp\u003EThe Department of Science and Technology (DOST) announced its first-ever champions of the Philippine Smart and Sustainable Communities Award (PSSCA) during the closing ceremony of the National Science, Technology, and Innovation Week (2025 NSTW), in Laoag City, Ilocos Norte.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EThe award recognizes the efforts of the local government units (LGUs) in developing their communities and improving the quality of life through science, technology and innovation-driven solutions.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EReceived entries were grouped into four thematic categories namely Human Well-being, Wealth Creation, Wealth Protection, and Sustainability.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EThe Human Well-being Award recognizes LGUs who have exemplified smart and sustainable solutions to ensure health and nutrition, food safety and security, access to clean water, clothing, shelter, and efficient transport systems.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EMoreover, the Wealth Creation Award is for LGUs who have successfully generated economic growth by integrating smart solutions to create value-adding products, services and other solutions towards national and regional development.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EFor the Wealth Protection Award, it was given to LGUs who have deployed smart solutions that focus on enhancing resilience through climate-adaptive technologies and science-driven disaster preparedness to safeguard communities and resources from environmental risks.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003ELastly, LGUs promoting environment stewardship and climate-resilient community were given the Sustainability Award.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EAfter a thorough evaluation of the entries received, Baguio City bagged the Wealth Protection Award, Wealth Creation Award, and Sustainability Award.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#x201C;We are very thankful to DOST for recognizing the efforts and initiatives of the City Government of Baguio in awarding us the several champions of Smart City Components. This will be a big boost for us in trying to gain more and achieve more in terms of sustainability and smart city programs,\u0026#x201D; Baguio City Administrator VJ Cawis said in a chance interview with DOST.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EBaguio City has implemented BMRSys: Building on a Health-Secure Baguio with Data, Dignity and Digital Compassion under the Human Wellbeing category; TERRA \u0026#x2014;a system that bridges technology and nature for resilient living under the Sustainability category; RAIN-GUARD\u0026#x2014;a smart rainfall and flood resilience system for real-time preparedness and climate protection; and WORKPASS\u0026#x2014;a digital leap in enabling jobs and regulating workforce mobility.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#x201C;We are, in a way, lucky in Baguio City because our constituents there, the level of literacy and acceptance in smart city initiatives has become easier recently. But at first, of course, there were birth pains. Like I said, in other LGUs, smart cities are not yet understood,\u0026#x201D; Cawis explained.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EHe added that when the Smart and Sustainable Communities Program (SSCP) was first introduced in the city, its constituents thought it was just an eye in the sky and CCTVs.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EHowever, residents have gradually realized its benefits, like the air quality monitoring system that guides the city administration in deciding how to reroute traffic, and the like.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EMeanwhile, Carmona City in Cavite declared as champion in the Human Well-Being category through its One Digitized Carmona: Building Smart, Inclusive, and Sustainable Communities Through Data-Driven Governance program.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EAmong the 29 nominees, DOST awarded Emerging SSC Award\u003Cstrong\u003E \u003C\/strong\u003E(Level 1); Expanding SSC Award (Level 2); Sustained SSC Award (Level 3); and Transformative SSC Award (Level 4) on November 21, 2025, at Centennial Arena, Laoag City.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#xA0;\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EAccording to DOST-Cordillera Administrative Region (DOST-CAR) Regional Director Nancy A. Bantog, entries were evaluated based on the level of maturity or readiness of technologies implemented and deployed in the cities.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EHowever, Bantog said none of the nominees achieved the highest level of award, which is the Transformative SSC Award or Level 4. This means that none of the projects implemented in cities have influenced policy frameworks on a larger scale and have been replicated by other LGUs.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#xA0;\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#x201C;Projects are evaluated according to their level of readiness and maturity in implementation.\u0026#xA0; This is to ensure that LGUs at different stages of progress are given equal opportunity to be recognized.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#xA0;\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EThe DOST-CAR heads the 2025 PSSC Awards secretariat.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EWinning entries received a plaque of recognition and P500,000 worth of proposal-driven project fund.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#xA0;\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EAs defined by the DOST, a \u0026#x2018;smart city\u0026#x2019; is a community that leverages technology and innovation to enhance urban functionality, sustainability, and livability, making it more responsive to its inhabitants.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#xA0;\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003ESmart city uses Information and Communications Technology (ICT) to improve the quality of life for citizens, enhance service delivery, foster a competitive economy, and promote a sustainable environment.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EThe Smart and Sustainable Communities Program (SSCP) is one of the many initiatives of the Department of Science and Technology (DOST) aimed at providing science-based, innovative, and inclusive solutions across four strategic pillars: human well-being, wealth creation, wealth protection, and sustainability. These pillars embody the mantra OneDOST4U: Solutions and Opportunities for All. For more information, visit \u003Ca href=\u0022http:\/\/www.dost.gov.ph\u0022 ref=\u0022nofollow\u0022\u003Ewww.dost.gov.ph\u003C\/a\u003E\u003Cstrong\u003E\u003Cem\u003E. (By Claire Bernadette A. Mondares, DOST-STII)\u003C\/em\u003E\u003C\/strong\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u003Cstrong\u003E\u003Cem\u003E\u0026#xA0;\u003C\/em\u003E\u003C\/strong\u003E\u003C\/p\u003E\n","region":"REGION 1","created":"2025-11-27 08:31:00","created_by_alias":"Claire Bernadette A. Mondares, DOST-STII","publish_date":"2025-11-27 08:31:00","is_press_release":1},{"article_id":621910,"title":"DOST pushes for inclusive smart and sustainable communities in NCR 2025 reg\u2019l science week","alias":"dost-pushes-for-inclusive-smart-and-sustainable-communities-in-ncr-2025-regl-science-week","content":"\u003Cp style=\u0022text-align: center;\u0022\u003E\u003Cimg src=\u0022\/storage\/appnews\/dd75f66f406443314b70d2d4479ea8fc.jpeg\u0022 alt=\u0022\u0022 title=\u0022\u0022 width=\u0022738\u0022 height=\u0022560\u0022 data-display=\u0022inline\u0022\u003E\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EAfter the successful holding of the 2025 National Science, Technology, and Innovation Week in Laoag City, the Department of Science and Technology (DOST) opens on November 24, 2025 the last leg of its 2025 Regional Science, Technology, and Innovation Week (RSTW) in the National Capital Region (NCR), which will run for three days until November 26, 2025.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EThis year, the RSTW in NCR is conducted under the PAMAMARISAN or the Pasig, Mandaluyong, Marikina, San Juan Clustered Area Science and Technology Office of the DOST-NCR, in partnership with the Technological Institute of the Philippines (TIP) Quezon City, as the host institution of the activity.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EDOST-NCR Regional Director Romelen T. Tresvalles offered a glimpse of the event\u0026#x2019;s theme \u0026#x201C;Building Smart and Sustainable Communities.\u0026#x201D;\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#xA0;\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#x201C;The theme \u0026#x201C;Building Smart and Sustainable Communities\u0026#x201D; is more than just a vision statement. It is a call to action. A reminder that even as we marvel at technology\u0026#x2019;s speed, we must never forget its purpose \u0026#x2014; to uplift lives, to narrow divides, and to leave no one behind,\u0026#x201D; she said.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EDr. Angelo Quirino Lahoz, TIP President, is honored to host the said event, saying that \u0026#x201C;it aligns with TIP\u0026#x2019;s school-wide commitment to providing the right ecosystem for collaboration and innovation.\u0026#x201D;\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EThis is supported by DOST Undersecretary for Regional Operations Sancho A. Mabborang, who said that the celebration of the RSTW in a university is a significant feat that is filled with symbolism.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EHe said that as the university shapes future leaders\u0026#x2014; offering hope by turning aspirations into reality, and generating solutions through knowledge, innovation, and technology\u0026#x2014; the RSTW is for young people.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#x201C;You are the reason why we are working to leverage science to provide opportunities and solutions. The reason we are seeking to establish smart and sustainable communities in the country. For a future that is bright and healthy for you to live in,\u0026#x201D; he said.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EThe occasion also sees the turnover of the locally contextualized Readiness and Needs Assessment Tool, a project developed by the TIP-Quezon City in partnership with DOST-NCR.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EThe tool aims to empower MSMEs to embrace innovation, improve productivity, and strengthen their competitiveness in an ever-evolving business landscape.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EMoreover, exhibit goers can expect an exciting lineup of activities\u0026#x2014;from interactive science exhibits and hands-on games to e-sports\u0026#x2013;themed challenges, technobazaars, and various science competitions.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EThere will also be technology and research forums, a smart city studio, technical consultations, and seminar series and trainings for a wide range of audiences, including students, teachers or faculty, differently abled persons, senior citizens, out-of-school youth, MSMEs, private organizations, community entrepreneurs, and the LGU.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u003Cstrong\u003EMeet Juana\u003C\/strong\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003ETo better illustrate the Department\u0026#x2019;s call for inclusive, people-centered development, DOST Secretary Renato U. Solidum introduced Juana, an artificial intelligence-generated character representing millions of Filipinos who have faced many forms of subtle and systemic exclusion in the face of development.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EA solo parent, teacher with a disability, and commuter, the Secretary said that Juana\u0026#x2019;s story highlighted how systemic barriers of development\u0026#x2014;from inaccessible infrastructure to climate risks\u0026#x2014;can reinforce exclusion.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: center;\u0022\u003E\u003Cimg src=\u0022\/storage\/appnews\/796e8794ff4d02ce603a8ff2719926b7.jpeg\u0022 alt=\u0022\u0022 title=\u0022\u0022 width=\u0022622\u0022 height=\u0022267\u0022 data-display=\u0022inline\u0022\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EHe said that this is the reason why the Department has been pushing for the Smart and Sustainable Program, a people-centric and technology-driven strategy to facilitate the transformation of communities toward becoming smart and sustainable since 2023.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#x201C;What we strive for is the balance of both\u0026#x2014;technology that empowers people, and development that can endure. This is the kind of inclusive future we are working toward,\u0026#x201D; he added.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EHe also emphasized that inclusive smart and sustainable communities are not just for the big cities nor for the digital literates, but for people from all walks of life.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#xA0;\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#x201C;Smart and sustainable communities are for them, for the students to improve their learning capacities, workers to ease their daily operations, urban farmers and fisherfolks, senior citizens, persons with disabilities. When driven by inclusive science and technology-based solutions, we can create a better picture of a Filipino\u0026#x2019;s daily lived realities,\u0026#x201D; he expounded.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EContinuing Juana\u0026#x2019;s story, the Secretary envisions that in 2035, government, private sector, and communities adopt a \u0026#x2018;universal accessibility\u0026#x2019; standard for all future projects.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#x201C;PWD-friendly digital platforms, smart home systems, and mobility tools become mainstream and affordable. A robust support ecosystem for solo parents emerges\u0026#x2014;financial, emotional, logistical, and educational,\u0026#x201D; he said, adding that Juana may live in a community safe from hazards, with access to technology and infrastructure for persons with disabilities.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EThis will happen as DOST, in the year 2025, \u0026#x201C;chose to talk to, and include the most vulnerable and marginalized in planning and building smart and sustainable communities.\u0026#x201D;\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EThe 2025 RSTW is one of the many initiatives of the Department of Science and Technology (DOST) aimed at providing science-based, innovative, and inclusive solutions across four strategic pillars: human well-being, wealth creation, wealth protection, and sustainability. These pillars embody the mantra OneDOST4U: Solutions and Opportunities for All. For more information, visit \u003Ca href=\u0022http:\/\/www.dost.gov.ph\u0022 ref=\u0022nofollow\u0022\u003Ewww.dost.gov.ph\u003C\/a\u003E. \u003Cstrong\u003E(By Rosemarie C. Se\u0026#xF1;ora, \u003Cem\u003EDOST-STII)\u003C\/em\u003E\u003C\/strong\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u003C\/p\u003E\n","region":"NCR","created":"2025-11-27 08:25:00","created_by_alias":"Rosemarie C. Se\u00f1ora, DOST-STII","publish_date":"2025-11-27 08:25:00","is_press_release":1},{"article_id":621909,"title":"DOST turns over roadmaps to make Pasig, Caloocan smart and sustainable cities","alias":"dost-turns-over-roadmaps-to-make-pasig-caloocan-smart-and-sustainable-cities","content":"\u003Cp\u003EThe Department of Science and Technology (DOST) hands over science, technology, and innovation (STI) roadmaps to the cities of Pasig and Caloocan to help fulfill their vision of building their smart and sustainable communities.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EThe turnover was done during the opening ceremony of the 2025 Regional Science, Innovation and Technology Week of the DOST-National Capital Region (DOST-NCR) on November 24, 2025 at the Technological Institute of the Philippines - Quezon City.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EIn his keynote, DOST Secretary said that the plight of millions of Filipinos experiencing systemic barriers of development inspires the Department to push for the Smart and Sustainable Program (SSCP), a people-centric and technology-driven strategy to facilitate the transformation of communities toward becoming smart and sustainable since 2023.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#x201C;Smart and sustainable communities are for them, for the students to improve their learning capacities, workers to ease their daily operations, urban farmers and fisherfolks, senior citizens, persons with disabilities. When driven by inclusive science and technology-based solutions, we can create a better picture of a Filipino\u0026#x2019;s daily lived realities,\u0026#x201D; he said.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EThrough the SSCP and Innovation, Science, and Technology for Accelerating Regional Technology-based Development (iSTART) Program, DOST-NCR and its partner local government units, such as Pasig City and Caloocan City, work together to formulate roadmaps containing evidence-based policymaking and strategic S\u0026amp;T investments for sustainable urban development.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EBoth programs also aim to deploy science and technology-based solutions to build smart and sustainable communities.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003ETitled \u0026#x201C;AGOS Pasig: Accelerating Growth and Opportunities through Science for Progressive, Adaptive, and Sustainable Innovation in Governance Pasig Smart City Roadmap 2025-2030,\u0026#x201D; the Smart City Roadmap for Pasig City was co-drafted with the Pasig Science and Technology Innovation (SATI) Technical Working Group, and contains the initiatives of Pasig City outlined until 2030 towards building a city anchored on principles of inclusive, smart and sustainable governance.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#xA0;\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EFurther, Caloocan City received its roadmap titled \u0026#x201C;KILOS: Kalookan Initiative for Leadership, Outcome, Science, and Sustained Development (2026-2028),\u0026#x201D; containing the science, technology, and innovation-based initiatives to be done until 2028 to build a smart and sustainable Caloocan City, drafted by the Science, Technology, and Innovation Technical Working Group of Caloocan City.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003ETo date, the DOST has partnered with 116 local government units (LGUs) in the country to help them craft their own smart and sustainable community roadmaps, adopt smart solutions in agriculture, governance, and transportation, among others, and work with stakeholders and like-minded partners.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EThe Smart and Sustainable Program (SSCP) is one of the many initiatives of the Department of Science and Technology (DOST) aims at providing science-based, innovative, and inclusive solutions across four strategic pillars: human well-being, wealth creation, wealth protection, and sustainability. These pillars embody the mantra OneDOST4U: Solutions and Opportunities for All. For more information, visit \u003Ca href=\u0022http:\/\/www.dost.gov.ph\u0022 ref=\u0022nofollow\u0022\u003Ewww.dost.gov.ph\u003C\/a\u003E. \u003Cstrong\u003E\u003Cem\u003E(By Rosemarie C. Se\u0026#xF1;ora, DOST-STII\u003Cbr\u003Eand photos from Patrick James Lee Alfonso, DOST-STII)\u003C\/em\u003E\u003C\/strong\u003E\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: center;\u0022\u003E\u003Cimg src=\u0022\/storage\/appnews\/ee43ba18456f92b7a7c504bc8900a859.jpeg\u0022 alt=\u0022\u0022 title=\u0022\u0022 width=\u0022876\u0022 height=\u0022337\u0022 data-display=\u0022inline\u0022\u003E\u003C\/p\u003E\u003Cp\u003ELeaders from the Department of Science and Technology, led by Secretary Renato U. Solidum, Jr., Undersecretary Sancho A. Mabborang, and Engr. Romelen T. Tresvalles formally turned over the Smart City Roadmaps during the opening ceremony of the 2025 Regional Science, Technology, and Innovation Week of DOST-NCR on November 24, 2025, at Technological Institute of the Philippines-Quezon City. Receiving the Pasig Smart City Roadmap on behalf of Hon. Ma. Victor Regis \u0026#x201C;Vico\u0026#x201D; Sotto were City Planning and Development Officer III Arch. Dulce Corazon and Executive Assistant to the City Mayor Ms. Arianne Bettina Morales.\u003C\/p\u003E\n","region":"NCR","created":"2025-11-27 08:22:00","created_by_alias":"Rosemarie C. Se\u00f1ora, DOST-STII","publish_date":"2025-11-27 08:22:00","is_press_release":1},{"article_id":621908,"title":"Malabon, Taguig City adopt GeoRiskPH to enhance its disaster preparedness capability","alias":"malabon-taguig-city-adopt-georiskph-to-enhance-its-disaster-preparedness-capability","content":"\u003Cp style=\u0022text-align: center;\u0022\u003E\u003Cimg src=\u0022\/storage\/appnews\/fd340cd6610835c13ee7ccfa43e7de5d.jpeg\u0022 alt=\u0022\u0022 title=\u0022\u0022 width=\u0022940\u0022 height=\u0022748\u0022 data-display=\u0022inline\u0022\u003E\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp\u003EMalabon City and Taguig City formalize their commitment to adopt GeoRisk Philippines (PH), highlighting the importance of science-based disaster planning and preparedness to the local government.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp\u003EThe signing ceremony was done during the opening ceremony of the 2025 Regional Science, Innovation and Technology Week of the Department of Science and Technology-National Capital Region (DOST-NCR) on November 24, 2025, at the Technological Institute of the Philippines - Quezon City.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EThrough this collaboration with DOST-NCR, DOST-Philippine Institute of Volcanology and Seismology (PHIVOLCS), the local government units of Malabon and Taguig reaffirm their shared commitment to building safer, smarter, and more resilient communities across the region.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#xA0;\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EIn his keynote, DOST Secretary Renato U. Solidum, Jr. emphasized the importance of co-creating smart solutions and rebuilding inclusive institutions for improving the lives of the Filipino people.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#x201C;With the recent natural hazards posing different disasters, our country needs inclusive institutions more than ever \u0026#x2013; the ones that will protect the environment, because when we protect the environment, the environment will also protect us,\u0026#x201D; he said.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EGeoRiskPH is a multi-platform system developed by DOST-PHIVOLCS and institutionalized in 2019 that provides accurate, up-to-date, and accessible geospatial information for evidence-based decision-making. Tools like HazardHunterPH, GeoMapperPH, and GeoAnalyticsPH are used to assess risks and support land use planning, infrastructure development, and emergency preparedness. It is funded by the DOST and monitored by the DOST-Philippine Council for Industry, Energy, and Emerging Technology Research and Development from 2018 to 2020.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EThe 2025 RSTW that featured GeoRiskPH is one of the many initiatives of the Department of Science and Technology (DOST) aimed at providing science-based, innovative, and inclusive solutions across four strategic pillars: human well-being, wealth creation, wealth protection, and sustainability. These pillars embody the mantra OneDOST4U: Solutions and Opportunities for All. For more information, visit \u003Ca href=\u0022http:\/\/www.dost.gov.ph\u0022 ref=\u0022nofollow\u0022\u003Ewww.dost.gov.ph\u003C\/a\u003E. \u003Cstrong\u003E\u003Cem\u003E(By Rosemarie C. Se\u0026#xF1;ora, DOST-STII)\u003C\/em\u003E\u003C\/strong\u003E\u003C\/p\u003E\n","region":"NCR","created":"2025-11-27 08:19:00","created_by_alias":"Rosemarie C. Se\u00f1ora, DOST-STII","publish_date":"2025-11-27 08:19:00","is_press_release":1},{"article_id":621907,"title":"PH\u2019s first bamboo waiting shed officially turned over; Gives Laoag City commuters green and comfortable public space","alias":"phs-first-bamboo-waiting-shed-officially-turned-over-gives-laoag-city-commuters-green-and-comfortable-public-space","content":"\u003Cp style=\u0022text-align: justify;\u0022\u003ECommuters in Laoag City, Ilocos Norte now have access to a greener and more convenient public space as the Department of Science and Technology (DOST), through its DOST Regional office no. 1 and DOST\u0026#x2013;Forest Products Research and Development Institute (DOST-FPRDI), DOST-Philippine Council for Agriculture, Aquatic and Natural Resources Research and Development (PCAARRD), Kawayan collective, and the local government unit of Laoag, formally turned over the country\u0026#x2019;s first-ever bamboo waiting shed.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EFunded by DOST-PCAARRD, this new structure, equipped with solar-powered lighting, charging ports, engineered bamboo seats, and an announcement board, highlights how simple public facilities can be modern, eco-friendly, and community-friendly through science, technology and innovation.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#x201C;This waiting shed is not only a simple structure, it is a symbol of collaboration and sustainable progress,\u0026#x201D; said DOST Secretary Renato U. Solidum Jr. during the turnover ceremony. He emphasized the importance of using abundant local resources such as bamboo. \u0026#x201C;We need to use what God has given us and God has given us a lot of bamboo. And bamboo is not a tree but a grass that you can actually cut and suddenly it will regenerate right away.\u0026#x201D;\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003ESolidum pointed out that the shed represents climate resilience and \u0026#x201C;\u003Cem\u003EAgham na Ramdam\u003C\/em\u003E\u0026#x201D; or science that is felt by the community. \u0026#x201C;This is just a pilot. But if we can actually say that this is a very good project and we need more waiting sheds all over the city, perhaps we can also make sure that our bamboo farmers can benefit out of it,\u0026#x201D; he added.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EAt the center of this innovation is DOST-FPRDI\u0026#x2019;s bamboo octagonal jointing system, a patented innovation that strengthens bamboo structures, allowing them to withstand everyday use and even heavy loads. \u0026#x201C;Most of the problems with bamboo structures are the joints. So, this is our solution to be more resilient,\u0026#x201D; Solidum explained.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EDOST-FPRDI Director Rico J. Cabangon highlighted how research and development transformed ordinary bamboo into a durable, modern public amenity.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EHe explained that the octagonal jointing system can withstand a load equivalent to a small SUV. \u0026#x201C;As you know, this octagonal jointing system can resist a load of about 7 tons,\u0026#x201D; he shared.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EThe shed, developed together with Kawayan Collective, blends functionality, sustainability, and aesthetics.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#x201C;The shed provides comfortable and climate-resilient shelter. It is equipped with an announcement board, engineered bamboo seats, and a solar panel for lighting, and charging ports and other gadgets,\u0026#x201D; he said. Director Cabangon added that future enhancements may include a rainwater collection and water filtration features.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003ECalling the shed \u0026#x201C;a living demonstration\u0026#x201D; of how science, design, and sustainability can come together, Cabangon said, \u0026#x201C;this waiting shed is a testament of the Secretary\u0026#x2019;s thrust na ang \u0026#x201C;\u003Cem\u003EAgham ay dapat Ramdam\u003C\/em\u003E.\u0026#x201D;\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EFor Laoag City Mayor James Bryan Q. Alcid, this project is more than just a new structure, it is a symbol of unity, culture, and forward thinking.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#x201C;One of a kind, the first in the Philippines,\u0026#x201D; Mayor Alcid proudly noted. He highlighted gratitude as the theme of his message: \u0026#x201C;It\u0026#x2019;s a powerful force that can transform lives, relationships, and communities.\u0026#x201D;\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EHe emphasized the shed\u0026#x2019;s practicality and beauty. \u0026#x201C;It\u0026#x2019;s easy to build, eco-friendly, solar-powered, and visually appealing. This is more than just a shed. It is the product of Filipino ingenuity, craftsmanship, and deep connection with our rich cultural heritage.\u0026#x201D;\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EMayor Alcid also expressed his deep gratitude and appreciation to DOST, saying, \u0026#x201C;Agyaman kami, DOST (We are thankful, DOST). More waiting sheds to come, Apo.\u0026#x201D;\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EThe bamboo waiting shed stands as a model for future community spaces\u0026#x2014; proof that sustainable materials, local craftsmanship, and science-driven design can uplift everyday life.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003ESolidum underscored this vision: \u0026#x201C;Science is not confined to laboratories. It lives in the spaces we use, the communities we build, and the environment we protect.\u0026#x201D;\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EThis project was implemented as part of DOST\u0026#x2019;s Smart and Sustainable Community Program (SSCP) to inspire more innovations that promote climate resilience, strengthen livelihood opportunities, and pave the way for a greener, more sustainable future for all. It was turned over during the 2025 National Science, Technology, and Innovation Week celebration held in Laoag City.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EThe turnover ceremony was also attended by other DOST officials including, DOST Undersecretary for Special Concerns Teodoro M. Gatchalian, Assistant Secretary for Countryside Development Ma. Teresa B. De Guzman, DOST Regional Office 1 Director Teresita A. Tabaog, Provincial Science and Technology Office of Ilocos Norte Provincial Director\u0026#xA0;Engr. Brian U. Rasco, DOST-National Research Council of the Philippines Executive Director Bernardo N. Sepeda\u003Cstrong\u003E, \u003C\/strong\u003Eand DOST-PCAARRD Executive Director Reynaldo V. Ebora.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EThe bamboo waiting shed developed by the Department of Science and Technology (DOST) is one of its many initiatives aimed at providing science-based, innovative, and inclusive solutions across four strategic pillars: human well-being, wealth creation, wealth protection, and sustainability. These pillars embody the mantra OneDOST4U: Solutions and Opportunities for All. For more information, visit \u003Ca href=\u0022http:\/\/www.dost.gov.ph\u0022 ref=\u0022nofollow\u0022\u003Ewww.dost.gov.ph\u003C\/a\u003E. \u003Cstrong\u003E\u003Cem\u003E(By Abigael S. Oma\u0026#xF1;a, DOST-STII)\u003C\/em\u003E\u003C\/strong\u003E\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: center;\u0022\u003E\u003Cimg src=\u0022\/storage\/appnews\/32da1ca0d51baf0fb53622a8eaf52268.jpeg\u0022 alt=\u0022\u0022 title=\u0022\u0022 width=\u0022878\u0022 height=\u0022411\u0022 data-display=\u0022inline\u0022\u003E\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u003C\/p\u003E\n","region":"REGION 1","created":"2025-11-26 08:30:00","created_by_alias":"Abigael S. Omana, DOST-STII","publish_date":"2025-11-26 08:30:00","is_press_release":1},{"article_id":621906,"title":"Public consultations on VIP Act IRR start in Clark, Pampanga","alias":"public-consultations-on-vip-act-irr-start-in-clark-pampanga","content":"\u003Cp style=\u0022text-align: center;\u0022\u003E\u003Cimg src=\u0022\/storage\/appnews\/08ff36b3cc6e5e21436dab6c18de3593.jpeg\u0022 alt=\u0022\u0022 title=\u0022\u0022 width=\u0022869\u0022 height=\u0022668\u0022 data-display=\u0022inline\u0022\u003E\u003C\/p\u003E\u003Cp\u003EThe Department of Science and Technology (DOST) has started its series of public consultations for the draft implementing rules and regulations (IRR) of the newly signed Virology and Vaccine Institute of the Philippines (VIP) Act.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EThe Luzon leg, the first of four consultations, was led by the DOST-Philippine Council for Health Research and Development (DOST-PCHRD) on November 13, 2025, at the Hilltop, Quest Hotel in Clark, Pampanga.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EIn his message, DOST Secretary Renato U. Solidum, Jr. shared that the public consultations aim to ensure the success of the VIP.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#x201C;More than a technical discussion, this public consultation would affirm our shared responsibility in building a nation guided by science and technology, anchored in cooperation, and sustained by the pursuit of public welfare and safety,\u0026#x201D; he said.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EDOST Undersecretary for Research and Development Dr. Leah J. Buendia led the public consultation, alongside DOST-PCHRD Executive Director Dr. Jaime C. Montoya; DOST-Philippine Council for Industry, Energy and Emerging Technology Research and Development Exec. Dir. Enrico C. Paringit; DOST-Philippine Council for Agriculture, Aquatic and Natural Resources Research and Development Exec. Dir. Reynaldo V. Ebora; DOST-Industrial Technology Development Institute Director Dr. Annabelle V. Briones; Department of Legislative Liaison Office Director Dr. Lita S. Suerte Felipe; and Atty. Jordan C. Tiburan from the DOST Legal team.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EAccording to\u0026#xA0; DOST Usec. Leah J. Buendia, the IRR will provide the framework that will guide how the VIP Law will be carried out\u0026#x2014;ensuring coordination, accountability, and alignment with the law\u0026#x2019;s vision for a stronger, science-driven Philippines.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EAttendees of the consultation include representatives from the government, academe, the private sector, research organizations, and civil societies. Inputs from the attendees will help ensure that the draft IRR formulated by the DOST will reflect the goals, mandates, and spirit of the VIP Act.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EExpected outcomes of the public consultations include a validated draft IRR, enhanced stakeholder participation, alignment with legal and policy frameworks, defined institutional roles and responsibilities, strengthened transparency and accountability, and informed finalization of the IRR.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EAt the end of the said first public consultation, DOST-PCHRD Executive Director Jaime C. Montoya thanked the attendees for their valuable inputs.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#x201C;Everybody\u0027s continued support will stand as a legacy of what we can achieve when science and technology is guided by service and strengthened through public cooperation,\u0026#x201D; he said.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003ERepublic Act No. 12290, or the VIP Act, was signed into law by President Ferdinand R. Marcos, Jr. on September 12, 2025, creating the VIP as the country\u0026#x2019;s premier national institute for virology research and development.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EThe institute will lead discovery programs in virology, carry out vaccine research, and develop diagnostic tools and therapeutic solutions for viruses and other pathogens. It will further champion evidence-based virology and vaccine policies, build partnerships with local and global research institutions, and train experts to expand national capacity. It will also invest in advanced virology infrastructure and offer technical support to the broader scientific community.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EThe schedule of the next public consultations is as follows:\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#x25CF;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0; Jan 12, 2026 - Visayas Leg\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#x25CF;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0; Jan 20, 2026 - Mindanao Leg\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#x25CF;\u0026#xA0;\u0026#xA0;\u0026#xA0;\u0026#xA0; Jan 27, 2026 - NCR Leg\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EThe draft IRR is set to be finalized in February 2026, which will signal the effective implementation of the law. Further, it is also one of the many initiatives of the Department of Science and Technology (DOST) aimed at providing science-based, innovative, and inclusive solutions across four strategic pillars: human well-being, wealth creation, wealth protection, and sustainability. These pillars embody the mantra OneDOST4U: Solutions and Opportunities for All. For more information, visit \u003Ca href=\u0022http:\/\/www.dost.gov.ph\u0022 ref=\u0022nofollow\u0022\u003Ewww.dost.gov.ph\u003C\/a\u003E. \u003Cstrong\u003E\u003Cem\u003E(By Rosemarie C. Se\u0026#xF1;ora, DOST-STII)\u003C\/em\u003E\u003C\/strong\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u003Cstrong\u003E\u003Cem\u003E\u0026#xA0;\u003C\/em\u003E\u003C\/strong\u003E\u003C\/p\u003E\n","region":"NCR","created":"2025-11-26 08:17:00","created_by_alias":"Rosemarie C. Se\u00f1ora, DOST-STII","publish_date":"2025-11-26 08:17:00","is_press_release":1},{"article_id":621905,"title":"BJMP GenSan wins best CEST community for 2025","alias":"bjmp-gensan-wins-best-cest-community-for-2025","content":"\u003Cp\u003EThe Department of Science and Technology (DOST) recognized General Santos City\u0026#x2019;s Bureau of Jail and Penology Management (BJMP) male dormitory as this year\u0026#x2019;s \u0026#x2018;Best CEST Community\u0026#x2019; for successfully integrating science and technology-based solutions to improve the quality of life of the persons deprived of liberty (PDL) community.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EThe award was given during the culmination of 2025 National Science, Technology, and Innovation Week (2025 NSTW), held in Laoag City, Ilocos Norte on November 19, 2025.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EWith the hope of building a smart, sustainable, and inclusive community for PDLs, former warden and Jail Chief Inspector Lucky Mer Natuel said they reached out to DOST through the Community Empowerment through Science and Technology (CEST) program.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#x201C;Kulang sa kagamitan, unsafe water, at limitadong pagkakataon at edukasyon. So, wala po kaming source ng potable water. And then, through the partnership formed between BJMP and DOST, a partnership made from heaven po talaga, a noble partnership, we witnessed something truly human lives slowly reclaiming dignity,\u0026#x201D; Natuel said.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EThrough the CEST program, and a partnership with the DOST-Region 12, Natuel said the BJMP General Santos City Jail was able to empower over 600 PDLs through education, livelihood opportunities, and a clean water system.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EThe CEST program is an initiative that uses science and technology to help underserved communities in the country.\u0026#xA0;\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EWith the goal to provide livelihood and alleviate poverty in remote communities, the program focuses on empowering marginalized sectors by providing technology-based solutions to improve livelihood, health, sanitation, disaster resilience, and education.\u0026#xA0;\u0026#xA0;\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003ETo highlight the best practices of community CEST adopters and to recognize their efforts in improving their community through science and technology, the DOST started searching for \u0026#x2018;Best CEST Community\u0026#x2019; in 2020 as part of the NSTW celebration.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EThe award aims to recognize communities that have successfully implemented CEST projects in their communities, which have improved the quality of life of their people.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003ERecognized as the grand champion for this year\u0026#x2019;s search for \u0026#x2018;Best CEST Community\u0026#x2019;, General Santos City Jail received a grand prize of P500,000, a plaque of recognition and P30,000 for bagging a Special Award in Sustainable Energy.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#xA0;\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#x201C;In Region 12, we did not just build a jail facility; we built communities that are sustainable, inclusive, and smart. The DOST gave the persons deprived of liberty the opportunity for science that knows no boundaries, agham na ramdam. Science that is felt, lived, and experienced even behind bars, proving that no one is indeed left behind. That they were once lost, least, and last. But now reminded that even inside jail, they are never alone,\u0026#x201D; Nautel said.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EMoreover, according to DOST Secretary Renato U. Solidum Jr., the CEST program has continuously delivered relevant science-based solutions across five key development areas since its inception in 2012.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EHe said, as an example, that 2,170 communities were empowered by creating livelihood opportunities and enhancing productivity through technology, deployment, capacity-building training, consultancy services, and other support interventions.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#x201C;Whether it is clean water in upland barangays, safer food on family tables, or better livelihoods through innovation, DOST ensures that science works for every Filipino. Sabi nga nila, malayo pa, pero malayo na. While we still have a long journey ahead before we can fully realize our vision of a truly smart and sustainable community, we must also recognize how far we have already come,\u0026#x201D; Solidum said.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EMeanwhile, from among the 16 nominees, Barangay Potrero\u0026#x2019;s zero waste program in Malabon City bagged P300,000 for winning the Best CEST Community 1st Runner up Award, and P30,000 for winning the Special Award for Sustainable Circular Economy.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003ESecond runner-up award and a Special Award for Sustainable Health and Nutrition were awarded to the municipality of Ramos, Tarlac. They received a P200,000 and a P30,000 cash prize for two awards respectively.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EMore than an award and recognition, Natuel said the BJMP GenSan also accepts the responsibility that comes with it.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EThe CEST program is one of the many initiatives of the Department of Science and Technology (DOST) aimed at providing science-based, innovative, and inclusive solutions across four strategic pillars: human well-being, wealth creation, wealth protection, and sustainability. These pillars embody the mantra OneDOST4U: Solutions and Opportunities for All. For more information, visit \u003Ca href=\u0022http:\/\/www.dost.gov.ph\u0022 ref=\u0022nofollow\u0022\u003Ewww.dost.gov.ph\u003C\/a\u003E. \u003Cstrong\u003E\u003Cem\u003E(By Claire Bernadette A. Mondares, DOST-STII and photos from DOST-12)\u003C\/em\u003E\u003C\/strong\u003E\u003C\/p\u003E\u003Cp\u003E\u003Cbr\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: center;\u0022\u003E\u003Cimg src=\u0022\/storage\/appnews\/9b1944bdf18f2504cee3dbbafad9f920.jpeg\u0022 alt=\u0022\u0022 title=\u0022\u0022 width=\u0022874\u0022 height=\u0022388\u0022 data-display=\u0022inline\u0022\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: center;\u0022\u003E\u003Cem\u003EBJMP General Santos City Jail Superintendent Joe Anthony Gargarita (left) and former BJMP GenSan warden Jail Chief Inspector Lucky Mer Natuel receives the plaque of recognition and a cheque worth P500,000 on behalf of the BJMP community, during the search for Best CEST community on November 19, 2025, at Centennial Arena, Laoag City.\u003C\/em\u003E\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: center;\u0022\u003E\u003Cimg src=\u0022\/storage\/appnews\/92932dd76ab57578bae04d9118d0a068.jpeg\u0022 alt=\u0022\u0022 title=\u0022\u0022 width=\u0022862\u0022 height=\u0022383\u0022 data-display=\u0022inline\u0022\u003E\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: center;\u0022\u003E\u003Cem\u003EDOST officials award the plaque and cheque worth P500,000 to BJMP General Santos City Jail Superintendent Joe Anthony Gargarita and former BJMP GenSan warden Jail Chief Inspector Lucky Mer Natuel during the search for Best CEST community on November 19, 2025, at Centennial Arena, Laoag City.\u003C\/em\u003E\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\n","region":"REGION 1","created":"2025-11-26 08:04:00","created_by_alias":"Claire Bernadette A. Mondares, DOST-STII","publish_date":"2025-11-26 08:04:00","is_press_release":1},{"article_id":621903,"title":"DOST brings science closer to people, launches three major programs in Central Luzon","alias":"dost-brings-science-closer-to-people-launches-three-major-programs-in-central-luzon","content":"\u003Cp\u003EThe Department of Science and Technology (DOST) rolls out three major science, technology, and innovation facilities in Central Luzon to bring its services closer to the communities.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EDOST secretary Renato U. Solidum Jr., together with DOST Undersecretary Sancho A. Mabborang, and DOST Region 3 Director Julius Caesar V. Sicat led the inauguration of the Smarter Approaches to Reinvigorate Agriculture as an Industry Centralized National Hub for Regional Operations (SARAI CeNTRO), the Innovation Hub (iHub), and the Advanced Manufacturing Center (AMCEN).\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003ESolidum, in his message, emphasized the agency\u0026#x2019;s thrust to make science more accessible and relevant to Filipinos, especially those in the regions.\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#x201C;In the past, accessing government services often meant travelling long hours to the capital or central office, and this can be time-consuming, costly, and challenging, especially for those living in remote communities. Today, we are changing that approach. DOST is bringing science closer to the people, meeting communities where they are instead of expecting them to visit us and come to Manila.\u0026#x201D;\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003ESolidum highlighted that the facilities in Central Luzon reflect DOST\u0026#x2019;s \u0026#x201C;bold journey towards helping the country and our people in their socio-economic development.\u0026#x201D; He further noted that these initiatives are aligned with the administration of President Ferdinand R. Marcos Jr., who \u0026#x201C;emphasized the role of science, technology, and innovation in boosting agriculture in the country and revitalizing our industries.\u0026#x201D;\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: center;\u0022\u003E\u003Cimg src=\u0022\/storage\/appnews\/a3e54739b73eccd88114a1116123ed47.jpeg\u0022 alt=\u0022\u0022 title=\u0022\u0022 width=\u0022935\u0022 height=\u0022569\u0022 data-display=\u0022inline\u0022\u003E\u003C\/p\u003E\u003Cp style=\u0022text-align: center;\u0022\u003E\u003Cem\u003ESARAI is another DOST flagship program aimed at supporting local farmers to improve their agricultural productivity using knowledge-based, smart technologies.\u003C\/em\u003E\u003C\/p\u003E\u003Cp\u003E\u003C\/p\u003E\u003Cp\u003ESARAI is a flagship initiative developed in partnership with UP Los Ba\u0026#xF1;os (UPLB) to improve agricultural productivity in the countryside to help farmers attain better agricultural products through the application of smart technologies.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003E\u0026#x201C;The SARAI is a program that I really wanted to implement since the President has directed DA and DOST to implement SARAI all over the country. It took us seven years to prepare for this,\u0026#x201D; Solidum explained.\u003C\/p\u003E\u003Cp style=\u0022text-align: justify;\u0022\u003EThe Secretary added that SARAI brings together data-driven tools such as crop modeling, satellite remote sensing, and geographic information system-based pest identification systems, which will help farmers make informed decisions, increase yields, and improve profitability.\u003C\/p\u003
