#preloader {

  content: "";
  position: fixed;
  top: calc(50% - 30px);
  left: calc(50% - 30px);
  border: 6px solid #f2f2f2;
  border-top: 6px solid #71b2e0;
  border-radius: 50%;
  width: 60px;
  height: 60px;
  -webkit-animation: animate-preloader 1s linear infinite;
  animation: animate-preloader 1s linear infinite;
}

@-webkit-keyframes animate-preloader {
  0% {
    transform: rotate(0deg);
  }
  100% {
    transform: rotate(360deg);
  }
}

  0% {
    transform: rotate(0deg);
  }
  100% {

.nav-menu .drop-down ul {
  display: block;

  left: 14px;

  opacity: 0;

}

.nav-menu .drop-down li {
  min-width: 180px;

}

.nav-menu .drop-down ul a {
  padding: 10px 20px;

}

  top: 0;
  left: calc(100% - 30px);
}

.nav-menu .drop-down .drop-down:hover > ul {
  opacity: 1;
  top: 0;
  left: 100%;
}

/* Mobile Navigation */
#navbar-toggler.navbar-toggler-scrolled span, .internal-page .navbar-toggler span {

.navbar-toggler span {
   display: block;
   background-color: #fff;
   height: 2px;
    width: 28px;
    margin: 2px 0 6px 0;
    -webkit-transform: rotate(0deg);
   -moz-transform: rotate(0deg);
   -o-transform: rotate(0deg);
   transform: rotate(0deg);
   position: relative;
   left: 0;
   opacity: 1;
}
.mobile-nav-active .navbar-toggler span, .mobile-nav-active  #navbar-toggler.navbar-toggler-scrolled span{
   background-color: #fff;
}
.navbar-toggler span:nth-child(1),
.navbar-toggler span:nth-child(3) {
   -webkit-transition: transform .35s ease-in-out;
   -moz-transition: transform .35s ease-in-out;
   -o-transition: transform .35s ease-in-out;
   transition: transform .35s ease-in-out;
}

.mobile-nav-active .navbar-toggler span:nth-child(1) {
    position: absolute;
    left: 12px;
    top: 10px;
    -webkit-transform: rotate(135deg);
    -moz-transform: rotate(135deg);
    -o-transform: rotate(135deg);
    transform: rotate(135deg);
    opacity: 0.9;
}
.navbar-toggler span:nth-child(2) {
  transition: opacity 0.3s;
  -webkit-transition: opacity 0.3s;
  opacity: 1;
}
.mobile-nav-active .navbar-toggler span:nth-child(2) {
    height: 12px;
    visibility: hidden;
    background-color: transparent;
    opacity: 0;
}

.mobile-nav-active .navbar-toggler span:nth-child(3) {
    position: absolute;
    left: 12px;
    top: 10px;
    -webkit-transform: rotate(-135deg);
    -moz-transform: rotate(-135deg);
    -o-transform: rotate(-135deg);
    transform: rotate(-135deg);
    opacity: 0.9;
}
