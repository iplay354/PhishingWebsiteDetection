/* Arrows */
.slick-prev,
.slick-next
{
    font-size: 0pt;
    line-height: 0;

    position: absolute;
    top: 50%;

    display: block;

    width: 40px;
    height: 40px;
    margin-top: -10px;
    padding: 0;

    cursor: pointer;

    color: transparent;
    border: none;
    outline: none;
    background: transparent;


	font-family: 'Glyphicons Halflings';
	font-style: normal;
	font-weight: normal;
	line-height: 1;
	-webkit-font-smoothing: antialiased;
	-moz-osx-font-smoothing: grayscale;


}
.slick-prev:hover,
.slick-prev:focus,
.slick-next:hover,
.slick-next:focus
{
    color: transparent;
    outline: none;
    background: transparent;
}
.slick-prev:hover:before,
.slick-prev:focus:before,
.slick-next:hover:before,
.slick-next:focus:before
{
    opacity: 1;
}
.slick-prev.slick-disabled:before,
.slick-next.slick-disabled:before
{
    opacity: .25;
}

.slick-prev:before,
.slick-next:before
{
   /* font-family: 'slick';*/
    font-size: 20pt;
    line-height: 1;

    opacity: .75;
    color: white;

    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

.slick-prev
{
    left: 40px;
	z-index:900000;
}
[dir='rtl'] .slick-prev
{
    right: -40px;
    left: auto;
}
.slick-prev:before
{
    /*content: "\e132";*/
}
[dir='rtl'] .slick-prev:before
{
    /*content: "\e131";*/
}

.slick-next
{
    right: -25px;
	z-index:900001;
}
[dir='rtl'] .slick-next
{
    right: auto;
    left: -25px;
}
.slick-next:before
{
    /*content: "\e131";*/
}
[dir='rtl'] .slick-next:before
{
    /*content: "\e132";*/
}

/* Slider */
.slick-loading .slick-list
{
    background: #fff url('https://www.staceyclarkephotography.com/blu_source/plugins/slick/ajax-loader.gif') center center no-repeat;
}


/* Dots */
.slick-slider
{
    margin-bottom: 0px;

}

.slick-dots
{
    position: absolute;
  	bottom: 0px;

    display: block;

    width: 100%;
    padding: 0;

    list-style: none;

    text-align: center;

	font-style: normal;
	font-weight: normal;

}
.slick-dots li
{
    position: relative;

    display: inline-block;

    width: 20px;
    height: 20px;
    margin: 0 5px;
    padding: 0;

    cursor: pointer;
}
.slick-dots li button
{
    font-size: 0px;
    line-height: 0;

    display: block;

    width: 20px;
    height: 20px;
    padding: 5px;

    cursor: pointer;

    color: transparent;
    border: 0;
    outline: none;
    background: transparent;
}
.slick-dots li button:hover,
.slick-dots li button:focus
{
    outline: none;
}
.slick-dots li button:hover:before,
.slick-dots li button:focus:before
{
    opacity: 1;
}
.slick-dots li button:before
{
    /*font-family: 'slick';*/
	font-family: Arial, Helvetica, sans-serif;
    font-size: 20pt;
    line-height: 20px;

    position: absolute;
    top: 0;
    left: 0;

    width: 20px;
    height: 20px;

    /*content: '•';*/
	content: "\2022";
    text-align: center;

    opacity: .5;
    color: white;

    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}
.slick-dots li.slick-active button:before
{
    opacity: .75;
    color: white;
}

<script language="javascript">
	var vars = {};

	function bluSetHash(str, google){
		var hash_sign = '#';
		if (google){
			hash_sign += '!/';
		}

		var curr_hash = bluGetHash();

		if (curr_hash == "#!/proofs" && str == "proofs"){

		}

		if (proofs){
			location.reload();
		}
	}


	function bluGetHash(){
		var hash = 	window.location.hash.substring(3);
		return window.location.hash;
	}

	function bluHashChange(){
					var hash = window.location.hash.split('/');
			var google_hash = (hash[0].indexOf("!") > -1) ? true: false;

			//get main page
			if (google_hash){
				var main_page = hash[1];

			} else {
				var main_page = hash[0].substring(1);
			}

			if (main_page == ''){
				main_page = 'home';
			}

			//get additional parameters
			var page_param = new Array();
			var n = 0
			for (var i=2; i< hash.length; i++){
				if (hash[i] != ''){
					page_param[n] = hash[i];
					n++;
				}
			}

			//active_page = {};
			if (main_page == 'cart' || main_page == 'profile' || main_page == 'proofs' || main_page == 'favorites'){
				active_page['Controller'] = main_page;
				active_page['GoToGal'] = false;
				if (main_page == 'proofs' && page_param.length > 0){
					active_page['Permalink'] = hash[2];
					active_page['Page'] = page_param[1];
					//alert(active_page['Page']);
					active_page['GoToGal'] = true;
				}

			} else {
				//find main page

				$('.blu-menu-wrapper').find('a[data-type="menu"]').each(function(){

					if (main_page == $(this).data('href')){
						$.each($(this).data('pageinfo'), function(k, v){
							active_page[k] = v;
						})

						$(".blu-menu-wrapper").find('a').removeClass('blu-menu-active');

						$(this).addClass('blu-menu-active');

					}
				})


				//if sub section
				if (page_param.length > 0){


					if (main_page == 'proofs'){
						active_page['GalPrefix'] = 'Wed';
					} else {
						active_page['GalPrefix'] = '';
						active_page['Page'] = page_param[1];
					}

					active_page['Permalink'] = page_param[0];

					active_page['Controller'] = 'gallery';
				}

			}


			/*//main button
			if (page_param.length == 0){
				if (page == 'cart' || page == 'profile'){
					active_page.Controller = page;
				} else {
					$('.blu-menu-wrapper').find('a[data-type="menu"]').each(function(){

						if (page == $(this).data('href')){
							active_page = 	$(this).data('page');
							$(".blu-menu-wrapper").find('a').removeClass('blu-menu-active');
							$(this).addClass('blu-menu-active');

						}
					})

				}
			// sub section
			} else {

			}*/

			//check if gallery music was playing
			if (active_page['Controller'] != 'gallery' && typeof sound_vars !== 'undefined'){
				if (sound_vars.gal_song_ids.length > 0){
					sound_vars.gal_song_ids = [];
					bluSoundPlayNext();
				}
			}

			if (active_page.AddedToHome && !google_hash){
				bluLoadAjax('home', active_page, '.blu-page', '.blu-page');
			} else {
				bluLoadAjax(active_page['Controller'], active_page, '.blu-page', '.blu-page');
			}
		
	}

			$(window).bind("hashchange", function(){
			bluHashChange();
		})

		$(window).trigger("hashchange");
	










	function bluLoadImages(wrapper, type, crop, open_first, max_w, max_h){
		crop = typeof crop !== 'undefined' ? crop : 'none';
		open_first = typeof open_first !== 'undefined' ? open_first : false; //for arrow navigation view
		var src;
		vars.active_gal_view = type;

		$('.blu-gal-img-info').fadeOut(0);

		//set watermark
		if ($('.blu-watermark').length){
			$('.blu-watermark').fadeTo(0, 0.25);

			if (type == 'thumbs'){
									$('.blu-watermark').fadeTo(0, 0);
							}
		}


		$(wrapper).find('img').each(function(){


			if (type == 'text'){
				var $img_parent = $(this).parent().parent().parent().parent();
			} else {
				var $img_parent = $(this).parent().parent();
			}

			//reset img
			$img_parent.stop().fadeTo(0, 0);
			$img_parent.css({ 'visibility': 'visible'});
			//reset rollover


			//update img src
			$(this).removeAttr('src');
			if (type == 'thumbs'){
				src = $(this).data('dir') + $(this).data('thumb');
			} else {
				src = $(this).data('dir') + $(this).data('img');
			}

			$(this).attr('src', src);

			$(this).one("load", function() {
				if (type == 'thumbs'){
					var r = $(this).data('thumb-w') / $(this).data('thumb-h');
				} else {
					var r = $(this).data('w') / $(this).data('h');
				}

				if (type == 'thumbs'){
					$img_parent.removeClass('blu-gal-img-blog');
					$img_parent.addClass('blu-gal-img-thumb');
					$('.blu-images-holder').css({
						'margin-left': '10px'
					})
					$img_parent.find('.blu-featured-link-over-wrapper').css({
						'display':'block'
					})
					$img_parent.find('.blu-featured-link-over-wrapper').stop().fadeTo(0, 0);


					//set image position when cropped

					if (crop == 'square'){
						$(this).parent().css({
							overflow: 'hidden'
						})

						$(this).parent().width(max_w);
						$(this).parent().height(max_h);
						if ($(this).data('w') > $(this).data('h')){
							$(this).height(max_h);
							var offset = -($(this).height() * r - max_w)/2;
							$(this).css({
								'margin-left': offset,
								'max-width': ''
							})
						} else {
							$(this).width(max_w);
							var offset = -($(this).width() / r - max_w)/2;
							$(this).css({
								'margin-top': offset,
								'max-width': ''
							})
						}

					}
				} else if (type == 'blog'){
					$img_parent.removeClass('blu-gal-img-thumb');
					$img_parent.addClass('blu-gal-img-blog');

					$('.blu-images-holder').css({
						'margin-left': 0
					})
					$img_parent.find('.blu-featured-link-over-wrapper').stop().fadeOut(0);

					//reset cropping and image positiojn
					$(this).parent().css({
						overflow: 'visible'
					})
					$(this).parent().css({
						'width': 'auto',
						'height': 'auto'
					});

					$(this).css({
						'width': 'auto',
						'height': 'auto',
						'margin-left': 'auto',
						'margin-top': 'auto',
						'max-width': '100%'
					});
					$img_parent.find('.blu-gal-img-info').width($(this).bluWidth());
				}

				$img_parent.stop().fadeTo("slow", 1);

				if (type != 'thumbs' && !bluIsEmpty($img_parent.find('.blu-gal-img-info'))){
					$img_parent.find('.blu-gal-img-info').fadeIn();
				}



				bluAdjScrollPage();


			}).each(function() {
				if(this.complete) $(this).load();
			});



		});

		//if arrow navigation view find and display 1st image
		if (open_first){
			img = $(wrapper).find('.blu-images-holder').children().first();
			bluOpenImagePreview(img);
			open_first = false;
		}

	}

	function bluScrollPage(a){
		if ($('a[data-anchor="'+ a + '"]').length){
			var goal_top = $('a[data-anchor="'+ a + '"]').position().top;
			if ($('.blu-menu').data('fixed')){
				//goal_top -= 40;
			}
			$('html,body').stop().animate({
			  scrollTop: goal_top
			}, 1000);
		}
	}

	function bluAdjScrollPage(){
		var hash = bluGetHash();
		var home_sec = hash.indexOf("!") > -1 ? false: true;
				hash = hash.substring(1);

		if (home_sec){
			bluScrollPage(hash);

		}
	}

	//SET CURSOR POSITION
	function bluMoveCaretToStart(el) {
		if (typeof el.selectionStart == "number") {
			el.selectionStart = el.selectionEnd = 0;
		} else if (typeof el.createTextRange != "undefined") {
			el.focus();
			var range = el.createTextRange();
			range.collapse(true);
			range.select();
		}
	}

	$.fn.bluHeight = function(){

        // find the closest visible parent and get it's hidden children
		var visibleParent = this.closest(':visible').children(), h;

		// set a temporary class on the hidden parent of the element
		visibleParent.addClass('blu-temp-show');

		// get the height
		h = this.height();

		// remove the temporary class
		visibleParent.removeClass('blu-temp-show');

		return h;

	};

	$.fn.bluWidth = function(){

        // find the closest visible parent and get it's hidden children
		var visibleParent = this.closest(':visible').children(), h;

		// set a temporary class on the hidden parent of the element
		visibleParent.addClass('blu-temp-show');

		// get the height
		w = this.width();

		// remove the temporary class
		visibleParent.removeClass('blu-temp-show');

		return w;

	};


	//SET FIELD FOCUS, BLUR EVENTS
	$.fn.bluSetForm = function(action, after_action, reset_form, use_enter){

		var $form = this.find('form');
		$form.submit(false);
		var focused = true;
		//format all fields
		this.find('input[type=text], input[type=password], textarea').each(function(){
			$(this).blur(function(){
				if ($(this).val() == ''){
					$(this).parent().addClass("blu-input-default");
					$(this).val($(this).data('default_value'))
					$(this).data('default', true);

					if ($(this).data('class') == 'blu-input-pass'){
						$(this).removeAttr('type');
						$(this).attr('type', 'text');
					}

				}

			})



			//set password field behavior
			if ($(this).data('class') == 'blu-input-pass'){
				//$(this).focus(function(){
					///$(this).val('');
				//})

			//set text fields behavior
			}

			var elem = $(this);
			$(this).focus(function(){
				var id = $(this).attr('id');

				var elem = document.getElementById(id);
				bluMoveCaretToStart(elem);
				window.setTimeout(function() {
					bluMoveCaretToStart(elem);
				}, 1);
			})



			$(this).keydown(function(){

				if ($(this).data('default')){
					$(this).parent().removeClass("blu-input-default");
					$(this).data('default', false);
					if ($(this).data('class') == 'blu-input-pass'){
						$(this).removeAttr('type');
						$(this).attr('type', 'password');
					}
					$(this).val('');
				}
			})
			
			if (!focused){
				$(this).focus();
				focused = true;	
			}
		})

		var $btn = this.find('input[type=submit], input[type=button]');

		this.find('input[type=submit], input[type=button]').click(function(){
			var validated = true;
			var invalid_str = '';
			

			//validate
			$form.find('input[type=text], textarea').each(function(){
				if (($(this).val() == '' || $(this).val() == $(this).data('default_value')) && $(this).data('required')){
					validated = false;
					invalid_str += $(this).data('default_value') + 	', ';
				}
			});

			if (invalid_str != ''){
				invalid_str = invalid_str.replace(/,\s*$/, "");
			}

			if (validated){

				var post = 'data=' + JSON.stringify($form.bluSerializeObject());

				$form.fadeTo('fast', 0.3);
				$btn.val('sending...');

				//alert(post);
				$.post(action, post, function(data){
					var success = data.substring(0, 1);
					var data = data.substring(1, data.length);
					$form.fadeTo('fast', 1);
					
					$btn.val($btn.data('default_value'));
					if (success == '0'){
						$('.blu-form-msg').html(data);
						if(data == "Please log into your profile first."){
							$('#blu_shop_link_profile').click();
						}
					} else {
						if (reset_form){
							bluResetForm($form);
						}
						$(after_action).data('data', data);
						$(after_action).click();
					}
				});
			} else {
				$('.blu-form-msg').html('Please enter the following: ' + invalid_str);
			}
		})

		$form.bind('keypress', function(e){
			if ( e.keyCode == 13  && ($btn.is(":focus") || use_enter)) {
				$(this).find('input[type=submit], input[type=button]').click();
			}
		});

		return this;
	}

	$.fn.bluSerializeObject = function(){
		var o = {};
		var a = this.serializeArray();
		$.each(a, function() {
			if (o[this.name] !== undefined) {
				if (!o[this.name].push) {
					o[this.name] = [o[this.name]];
				}
				o[this.name].push(this.value || '');
			} else {
				o[this.name] = this.value || '';
			}
		});
		return o;
	};

	function bluResetForm($form){
		var reset_form = true;
		$form.find('input[type=text], input[type=password], textarea').each(function(){
			$(this).parent().addClass("blu-input-default");
			if ($(this).attr('type') == 'password'){
				$(this).removeAttr('type');
				$(this).attr('type', 'text');
			}

			$(this).val($(this).data('default_value'))
			$(this).data('default', 1);
			$('.blu-form-msg').html('');
		})




		$form.find('input[type=checkbox]').each(function(){
			$(this).prop('checked', false);
		});
	}

	function bluLoadAjax(file, post, data_holder, fadein_holder, redirect){
		if (file == 'favorites'){
			file = 'gallery.php?favorites';
			post = '';
		} else {
			file += '.php';
		}

		var json_post = JSON.stringify(post);

		redirect = typeof redirect !== 'undefined' ? redirect : '';
		$.ajax({ type: "POST",
             url: 'https://www.staceyclarkephotography.com/blu_source/controllers/' + file + '',
             data: {data : json_post},
             cache: false,
             success: function(data){
				//alert(data);
				$(data_holder).html(data);
				if (fadein_holder != '' && $(fadein_holder).length){
					window.scrollTo(0, 0);

					$(fadein_holder).fadeIn(function(){

						bluResize();

						if ((post.Type == 'contact' || (post.Type == 'text' && post.SubType == 'single'))  && data_holder == '.blu-page'){
							bluScrollPage(post.Permalink);
						}
					});
				} else if (redirect){
					window.location.href = redirect;
				}
             }
		})


	}

	//PARALLAX FUNCTIONS
	/* fix vertical when not overflow
	call fullscreenFix() if .fullscreen content changes */
	function bluParallaxFullscreenFix(){
		var h = $('body').height();
		// set .fullscreen height
		$(".blu-parallax-content-b").each(function(i){
			if($(this).innerHeight() > h){

	/* resize background images */
	function bluParallaxBgResize(){
		var windowH = $(window).height();
		var parallax_h = vars.win_h/2;
		if (0){

		}
		$(".blu-parallax-bg").each(function(i){
			var path = $(this);
			path.height(parallax_h);
			// variables
			var contW = path.width();
			var contH = path.height();

			var imgW = path.attr("data-img-width");
			var imgH = path.attr("data-img-height");
			var ratio = imgW / imgH;
			// overflowing difference
			var diff = parseFloat(path.attr("data-diff"));
			diff = diff ? diff : 0;
			// remaining height to have fullscreen image only on parallax
			var remainingH = 0;
			if(path.hasClass("blu-parallax") && !$("html").hasClass("touch")){
				var maxH = contH > windowH ? contH : windowH;
				remainingH = windowH - contH;
			}
			// set img values depending on cont
			imgH = contH + remainingH + diff;
			imgW = imgH * ratio;
			// fix when too large
			if(contW > imgW){
				imgW = contW;
				imgH = imgW / ratio;
			}
			//
			path.data("resized-imgW", imgW);
			path.data("resized-imgH", imgH);

			path.css("background-size", imgW + "px " + imgH + "px");
		});



	}


	/* set parallax background-position */
	function bluParallaxPosition(e){
		var heightWindow = $(window).height();
		var topWindow = $(window).scrollTop();
		var bottomWindow = topWindow + heightWindow;
		var currentWindow = (topWindow + bottomWindow) / 2;

		$(".blu-parallax").each(function(i){
			var path = $(this);

			var height = path.height();
			var top = path.offset().top;
			var bottom = top + height;
			// only when in range
			if(bottomWindow > top && topWindow < bottom){
				var imgW = path.data("resized-imgW");
				var imgH = path.data("resized-imgH");
				// min when image touch top of window
				var min = 0;
				// max when image touch bottom of window
				var max = - imgH + heightWindow;
				// overflow changes parallax
				var overflowH = height < heightWindow ? imgH - height : imgH - heightWindow; // fix height on overflow
				top = top - overflowH;
				bottom = bottom + overflowH;
				// value with linear interpolation
				var value = min + (max - min) * (currentWindow - top) / (bottom - top);
				// set background-position
				var orizontalPosition = path.attr("data-oriz-pos");
				orizontalPosition = orizontalPosition ? orizontalPosition : "50%";
				$(this).css("background-position", orizontalPosition + " " + value + "px");
			}
		});
	}

	function bluSoundPlayNext(){
		soundManager.destroySound('song' + sound_vars.gal_song_no);
		sound_vars.song_no++;
		if (sound_vars.song_no > sound_vars.jukebox_count){
			if (sound_vars.loop == "yes"){
				sound_vars.song_no = 1;
			} else {
				sound_vars.song_no = 0;
			}
		}

		if (sound_vars.song_no > 0 && sound_vars.jukebox_count > 0){
			soundManager.createSound({
			 id:'song' + sound_vars.song_no,
			 url: 'https://www.staceyclarkephotography.com/music/sound' + sound_vars.jukebox[sound_vars.song_no].id + '.mp3',
			 onfinish: bluSoundPlayNext

			});

			soundManager.play('song' + sound_vars.song_no);
		}
	}

	function bluSoundGalPlayNext(){
		soundManager.destroySound('song' + sound_vars.song_no);
		sound_vars.gal_song_no++;
		if (sound_vars.gal_song_no == sound_vars.gal_song_ids.length){
			if (sound_vars.loop == "yes"){
				sound_vars.gal_song_no = 0;
			} else {
				sound_vars.gal_song_no = -1;

		}

		if (sound_vars.gal_song_no >= 0){

			 id:'song' + sound_vars.gal_song_no,

			 onfinish: bluSoundGalPlayNext
