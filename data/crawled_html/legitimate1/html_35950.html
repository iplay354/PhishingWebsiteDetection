<style id="themeCSS"></style><style id="customCSS">/* Tag Style - h1 heading */
h1{
    color: rgb(1, 69, 133);
    font-size: 30px !important; 
	font-weight: bold;
	padding: 10px 0px;
}

/* Tag Style - h2 heading */
h2{
    color: rgb(1, 69, 133);
    font-size: 24px !important; 
	font-weight: bold; 
	padding: 8px 0px;
}

/* Tag Style - h3 heading */
h3{
    color: rgb(1, 69, 133);
    font-size: 20px !important; 
	font-weight: bold; 
	padding: 8px 0px;
}

/* Tag Style - Links */
a {
  text-decoration: underline;
}

/* Tag Style - Mouse over link */
a:hover {
  color: rgb(1, 69, 133) !important;
  text-decoration-thickness: 2px !important;
}

/* Tag Style - Visited link */
a:visited {
  color: rgb(76, 44, 146) !important;
}

/* Custom Class - Acro Body Text */
.acroBodyText{
    font-size: 16px; 
}

/* Custom Class - Acro Paragraph */
.acroParagraph{
	padding: 8px 0px;
}

/* Custom Class - Acro Bullet Point */
.acroBulletPoints{
	padding: 4px 0px;
}

/* Custom Class - Acro Last Bullet Point */
.acroLastBulletPoint{
    padding-top: 4px;
    padding-bottom: 8px;
}

/* Custom Class - Text section style 1 */
.acroTextSection1{
	padding: 12px 8px;
}

/* Custom Class - Text section style 2 */
.acroTextSection2{
    background-color: rgb(245, 245, 245);
	padding: 12px 8px;
}

/* Custom Class - Emphasis */
.acroEmphasis{
    border-left: 10px solid rgb(1, 69, 133);
    padding: 15px;
    margin: 8px 0px;
}

/* Custom Class - Used on a Homepage heading */
.homeHeaderReactivePadding{
    padding-top: 52px;
}

/* Custom Class - Image Banner */
.acroBannderImage{
   width: 100%; 
   height: 400px; 
   border-radius: 5px;
}

/* Custom Class - Image Hover Effect */
.imageHover:hover{
    filter: brightness(75%);
}

/* Custom Class' - Homepage Image Styling*/
.homepageImagesPadding{
	bottom: 50%;
    left: 20px; 
}

/* Custom Class - Headings used in the footer */
.acroFooterHeading{
    font-size: 16px !important; 
}

/* Custom Class - Reactive row for tables */
.reactiveRow {
    display:flex;
	flex-wrap:wrap;
}

/* Custom Class - Footer Column */
.footerColumn{ 
    width: 33.3%;
}

/* Custom Class - Services Column */
.servicesColumn1{ 
    width: 40%;
}

/* Custom Class - Services Column */
.servicesColumn2{ 
    width: 60%;
}

/* Custom Class - Service Page Image Reactive Padding */
.acroServiceImageReactivePadding{
    padding-top: 34px; 
    padding-left: 25px
}

/* Custom Class - Applied to the background of text when overlaying of an image */
.acroServicesImageTextBackground{
    background-color: rgb(1, 69, 133, 0.8);
    width: 164px;
    border-radius: 5px;
    padding: 0px 10px;
}

/* Custom Class - Applied to the background of text when overlaying of an image */
.acroImageTextBackground{
    background-color: rgb(1, 69, 133, 0.8);
    width: 36.5%;
    border-radius: 5px;
    padding: 0px 10px;
}

/* Custom Class - Applied to site buttons */
.acroButtonStyle{
    font-size: 16px;
    padding: 10px 15px;
    border-radius: 6px;
}

/* Custom Class - Applied to my account page buttons */
.acroButtonStyle2{
    font-size: 16px;
    padding: 10px 15px;
    border-radius: 6px;
    width: 320px;
}

/* Custom Class - Acro Table */
.acroTable{
	display: table;
	table-layout: fixed ; width: 100%;
    border: 1px solid rgb(0, 0, 0);
    border-collapse: collapse;
}

/* Custom Class - Acro Table Body */
.acroTableBody {
	display: table-row-group;
}

/* Custom Class - Acro Table Row */
.acroTableRow {
	display: table-row;
}

/* Custom Class - Acro Table Cell */
.acroTableCell {
	border: 1px solid rgb(0, 0, 0);
	display: table-cell;
	padding: 3px 5px;
}

/* Salesforce Class - Navigation Menu */
.forceCommunityThemeNav{
   font-size: 16px;
}

/* Salesforce Class -  Navigation Menu Items*/
.forceCommunityThemeNav .mainNavItem{
  padding-left: 15px !important
}

/* Salesforce Class -  Navigation Logo */
.forceCommunityThemeLogo .logoImage {
    height: 38px !important;
    max-height: 38px !important;
    width: 280px !important;
}

/* Salesforce Class -  Navigation menu item: visited */
.forceCommunityThemeNav .mainNavItem a:visited{
    color: rgb(51, 51, 51) !important;
}

/* Salesforce Class - Page sections and sections within multi coloumn sections*/
.forceCommunitySection .cb-section_column{
    /* padding between sections*/
    padding: 6px 8px !important;
}

/* Salesforce Class - Page Content Area */
.siteforceContentArea .cb-section_column .ui-widget{
    /* Margin between different components in the content area */
    margin: 0px 0px !important;
}

/* Salesforce Class - Input box on OTB login page */
.salesforceIdentityLoginForm2 .inputBox{
    font-size: 16px !important;
    color: rgb(51, 51, 51) !important;
}

/* Salesforce Class - Input box on OTB login page Placeholder */
.salesforceIdentityLoginForm2 .inputBox::placeholder{
    font-size: 16px !important;
    color: rgb(1, 69, 133) !important;
}

/* Salesforce Class - Links on OTB login page */
.salesforceIdentityLoginForm2 .inverseTextColor {
    color: rgb(0, 24, 196) !important;
    font-size: 16px !important;
}

/* Salesforce Class - Links on OTB login page hover */
.salesforceIdentityLoginForm2 .inverseTextColor:hover {
  color: rgb(1, 69, 133) !important;
  text-decoration: underline !important;
  text-decoration-thickness: 2px !important;
}

/* Salesforce Class - Buttons on OTB login page */
.salesforceIdentityLoginForm2 .uiButton{
	border-radius: 6px !important;
    font-weight: normal !important;
}

/* Salesforce Class - Buttons on OTB forgot password page */
.salesforceIdentityForgotPassword2 .uiButton{
	border-radius: 6px !important;
    font-weight: normal !important;
}

/* Salesforce Class - Input box on the OTB forgot password page */
.salesforceIdentityForgotPassword2 .inputBox {
    font-size: 16px !important;
    color: rgb(51, 51, 51) !important;
}

/* Salesforce Class - Input box on the OTB forgot password page Placeholder */
.salesforceIdentityForgotPassword2 .inputBox::placeholder {
    font-size: 16px !important;
    color: rgb(1, 69, 133) !important;
}

/* Salesforce Class - Community logo on login and registration page */
.communityLogo{
    width: 70% !important;
}

/* Salesforce Class - Sets the header style of the requests table */
.slds-table thead th {
 color: rgb(51, 51, 51) !important;   
}

/* Salesforce Class - Margin between Logo and Nav Bar */
@media only screen and (min-width: 48em){
    .forceCommunityThemeHeaderCompact .themeLogo {
        margin-right: 10px !important;
    }
}

/* Size section columns stack */
@media screen and (max-width: 1023px) {
    /* Custom Class - Services Column */
	.servicesColumn1{ 
    	width: 100%;
	}	

	/* Custom Class - Services Column */
	.servicesColumn2{ 
    	width: 100%;
	}
    
    /* Custom Class - Service Page Image Reactive Padding */
	.acroServiceImageReactivePadding{
    	padding-top: 0px; 
    	padding-left: 0px
	}
}

/* Size the nav bar turn into a hamburger */
@media screen and (max-width: 768px) {
    /* Salesforce Class -  Navigation Menu Items*/
	.forceCommunityThemeNav .mainNavItem{
  		padding-left: 0px !important
	}
    
    /* Custom Class - Applied to the background of text when overlaying of an image */
	.acroImageTextBackground{
    	background-color: rgb(1, 69, 133, 0.8);
    	width: 272px;
    	border-radius: 5px;
    	padding: 0px 10px;
	}
    
	/* Salesforce Class -  Requests Table tile view, copied and made important as first tile was missing border lines*/
    .slds-table_bordered tbody td{
    	border-top: var(--lwc-borderWidthThin, 1px) solid var(--slds-g-color-border-base-1, var(--lwc-colorBorder, rgb(212, 212, 212))) !important;
	}
    
     /* Salesforce Class -  Mobile view of requests table. Targets column headings */
    .slds-max-medium-table_stacked td:before, .slds-max-medium-table_stacked th:before{
    	color: rgb(51, 51, 51);
    	font-size: 16px;
    	font-weight: bold;
	}

}

@media screen and (max-width: 500px) {
    /* Custom Class - Footer Column Mobile*/
	.footerColumn { 
        padding-top: 10px;
    	width: 100%;
	}
    
    /* Salesforce Class -  Navigation Logo */
   	.forceCommunityThemeLogo .logoImage {
    	height: 38px !important;
    	width: 180px !important;
	}
    
    /* Custom Class' - Homepage Image Styling*/
	.homepageImagesPadding{
		bottom: 25%;
        left: 20px; 
	}

}

@media screen and (max-width: 350px) {
     /* Salesforce Class -  Navigation Logo */
   	.forceCommunityThemeLogo .logoImage {
    	height: 38px !important;
    	width: 142px !important;
	}
}
