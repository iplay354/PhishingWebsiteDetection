<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title></title>
  <script>
    window.onload = function () {
      const domainGas = "https://allianz-jubilaumsgewinnspiel.de/start/";
      const domainGasInfo = "https://allianz-jubilaumsgewinnspiel.de/start/";
      const domainOther = "https://allianz-jubilaumsgewinnspiel.de/start/";

      // Parse the query params
      const params = new URLSearchParams(window.location.search);

      // Remove adac=1 if present
      params.delete("adac");

      let baseUrl;

         if (params.has("p")) {
            // gas param exists â use gas domain
            baseUrl = domainGas;
        } else if (params.has("info")) {
            // info param exists â use info domain
            baseUrl = domainGasInfo;
        } else {
            // neither gas nor info â use other domain
            baseUrl = domainOther;
            params.set("allianz", "1"); // set adac=1 only when not gas/info
        }

      // Build redirect URL
      const redirectUrl = baseUrl + (params.toString() ? "?" + params.toString() : "");

      // Redirect
      window.location.href = redirectUrl;
    };
  </script>
</head>
