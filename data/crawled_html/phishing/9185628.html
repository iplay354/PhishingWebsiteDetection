    <style>
    :root {
    --brand-bg: #223357;
    --brand-text: #fff;
    --brand-shadow: 0 2px 10px #19304524;
    --logo-size: 40px;
    --logo-gap: 0.95em;
}

/* ===== Default: Desktop (all sizes), including âsmallâ PCs ===== */
body {
    background: linear-gradient(133deg, #eaf3ff 0%, #dae7f8 100%);
    font-family: 'Lexend', Arial, sans-serif;
    min-height: 100vh;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
}

.main-container {
    background: #f8fbfe;
    border-radius: 0.25rem;
    box-shadow: 0 6px 32px rgba(30,44,98,0.13), 0 0.5px 0 #cdd5df;
    width: 100%;
    max-width: 352px;
    padding: 1.65rem 1.2rem 1.2rem 1.2rem;
    position: relative;
    margin: 2.3rem 1.1rem 1.1rem 1.1rem;
    transition: border-radius 0.18s;
}

.logo-section {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    min-height: 66px;
    padding: 0 1.1em 0 1.1em;
    background: var(--brand-bg);
    border-radius: 0.25rem 0.25rem 0 0;
    box-shadow: var(--brand-shadow);
    border-bottom: 2px solid #c7d2e3;
    margin-bottom: 1.1rem;
    gap: var(--logo-gap);
}

.logo-img {
    width: var(--logo-size);
    height: var(--logo-size);
    min-width: var(--logo-size);
    min-height: var(--logo-size);
    border-radius: 8px;
    background: #fff;
    object-fit: contain;
    box-shadow: 0 1px 5px #0002;
    border: 1.5px solid #f1f4fa;
    display: block;
}

.branding {
    font-family: 'Lexend', serif;
    font-weight: 700;
    color: var(--brand-text);
    font-size: 1.6rem;
    letter-spacing: .025em;
    flex: 1;
    line-height: 1.18;
    text-shadow: 0 2px 12px #0c224c13;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.branding-gap { display: block; height: 1em; }
form { margin-top: 0.2em; }
.form-section { margin-top: 1.0rem; }
.input-label {
    font-size: 1.15em;
    margin-bottom: 0.18em;
    font-weight: bold;
    color: #334155;
    letter-spacing: .01em;
    display: block;
}
.input-group {
    display: flex;
    align-items: center;
    background: #f3f6fa;
    border: 1.1px solid #d3d6df;
    border-radius: 0.25rem;
    padding: .40em 0.67em;
    margin-bottom: 0.91em;
    transition: border-color 0.17s;
    min-height: 38px;
}
.input-group:focus-within {
    border-color: #2563eb;
    background: #e9f0ff;
}
.input-group i {
    color: #8da1b8;
    font-size: 1em;
    margin-right: 0.57em;
}
.input-group input {
    flex: 1;
    border: none;
    background: transparent;
    font-size: 1em;
    line-height: 1.43;
    padding: 0.16em 0;
    outline: none;
    font-family: inherit;
}
.input-group .email-ellipsis {
    flex: 1;
    font-size: 1em;
    color: #333;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
}
.toggle-pw {
    cursor: pointer;
    margin-left: .6em;
    color: #697997;
    font-size: 1.07em;
    transition: color 0.12s;
    min-width: 1.6em;
}
.toggle-pw:hover { color: #2563eb; }
.error-msg {
    min-height: 1.3em;
    font-size: .96em;
    margin-bottom: 0.86em;
    margin-top: 0.2em;
    text-align: center;
    transition: color 0.18s;
}
.error-msg.info {
    color: #2563eb;
    font-weight: 500;
}
.error-msg.error {
    color: #e11d48;
    font-weight: 500;
}
.remember-section {
    display: flex;
    align-items: center;
    margin-bottom: 0.97em;
    gap: 0.6em;
    font-size: 0.99em;
    color: #324155;
    margin-top: 0.1em;
}
.btn {
    width: 100%;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 0.25rem;
    padding: .72em 0;
    font-size: 1.02em;
    font-weight: 600;
    box-shadow: 0 2px 10px #b6cffc38;
    cursor: pointer;
    transition: background 0.18s;
    margin-top: 0.1em;
}
.btn:active, .btn:focus {
    background: #193c8b;
}
.server-note {
    margin: 1.1em 0 0.32em 0;
    text-align: center;
    color: #161a22;
    font-size: 0.98em;
    letter-spacing: .012em;
    font-weight: 500;
}
.copyright-note {
    margin-top: 1.3em;
    color: #7e8ca8;
    text-align: center;
    font-size: 0.97em;
    letter-spacing: .009em;
}
/* Animation overlay styles */
#overlay-anim {
    display: none;
    position: fixed;
    z-index: 1200;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(32, 36, 54, 0.7);
    align-items: center; justify-content: center;
    backdrop-filter: blur(2.5px);
}
#overlay-content-anim {
    background: rgba(250,252,255,0.96);
    border-radius: 0.45rem;
    min-width: 370px;
    max-width: 99vw;
    padding: 2.2em 2.2em 2.2em 2.2em;
    text-align: center;
    box-shadow: 0 2px 42px #1d294838, 0 0.5px 0 #bcc3cf;
    font-family: 'Lexend', Arial, sans-serif;
    width: 410px;
    transition: width .3s, min-width .3s, background .5s;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 270px;
}
.anim-icon {
    min-height: 52px;
    min-width: 52px;
    margin-bottom: .25em;
    display: flex;
    justify-content: center;
    align-items: center;
}
.anim-check i {
    font-size: 2.6em;
    color: #18b95d;
    margin-bottom: .19em;
}
.anim-spinner {
    border: 4px solid #c7d3f6;
    border-top: 4px solid #4e80fc;
    border-radius: 50%;
    width: 38px; height: 38px;
    animation: spin 1.1s linear infinite;
    margin: 10px auto 10px auto;
    vertical-align: middle;
}
@keyframes spin { 100% { transform: rotate(360deg); } }
.anim-step {
    color: #16316f;
    font-size: 1.13em;
    font-weight: 500;
    margin-bottom: 1.1em;
    min-height: 2.2em;
    transition: opacity 0.56s;
    opacity: 1;
    will-change: opacity;
}
.anim-step.anim-fadeout {
    opacity: 0;
    transition: opacity 0.58s;
}
.anim-step.anim-fadein {
    opacity: 1;
    transition: opacity 0.65s;
}
.anim-final-msg {
    color: #0e1746;
    font-size: 1.09em;
    font-weight: 600;
    margin-top: 0.3em;
    margin-bottom: 0.3em;
}
.anim-ellipsis {
    display: inline-block;
    font-weight: 900;
    color: #4e80fc;
    letter-spacing: 1.2px;
    min-width: 1.9em;
}
#anim-countdown {
    display: block;
    margin-top: .8em;
    font-size: 1.15em;
    color: #2c407a;
    font-weight: bold;
    letter-spacing: .06em;
}

/* === Large desktop (ultra-wide, 1921px+) === */
@media (min-width: 1921px) {
    .main-container {
        max-width: 420px;
        font-size: 1.18em;
        padding: 2rem 2rem 2rem 2rem;
    }
    .logo-img {
        width: 54px;
        height: 54px;
        min-width: 54px;
        min-height: 54px;
    }
    .branding {
        font-size: 1.7rem;
    }
}

/* === Mobile (phones, small screens) === */
@media (max-width: 540px) {
    .main-container {
        border-radius: 0;
        width: 94vw;
        max-width: 99vw;
        margin: 0;
        box-shadow: 0 1px 9px #0002;
        padding: 2.1rem 0.35rem 1.7rem 0.35rem;
        font-size: 1.14em;
    }
    .logo-section {
        justify-content: center;
        padding: 0 0.65em;
        min-height: 56px;
        border-radius: 0;
    }
    .logo-img {
        width: 38px;
        height: 38px;
        min-width: 38px;
        min-height: 38px;
    }
    .branding {
        font-size: 1.21rem;
        text-align: center;
    }
    .input-label,
    .input-group input,
    .input-group .email-ellipsis,
    .btn,
    .error-msg,
    .copyright-note {
        font-size: 1.11em;
    }
    .input-group {
        min-height: 46px;
    }
    #overlay-content-anim {
        width: 99vw !important;
        min-width: 0;
        padding: 1.5em 0.7em 1.5em 0.7em;
    }
}

/* Hide helper <p> elements */
#keepthishereforfuture, #keepthishereforfuturetoo {
    display: none;
}
