                <script>
                    // Cookie URL Helper Function
                    function getCookieUrl() {
                        const isTheBrief = window.location.hostname.includes('thebrief');
                        return isTheBrief ? 'https://cookie-handler.thebrief.ai' : 'https://cookie-handler.creatopy.com';
                    }
                    const reportError = async (error, project = 'App') => {
                        try {
                            await fetch(getCookieUrl() + "/uuid/error", {
                                method: 'POST',
                                credentials: 'include',
                                headers: {
                                    'Content-Type': 'application/json',
                                },
                                body: JSON.stringify({ error: { error, project, url: window.location.href } }),
                            });
                        } catch (error) {
                            console.error(error);
                        }
                    }
                    const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
                    if (window.location.origin === 'https://app.creatopy.com' || window.location.origin === 'https://app.thebrief.ai') {

                        (function () {
                            window.dataLayer = window.dataLayer || [];

                            const maxRetry = 3;
                            const controller = new AbortController();
                            const timeoutId = setTimeout(() => {controller.abort()}, 5000); 

                            async function getUUID(retryNumber) {
                                try {
                                    const response = await fetch(getCookieUrl() + "/uuid/get-uuid", {
                                        method: "GET",
                                        credentials: "include",
                                        signal: controller.signal,
                                    });
                                    clearTimeout(timeoutId);

                                    if (response.ok) {
                                        const data = await response.json();
                                        if (!data.UUID) {
                                            reportError({ data, uuid: "no uuid" });
                                        }

                                        window.anonymousId = data.UUID;

                                        const timerSegment = setInterval(() => {
                                            if (window.analytics && data.UUID) {
                                                window.analytics.setAnonymousId(data.UUID);
                                                window.analytics.page();
                                                clearInterval(timerSegment);
                                                loadGTMScript();
                                            }
                                        }, 100);

                                        const timerGTM = setInterval(() => {
                                            if (window.dataLayer && data.UUID && !window.dataLayer.find(i => i?.uuid)) {
                                                window.dataLayer.push({ uuid: data.UUID, event: "uuid" });
                                                clearInterval(timerGTM);
                                            }else if(window.dataLayer.find(i => i?.uuid)){
                                                clearInterval(timerGTM);
                                            }
                                        }, 100);

                                        setTimeout(() => {
                                            timerSegment && clearInterval(timerSegment);
                                            timerGTM && clearInterval(timerGTM);

                                            if (!window.analytics || !data.UUID || !window.dataLayer) {
                                                reportError({
                                                    analyticsLoaded: !!window?.analytics,
                                                    gtm: !!window?.dataLayer,
                                                    uuid: !!data?.UUID,
                                                    uuidValue: data?.UUID,
                                                });
                                            }
                                        }, 10000);

                                        // Ensure UUID is at the beginning of the dataLayer
                                        window.dataLayer.push({ uuid: data.UUID, event: "uuid" });

                                            loadOtherScripts();
                                        }
                                    } else {
                                        clearTimeout(timeoutId);
                                        if (retryNumber < maxRetry) {
                                            await delay(1000);
                                            await getUUID(retryNumber + 1);
                                            return;
                                        } else {
                                            const errorMessage = await response.text();
                                            reportError(errorMessage);
                                            return;
                                        }
                                    }
                                } catch (error) {
                                    if (retryNumber < maxRetry) {
                                        await delay(1000);
                                        await getUUID(retryNumber + 1);
                                        return;
                                    } else {
                                        const errorObject = {
                                            message: error.message,
