<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="The onboarding panel for the drivers affiliated with UTWSD Union." />
  <meta name="author" content="Coderthemes" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <title>Onboarding Panel</title>
  <base href="/" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio,line-clamp"></script>
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
  />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter var'],
          },
          colors: {
            'primary-yellow': '#F1A303',
            'secondary-gray': '#241E20',
          },
        },
      },
    }
  </script>
  <style type="text/tailwindcss">
    @layer components {
  
  /* / html and body / */

  html {
    @apply h-full bg-gray-100 text-gray-900;
  }
  body {
    @apply h-full;
  }

/* / form / */

  [type="text"],
  [type="password"],
  [type="email"],
  [type="number"],
  [type="url"],
  [type="date"],
  [type="datetime-local"],
  [type="month"],
  [type="week"],
  [type="time"],
  [type="search"],
  [type="tel"],
  [type="checkbox"],
  [type="radio"],
  select,
  [multiple],
  textarea {
    @apply appearance-none block border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-primary-yellow focus:border-primary-yellow sm:text-sm;
  }
  


  /* / navbar / */

  .navbar-active{
    @apply bg-gray-900 text-white;
  }
  .navbar-svg-active{
    @apply text-gray-300;
  }
  .navbar-default{
    @apply text-gray-300 hover:bg-gray-700 hover:text-white;
  }
  .navbar-svg-default{
    @apply text-gray-400 group-hover:text-gray-300;
  }

  /* / button / */

  .btn-sm{
    @apply inline-flex items-center px-3 py-2 border border-transparent text-sm leading-4 font-medium rounded-md shadow-sm text-white bg-primary-yellow hover:bg-primary-yellow/80 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-yellow;
  }

  .btn-sm-white{
    @apply inline-flex items-center px-3 py-2 border border-gray-300 shadow-sm text-sm leading-4 font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-yellow;
  }

  /* / setting steps / */

  .setting-step-active{
    @apply bg-primary-yellow/10 border-primary-yellow/80 text-primary-yellow hover:bg-primary-yellow/5 hover:text-primary-yellow;
  }
  .setting-step-active-svg{
    @apply text-primary-yellow/80 group-hover:text-primary-yellow;
  }
  .setting-step-default{
    @apply border-transparent text-gray-900 hover:bg-gray-50 hover:text-gray-900;
  }
  .setting-step-default-svg{
    @apply text-gray-400 group-hover:text-gray-500;
  }
  
  .ng-select{
    @apply h-[38px] bg-transparent appearance-none block border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary-yellow focus:border-transparent sm:text-sm !important;
  }
  .select2-container .select2-selection--single{
    @apply h-[38px] bg-transparent appearance-none block border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary-yellow focus:border-transparent sm:text-sm !important;
  }
  .select2-selection__rendered{
    @apply leading-[38px] !important;
  }
  .select2-selection__arrow{
    @apply h-[38px] !important ;
  }
   .ng-value-container .ng-value{
    @apply mt-1.5 !important ;
  }


}


    </style>
