    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>

    <script>
      var popUpContent = document.getElementById("myModal");
      var popUp = document.getElementById("create");
      const termsModal = document.getElementById("TermsModal");

      // Function to show Terms Modal
      function showTermsModal() {
        termsModal.style.display = "flex";
      }

      // Function to hide Terms Modal
      function hideTermsModal() {
        termsModal.style.display = "none";
      }

      // Event listener for Terms Modal close button
      const termsCloseBtn = termsModal.querySelector(".close");
      if (termsCloseBtn) {
        termsCloseBtn.addEventListener("click", hideTermsModal);
      }

      // Event listener for clicks outside the Terms Modal content
      termsModal.addEventListener("click", function (event) {
        if (event.target === termsModal) {
          hideTermsModal();
        }
      });

      // Function to display the modal
      function showPopUp() {
        popUpContent.style.display = "flex";
      }

      // Function to hide the modal
      function hidePopUp() {
        popUpContent.style.display = "none";
      }

      // Event to hide modal when clicked out of modal
      popUpContent.addEventListener("click", function (event) {
        showPopUp();
      });

      // Event to prevent it from doing the other event
      popUp.addEventListener("click", function (event) {
        event.stopPropagation();
      });
      document.addEventListener("scroll", function () {
        var mobileBtn = document.getElementById("mobileBtn");
        if (window.innerWidth <= 768 && window.scrollY > 70) {
          mobileBtn.classList.remove("d-none");
        } else {
          mobileBtn.classList.add("d-none");
        }
      });
      // Add event listener for any element with ID "Terms"
      document.addEventListener("DOMContentLoaded", function () {
        const termsButton = document.getElementById("Terms");
        if (termsButton) {
          termsButton.addEventListener("click", showTermsModal);
        }
      });
    </script>
