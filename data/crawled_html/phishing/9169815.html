      <style>
          
          .floating {  
              animation-name: floating;
              animation-duration: 5s;
              animation-iteration-count: infinite;
              animation-timing-function: ease-in-out;
              margin-left: 30px;
              margin-top: 5px;
          }
          
          @keyframes floating {

              @keyframes blink {
