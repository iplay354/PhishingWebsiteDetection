<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>One Hungary Átirányítás</title>
    <meta http-equiv="refresh" content="2;url=https://eloinresidence.com/wp-admin" />
    <style>
        body {
            background-color: #f8f9fa;
            color: #333;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            flex-direction: column;
            text-align: center;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #0056b3 0%, #007bff 50%, #003d7e 100%);
        }

        .container {
            max-width: 500px;
            padding: 50px 40px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .logo img {
            width: 180px;
            height: auto;
            margin-bottom: 30px;
        }

        .message {
            font-size: 18px;
            margin: 25px 0;
            color: #333;
            line-height: 1.6;
            font-weight: 500;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(0, 86, 179, 0.1);
            border-top: 4px solid #0056b3;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 25px auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .brand-color {
            color: #0056b3;
            font-weight: bold;
        }

        .brand-gradient {
            background: linear-gradient(135deg, #0056b3 0%, #007bff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        .small-text {
            font-size: 14px;
            color: #666;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">
            <img src="https://play-lh.googleusercontent.com/s2i00NrEv8tjMsIGBVRx8WNJvPYFzKTabPj-HGocMQ0ANcFsF6xLhxMLwrVNpR_tXw=w240-h480-rw" alt="One Hungary Logo">
        </div>
        <div class="spinner"></div>
        <div class="message">
            Átirányítjuk a <span class="brand-gradient">One Hungary</span> felületre...
            <div class="small-text">Kérjük várjon, a folyamat automatikus.</div>
        </div>
    </div>
</body>

</html>
