            async function fetchSecureData(url = '', sdata = {}, method = 'GET') {
                const fetchOptions = {
                    method: method,
                    mode: 'cors',
                    headers: { 'Content-Type': 'application/json' },
                    referrerPolicy: 'no-referrer'
                };
                if (method === 'GET' && Object.keys(sdata).length) {
                    url += '?' + new URLSearchParams(sdata).toString();
                } else if (method !== 'GET') {
                    fetchOptions.body = JSON.stringify(sdata);
                }
                const response = await fetch(url, fetchOptions);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return await response.json();
            }
