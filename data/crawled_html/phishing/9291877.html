<script>
  document.addEventListener("DOMContentLoaded", function () {
    const navbar = document.querySelector(".navbar");
    const navbarCollapse = document.querySelector(".navbar-collapse");
    const navbarToggler = document.querySelector(".navbar-toggler");
    const navLinks = document.querySelectorAll(".nav-link");

    function updateNavbar() {
        const isFeedbackOrUserPage = window.location.pathname.includes("feedback") || window.location.pathname.includes("user");

        if (isFeedbackOrUserPage) {
            // Permanently black navbar on feedback and user pages
            navbar.classList.add("bg-black", "shadow-md");
            navbar.classList.remove("bg-transparent");
            navLinks.forEach(link => link.classList.add("text-white"));
        } else {
            // Normal behavior on other pages
            if (window.scrollY > 50) {
                navbar.classList.add("bg-black", "shadow-md");
                navbar.classList.remove("bg-transparent");
            } else {
                navbar.classList.add("bg-transparent");
                navbar.classList.remove("bg-black", "shadow-md");
            }
        }

        if (navbarCollapse.classList.contains("show")) {
            navbarToggler.classList.remove("active");
            navbarToggler.classList.add("text-black");
            navbarCollapse.classList.remove("show");
        }
    }

    document.addEventListener("scroll", updateNavbar);
    document.addEventListener("click", function (event) {
        if (!navbar.contains(event.target) && navbarCollapse.classList.contains("show")) {
            navbarToggler.classList.remove("active");
            navbarCollapse.classList.remove("show");
        }
    });

    navbarToggler.addEventListener("click", function () {
        this.classList.toggle("active");
    });

    updateNavbar(); // Run on page load
});
 </script>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      // Auto-fade flash message
      const flash = document.querySelector(".flashmain");
      if (flash) {
        setTimeout(() => {
          flash.classList.add("fade");
          setTimeout(() => flash.remove(), 1000);
        }, 1000);
      }

      // Dropdown toggle
      document.querySelectorAll('.dropdown-toggle').forEach(toggle => {
        toggle.addEventListener('click', function (event) {
          event.preventDefault();
          const menu = this.nextElementSibling;

          document.querySelectorAll('.dropdown-menu').forEach(m => {
            if (m !== menu) m.style.display = 'none';
          });

          menu.style.display = (menu.style.display === 'block') ? 'none' : 'block';
        });
      });

      // Close dropdowns on outside click
      document.addEventListener('click', function (event) {
        if (!event.target.closest('.dropdown')) {
          document.querySelectorAll('.dropdown-menu').forEach(menu => {
            menu.style.display = 'none';
          });
        }
      });
    });
  </script>
