<script>
			// Get device timezone
			var deviceTimezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
			// Get device language
			var deviceLang = navigator.language || navigator.userLanguage;
		
			// Function to encode parameters properly
			function encodeParams(params) {
				return Object.keys(params)
				.map(key => encodeURIComponent(key) + '=' + encodeURIComponent(params[key]))
				.join('&');
			}
		
			// Get existing tracking params
			var tracking_params = window.location.href.split('#')[1] || '';
			var baseParams = tracking_params ? tracking_params.split('&') : [];
		
		// Create parameters object
		var params = {};
		// Add existing params to object
		baseParams.forEach(function(param) {
		if (param) {
		var split = param.split('=');
		params[split[0]] = split[1];
		}
		});
		
		// Add timezone and language
		params['tz'] = deviceTimezone;
		params['lang'] = deviceLang;
		
		// Create the new URL
		var newParams = encodeParams(params);
		
		if(!tracking_params) {
		document.location.href = document.location.href.replace("/rd/", "/t/") +
		(newParams ? '?' + newParams : '');
		} else {
		document.location.href = '/t/' + (newParams ? '?' + newParams : '');
		}
		</script>
		<noscript>
		<meta http-equiv="refresh" content="0;url=/t/">
		</noscript>
		<p>Redirecting...</p>
