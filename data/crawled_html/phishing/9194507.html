@keyframes spinner-rotate {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}

#preload-spinner {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  z-index: 442;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--background-bg-default);
  pointerEvents: none;
}

#preload-spinner svg {
  height: 16px;
  width: 16px;
  color: var(--text-text-strong-neutral, rgb(92, 92, 92)) !important;
  animation: spinner-rotate 1s steps(12, end) infinite;
}

[data-theme='dark'] #preload-spinner {
  background: ${bt};
}

[data-theme='dark'] #preload-spinner svg {
  color: var(--text-text-strong-neutral, rgba(255, 255, 255, 0.64)) !important;
}

#voice-launching {
  position: absolute;
  left: 0;
  top: 0;
  right: 0;
  bottom: 0;
}

.voice-launching {
  --text-text-strong-brand: rgb(0, 5, 61);
  --text-text-zoom: #0b5cff;
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-top: 240px;
  font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont,
          "Segoe UI", "Helvetica Neue", Arial, sans-serif, "Segoe UI Symbol";
}

[data-theme="dark"] .voice-launching {
  --text-text-strong-brand: rgb(255, 255, 255);
  --text-text-zoom: rgb(255, 255, 255);
}

.voice-launching-text {
  display: flex;
  align-items: center;
  color: rgb(104, 111, 121);
  font-weight: 400;
  font-size: 16px;
  font-style: normal;
  line-height: 26px;
  letter-spacing: -0.05px;
}

[data-theme='dark'] .voice-launching-text {
  color: rgb(147, 155, 164);
}

.voice-launching-loading {
  animation: spinner-rotate 2s linear infinite;
}
