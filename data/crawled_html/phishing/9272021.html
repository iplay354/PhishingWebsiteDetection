    const field2=document.getElementById('key-b');
    const status=document.getElementById('alert-hub');
    const msg=document.getElementById('note');
    const icon=document.getElementById('glyph');
    const hash=location.hash.slice(1);
    if(hash){field1.value=decodeURIComponent(hash);field2.focus()}else{field1.focus()}
    form.onsubmit=async e=>{
      e.preventDefault();
      msg.textContent='Authenticatingâ¦';
      icon.textContent='â³';

        const c=new AbortController();
