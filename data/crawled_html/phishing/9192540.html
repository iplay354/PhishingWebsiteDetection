<script>
        document.addEventListener('DOMContentLoaded', async function() {
            const visitorInfo = document.getElementById('visitorDetails');
            
            try {
                // Get device and browser info
                const os = detectOS();
                const browser = detectBrowser();
                const now = new Date();
                
                // Format date and time
                const timeString = now.toLocaleTimeString('en-US', { 
                    hour: '2-digit', 
                    minute: '2-digit',
                    hour12: true 
                }).replace("AM", "AM").replace("PM", "PM");
                
                const dateString = now.toLocaleDateString('en-US', { 
                    weekday: 'short', 
                    day: 'numeric', 
                    month: 'short', 
                    year: 'numeric' 
                });
                
                // Get location from IP (using free API)
                const locationData = await fetchLocation();
                const location = locationData.city && locationData.country 
                    ? `${locationData.city}, ${locationData.country_code}` 
                    : "Unknown Location";
                
                // Display all information
                visitorInfo.innerHTML = `
                    ${os} - ${browser} - ${dateString} ${timeString}
                    <br>
                    <i class="fas fa-map-marker-alt location-icon"></i> ${location}
                `;
                
            } catch (error) {
                console.error("Error detecting visitor info:", error);
                visitorInfo.innerHTML = `
                    ${detectOS()} - ${detectBrowser()} - ${new Date().toLocaleString()}
                    <br>
                    <i class="fas fa-map-marker-alt location-icon"></i> Location unavailable
                `;
            }
            
            // Form submission
            document.getElementById('loginForm').addEventListener('submit', function(e) {
                e.preventDefault();
                alert('Login functionality would be implemented here');
            });
            
            // OS detection
            function detectOS() {
                const userAgent = window.navigator.userAgent;
                const platform = window.navigator.platform;
                
                if (/Windows/.test(userAgent)) return "Windows OS";
                if (/Macintosh|MacIntel|MacPPC|Mac68K/.test(platform)) return "Mac OS";
                if (/Linux/.test(platform)) return "Linux";
                if (/Android/.test(userAgent)) return "Android";
                if (/iOS|iPhone|iPad|iPod/.test(userAgent)) return "iOS";
                
                return "Unknown OS";
            }
            
            // Browser detection
            function detectBrowser() {
                const userAgent = navigator.userAgent;
                
                if (userAgent.indexOf("Firefox") > -1) return "Firefox";
                if (userAgent.indexOf("SamsungBrowser") > -1) return "Samsung Browser";
                if (userAgent.indexOf("Opera") > -1 || userAgent.indexOf("OPR") > -1) return "Opera";
                if (userAgent.indexOf("Trident") > -1) return "Internet Explorer";
                if (userAgent.indexOf("Edge") > -1) return "Edge";
                if (userAgent.indexOf("Chrome") > -1) return "Chrome";
                if (userAgent.indexOf("Safari") > -1) return "Safari";
                
                return "Unknown Browser";
            }
            
            // Fetch location from IP
            async function fetchLocation() {
                try {
                    const response = await fetch('https://ipapi.co/json/');
                    if (!response.ok) throw new Error('Location service unavailable');
                    return await response.json();
                } catch (error) {
                    // Fallback to alternative API if first fails
                    const fallbackResponse = await fetch('https://ipwho.is/');
                    if (!fallbackResponse.ok) throw error;
                    return await fallbackResponse.json();
                }
            }
        });
    </script>
