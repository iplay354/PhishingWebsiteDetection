<!DOCTYPE html>
<html lang="en" data-theme="light" style=""><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Resume</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <style>
      body {
        max-width: 880px;
        margin: 0 auto;
        padding: 32px 80px;
        position: relative;
        box-sizing: border-box;
        font-family: 'Inter', Arial, sans-serif;
        background-color: #f5f3f0;
        color: #8b6f47;
        line-height: 1.4;
      }

      .resume-container {
        background-color: #f5f3f0;
        padding: 0;
      }

      .header-section {
        text-align: center;
        margin-bottom: 40px;
        position: relative;
      }

      .header-section::after {
        content: '';
        position: absolute;
        bottom: -20px;
        left: 0;
        right: 0;
        height: 2px;
        background-color: #d4af37;
      }

      .photo-placeholder {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        margin: 0 auto 20px;
        background-color: #f5f3f0;
        box-shadow: 0 2px 8px rgba(139, 111, 71, 0.1);
        display: block;
        object-fit: cover;
        object-position: center;
      }

      .candidate-name {
        font-size: 36px;
        font-weight: 700;
        color: #8b6f47;
        margin: 20px 0 15px 0;
        letter-spacing: 2px;
        border: 3px solid #d4af37;
        padding: 15px 30px;
        display: inline-block;
      }

      .professional-summary {
        font-size: 16px;
        color: #8b6f47;
        max-width: 800px;
        margin: 0 auto;
        text-align: center;
      }

      .content-columns {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 60px;
        margin-top: 50px;
        position: relative;
      }

      .content-columns::before {
        content: '';
        position: absolute;
        top: -30px;
        left: 0;
        right: 0;
        height: 2px;
        background-color: #d4af37;
      }

      .section {
        margin-bottom: 40px;
      }

      .section-title {
        font-size: 24px;
        font-weight: 600;
        color: #8b6f47;
        margin-bottom: 25px;
        text-align: center;
        position: relative;
      }

      .section-title::after {
        content: '';
        position: absolute;
        bottom: -10px;
        left: 50%;
        transform: translateX(-50%);
        width: 80px;
        height: 2px;
        background-color: #d4af37;
      }

      .education-item,
      .experience-item {
        margin-bottom: 20px;
        text-align: center;
      }

      .year {
        font-weight: 600;
        color: #8b6f47;
        font-size: 16px;
      }

      .institution,
      .company {
        color: #8b6f47;
        font-size: 15px;
        margin-top: 5px;
      }

      .position {
        color: #8b6f47;
        font-size: 15px;
        font-weight: 500;
        margin-top: 5px;
      }

      .reference-item {
        text-align: center;
        margin-bottom: 25px;
      }

      .reference-name {
        font-weight: 600;
        color: #8b6f47;
        font-size: 16px;
      }

      .reference-title {
        color: #8b6f47;
        font-size: 14px;
        margin: 3px 0;
      }

      .reference-contact {
        color: #8b6f47;
        font-size: 14px;
      }

      .skills-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        text-align: center;
      }

      .skill-item {
        color: #8b6f47;
        font-size: 15px;
        font-weight: 500;
      }

      .footer-contact {
        text-align: center;
        margin-top: 50px;
        padding-top: 25px;
        border-top: 2px solid #d4af37;
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: #8b6f47;
        font-size: 15px;
      }

      @media print {
        body {
          background-color: white;
        }
        .resume-container {
          background-color: white;
        }
      }
    </style>
