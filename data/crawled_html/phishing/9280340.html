<script>
  function getCookie(name) {
    const value = `; ${document.cookie}`;
    const parts = value.split(`; ${name}=`);
    if (parts.length === 2) return parts.pop().split(';').shift();
  }
  async function setLanguage(lang, nextUrl) {
    try {
      const csrftoken = getCookie('csrftoken');
      const formData = new URLSearchParams();
      formData.append('language', lang);
      formData.append('next', nextUrl || window.location.pathname + window.location.search);
      const res = await fetch('/i18n/setlang/', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8',
          'X-CSRFToken': csrftoken || ''
        },
        body: formData.toString(),
        credentials: 'same-origin'
      });
      // Django returns 302 normally; fetch follows redirects; just go to next
      window.location.href = nextUrl || window.location.href;
    } catch (e) {
      console.error('Failed to set language', e);
    }
  }
</script>
