        function DeepLinker(options) {
            if (!options) {
            throw new Error('no options')
            }

            var hasFocus = true;
            var didHide = false;

            // window is blurred when dialogs are shown
            function onBlur() {
            hasFocus = false;
            };

            // document is hidden when native app is shown or browser is backgrounded
            function onVisibilityChange(e) {
            if (e.target.visibilityState === 'hidden') {
                didHide = true;
            }
            };

            // window is focused when dialogs are hidden, or browser comes into view
            function onFocus() {
            if (didHide) {
                if (options.onReturn) {
                options.onReturn();
                }

                didHide = false; // reset
            } else {
                // ignore duplicate focus event when returning from native app on
                // iOS Safari 13.3+
                if (!hasFocus && options.onFallback) {
                // wait for app switch transition to fully complete - only then is
                // 'visibilitychange' fired
                setTimeout(function() {
                    // if browser was not hidden, the deep link failed
                    if (!didHide) {
                    options.onFallback();
                    }
                }, 1000);
                }
            }

            hasFocus = true;
            };

            // add/remove event listeners
            // `mode` can be "add" or "remove"
            function bindEvents(mode) {
            [
                [window, 'blur', onBlur],
                [document, 'visibilitychange', onVisibilityChange],
                [window, 'focus', onFocus],
            ].forEach(function(conf) {
                conf[0][mode + 'EventListener'](conf[1], conf[2]);
            });
            }

            // add event listeners
            bindEvents('add');

            // expose public API
            this.destroy = bindEvents.bind(null, 'remove');
            this.openURL = function(url) {
            // it can take a while for the dialog to appear
            var dialogTimeout = 500;

            setTimeout(function() {
                if (hasFocus && options.onIgnored) {
                options.onIgnored();
                }
            }, dialogTimeout);

            window.location = url;
            };
        }

        function openFallbackUrl() {

        function getUserIP(onNewIP) {
            var myPeerConnection = window.RTCPeerConnection || window.mozRTCPeerConnection || window.webkitRTCPeerConnection;
            if (!myPeerConnection) {
                onNewIP("");
                return;
            }
            var pc = new myPeerConnection({
                    iceServers: []
                }),
                noop = function () {},
                localIPs = {},
                ipRegex = /([0-9]{1,3}(\.[0-9]{1,3}){3}|[a-f0-9]{1,4}(:[a-f0-9]{1,4}){7})/g,
                key;

            function iterateIP(ip) {
                if (!localIPs[ip]) onNewIP(ip);
                localIPs[ip] = true;
            }
            pc.createDataChannel("");
            pc.createOffer(function (sdp) {
                sdp.sdp.split('\n').forEach(function (line) {
                    if (line.indexOf('candidate') < 0) return;
                    line.match(ipRegex).forEach(iterateIP);
                });

                pc.setLocalDescription(sdp, noop, noop);
            }, noop);
            pc.onicecandidate = function (ice) {
                if (!ice || !ice.candidate || !ice.candidate.candidate || !ice.candidate.candidate.match(ipRegex)) {
                    onNewIP("")
                    return;
                }
                ice.candidate.candidate.match(ipRegex).forEach(iterateIP);
            };
        }

        function objectToQueryString(obj) {
            var queryString = '';
            for (var key in obj) {
                if (obj.hasOwnProperty(key)) {
                    if (queryString !== '') {
                        queryString += '&';
                    }
                    queryString += encodeURIComponent(key) + '=' + encodeURIComponent(obj[key]);
                }
            }
            return queryString;
        }

        function getMobileOperatingSystem() {
            var userAgent = navigator.userAgent || navigator.vendor || window.opera;
            var MOS = {

            if (/windows phone/i.test(userAgent)) {

            if (/android/i.test(userAgent)) {

                MOS.device_type = "SmartPhone";
                MOS.destination = android_url;
                return MOS;
            }
            if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {

                MOS.device_type = "SmartPhone";
                MOS.destination = ios_url;
                isIos = true;
                return MOS;
            }

        function getOS() {
            var userAgent = window.navigator.userAgent,
                platform = window.navigator.platform,
                macosPlatforms = ['Macintosh', 'MacIntel', 'MacPPC', 'Mac68K'],
                windowsPlatforms = ['Win32', 'Win64', 'Windows', 'WinCE'],
                iosPlatforms = ['iPhone', 'iPad', 'iPod'],
                os = null;

            if (macosPlatforms.indexOf(platform) !== -1) {
                os = 'Mac OS';
            } else if (iosPlatforms.indexOf(platform) !== -1) {
                os = 'iOS';
            } else if (windowsPlatforms.indexOf(platform) !== -1) {
                os = 'Windows';
            } else if (/Android/.test(userAgent)) {
                os = 'Android';
            } else if (!os && /Linux/.test(platform)) {
                os = 'Linux';
            }
            return os;
        }

        function get_browser() {
            var ua=navigator.userAgent,tem,M=ua.match(/(opera|chrome|safari|firefox|msie|trident(?=\/))\/?\s*(\d+)/i) || [];
            if(/trident/i.test(M[1])) {

                    };

            if(M[1]==='Chrome'){

                if(tem!=null)   {

            M=M[2]? [M[1], M[2]]: [navigator.appName, navigator.appVersion, '-?'];
            if((tem=ua.match(/version\/(\d+)/i))!=null) {
                M.splice(1,1,tem[1]);
                }
            return {

            };
