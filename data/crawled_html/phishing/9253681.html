<body class="loginform">
    <div class="login-form-container">
        <div class="login-form-content">
            <div class="login-form">
                <div class="panel panel-default">
                    <div class="panel-body" style="padding: 30px !important">
                        <div id="logo" style="float: none; margin: 20px auto; width: 330px">
                            <img src="/layout/logo.png?var=01" alt="WSPayPer" />
                        </div>
                        <div class="text-center">
                                <h2>Nema naloga za plaćanje.</h2>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/Scripts/jquery-2.2.3.min.js"></script>
<script src="/Scripts/jquery-ui-1.11.4.js"></script>

    <script src="/Scripts/bootstrap.min.js"></script>

    <script src="/Scripts/jquery.validate.min.js"></script>

    <script src="/js/wstools.min.js"></script>
    <script src="/js/init.js"></script>

    <script type="text/javascript">

		$(function () {

				$('#UserName').focus();

				var url = "GetJsonUserRoles";

				$('#UserName')
					.blur(function () {
						var username = $('#UserName').val();

						$.getJSON(url,
							{ uname: username },
							function (data) {
								if (data.Success) {
									if (data.Result != undefined) {
										var result = JSON.parse(data.Result);
										var sel = $('#ddlRoles');
										sel.find('option').remove().end();
										$(result).each(function () {
											sel.append($("<option>").attr('value', this.val).text(this.text));
										});
										$('#divRoles').css('visibility', 'visible');
										$('#btnSubmit').prop('disabled', false);
									}

								} else {
									$('#divRoles').css('visibility', 'hidden');
									$('#btnSubmit').prop('disabled', true);
								}
							});
					});

			});

    </script>
</body>
