		<style type="text/css">
			.lf-progress {
			  -webkit-appearance: none;
			  -moz-apperance: none;
			  width: 100%;
			  /* margin: 0 10px; */
			  height: 4px;
			  border-radius: 3px;
			  cursor: pointer;
			}
			.lf-progress:focus {
			  outline: none;
			  border: none;
			}
			.lf-progress::-moz-range-track {
			  cursor: pointer;
			  background: none;
			  border: none;
			  outline: none;
			}
			.lf-progress::-webkit-slider-thumb {
			  -webkit-appearance: none !important;
			  height: 13px;
			  width: 13px;
			  border: 0;
			  border-radius: 50%;
			  background: #ffffff;
			  cursor: pointer;
			}
			.lf-progress::-moz-range-thumb {
			  -moz-appearance: none !important;
			  height: 13px;
			  width: 13px;
			  border: 0;
			  border-radius: 50%;
			  background: #ffffff;
			  cursor: pointer;
			}
			.lf-progress::-ms-track {
			  width: 100%;
			  height: 3px;
			  cursor: pointer;
			  background: transparent;
			  border-color: transparent;
			  color: transparent;
			}
			.lf-progress::-ms-fill-lower {
			  background: #ffffff;
			  border-radius: 3px;
			}
			.lf-progress::-ms-fill-upper {
			  background: #ffffff;
			  border-radius: 3px;
			}
			.lf-progress::-ms-thumb {
			  border: 0;
			  height: 15px;
			  width: 15px;
			  border-radius: 50%;
			  background: #ffffff;
			  cursor: pointer;
			}
			.lf-progress:focus::-ms-fill-lower {
			  background: #ffffff;
			}
			.lf-progress:focus::-ms-fill-upper {
			  background: #ffffff;
			}
			.lf-player-container :focus {
			  outline: 0;
			}

			  position: relative;
			}
			
			.lf-popover-content {
			  display: inline-block;
