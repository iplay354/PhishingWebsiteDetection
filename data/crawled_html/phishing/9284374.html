<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Verify Robot Check</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding-top: 100px; background-color: #f5f5f5; }
    .box { background: white; display: inline-block; padding: 30px; border: 1px solid #ccc; border-radius: 12px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    label { font-size: 16px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Please confirm you're not a robot</h2>
    <form method="POST">
      <label>
        <input type="checkbox" name="human" value="yes" required>
        I'm not a robot
      </label><br><br>
      <button type="submit">Continue</button>
    </form>
  </div>
</body>
</html>
