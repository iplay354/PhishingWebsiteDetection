<script>
    class OrganizationAttributeEnhancement {
        name = 'OrganizationAttributeEnhancement';
        pluginType = 'pipeline';
        category = 'enrichment';
        version = '0.0.1';
        isActive = false;
        logger;
        organization;

        initialize(context = {}) {
            this.context = context;
            this.logger = context.logger;
            this.organization = context.pluginConfig?.organization;
            console.log(`${this.name} plugin initialized with organization:`, this.organization);
        }

        processEvent(event) {
            if (!this.isActive) {
                this.logger?.warn(`${this.name} plugin is not active.`);
                return event;
            }
            if(this.organization != undefined) {
                event.eventProperties['organization'] = this.organization;
            } else {
                this.logger?.warn(`${this.name} plugin: organization is not set.`);
            }
            return event;
        }

        start() {
            this.isActive = true;
            this.logger?.info(`${this.name} plugin started.`);
        }

        stop() {
            this.isActive = false;
            this.context?.logger.debug('Stopped - no longer processing events.');
        }

        destroy() {
            this.organization = undefined; // Clear the stored ID from the instance
        }

    }
</script>

    // Shared getCookie function - used by both ad tracking and GPS location
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            let cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                let cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    <script>
        showAdsTime = AD_COMPLETION_TRACK_DELAY_MS;
        
        // Track ad completion after delay
        setTimeout(() => {
            trackAdCompletion();
        }, showAdsTime);
        
        function trackAdCompletion() {
            const completionData = {
                'mappable_id': sharedMappableId,
                'organization': 'None',
                'beacon': '4686008',
                'event_type': 'ad_completed',
                'time_spent_ms': showAdsTime
            };
            
            sendAdAnalytics(completionData);
        }
        
        async function sendAdAnalytics(data) {
            const requestUrl = window.location.origin + '/analytics/ad-tracking/';
            // Prioritize hidden input field for CSRF token (more secure than cookie)
            const csrfInput = document.querySelector('[name=csrfmiddlewaretoken]');
            const csrftoken = csrfInput?.value || getCookie('csrftoken');
            
            const headers = {
                "Content-Type": "application/json",
            };
            if (csrftoken) {
                headers["X-CSRFToken"] = csrftoken;
            }
            
            try {
                const response = await fetch(requestUrl, {
                    method: "POST",
                    headers: headers,
                    body: JSON.stringify(data),
                });
                if (!response.ok) {
                    console.error('Analytics send failed, status:', response.status);
                }
            } catch (error) {
                console.error('Fetch request failed:', error);
            }
        }
    </script>

<script>
    const kCountdownDuration = 3;
    const adRoot = document.getElementById('ad-root');
    const adLogoSplash = document.getElementById('ad-logo-splash');

    function Countdown(callback) {
      let counter = kCountdownDuration - 1;

      const interval = setInterval(() => {
        callback(counter);
        if (counter <= 0) {
          clearInterval(interval);
        }
        counter = counter - 1;
      }, 1000);
    }

    function freeAd() {
      const overlay = document.createElement('div');
      overlay.id = 'ad-overlay';

      const heading = document.createElement('div');
      heading.id = 'ad-heading';
      heading.innerHTML = `<h1>This QR Code is powered by</h1><img src="/static/images/polo_logo_v2.png" alt="The QR Code Generator" />`

      const circle = document.createElement('div');
      circle.id = 'ad-circle';
      circle.textContent = `${kCountdownDuration}`;

      const message = document.createElement('div');
      message.innerHTML = `<div>This QR Code was created with a free account on <a href="https://www.the-qrcode-generator.com?utm_source=qr_serve&amp;utm_campaign=free_banner">www.the-qrcode-generator.com</a><br/><br/>Upgrade to remove this ad.</div>`;

      overlay.appendChild(heading);
      overlay.appendChild(circle);
      overlay.appendChild(message);
      adRoot.appendChild(overlay);

      Countdown((count) => {
        circle.textContent = count;
        if (count <= 0) {
          if(adRoot) {
            adRoot.removeChild(overlay);
            adRoot.style.display = 'none';
          }
        }
      });
    }

    function showLogoSplash() {
      setTimeout(() => {
        if(adLogoSplash) adLogoSplash.style.display = 'none';
        freeAd();
      }, 3000); // Duration of the GIF
    }

    showLogoSplash();
</script>
