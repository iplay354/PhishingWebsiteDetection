				<script type="text/javascript">
	
					function clearInputFields() {
						document.getElementById('loginForm:username').value = '';
						document.getElementById('loginForm:password').value = '';
						document.getElementById('loginForm:usernameEmpresa').value = '';
						document.getElementById('loginForm:usernameUtilizador').value = '';
						document.getElementById('loginForm:passwordEmpresa').value = '';
					}
	
					
					// Restricts input for the given textbox to the given inputFilter.
					function setInputFilter(textbox, inputFilter) {
					  ["input", "keydown", "keyup", "mousedown", "mouseup", "select", "contextmenu", "drop"].forEach(function(event) {
					    textbox.addEventListener(event, function() {
					      if (inputFilter(this.value)) {
					        this.oldValue = this.value;
					        this.oldSelectionStart = this.selectionStart;
					        this.oldSelectionEnd = this.selectionEnd;
					      } else if (this.hasOwnProperty("oldValue")) {
					        this.value = this.oldValue;
					        this.setSelectionRange(this.oldSelectionStart, this.oldSelectionEnd);
					      }
					    });
					  });
					}
					
					setInputFilter(document.getElementById("loginForm:username"), function(value) {
					  return /^\d*$/.test(value);
					});
	
					setInputFilter(document.getElementById("loginForm:password"), function(value) {
						  return /^\d*$/.test(value);
						});
					
					setInputFilter(document.getElementById("loginForm:usernameEmpresa"), function(value) {
						  return /^\d*$/.test(value);
						});
	
					setInputFilter(document.getElementById("loginForm:usernameUtilizador"), function(value) {
							 return /^\d*$/.test(value);
						});
	
					setInputFilter(document.getElementById("loginForm:passwordEmpresa"), function(value) {
						  return /^\d*$/.test(value);
						});
			
					
					function openPage(pageName,elmnt,color) {
						var i, tabcontent, tablinks;
						tabcontent = document.getElementsByClassName("tabcontentlogin");
						for (i = 0; i < tabcontent.length; i++) {
							tabcontent[i].style.display = "none";
						}
						tablinks = document.getElementsByClassName("tablinklogin");
						for (i = 0; i < tablinks.length; i++) {
							tablinks[i].style.backgroundColor = "#cccccc";
							tablinks[i].style.color="#003774";
						}
						document.getElementById(pageName).style.display = "block";
						elmnt.style.backgroundColor = color;
						elmnt.style.color = "#ffffff";
						clearInputFields();
	
						if(pageName == "particulares") {
							document.getElementById('loginForm:username').disabled = false;
							document.getElementById('loginForm:password').disabled = false;						
							document.getElementById('loginForm:usernameEmpresa').disabled = true;
							document.getElementById('loginForm:usernameUtilizador').disabled = true;
							document.getElementById('loginForm:passwordEmpresa').disabled = true;
							document.getElementById('loginForm:username').focus();
							document.getElementById('errorMsgEmpresas').style.display='none';						
						} else {
							document.getElementById('loginForm:username').disabled = true;
							document.getElementById('loginForm:password').disabled = true;
							document.getElementById('loginForm:usernameEmpresa').disabled = false;
							document.getElementById('loginForm:usernameUtilizador').disabled = false;
							document.getElementById('loginForm:passwordEmpresa').disabled = false;
							document.getElementById('loginForm:usernameEmpresa').focus();
							document.getElementById('errorMsgParticulares').style.display='none'; 
						}
					}
	
					{
	 				document.getElementById('loginForm:username').focus();
					}
	
					var isEmpresa = 'false';
					var isParticular = 'false';
					var lastTab = 'Particulares';
					// Get the element with id="defaultOpen" and click on it
					if(lastTab == 'Empresas') {
						document.getElementById("empresa").click();
						if(isEmpresa == 'true')
							document.getElementById("particular").disabled = true;
							document.getElementById("particular").style.pointerEvents = "none";
					} else {
						document.getElementById("particular").click();
						if(isParticular == 'true') {
							document.getElementById("empresa").disabled = true;
							document.getElementById("empresa").style.pointerEvents = "none";
						}
					}					
					
					window.onload = function(e){ 
						var x = document.getElementById("loadingModalPanel");
						var y = document.getElementById("modal_shadow");
						x.style.display = "none";
						y.style.display = "none";
					};
	
					function showLoading() {
						var lastTabValue = document.getElementById('loginForm:usernameEmpresa').disabled ? "Particulares" : "Empresas";
						
						// Set value for whichever hidden input exists
						var lastTabPing = document.getElementById("loginForm:lastTabPing");
						var lastTabIdentity = document.getElementById("loginForm:lastTabIdentity");
						
						if (lastTabPing) {
							lastTabPing.value = lastTabValue;
						}
						if (lastTabIdentity) {
							lastTabIdentity.value = lastTabValue;
						}
	
						var x = document.getElementById("loadingModalPanel");
						var y = document.getElementById("modal_shadow");
						x.style.display = "block";
						y.style.display = "block";
					};
	
							
					document.getElementById("loginForm:cancel").onclick = function() {
	
						var LoginError = 'false';
						if (LoginError == 'true'){
							document.getElementById("errorMsgParticulares").style.display='none';
							document.getElementById("errorMsgEmpresas").style.display='none';
							document.getElementById("particular").disabled = false;
							document.getElementById("particular").style.pointerEvents = null;
							document.getElementById("empresa").disabled = false;
							document.getElementById("empresa").style.pointerEvents = null;
						}
					};
