s.  In the center of the table is a selection of other cards the players can &quot;buy&quot; as they can afford them.  Through their selection of cards to buy, and how they play their hands as they draw them, the players construct their deck on the fly, striving for the most efficient path to the precious victory points by game end.<\/p>\n\n<p><em>Dominion<\/em> is not a Collectible Card Game (CCG), but the play of the game is similar to the construction and play of a CCG deck. The game comes with 500 cards. You select 10 of the 25 Kingdom card types to include in any given play&mdash;leading to immense variety.<\/p>\n\n<p><em>&mdash;user summary<\/em><\/p>\n\n<p><em>Part of the <a class=\"\" href=\"\/wiki\/page\/Dominion_series#\">Dominion series<\/a>.<\/em><\/p>\n\n","wiki":"<p><strong>The Dominion FAQ<\/strong> at BoardGameGeek:<br \/>\n<a class=\"\" href=\"\/wiki\/page\/Dominion_FAQ#\">Dominion FAQ<\/a><\/p>\n\n<p><strong>FAQ with all rules and unpublished rulings<\/strong>:<br \/>\n<a class=\"\" href=\"\/wiki\/page\/Complete_and_All-Encompassing_Dominion_FAQ#\">Complete and All-Encompassing Dominion FAQ<\/a><\/p>\n\n<p><strong><a class=\"\" href=\"\/wiki\/page\/Awards#\">Awards<\/a><\/strong><\/p>\n\n<ul>\n    <li> 2010 <a class=\"\" href=\"\/wiki\/page\/%C3%85rets_Spill#\">\u00c5rets Familiespill<\/a> (Norway), Winner, Family Game of the Year<\/li>\n    <li> 2009 <a class=\"\" href=\"\/wiki\/page\/Gouden_Ludo#\">Gouden Ludo<\/a> Nominee (Flanders\/Belgium)<\/li>\n    <li> 2009 I Mensa HungarIQa T&aacute;rsasj&aacute;t&eacute;kverseny, Legjobb Strat&eacute;giai k&aacute;rtyaj&aacute;t&eacute;k - I Mensa HungarIQa Boardgame competition, Best Strategy cardgame<\/li>\n    <li> 2009 <a class=\"\" href=\"\/wiki\/page\/Japan_Boardgame_Prize#\">Japan Boardgame Prize<\/a>, Game of the Year, Winner<\/li>\n    <li> 2009 <a class=\"\" href=\"\/wiki\/page\/Spiel_der_Herzen#\">Spiel der Herzen<\/a>, Game of the Year<\/li>\n    <li> 2009 <a rel=\"nofollow\" href=\"http:\/\/w
