<!doctype html>
<html lang="en">
    <head>
        <title>Brown University Archived News</title>
        <meta name="author" content="Brown University" />
        <meta name="description" content="Brown University Archived News" />
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" href="/favicon.ico" data-next-head="" />
        <style>
            * {
                padding: 0;
                margin: 0;
                box-sizing: border-box;
            }

            body {
                display: flex;
                flex-direction: column;
                height: 100vh;
                font-size: 16px;
                line-height: 1.25;
                color: #222222;
                font-family: "Times New Roman", Times, serif;
            }

            body header {
                background-color: #ffffff;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 1rem 0;
                width: 100%;
                height: 150px;
                max-width: 1370px;
                margin: 0 auto;
            }

            body header a {
                width: 20%;
                max-width: 180px;
            }

            body header a img {
                width: 100%;
                height: auto;
                margin: 0;
                padding: 0;
            }

            body header a img:hover {
                opacity: 0.75;
            }

            body main {
                margin: auto;
                display: flex;
                align-items: center;
                flex-direction: column;
                justify-content: center;
                padding: 4rem;
            }

            body main h1 {
                text-align: center;
            }

            body main h1 {
                max-width: 30ch;
            }

            body main p {
                margin: 0.25rem 0 2rem 0;
                max-width: 60ch;
            }

            body main a {
                text-decoration: none;
                border-bottom: 1px solid #98a4ae;
                color: #c00404;
            }

            body main a:focus,
            body main a:hover {
                border-bottom-color: #c00404;
                color: #000;
            }

            body footer {
                background-color: #4e3629;
                margin-top: auto;
            }

            body footer div {
                margin: 0 auto;
                width: 100%;
                max-width: 1370px;
                padding: 2rem 0;
                display: flex;
                flex-direction: row;
                flex-wrap: nowrap;
                color: #f8f7f5;
            }

            body footer p {
                width: 100%;
                text-align: center;
            }

            @media screen and (prefers-reduced-motion: no-preference) {
                body main a {
                    text-decoration: none;
                    border-bottom: 1px solid #98a4ae;
                    color: #c00404;
                    -webkit-transition:
                        border 0.25s,
                        color 0.25s,
                        background 0.25s;
                    transition:
                        border 0.25s,
                        color 0.25s,
                        background 0.25s;
                }
            }

            @media only screen and (max-width: 768px) {
                body {
                    font-size: 14px;
                }
                body main {
                    padding: 1rem;
                }
                body main h1 {
                    font-size: 2em;
                }
                body main h2 {
                    font-size: 1.5em;
                }
            }

            @media only screen and (max-width: 500px) {
                body header {
                    padding: 1rem;
                }
                body header a {
                    width: 30%;
                    margin-left: 0;
                }
                body header a img {
                    margin: 0 1rem 0 0;
                    padding: 0 1rem 0 0;
                }
                body main > a {
                    margin: 1rem;
                    font-size: 1rem;
                    padding: 1rem 1rem;
                }
                body main h1 {
                    font-size: 1.5rem;
                }
            }
        </style>
    </head>
    <body>
        <header>
            <a href="https://www.brown.edu"
                ><img
                    src="https://www.brown.edu/themes/custom/brown/static/images/logo.png"
                    alt="Brown University"
            /></a>
        </header>
        <main id="main">
            <h1>Brown University Archived News</h1>
            <p>
                Browse past articles from Academic years
                <a href="/1987-2007"
                    >1987 to 2007
                </a>
                or annual from
                <a href="/2007-2015/2015a.html">2007 to 2015</a>
            </p>
        </main>
        <footer>
            <div>
                <p>Â© Brown University</p>
            </div>
        </footer>
    </body>
</html>
