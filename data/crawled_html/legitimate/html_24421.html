:false,"isTopics":false},{"label":"Life Issues","facets":[{"label":"Hope","isSelected":false,"count":7},{"label":"Prayer","isSelected":false,"count":6},{"label":"Spiritual Growth","isSelected":false,"count":5},{"label":"Fellowship with God","isSelected":false,"count":5},{"label":"Wisdom & Decision Making","isSelected":false,"count":4},{"label":"Reverence for God","isSelected":false,"count":4},{"label":"Relationships","isSelected":false,"count":4},{"label":"Living like Christ","isSelected":false,"count":4},{"label":"Serving Others","isSelected":false,"count":3},{"label":"Spiritual Disciplines (Fasting, etc.)","isSelected":false,"count":2}],"isAuthors":false,"isBibleBooks":false,"isBrands":false,"isContentTypes":false,"isLifeIssues":true,"isTopics":false}],"hasMorePages":true,"totalMatching":129,"totalPages":13,"items":[{"authorName":null,"tags":null,"contentTag":"Discovery Series","dateDisplay":null,"timeDisplay":null,"iconStyle":"discovery-series","image":{"imageType":"Image","imageAlt":"","aspectRatio":null,"url":"/contentassets/c4983dbc4aa844669248da0d0d830fca/hp075_m.jpg"},"title":"The Ordinary Life of Jesus","description":"Do you believe in Jesus? Often we mean we believe in Jesus’s divinity: his eternality, his miracles, his resurrection, his sovereignty over history and the universe, and the rest of his awe-inspiring attributes. But do we also believe in Jesus’s humanity? In this booklet excerpted from Ryan Lokkesmoe’s book Jesus Was Human Too: Seeing the Son of God in Life’s Everyday Moments, dive deep into the significance of the ordinary human experiences of the Son of God. Discover what it means for your everyday life as you follow Jesus who was human too. ","url":"/en/discovery-series/the-ordinary-life-of-jesus/the-ordinary-life-of-jesus-introduction","videoUrl":null,"length":null},{"authorName":null,"tags":null,"contentTag":"Discovery Series","dateDisplay":null,"timeDisplay":null,"iconStyle":"discovery-series","image":{"imageType":"Image","imageAlt":"","aspectRatio":null,"url":"/contentassets/09e53909578d4ad0b23e6e9f62882390/q0775_m.jpg"},"title":"Noah Hope in the Waters of Remaking","description":"Noah and his ark is one of the most well-known stories in the Bible. From flannel graphs to cartoons to beautiful depictions on stage, it’s a dearly loved part of Scripture. But it’s also easy to miss why God dismantled the world he once called “very good.” How did things end up like they did? And how did the flood and Noah’s boat solve it? In this booklet, discover the role that the flood plays both in the story of Genesis and in God’s work to fix the world that was broken. ","url":"/en/discovery-series/noah-hope-in-the-waters-of-remaking/introduction-noah","videoUrl":null,"length":null},{"authorName":"Kelley Mathews","tags":null,"contentTag":"Discovery Series","dateDisplay":"10/15/25","timeDisplay":null,"iconStyle":"discovery-series","image":{"imageType":"Image","imageAlt":"","aspectRatio":null,"url":"/siteassets/discovery-series/q0761_m.jpg"},"title":"More than a Mother: Lessons From The Life Of The First Disciple","description":"In this booklet, join Kelley Mathews as she investigates the story of Mary down through the corridors of history. Discover what the early church thought and taught about Jesus’s mother and dig into the witness of the Bible itself to learn more about the first disciple of the Christ.  ","url":"/en/discovery-series/more-than-a-mother/lessons-from-the-life-of-the-first-disciple","videoUrl":null,"length":null},{"authorName":"Joseph R. Dodson","tags":null,"contentTag":"Discovery Series","dateDisplay":"09/24/25","timeDisplay":null,"iconStyle":"discovery-series","image":{"imageType":"Image","imageAlt":"","aspectRatio":null,"url":"/siteassets/discovery-series/q0411_m.jpg"},"title":"Joy to the Full: Jesus's First Miracle And The Hope Of New Creation","description":"Jesus didn’t come reinforce old ways of living and worshipping his Father. Jesus came to inaugurate the new kingdom creation where humanity could live in right relationship with their creator and experience the fullness of his kindness and joy. In this booklet, pastor and scholar Joseph Dodson dives into Jesus’s first miracle turning water into wine. Discover the hope of a new creation heralded by a miraculous solution to a wedding’s tragic problem. And then uncover the hope Jesus’s promise that he came to give his people true and lasting joy. ","url":"/en/discovery-series/joy-to-the-full/joy-to-the-full-introduction","videoUrl":null,"length":null},{"authorName":"Kurt DeHaan","tags":null,"contentTag":"Discovery Series","dateDisplay":"09/02/25","timeDisplay":null,"iconStyle":"discovery-series","image":{"imageType":"Image","imageAlt":"","aspectRatio":null,"url":"/siteassets/discovery-series/q0708_m.jpg"},"title":"Finding True Satisfaction in Our Work","description":"“Work willingly at whatever you do, as though you were working for the Lord rather than for people. Remember that the Lord will give you an inheritance as your reward, and that the Master you are serving is Christ.” —Colossians 3:23-24 (NLT) With God, work does not have to be a burden. This Discovery Series booklet from author Kurt DeHaan will help you learn what it looks like to give God your stresses and go to work for Him every single day. ","url":"/en/discovery-series/finding-true-satisfaction-in-our-work/introduction-finding-true-satisfaction-in-our-work","videoUrl":null,"length":null},{"authorName":"Evan Parks","tags":null,"contentTag":"Discovery Series","dateDisplay":"07/31/25","timeDisplay":null,"iconStyle":"discovery-series","image":{"imageType":"Image","imageAlt":"","aspectRatio":null,"url":"/contentassets/676349e4d53542a9be8546afb296eedc/q0755_m.jpg"},"title":"Get Unstuck","description":"“When we become a new creation in Christ, our behavior, attitudes, desires, and thinking need to change to match our new identity as Christ's followers.” —Dr. Evan Parks. In Christ, we are made new. Yet the highs and lows of life still cause us to experience big feelings—anxiety being one of them. In this Discovery Series booklet from Our Daily Bread Ministries, psychologist Dr. Evan Parks offers tangible steps that you can take to get through overwhelming emotions with the restoration power of Christ’s love.  \n\n ","url":"/en/discovery-series/get-unstuck/three-biblical-steps-for-overcoming-anxiety","videoUrl":null,"length":null},{"authorName":null,"tags":null,"contentTag":"Discovery Series","dateDisplay":"06/24/25","timeDisplay":null,"iconStyle":"discovery-series","image":{"imageType":"Image","imageAlt":"","aspectRatio":null,"url":"/siteassets/discovery-series/q0535_m.jpg"},"title":"Encounter God in Exodus: The One Who Is Present ","description":"The picture of God that emerges from Exodus is complex. Join Carmen Joy Imes in uncovering the second book of the Bible’s unique picture of the God who conquered Egypt to rescue his people. The same God who revealed himself to Moses and mercifully rescued Israel from oppression invited them into intimate relationship with himself and provided for their needs in the wilderness. In return, Yahweh demands their allegiance and requires them to treat others well. Their mission is to represent Yahweh well among the nations. Yahweh promises to live among them. If they fail, they experience similar forms of punishment to the Egyptians. ","url":"/en/discovery-series/encounter-god-in-exodus-the-one-who-is-present/the-god-who-rescues","videoUrl":null,"length":null},{"authorName":null,"tags":null,"contentTag":"Discovery Series","dateDisplay":"06/23/25","timeDisplay":null,"iconStyle":"discovery-series","image":null,"title":null,"description":null,"url":"/en/discovery-series/knowing-god-through-galatians/knowing-god-through-galatians","videoUrl":null,"length":null},{"authorName":"J. Scott Duvall","tags":null,"contentTag":"Discovery Series","dateDisplay":"06/23/25","timeDisplay":null,"iconStyle":"discovery-series","image":{"imageType":"Image","imageAlt":"","aspectRatio":null,"ur
