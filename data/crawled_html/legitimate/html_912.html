    const CONNECTION_PARAM_NAME = 'connection';

    const extAuthorizeURL = 'https@3A@2F@2Fauth.chatwork.com@2Fauthorize@3Fclient_id@3DQkyy7b2eDJaBtkYh78liXUlQcxWmJ5aV@26scope@3Dopenid@2520email@2520offline_access@26state@3Db95a03fabb328f72aff9be3802668d2e@26nonce@3Da14f3e30319ea9c570105a469783e338@26response_mode@3Dquery@26audience@3Dhttps@253A@252F@252Fwww.chatwork.com@252F@26redirect_uri@3Dhttps@253A@252F@252Fwww.chatwork.com@252Fpackages@252Fauth0@252Fcallback.php@26response_type@3Dcode';

    const authorizeURL = new URL(decodeURIComponent(extAuthorizeURL.replace(/@/g, '%')).replace(/@/g, '%'));

    const ulpField = document.querySelector('#email-connection-authorize-link-container');
    if (ulpField) {
      const emailSigninButton = document.getElementById('email-signin-button');
      const emailAuthorizeURL = new URL(authorizeURL.toString());
      emailAuthorizeURL.searchParams.delete(CONNECTION_PARAM_NAME);

      emailSigninButton.addEventListener('click', function() {
        let domain = window.location.hostname;

        domainParts.shift();
        domain = domainParts.join('.');
        document.cookie = 'last-connection=email; Secure; Path=/; Domain=' + domain + '; SameSite=Lax; Max-Age=' + (365 * 24 * 60 * 60);

<script>
  (function () {
    // Determine event prefix based on connection type
    const isEmailConnection = 'password' === 'email';
    const eventPrefix = isEmailConnection ? 'email_login_' : 'login_';
    
    const [key, value] = location.hash
      .substring(1) // remove #
      .split('=');

    if (key === 'error_code') {
      TD.trackEvent(eventPrefix + 'failure');
      
      if (value === 'gora_login_failure') {
        TD.trackEvent(eventPrefix + 'gora_login_failure');
      }
    } else {
      TD.trackEvent(eventPrefix + 'open');
    }
    
    const emailError = document.querySelector('#error-element-username');
    if (emailError) {
      TD.trackEvent(eventPrefix + 'warning_email');
    }
    
    const helpLinkAnchor = document.querySelector('.help-link');
    if (helpLinkAnchor) {
      helpLinkAnchor.addEventListener('click', _ev => TD.trackEvent(eventPrefix + 'click_help_link'));
    }
    
    const googleButton = document.querySelector('button[data-provider="google"]');
    if (googleButton) {
      googleButton.addEventListener('click', _ev => TD.trackEvent(eventPrefix + 'click_google'));
    }
    
    const appleButton = document.querySelector('button[data-provider="apple"]');
    if (appleButton) {
      appleButton.addEventListener('click', _ev => TD.trackEvent(eventPrefix + 'click_apple'));
    }
  })();
</script>
