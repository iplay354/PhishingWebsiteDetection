            <P><b><font size="4"><a name="Walter"></a>Walter Lantz</font></b><font size="4"> was born Walter Benjamin Lantz on April 27, 1899 in New Rochelle, New 

York into a family of Italian immigrants, his parents being 

Francesco Paolo Lantz (formerly Lanza) and Maria Gervasi (later Jarvis), the 

latter coming from Calitri, Italy.  

Lantz was interested in art at an early age, completing a mail order drawing class 

at age twelve. He got his first taste of animation when he watched Winsor 

McCays cartoon short, Gertie the 

Dinosaur. This, perhaps, inspired him to become a cartoonist himself..</font></P>

        </td>

        <td width="33%">



            <p align="center"><a href="javascript:na_open_window('win', 'images/Walter_Lantz/Walter-Lantz-with-Dr-Mett.jpg', 0, 0, 600, 600, 0, 0, 0, 1, 0)" target="_self"><span style="font-size:12pt;"><img src="images/Walter_Lantz/Walter-Lantz-with-Dr-Mett.jpg" width="200" height="246" border="0" alt="Walter Lantz and Dr Bill Mett"></span></a><span style="font-size:12pt;"><br></span><font size="4">Walter Lantz with Dr. Mett<br>The painting <br>&quot;</font><a href="javascript:na_open_window('win', 'images/Walter_Lantz/A-Portrait-of-Woody-Woodpecker-by-Walter-Lantz.jpg', 0, 0, 500, 600, 0, 0, 0, 0, 0)" target="_self"><b><font size="4">A Portrait of Woody Woodpecker</font></b></a><font size="4">&quot;<br> is in the background.</font></p>

            <P align="left"><font size="4">While working as an auto mechanic, Walter Lantz got his first break in the art 

world. A well-to-do customer, Fred Kafka, liked his drawings on the garage's 

bulletin board. He bankrolled his studies at New York City's Art Students 

League. Kafka also helped him get a job in town, as a copy boy at the New York American, 

owned by William Randolph 

Hearst. When he had completed his day's work at the newspaper office, he 

attended art school.</font></P>

            <P align="left"><font size="4">By the time he was sixteen, Lantz was working behind the camera in the 

animation department under the supervision of director Gregory La Cava. Lantz 

then began work at the John R. Bray Studios in 

New York on 

the Jerry On The Job series. In 1924, Lantz began to rise to prominence 

at the studio and directed, animated, and even starred in his first cartoon 

series, Dinky Doodle. By 1927 he moved to Hollywood, 

California where he worked briefly for director Frank Capra and then was a 

gag writer for Mack 

Sennett comedies.</font></P>

    <tr>

        <td width="794" align="center" valign="top" colspan="3">

            <P align="left"><font size="4">In 1928, Lantz was hired by Charles B. Mintz as a 

director on the Oswald the Lucky 

Rabbit cartoon series for Universal. Earlier that year, Mintz and his 

brother-in-law George 

Winkler had succeeded in snatching Oswald from the character's original 

creator, Walt Disney. Universal 

president Carl Laemmle became 

dissatisfied with the Mintz-Winkler product and fired them, deciding instead to 

produce the Oswalds directly on the Universal lot. While schmoozing with 

Laemmle, Lantz wagered a bet that if he could beat the producer in a game of 

poker that the character would be his. As fate would have it, Lantz successfully 

won the bet and Oswald was now his character.<br></font></P>

            <hr>        </td>

    </tr>

    <tr>

        <td width="179" align="center" valign="top"><a href="javascript:na_open_window('win', 'images/Walter_Lantz/Walter-Lantz-painting-Triple-Self-portrait.jpg', 0, 0, 600, 500, 0, 0, 0, 0, 0)" target="_self"><img src="images/Walter_Lantz/Walter-Lantz-painting-Triple-Self-portrait.jpg" width="200" height="190" border="0" alt='Walter Lantz Painting "Triple Self Portrait"'><br></a><b>Walter Lantz<br><span style="font-size:12pt;">Highlighting Woody Woodpecker's<br><a href="javascript:na_open_window('win', 'images/Walter_Lantz/Triple-Self-Portrait-by-Walter-Lantz.jpg', 0, 0, 600, 500, 0, 0, 0, 1, 0)" target="_self">Triple Self Portrait</a></span></b></td>

        <td width="288" align="center" valign="top"><a href="javascript:na_open_window('win', 'images/Walter_Lantz/Triple-Self-Portrait-by-Walter-Lantz.jpg', 0, 0, 725, 500, 0, 0, 0, 1, 0)" target="_self"><b><i><img src="images/Walter_Lantz/Triple-Self-Portrait-by-Walter-Lantz_sm.jpg" width="200" height="160" border="0" alt="Triple Self Portrait of Woody Woodpecker by Walter Lantz"><br></i><span style="font-size:12pt;">Triple Self Portrait<br>of Woody Woodpecker</span></b></a><br><b><span style="font-size:12pt;">16x20 Oilgraph Highlighted and Signed <br>by Walter Lantz</span></b></td>

        <td width="315" align="center" valign="middle">

            <p align="left"><font size="4">The &quot;Triple Self Portrait&quot; of Woody Woodpecker is one of Walter Lantz'z most popular paintings.</font></p>

            <p align="left"><font size="4">Mr. Lantz took his inspiration for this piece from Norman Rockwell's famous </font><b><a href="javascript:na_open_window('win', 'images/Norman_Rockwell/Triple_Self_Portrait_lg.jpg', 0, 0, 500, 500, 0, 0, 0, 0, 0)" target="_self"><font size="4">&quot;Triple Self Portrait&quot;</font></a></b><font size="4">, which is also available through Art Corporation of America.</font></p>

        </td>

    </tr>

    <tr>

        <td width="794" align="center" valign="top" colspan="3">            <hr>            <P align="left"><font size="4">As Walter Lantz began assembling a new studio, he decided to select a fellow New 

York animator, Bill 

Nolan, to help develop the series. Nolan's previous credentials included 

inventing the panorama background and developing a new, streamlined Felix 

the Cat. Nolan was (and still is) probably best known for perfecting the 

&quot;rubber hose&quot; style of animation. In September 1929, Lantz finally put out his 

first cartoon, Race Riot.</font></P>

            <P align="left"><font size="4">By 1935, Walter Lantz had managed to become an independent producer, supplying 

cartoons to Universal instead of merely overseeing the animation department. By 

1940, he was negotiating ownership for the characters he had been working 

with.</font></P>

        </td>

    </tr>

    <tr>

        <td width="794" height="187" align="center" valign="top" colspan="3">

            <P align="left"><font size="4">When Oswald had worn out his welcome, Lantz decided that he needed a new 

character. Meany, 

Miny, and Moe, Baby-Face 

Mouse, and Snuffy 

Skunk were only a few of the personalities Lantz and his staff had come up 

with. However, one character, Andy Panda, stood out from 

the rest and soon became Lantz's headline star for the 1939-1940 production 

season.</font></P>

            <P align="left"><font size="4">In 1940 Lantz had married actress Grace Stafford. During 

their honeymoon, the couple kept hearing a woodpecker incessantly pecking on 

their roof. Gracie suggested that Walter use the bird for inspiration and make 

him into a cartoon character. Taking her advice, though a bit skeptical about 

its success, Lantz debuted Woody Woodpecker as a 

side star in an animation short called Knock 

Knock featuring Andy Panda.</font></P>

        </td>

    </tr>

    <tr>

        <td width="794" height="87" align="center" valign="top" colspan="3">

            <P align="left"><font size="4">Mel 

Blanc supplied Woody's voice for his first three cartoons. When Blanc 

accepted a full-time contract with Leon 

Schlesinger Productions/Warner Bros. and left the 

Lantz studio, gagman Ben Hardaway, who was the 

main force responsible for Knock Knock, became the bird's voice. Despite 

this, however, Blanc's distinctive laugh was still used throughout the 

cartoons.</font></P>

        </td>

    </tr>

    <tr>

    <tr>

        <td width="794" height="210" align="center" valign="middle" colspan="3">

            <P align="left"><font size="4">During 1948, the Lantz studio had a hit Academy Award-nominated 

tune in The Woody Woodpecker Song, featuring Blancs laugh. Mel Blanc sued 

Lantz for half a million dollars, claiming that Lantz had used his voice in 

various later cartoons without his permission. </font></P>

            <p align="left"><font size="4">&nbsp;The judge, however, ruled against 

Blanc, saying that he had failed to copyright his voice or contributions. Even 

though Lantz had won the case, he paid Blanc the money in an out-of-court 

settlement when Blanc filed an appeal, and went off to search for a new voice 

for Woody Woodpecker.</font>        </td>

    </tr>

    <tr>

        <td width="794" height="139" align="center" valign="top" colspan="3">

            <P align="left"><font size="4">In 1950, Lantz held anonymous auditions. Gracie, Lantz's wife, had offered to 

do Woody's voice; however, Lantz turned her down because Woody was a male 

character. Not discouraged in the least, Gracie went about secretly making her 

own anonymous audition tape, and submitted it with the others for the studio to 

listen to. Not knowing whose voice was being heard, Lantz picked Gracies voice 

to do Woody Woodpecker. Gracie supplied Woodys voice until Lantz finally 

stopped making new cartoons for Woody Woodpecker. At 

first Gracie had chosen to voice Woody with no screen credit because she thought 

that it would disappoint the children to know Woody Woodpecker was voiced by a 

woman. However, she soon came to enjoy being known as the voice of Woody 

Woodpecker, and allowed her name to be put on the credit screen.</font></P>

        </td>

    </tr>

    <tr>

        <td width="794" height="139" align="center" valign="top" colspan="3">

                    </td>

                    <td width="50%">



                        <p align="center"><a href="javascript:na_open_window('win', 'images/Walter_Lantz/Walter-Lantz-Sketch.jpg', 0, 0, 600, 600, 0, 0, 0, 1, 0)" target="_self"><b><i><img src="images/Walter_Lantz/Walter-Lantz-Sketch.jpg" width="200" height="186" border="0" alt="Original Sketch by Walter Lantz"><br></i><span style="font-size:12pt;">Original Sketch of Andy Panda</span></b></a><br><span style="font-size:12pt;"><b>by Walter Lantz</b></span></p>

                    </td>

                </tr>

            </table>

        </td>

    </tr>

    <tr>

        <td width="794" height="139" align="center" valign="top" colspan="3">

            <P align="left"><font size="4">The baby boomer generation came 

to know and love Lantz as the creator of the Woody Woodpecker 

cartoons. He used his TV appearances to show how the animation was actually 

done. For many of those young viewers, it was the first time they had seen an 

explanation of the process. That same generation later knew him for entertaining 

the troops during the Vietnam War and visiting 

hospitalized veterans.</font></P>

            <P align="left"><font size="4">Walter Lantz's studio closed in 1972. It had been the last remaining 

classical cartoon studio. In his retirement, Lantz continued to manage his 

studios properties by offering re-releases of cartoons and sales to new venues. 

He also continued to draw and paint, selling his paintings of Woody Woodpecker 

rapidly. On top of that, he worked with Little League and other 

youth groups around his area. In 1982, Lantz donated seventeen artifacts to the 

Smithsonian Institution's National Museum of American History, among 

them a wooden model of Woody Woodpecker from the cartoon characters debut in 

1941.</font></P>

            <P align="left"><font size="4">In 1993, Lantz established a ten thousand dollar scholarship and prize for 

animators in his name at California 

Institute of the Arts in Valencia. Walter 

Lantz died at St. Joseph Medical Center in Burbank, California 

of heart failure on March 22, 1994, aged 94.</font></P>

        </td>

    </tr>
