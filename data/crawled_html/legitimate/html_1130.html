<!-- url: https://www.vlive.tv
status: 200 -->
<!DOCTYPE html>
<html lang="en_US" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <link rel="icon" href="favicon.ico?2023013112" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1">
    <title>VLIVE is now a part of Weverse</title>
    <style>
        @font-face {
            font-family: Pretendard;
            font-weight: 700;
            font-display: swap;
            src: url(https://ssl.pstatic.net/static/wevweb/assets/fonts/pretendard/woff2-subset/Pretendard-Bold.subset.woff2)
            format('woff2');
        }

        @font-face {
            font-family: Pretendard;
            font-weight: 500;
            font-display: swap;
            src: url(https://ssl.pstatic.net/static/wevweb/assets/fonts/pretendard/woff2-subset/Pretendard-Medium.subset.woff2)
            format('woff2');
        }

        @font-face {
            font-family: Pretendard;
            font-weight: 400;
            font-display: swap;
            src: url(https://ssl.pstatic.net/static/wevweb/assets/fonts/pretendard/woff2-subset/Pretendard-Regular.subset.woff2)
            format('woff2');
        }

        body,
        p,
        h1,
        ul,
        li,
        button {
            padding: 0;
            margin: 0;
        }

        html {
            -webkit-text-size-adjust: none;
        }

        body,
        button {
            font-family: Pretendard, -apple-system, BlinkMacSystemFont, Helvetica, Arial, Dotum, sans-serif;
            font-size: 13px;
        }

        ul,
        li {
            list-style: none;
        }

        a {
            color: inherit;
        }

        a,
        a:hover,
        a:active,
        a:focus {
            text-decoration: none;
            cursor: pointer;
        }

        button {
            background: transparent;
            color: inherit;
            cursor: pointer;
            border: 0;
            vertical-align: top;
        }

        button:disabled {
            cursor: default;
        }

        img {
            max-width: 100%;
            border: 0;
            vertical-align: top;
        }

        html,
        body {
            height: 100%;
        }

        #wrap {
            display: flex;
            flex-direction: column;
            min-height: 100%;
        }

        .language_selection {
            position: absolute;
            right: 18px;
            top: 18px;
        }

        .language_selection .button_language {
            display: flex;
            align-items: center;
            column-gap: 4px;
            padding: 12px;
            line-height: 22px;
            font-weight: 500;
            font-size: 16px;
            color: #000;
        }

        .language_selection .button_language::after {
            content: '';
            width: 12px;
            height: 12px;
            background: url(img/icon_language_selection_arrow.png) no-repeat 0 0;
            background-size: contain;
            vertical-align: top;
        }

        .language_selection .language_list {
            position: absolute;
            top: 100%;
            right: 12px;
            width: 150px;
            padding: 6px;
            box-sizing: border-box;
            border-radius: 8px;
            box-shadow: 0 0 4px rgba(0, 0, 0, 0.1), 0 5px 10px rgba(0, 0, 0, 0.1);
            background-color: #fff;
        }

        .language_selection .language_list .option {
            width: 100%;
            padding: 9px;
            line-height: 22px;
            border-radius: 6px;
            font-weight: 500;
            font-size: 14px;
            text-align: left;
            color: #444;
        }

        .language_selection .language_list .option[aria-selected=true] {
            font-weight: 700;
            color: #08ccca;
        }

        .language_selection .language_list .option:hover {
            background-color: #f7f7fa;
        }

        .container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            width: 1160px;
            max-width: 100%;
            margin: 0 auto;
            padding: 118px 30px 40px;
            box-sizing: border-box;
            color: #000;
        }

        .title {
            text-align: center;
        }

        .description {
            padding-top: 30px;
            line-height: 30px;
            font-size: 18px;
            text-align: center;
        }

        .link_query_box {
            display: flex;
            justify-content: center;
            column-gap: 30px;
            padding: 70px 0 90px;
        }

        .link_query {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 347px;
            height: 140px;
            padding: 0 30px;
            box-sizing: border-box;
            border-radius: 14px;
            background-color: #f7f7fa;
        }

        .link_query_box .text {
            line-height: 22px;
            font-weight: 500;
            font-size: 16px;
            color: #222;
        }

        .link_query_box .text::after {
            content: '';
            display: inline-block;
            width: 6px;
            height: 13px;
            margin-left: 6px;
            background: url(img/link_query_arrow.png) no-repeat 0 0;
            background-size: contain;
            vertical-align: -1px;
        }

        .link_weverse {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            width: 232px;
            height: 50px;
            border-radius: 8px;
            line-height: 19px;
            background: linear-gradient(135deg, #08ccca 0%, #18e79c 100%);
            font-weight: 700;
            font-size: 16px;
            color: #fff;
        }

        .link_weverse:hover {
            background: linear-gradient(0deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.2)), linear-gradient(135deg, #0ed5bc 0%, #14e0a9 100%);
        }

        @media (max-width: 1024px) {
            .language_selection {
                top: 8px;
                right: 8px;
            }

            .container {
                padding: 60px 30px 30px;
            }

            .title img {
                max-width: 324.8px;
                width: 100%;
                height: auto;
            }

            .description {
                padding-top: 19px;
                line-height: 28px;
                font-size: 17px;
            }

            .link_query_box {
                flex-direction: column;
                gap: 10px;
                padding: 40px 0 50px;
            }

            .link_query {
                width: 100%;
                height: 90px;
            }

            .link_weverse {
                margin-top: auto;
                width: 100%;
            }
        }
    </style>
    <script type="text/javascript" src="./js/script.js"></script>
</head>
<body>
<div id="wrap">
    <div class="language_selection">
        <!-- [D] 언어 선택 목록이 열릴 때 aria-expanded 값을 true 로 변경해 주세요. -->
        <button type="button" class="button_language" aria-expanded="true" aria-haspopup="listbox" aria-label="language selection">한국어</button>
        <ul class="language_list" role="listbox" style="display: none;">
            <li class="item" role="presentation">
                <!-- [D] 선택된 언어 button.option 의 aria-selected 값을 true 로 변경해 주세요. -->
                <button type="button" class="option" role="option" aria-selected="false" data-language="ko">한국어</button>
            </li>
            <li class="item" role="presentation">
                <button type="button" class="option" role="option" aria-selected="false" data-language="en">English</button>
            </li>
            <li class="item" role="presentation">
                <button type="button" class="option" role="option" aria-selected="false" data-language="ja">日本語</button>
            </li>
        </ul>
    </div>
    <div class="container">
        <h1 class="title"><img src="img/vsunset_title_image.png" width="406" height="196" alt="VLIVE is now a part of Weverse" /></h1>
        <p class="description">V LIVE is unified with Weverse on <strong>January 1, 2023 (KST)</strong>.<br />We'll do our best to keep improving on Weverse.<br />See you on there!</p>
        <div class="link_query_box">
            <a href="/notice" class="link_query">
                <span class="text">V LIVE Unification Notice</span>
            </a>
            <a href="/refund" class="link_query">
                <span class="text">Request Refund</span>
            </a>
        </div>
        <a href="https://weverseapp.page.link/?apn=co.benx.weverse&ibi=co.benx.weverse&isi=1456559188&ius=weverse&link=https%3A%2F%2Fweverse.io%2F" class="link_weverse">Explore Weverse!</a>
    </div>
</div>
</body>
</html>
