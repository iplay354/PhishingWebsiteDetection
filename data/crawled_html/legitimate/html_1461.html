    <style>
    html, body {
        font-size: 13px;
        font-family: Helvetica,Arial,Roboto,sans-serif;
        line-height: 1.5;
        color: #444;
        background-color: #f2f5f7;
        position: relative;
        margin: 0;
        padding: 0;
        height: 100%;
    }

    .footer {
        padding-top: 20px;
        position: absolute;
        z-index: 5;
        background-color: #f2f5f7;
        bottom: 0;
        width: 100%;
    }

    .page-header .header-container {
        position: relative;
        background-color: #f2f5f7;
    }

    .page-header .header-container > .wrapper {
        display: -webkit-box;
        display: -ms-flexbox;
        display: flex;
        height: 70px;
        position: relative;
        align-items: center;
    }

    .main-content {
        padding-bottom: 60px;
    }

    .page-header .header-container .header-logo {
        width: 220px;
    }

    .ceneo-logo {
        height: 53px;
        display: inline-block;
        vertical-align: top;
        position: relative;
        width: 116px;
        margin: 0px 10px;
    }

    .copyright {
        margin-top: 1.5em;
        text-align: center;
        background: rgba(0,0,0,.1);
    }

    .copyright .wrapper {
        padding-top: .75em;
        padding-bottom: .75em;
        position: relative;
    }

    a:active, a:hover {
        outline: 0;
    }

    a:hover {
        color: #0071c5;
    }

    a {
        -webkit-transition: color .3s;
        -moz-transition: color .3s;
        -o-transition: color .3s;
        transition: color .3s;
        text-decoration: none;
        color: #444;
    }

    .layout_container {
        min-height: 100%;
        position: relative;
    }

    .btn {
        margin: 0;
        display: inline-block;
        padding: 5px 14px;
        margin-bottom: 0;
        font-size: 13px;
        line-height: 19px;
        text-align: center;
        border-radius: 3px;
        vertical-align: middle;
        cursor: pointer;
        -webkit-appearance: button;
        font-family: sans-serif;
        color: #fff;
        border: 0;
        border-color: rgba(0,0,0,.1) rgba(0,0,0,.1) rgba(0,0,0,.25);
        background-color: #0071c5;
    }

    .captcha-bot {
        position: relative;
        width: 352px;
        margin: 10px auto;
        text-align: center;
    }

    @media (max-width: 960px) {
        #bot {
            display: none;
        }
    }
    
    .card-form {
        box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.24);
        padding: 10px 25px!important;
        box-sizing: border-box;
        background-color: #fdfdfd;
    }

    form {
        margin: 0;
    }

    #bot {
        position: absolute;
        right: -72px;
        top: 0;
        content: '';
        width: 90px;
        height: 155px;
    }

    .card-form .col .col-wide {
        width: 100%;
    }
    .captcha-bot .col-wide {
        text-align: right;
        margin: 15px 0;
    }
    .field-validation-error {
        margin-bottom: .375em;
        display: block;
        border: 0;
        color: #e71226
    }

    </style>
</head>

<script type="text/javascript">
    function successChallengeCallback(token) {
        var form = document.getElementById("turnstileChallenge");
        form.elements["client-side-errors"].value = "";
        form.submit();
    }
    function errorChallengeCallback(errorCode) {
        var form = document.getElementById("turnstileChallenge");
        form.elements["client-side-errors"].value = errorCode;
    }
</script>

    </div>
</form>
