  const params = new URLSearchParams(window.location.search);
  const origUrl = (params.get("url") || "/") + "?human=1";

  const btn = document.getElementById("continueBtn");

  // 5) Auto-redirect after 3 seconds
  setTimeout(() => {
    window.location.href = origUrl;
