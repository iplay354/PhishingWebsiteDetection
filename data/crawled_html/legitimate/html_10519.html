 to longer stories anyway - it is time to stretch your borders. You've heard of far-off places - exotic countries, where they have pancakes but not waffles, where the people wear the wrong number of shirts, and don't even have a word for the look two people give each other when they each hope that the other will do something that they both want done but which neither of them wants to do. It is to these lands that you now turn your gaze.<\/p>\n\n<p><em><strong>Dominion: Hinterlands<\/strong><\/em> is the sixth addition to the game of <em>Dominion<\/em>. It adds 26 new Kingdom cards to Dominion, including 20 Actions, 3 Treasures, 3 Victory cards, and 3 Reactions. The central theme is cards that do something immediately when you buy them or gain them.<\/p>\n\n<p><em>Part of the <a class=\"\" href=\"\/wiki\/page\/Dominion_series#\">Dominion series<\/a>.<\/em><\/p>\n\n","wiki":"<p><strong>FAQ with all Dominion rules and unpublished rulings<\/strong>:<br \/>\n<a class=\"\" href=\"\/wiki\/page\/Complete_and_All-Encompassing_Dominion_FAQ#\">Complete and All-Encompassing Dominion FAQ<\/a><\/p>\n\n<p><strong><a class=\"\" href=\"\/wiki\/page\/Microbadges#\">Microbadges<\/a><\/strong><\/p>\n\n<p><a href=\"\/microbadge\/23280\"><img alt='Microbadge: Dominion: Hinterlands fan' onmouseover=\"return overlib('Dominion: Hinterlands fan', WRAP );\" onmouseout=\"return nd();\" title=''class='mbimg'loading=\"lazy\"src=\"https:\/\/cf.geekdo-static.com\/mbs\/mb_23280_1.png\"><\/a> <a rel=\"nofollow\" href=\"http:\/\/www.boardgamegeek.com\/microbadge\/23280\" onclick=\"window.open(this.href, '_blank'); return false;\">Dominion: Hinterlands fan<\/a><br \/>\n<a href=\"\/microbadge\/14376\"><img alt='Microbadge: I play Dominion with all the expansions mixed in.' onmouseover=\"return overlib('I play Dominion with all the expansions mixed in.', WRAP );\" onmouseout=\"return nd();\" title=''class='mbimg'loading=\"lazy\"src=\"https:\/\/cf.geekdo-static.com\/mbs\/mb_14376_0.png\"><\/a> I play Dominion with all the expansions mixed in.<\/p>\n\n<strong>Components (Rio Grande Games standard edition):<\/strong><br \/>\n<ul>\n    <li>300 Cards:<ul>\n        <li> 266 Kingdom Cards <ul>\n            <li>10 each of Border Village, Cache, Cartographer, Crossroads, Develop, Duchess, Embassy, Fool&rsquo;s Gold, Haggler, Highway, Ill-Gotten Gains, Inn, Jack Of All Trades, Mandarin, Margrave, Noble Brigand, Nomad Camp, Oasis, Oracle, Scheme, Spice Merchant, Stables, Trader<\/li>\n            <li>12 each of Farmland, Silk Road, Tunnel<\/li>\n        <\/ul><\/li>\n        <li>26 Place holder cards<\/li>\n        <li>8 Blank Cards<\/li>\n    <\/ul><\/li>\n    <li> Storage Tray<\/li>\n    <li> Rulebook<\/li>\n<\/ul>\n\n<p><strong><a class=\"wikilink_new\" href=\"\/wiki\/page\/Card_Search_Engine\">Card Search Engine<\/a><\/strong><\/p>\n\n<ul>\n    <li> <a rel=\"nofollow\" href=\"http:\/\/deckengine.info\/\" onclick=\"window.open(this.href, '_blank'); return false;\">deckengine.info<\/a><\/li>\n<\/ul>\n\n","website":{"url":false},"imageid":"1077695","images":{"thumb":"https:\/\/cf.geekdo-images.com\/J6mcvuL1AbP3n5B-hqH3ng__small\/img\/Ti_hqI1AdEMzsCHHW3xVVB3PEz0=\/fit-in\/200x150\/filters:strip_icc()\/pic1077695.jpg","micro":"https:\/\/cf.geekdo-images.com\/J6mcvuL1AbP3n5B-hqH3ng__micro\/img\/XG5kZP5WZNvH1fXqcW2Ti9W711k=\/fit-in\/64x64\/filters:strip_icc()\/pic1077695.jpg","square":"https:\/\/cf.geekdo-images.com\/J6mcvuL1AbP3n5B-hqH3ng__square\/img\/JaQSwmTKKlo1gBplZPoyOH4csGk=\/75x75\/filters:strip_icc()\/pic1077695.jpg","tallthumb":"https:\/\/cf.geekdo-images.com\/J6mcvuL1AbP3n5B-hqH3ng__tallthumb\/img\/yNJkywQP-p7VnyxnHioN5FA1MuA=\/fit-in\/75x125\/filters:strip_icc()\/pic1077695.jpg","previewthumb":"https:\/\/cf.geekdo-images.com\/J6mcvuL1AbP3n5B-hqH3ng__previewthumb\/img\/sEtGvRmyBkDKJ0NTKfW6oMEWwsQ=\/fit-in\/300x320\/filters:strip_icc()\/pic1077695.jpg","square200":"https:\/\/cf.geekdo-images.com\/J6mcvuL1AbP3n5B-hqH3ng__square200\/img\/ES8U90v4W27f2wIbLEFhhOSvc2I=\/20
