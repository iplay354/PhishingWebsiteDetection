":"0","secondaryname":true},{"nameid":"2357497","name":"Pirate Battleships","sortindex":"1","primaryname":"0","secondaryname":true},{"nameid":"539003","name":"Pocket Battleships","sortindex":"1","primaryname":"0","secondaryname":true},{"nameid":"39113","name":"Salvo","sortindex":"1","primaryname":"0","secondaryname":true},{"nameid":"41552","name":"Schiffe versenken","sortindex":"1","primaryname":"0","secondaryname":true},{"nameid":"1332828","name":"Sea Battle","sortindex":"1","primaryname":"0","secondaryname":true},{"nameid":"40644","name":"Sea Battle","sortindex":"1","primaryname":"0","secondaryname":true},{"nameid":"1182072","name":"Sink the Battle Fleet","sortindex":"1","primaryname":"0","secondaryname":true},{"nameid":"1043916","name":"Star Wars Battleship","sortindex":"1","primaryname":"0","secondaryname":true},{"nameid":"39120","name":"Sunk","sortindex":"1","primaryname":"0","secondaryname":true},{"nameid":"797765","name":"Tank Commander","sortindex":"1","primaryname":"0","secondaryname":true},{"nameid":"44341","name":"Travel Battleship","sortindex":"1","primaryname":"0","secondaryname":true},{"nameid":"605703","name":"Travel Sea Battle","sortindex":"1","primaryname":"0","secondaryname":true},{"nameid":"1668157","name":"Upscope","sortindex":"1","primaryname":"0","secondaryname":true},{"nameid":"2415545","name":"Victory at Sea","sortindex":"1","primaryname":"0","secondaryname":true},{"nameid":"523872","name":"Warships","sortindex":"1","primaryname":"0","secondaryname":true},{"nameid":"2239947","name":"World's Smallest Battleship","sortindex":"1","primaryname":"0","secondaryname":true}],"primaryname":{"nameid":"2174","name":"Battleship","sortindex":"1","primaryname":"1","translit":"Battleship"},"description":"<p><strong>Battleship<\/strong> was originally a pencil-and-paper public domain game known by different names, but <a  href=\"\/boardgamepublisher\/20\/milton-bradley\"   >Milton Bradley<\/a> made it into the well known board game in 1967.  The pencil and paper grids were changed to plastic grids with holes that could hold plastic pegs used to record the guesses.<\/p>\n\n<p>Each player deploys his ships (of lengths varying from 2 to 5 squares) secretly on a square grid.  Then each player shoots at the other's grid by calling a location.  The defender responds by &quot;Hit!&quot; or &quot;Miss!&quot;.  You try to deduce where the enemy ships are and sink them.  First to do so wins.<\/p>\n\n<p>The <strong>Salvo<\/strong> variant listed in the rules allows each player to call out from 1 to 5 shots at a time depending on the amount of ships the player has left (IE: players each start off with 5 ships, so they start off with 5 shots.  As ships are sunk, the players gets fewer shots).  This version of the game is closer to the original pencil-and-paper public domain game.  Many versions of the pencil-and-paper game have different amounts of shots based on the ship (IE: Battleship: 5 shots. Destroyer: 3 Shots, Etc.).<\/p>\n\n","wiki":"<p><strong> <a class=\"\" href=\"\/wiki\/page\/Microbadges#\">Microbadges<\/a> <\/strong><br \/>\n<a href=\"\/microbadge\/12065\"><img alt='Microbadge: You sank my Battleship' onmouseover=\"return overlib('You sank my Battleship', WRAP );\" onmouseout=\"return nd();\" title=''class='mbimg'loading=\"lazy\"src=\"https:\/\/cf.geekdo-static.com\/mbs\/mb_12065_0.png\"><\/a><\/p>\n\n<strong>Components:<\/strong><br \/>\n<ul>\n    <li> 2 Game Units<\/li>\n    <li> 10 Plastic Ships<\/li>\n    <li> White Pegs (168)<\/li>\n    <li> Red Pegs (84)<\/li>\n    <li> Instructions<\/li>\n    <li> Label Sheet (Assembled)<\/li>\n<\/ul>\n\n<hr \/>\n<p>In 2008, <a  href=\"\/boardgamepublisher\/51\/hasbro\"   >Hasbro<\/a> &quot;reinvented&quot; the game into <a  href=\"\/boardgame\/40851\/battleship-the-tactical-combat-game\"   >Battleship (Revised)<\/a>.<\/p>\n\n<p>Some history of the published versions of the game:<br \/>\n1931: Starex Novelty Co. of NY publishes <strong>Salvo<\/strong>.<br \/>\n1933: The Strathmo
