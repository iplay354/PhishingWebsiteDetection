3ab036eb2"},"tablet":{"media":"all and (min-width: 768px)","srcset":"https://image-api.prod.kitco.com/image/bae0c25d-908f-4b35-b1ae-3c6ed2616290.webp?top=0.042056074766355\u0026left=0\u0026width=1280\u0026height=719.91588785047\u0026scale_width=1024\u0026token=8a84901e63c5782b1dc20688dc15863e9efaa71e48c05e210550544858315edb"}}}},"teaserImage":{"detail":{"default":{"srcset":null},"sources":{"teaser_small":{"srcset":null,"media":null},"teaser_medium":{"srcset":null,"media":null},"desktop":{"media":null,"srcset":null},"mobile":{"media":null,"srcset":null},"tablet":{"media":null,"srcset":null}}}},"legacyThumbnailImageUrl":null}]},"cacheTagsHeader":null},"dataUpdateCount":1,"dataUpdatedAt":1766745088065,"error":null,"errorUpdateCount":0,"errorUpdatedAt":0,"fetchFailureCount":0,"fetchFailureReason":null,"fetchMeta":null,"isInvalidated":false,"status":"success","fetchStatus":"idle"},"queryKey":["newsByCategoryGeneric",{"limit":15,"offset":0,"urlAlias":"/news/category/cryptocurrencies"}],"queryHash":"[\"newsByCategoryGeneric\",{\"limit\":15,\"offset\":0,\"urlAlias\":\"/news/category/cryptocurrencies\"}]"},{"dehydratedAt":1766745088073,"state":{"data":{"nodeListByCategory":{"total":2313,"items":[{"id":214610,"__typename":"OffTheWire","body":"\u003cp\u003eDemocratic Republic of Congo has suspended artisanal copper and cobalt mineral processing, according to a decree seen by Reuters, in an effort to improve transparency and prevent illegal exports, a pervasive problem in the mineral-rich nation.\u003c/p\u003e\u003cp\u003eCongo, the world’s top cobalt supplier contributing around 70% of global output, has wrestled for decades with illegal, artisanal mining that diverts revenue away from the nation’s coffers.\u003c/p\u003e\u003cp\u003eThe decree, dated December 19 and signed by mines minister Louis Watum Kabamba, orders all entities that process and market artisanal copper and cobalt to suspend operations and certify the origin of minerals used.\u003c/p\u003e\u003cp\u003eA commission would be set up to carry out compliance and to verify the traceability and legality of supplies, the document said.\u003c/p\u003e\u003cp\u003eReuters could not determine the likely impact on illegal exports and Congo’s government had no figures.\u003c/p\u003e\u003cp\u003e“This suspension will be an opportunity to identify the flow and volume of minerals processed by the processing units,” a source at the president’s office said.\u003c/p\u003e\u003cp\u003eLICOCO, a Congolese nongovernmental group that aims to fight corruption in the sector said many entities operating illegally paid bribes to obtain their permits to circumvent the requirements laid out in the mining code.\u003c/p\u003e\u003cp\u003eCongo launched its first batch of traceable artisanal cobalt in November to clean up the supply chain and align production with international environmental, social and governance standards.\u003c/p\u003e\u003cp\u003eArtisanal mining is a lifeline for many in Congo, employing an estimated 1.5 million to 2 million people and supporting more than 10 million people indirectly.\u003c/p\u003e\u003cp\u003eBut unregulated output is difficult to track, risks being confiscated by the government and pushes up the price of ethically produced, traceable cobalt.\u003c/p\u003e\u003cp\u003e(By Yassin Kombi and Anait Miridzhanian; Editing by Jessica Donati and Alexandra Hudson)\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e","category":{"id":56,"name":"Mining","urlAlias":"/news/category/mining"},"title":"Congo halts artisanal copper and cobalt processing amid corruption crackdown ","teaserHeadline":null,"teaserSnippet":"Democratic Republic of Congo has suspended artisanal copper and cobalt mineral processing, according to a decree seen by Reuters, in an effort to improve transparency and prevent illegal exports, a pervasive problem in the mineral-rich nation.Congo, the world’s top cobalt supplier contributing around 70% of global output, has wrestled for decades with illegal, artisanal mining that diverts revenue away from the nation’s coffers.","urlAlias":"/news/off-the-wire/2025-12-24/congo-halts-artisanal-copper-and-cobalt-processing-amid-corruption","source":{"name":"Reuters","subtitle":null,"description":null},"createdAt":"2025-12-24T14:08:33-0500","updatedAt":"2025-12-24T14:10:01-0500","imageUrl":null,"image":{"detail":{"default":{"srcset":"https://image-api.prod.kitco.com/image/5c1d81de-31e3-440d-b191-9d123d72897a.jpeg?top=15.5018718802\u0026left=0\u0026width=464\u0026height=260.9962562396\u0026scale_width=1920\u0026token=5d2106f68991c9c4ade5e8ae0acf3b41b3113138e7bdb0091cfe04622978d9cf"},"sources":{"teaser_small":{"srcset":"https://image-api.prod.kitco.com/image/5c1d81de-31e3-440d-b191-9d123d72897a.jpeg?top=15.5018718802\u0026left=0\u0026width=464\u0026height=260.9962562396\u0026scale_width=200\u0026token=98ab647b5404154bd6f7befa8c135b77939ff37fd7d63ba98512660768a3dcb2","media":"all and (min-width: 0px)"},"teaser_medium":{"srcset":"https://image-api.prod.kitco.com/image/5c1d81de-31e3-440d-b191-9d123d72897a.jpeg?top=15.5018718802\u0026left=0\u0026width=464\u0026height=260.9962562396\u0026scale_width=400\u0026token=0c29977b75dd5b0c5da11d431dd5305285f03a37d0f8588511b2900c2ae47a48","media":"all and (min-width: 0px)"},"desktop":{"media":"all and (min-width: 1024px)","srcset":"https://image-api.prod.kitco.com/image/5c1d81de-31e3-440d-b191-9d123d72897a.jpeg?top=15.5018718802\u0026left=0\u0026width=464\u0026height=260.9962562396\u0026scale_width=1920\u0026token=5d2106f68991c9c4ade5e8ae0acf3b41b3113138e7bdb0091cfe04622978d9cf"},"mobile":{"media":"all and (min-width: 0px)","srcset":"https://image-api.prod.kitco.com/image/5c1d81de-31e3-440d-b191-9d123d72897a.jpeg?top=0\u0026left=85.997905759162\u0026width=292.00418848168\u0026height=292\u0026scale_width=768\u0026token=8e8181048ed01b15220ccc466480f9a7f9bdd357775228468aa1bf6059c76905"},"tablet":{"media":"all and (min-width: 768px)","srcset":"https://image-api.prod.kitco.com/image/5c1d81de-31e3-440d-b191-9d123d72897a.jpeg?top=15.5018718802\u0026left=0\u0026width=464\u0026height=260.9962562396\u0026scale_width=1024\u0026token=670b0189e83f58bf46b7e635128d6ef18e9f2484af5d1069dc11dc8fc96a1100"}}}},"featured":false,"legacyThumbnailImageUrl":null},{"id":214599,"__typename":"OffTheWire","body":"\u003cp\u003eDec 24 (Reuters) - Gold and copper miner SolGold (SOLG.L), opens new tab said on Wednesday it had agreed to be acquired by its largest shareholder Jiangxi Copper (600362.SS), in a deal valuing it at 867 million pounds ($1.17 billion).\u003c/p\u003e\u003cp\u003eThe 28-pence-per-share deal represents an almost 43% premium to Ecuador-focused SolGold's closing price on November 19, the day before Jiangxi first approached the company for a deal.\u003cbr\u003e\u003cbr\u003eSolGold's shares closed marginally higher at 25.65 pence in a holiday-shortened trading session on Wednesday.\u003c/p\u003e\u003cp\u003eThe agreement gives Jiangxi control of SolGold's Cascabel project in Ecuador's Imbabura province, as miners race to secure copper supplies amid rising demand driven by electric vehicle and AI infrastructure investments.\u003c/p\u003e\u003cp\u003eThe region is home to one of the world's largest undeveloped copper-gold deposits in South America.\u003c/p\u003e\u003cp\u003eThe London-listed miner said earlier this month it was inclined to recommend the offer, which was Jiangxi's third proposal to acquire the company.\u003c/p\u003e\u003cp\u003e\"JCC is delighted to have received the unanimous recommendation of the SolGold board and strong support from other large shareholders in favour of the acquisition. JCC is excited by the potential of the Cascabel project,\" Shaobing Zhou, vice chairman and general manager of Jiangxi, said in a statement.\u003c/p\u003e\u003cp\u003eSolGold's other top investors include global miner BHP (BHP.AX), and Newmont (NEM.N).\u003cbr\u003e($1 = 0.7405 pounds)\u003c/p\u003e\u003cp\u003eReporting by Shashwat Awasthi in Bengaluru; Editing by Shilpi Majumdar, Kirsten Donovan\u003c/p\u003e","category":{"id":56,"name":"Mining","urlAlias":"/news/category/mining"},"title":"SolGold agrees to $1.2 billion takeover by top investor Jiangxi Copper","teaserHeadline":null,"teaserSnippet":"Dec 24 (Reuters) - Gold and copper miner SolGold (SOLG.L), opens new tab said on Wednesday it had agreed to be acquired by its largest shareholder Jiangxi Copper (600362.SS), in a deal valuing it at 867 million pounds ($1.17 billion).The 28-pence-per-share deal represents an almost 43% premium to Ecuador-focused SolGold's closing price on November 19, the day before Jiangxi first approached the company for a deal.SolGold's shares closed marginally higher at 25.65 pence in a holiday-shortened trading session on Wednesday.","urlAlias":"/news/off-the-wire/2025-12-24/solgold-agrees-12-billion-takeover-top-investor-jiangxi-copper","source":{"name":"Reuters","subtitle":null,"description":null},"createdAt":"2025-12-24T11:06:20-0500","updatedAt":"2025-12-24T11:07:52-0500","imageUrl":null,"image":{"detail":{"default":{"srcset":"https://image-api.prod.kitco.com/image/b65eccbb-4e73-42c9-b57b-eeecb258bbb3.jpeg?top=15.5018718802\u0026left=0\u0026width=464\u0026height=260.9962562396\u0026scale_width=1920\u0026token=cbb55c760d90a335a989350d727183826897e779c7185b789009cce29d1f5cb8"},"sources":{"teaser_small":{"srcset":"https://image-api.prod.kitco.com/image/b65eccbb-4e73-42c9-b57b-eeecb258bbb3.jpeg?top=15.5018718802\u0026left=0\u0026width=464\u0026height=260.9962562396\u0026scale_width=200\u0026token=13039aae736e505bc1b6b3c6c99277e0426f93f62acbaf4f0d52ad079d3c9a2c","media":"all and (min-width: 0px)"},"teaser_medium":{"srcset":"https://image-api.prod.kitco.com/image/b65eccbb-4e73-42c9-b57b-eeecb258bbb3.jpeg?top=15.5018718802\u0026left=0\u0026width=464\u0026height=260.9962562396\u0026scale_width=400\u0026token=2d6a9b154e2797aa80c6a842af85deac2b446f490b9f3c2e5ae455e495890b13","media":"all and (min-width: 0px)"},"desktop":{"media":"all and (min-width: 10 Tuesday, the tenth project to be approved under the scheme.The incorporation of the Gualcamayo project, which would extend the life of the existing mine and employ some 1,700 people, brings the total investment in projects approved under the RIGI program to $25 billion, Caputo said on social media.(By Walter Bianchi; Editing by Natalia Siniawski)","urlAlias":"/news/off-the-wire/2025-12-24/argentinas-tax-break-program-approves-665m-gold-mine-project","source":{"name":"Reuters","subtitle":null,"description":null},"createdAt":"2025-12-24T10:50:21-0500","updatedAt":"2025-12-24T10:51:46-0500","imageUrl":null,"image":{"detail":{"default":{"srcset":"https://image-api.prod.kitco.com/image/ef3f2162-0763-4736-89e5-6650e55ca22c.jpeg?top=15.5018718802\u0026left=0\u0026width=464\u0026height=260.9962562396\u0026scale_width=1920\u0026token=af4d5b4097aa5081be657485ef7fb195ae807e6fb78262ca1a8e2786476e4c89"},"sources":{"teaser_small":{"srcset":"https://image-api.prod.kitco.com/image/ef3f2162-0763-4736-89e5-6650e55ca22c.jpeg?top=15.5018718802\u0026left=0\u0026width=464\u0026height=260.9962562396\u0026scale_width=200\u0026token=e22e845f722e2144b5c9ae7ccadf77b1ff0dc127111284e667bbd391c7bce6c8","media":"all and (min-width: 0px)"},"teaser_medium":{"srcset":"https://image-api.prod.kitco.com/image/ef3f2162-0763-4736-89e5-6650e55ca22c.jpeg?top=15.5018718802\u0026left=0\u0026width=464\u0026height=260.9962562396\u0026scale_width=400\u0026token=3a40b163639639babcb6628b4301baef2095cdbe3832f4c8b88633693d85573f","media":"all and (min-width: 0px)"},"desktop":{"media":"all and (min-width: 1024px)","srcset":"https://image-api.prod.kitco.com/image/ef3f2162-0763-4736-89e5-6650e55ca22c.jpeg?top=15.5018718802\u0026left=0\u0026width=464\u0026height=260.9962562396\u0026scale_width=1920\u0026token=af4d5b4097aa5081be657485ef7fb195ae807e6fb78262ca1a8e2786476e4c89"},"mobile":{"media":"all and (min-width: 0px)","srcset":"https://image-api.prod.kitco.com/image/ef3f2162-0763-4736-89e5-6650e55ca22c.jpeg?top=0\u0026left=85.997905759162\u0026width=292.00418848168\u0026height=292\u0026scale_width=768\u0026token=f7aa49608950910ab2e3fce5f3752eff3047d782a60d23ae3015c67a9948b1c2"},"tablet":{"media":"all and (min-width: 768px)","srcset":"https://image-api.prod.kitco.com/image/ef3f2162-0763-4736-89e5-6650e55ca22c.jpeg?top=15.5018718802\u0026left=0\u0026width=464\u0026height=260.9962562396\u0026scale_width=1024\u0026token=0a60e60af57fb8d9469c1da104d5deeaab33502556cc12ea19c83aa1d050d9ca"}}}},"featured":false,"legacyThumbnailImageUrl":null},{"id":214593,"__typename":"OffTheWire","body":"\u003cp\u003eThe world’s largest iron ore supplier, Rio Tinto, plans to replace the index used for settlement for shipments to China in January and February, according to a client notice reviewed by Reuters and a trader with knowledge of the matter.\u003c/p\u003e\u003cp\u003e\u0026nbsp;The Australian miner sent emails to Chinese clients notifying them that Fastmarkets MB’s iron ore indices will replace Platts indices for settlement of iron ore shipments in the first two months of 2026, according to the notice and the trader.\u003c/p\u003e\u003cp\u003eIt was not immediately clear why Rio Tinto is making the change, and whether it applies to all of its Chinese clients.\u003c/p\u003e\u003cp\u003eRio Tinto, S\u0026amp;P Global, and Fastmarkets did not immediately respond to requests for comment.\u003c/p\u003e\u003cp\u003e“The indices to be adopted in final settlement and future long-term contract are under negotiation,” the client notice said.\u003c/p\u003e\u003cp\u003eRio Tinto has been using the Platts indices to settle its flagship products in annual contracts and spot market for more than a decade, two traders said.\u003c/p\u003e\u003cp\u003e(By Amy Lv and Tony Munroe; Editing by Kirsten Donovan)\u003c/p\u003e","category":{"id":56,"name":"Mining","urlAlias":"/news/category/mining"},"title":"Rio Tinto to change index for some iron ore settlement, client notice","teaserHeadline":null,"teaserSnippet":"The world’s largest iron ore supplier, Rio Tinto, plans to replace the index used for settlement for shipments to China in January and February, according to a client notice reviewed by Reuters and a trader with knowledge of the matter.\u0026nbsp;The Australian miner sent emails to Chinese clients notifying them that Fastmarkets MB’s iron ore indices will replace Platts indices for settlement of iron ore shipments in the first two months of 2026, according to the notice and the trader.","urlAlias":"/news/off-the-wire/2025-12-24/rio-tinto-change-index-some-iron-ore-settlement-client-notice","source":{"name":"Reuters","subtitle":null,"description":null},"createdAt":"2025-12-24T10:49:15-0500","updatedAt":"2025-12-24T10:50:04-0500","imageUrl":null,"image":{"detail":{"default":{"srcset":"https://image-api.prod.kitco.com/image/5cd7ea39-268a-47ac-a469-9d125df7a110.jpeg?top=15.5018718802\u0026left=0\u0026width=464\u0026height=260.9962562396\u0026scale_width=1920\u0026token=bd041cea5e4bb6c7d9e08ccb6fa83bb4660ea3efab913ea2234b621bf6e782d7"},"sources":{"teaser_small":{"srcset":"https://image-api.prod.kitco.com/image/5cd7ea39-268a-47ac-a469-9d125df7a110.jpeg?top=15.5018718802\u0026left=0\u0026width=464\u0026height=260.9962562396\u0026scale_width=200\u0026token=a58eeb37f4f7eb475d05f99d2bf10b6b4a5ffe11d87041f25d44062ca3bb8748","media":"all and (min-width: 0px)"},"teaser_medium":{"srcset":"https://image-api.prod.kitco.com/image/5cd7ea39-268a-47ac-a469-9d125df7a110.jpeg?top=15.5018718802\u0026left=0\u0026width=464\u0026height=260.9962562396\u0026scale_width=400\u0026token=50a37de1ae8561b6bf20fb39106490d9bc4011c9898fc789448c0bc019028e2d","media":"all and (min-width: 0px)"},"desktop":{"media":"all and (min-width: 1024px)","srcset":"https://image-api.prod.kitco.com/image/5cd7ea39-268a-47ac-a469-9d125df7a110.jpeg?top=15.5018718802\u0026left=0\u0026width=464\u0026height=260.9962562396\u0026scale_width=1920\u0026token=bd041cea5e4bb6c7d9e08ccb6fa83bb4660ea3efab913ea2234b621bf6e782d7"},"mobile":{"media":"all and (min-width: 0px)","srcset":"https://image-api.prod.kitco.com/image/5cd7ea39-268a-47ac-a469-9d125df7a110.jpeg?top=0\u0026left=85.997905759162\u0026width=292.00418848168\u0026height=292\u0026scale_width=768\u0026token=4d545c49c323dfffc8349c3731b4e51307b61f9dec0b8ec96f31148f82e2a625"},"tablet":{"media":"all and (min-width: 768px)","srcset":"https://image-api.prod.kitco.com/image/5cd7ea39-268a-47ac-a469-9d125df7a110.jpeg?top=15.5018718802\u0026left=0\u0026width=464\u0026height=260.9962562396\u0026scale_width=1024\u0026token=a6a89d1933b47136ca235e68efd96f618230a32ed5d53b2ac2d4482286667143"}}}},"featured":false,"legacyThumbnailImageUrl":null},{"id":214592,"__typename":"OffTheWire","body":"\u003cp\u003eIndonesia has identified potential fines amounting to $8.5 billion that the government could collect in 2026 from palm oil companies and miners operating illegally in forest areas, the country’s attorney general said on Wednesday.\u003c/p\u003e\u003cp\u003ePresident Prabowo Subianto’s forestry task force, made up of military personnel, police, prosecutors and government officials, has this year cracked down on an unprecedented scale on plantations and mines in what authorities say were supposed to be forest areas.\u003c/p\u003e\u003cp\u003eThe military-backed campaign has unnerved the palm oil industry, with analysts predicting that in combination with Indonesia’s ambitious biodiesel plans, the seizures could put even more upward pressure on global prices by disrupting production.\u003c/p\u003e\u003cp\u003eAttorney General Sanitiar Burhanuddin, speaking at a ceremony in front of tall stacks of red rupiah banknotes, said the task force has already taken over 4.1 million hectares (9.8 million acres) of illegal plantations and mines, a total area about the size of the Netherlands.\u003c/p\u003e\u003cp\u003eBurhanuddin also handed to the finance minister over 2.34 trillion rupiah ($139.70 million) in fines the task force collected from 20 palm oil companies and one nickel miner.\u003c/p\u003e\u003cp\u003e“For 2026, there is revenue potential from administrative fines from palm oil plantations and mines within forest areas, amounting to 109.6 trillion rupiah ($6.54 billion) for palm oil and 32.63 trillion rupiah ($1.95 billion) for mining,” Burhanuddin said.\u003c/p\u003e\u003cp\u003eHe did not name any of the companies.\u003c/p\u003e\u003cp\u003eBurhanuddin also transferred more than 240,500 hectares of plantations to state firm Agrinas Palma Nusantara, which was set up early in 2025. Agrinas’s total land size has now reached 1.7 million hectares, consolidating its position as the largest palm oil company in the world by area.\u003c/p\u003e\u003cp\u003eAt the ceremony, Prabowo praised the task force and railed against those he said had tried to bleed Indonesia dry as well as foreign forces undermining his government.\u003c/p\u003e\u003cp\u003e“Even though the work, the journey is tough, I have an instinct in 2026 we will take even bolder steps … We will save this nation’s wealth without hesitation,” he said.\u003c/p\u003e\u003cp\u003eIndonesia is the world’s biggest exporter of palm oil, thermal coal, nickel and tin.\u003c/p\u003e\u003cp\u003e($1 = 16,750.0000 rupiah)\u003c/p\u003e\u003cp\u003e(By Gayatri Suroyo; Editing by David Stanway)\u003c/p\u003e","category":{"id":56,"name":"Mining","urlAlias":"/news/category/mining"},"title":"Indonesia plans to fine palm oil growers, miners $8.5B for forest encroachment","teaserHeadline":null,"teaserSnippet":"Indonesia has identified potential fines amounting to $8.5 billion that the government could collect in 2026 from palm oil companies and miners operating illegally in forest areas, the country’s attorney general said on Wednesday.President Prabowo Subianto’s forestry task force, made up of military personnel, police, prosecutors and government officials, has this year cracked down on an unprecedented scale on plantations and mines in what authorities say were supposed to be forest areas.","urlAlias":"/news/off-the-wire/2025-12-24/indonesia-plans-fine-palm-oil-growers-miners-85b-forest-encroachment","source":{"name":"Reuters","subtitle":null,"description":null},"createdAt":"2025-12-24T10:40:11-0500","updatedAt":"2025-12-24T10:48:45-0500","imageUrl":null,"image":{"detail":{"default":{"srcset":"https://image-api.prod.kitco.com/image/0c758b6c-2d9f-4286-adb3-d05431eb78c0.gif?top=15.5018718802\u0026left=0\u0026width=464\u0026height=260.9962562396\u0026scale_width=1920\u0026token=bc1f98f32d5eba3e7b8363a08fb3ad99b9512c3882c8400e1533fc8d52a7c822"},"sources":{"teaser_small":{"srcset":"https://image-api.prod.kitco.com/image/0c758b6c-2d9f-4286-adb3-d05431eb78c0.gif?top=15.5018718802\u0026left=0\u0026width=464\u0026height=260.9962562396\u0026scale_width=200\u0026token=4b04e5858c4fea40e0681848b73fddaf1d4784c750b2cdb738359fbd8b66bbda","media":"all and (min-width: 0px)"},"teaser_medium":{"srcset":"https://image-api.prod.kitco.com/image/0c758b6c-2d9f-4286-adb3-d05431eb78c0.gif?top=15.5018718802\u0026left=0\u0026width=464\u0026height=260.9962562396\u0026scale_width=400\u0026token=ac69b360b46c4bc00a9471c87158885ea05552892fed4681e73537ec4b375414","media":"all and (min-width: 0px)"},"desktop":{"media":"all and (min-width: 1024px)","srcset":"https://image-api.prod.kitco.com/image/0c758b6c-2d9f-4286-adb3-d05431eb78c0.gif?top=15.5018718802\u0026left=0\u0026width=464\u0026height=260.9962562396\u0026scale_width=1920\u0026token=bc1f98f32d5eba3e7b8363a08fb3ad99b9512c3882c8400e1533fc8d52a7c822"},"mobile":{"media":"all and (min-width: 0px)","srcset":"https://image-api.prod.kitco.com/image/0c758b6c-2d9f-4286-adb3-d05431eb78c0.gif?top=0\u0026left=85.997905759162\u0026width=292.00418848168\u0026height=292\u0026scale_width=768\u0026token=45d3b87e842fe79ac2a44dad1f24003d8e877c4a1fc64b3f56981c5cae658c89"},"tablet":{"media":"all and (min-width: 768px)","srcset":"https://image-api.prod.kitco.com/image/0c758b6c-2d9f-4286-adb3-d05431eb78c0.gif?top=15.5018718802\u0026left=0\u0026width=464\u0026height=260.9962562396\u0026scale_width=1024\u0026token=2b4e36d8f0ab665dc2e6153c548897dcb69feebae6d6e8b5fd0a32137cf77610"}}}},"featured":false,"legacyThumbnailImageUrl":null},{"id":214519,"__typename":"OffTheWire","body":"\u003cp\u003eTala Oury Sow has to wash her kitchen utensils and clothes in brown, murky water in the village of Koussadji in Guinea’s western Kindia region.\u003c/p\u003e\u003cp\u003e“Do you think we can cook and wash with this? We have no other choice,” the 28-year-old farmer said, gesturing to the water she collected from a nearby river, 500 metres (550 yards) from her home in the Telimele prefecture of the West African nation.\u003c/p\u003e\u003cp\u003eSow blames the state of the water on the Indian mining company Ashapura Minechem, which opened a bauxite mine about 2 km from Koussadji in 2019.\u003c/p\u003e\u003cp\u003eBauxite, the raw material in aluminum, is in high global demand because it plays a key role in enabling the clean energy transition, and Guinea holds the world’s largest reserves.\u003c/p\u003e\u003cp\u003eBut the people of Koussadji and nearby villages say they are not benefitting from the bauxite boom, but instead suffer from the environmental consequences of large-scale mining, including water and air pollution.\u003c/p\u003e\u003cp\u003eTheir complaints resonate across Africa, where many governments and activists are pushing for more domestic control – and economic benefits – of the critical minerals vital for the energy transition away from polluting fossil fuels.\u003c/p\u003e\u003cp\u003eAluminum is used in solar panels, wind turbines and electric vehicles, as well as energy-efficient appliances and insulation materials in greener buildings.\u003c/p\u003e\u003cp\u003e“Look at this water, look at the gift they’ve given us. With this water, do you think life is possible?” said Sow, who grows rice, cassava, groundnut and cashews and blamed her falling crop yields on pollution.\u003c/p\u003e\u003cp\u003eAshapura did not respond to three emails requesting comment on the villagers’ allegations of pollution.\u003c/p\u003e\u003cp\u003eThe company did build a borehole in the nearby village of Bembou Silaty a year ago, but the water does not cover people’s needs, according to Souleymane Bah, a teacher from the village.\u003c/p\u003e\u003cp\u003eAshapura has also faced allegations of environmental pollution in India.\u003c/p\u003e\u003cp\u003eIn Bembou Silaty, Tokpa Fehand, a nurse working at the Poste de Sante health centre, said the village is adversely affected by mining activity, both in the dry and wet seasons.\u003c/p\u003e\u003cp\u003e“There are respiratory illnesses from the dust, the village is surrounded by the mine, and the machinery hardly ever stops working,” he said.\u003c/p\u003e\u003cp\u003eA 2023 community audit of the environmental and social impacts of mining in the nearby region of Boke linked bauxite mining to water pollution, a drop in agricultural productivity and a rise in air pollution.\u003c/p\u003e\u003cp\u003eOumar Totiya Barry, executive director of the independent Guinean Observatory for Mines and Metals, said the problems experienced in Bembou Silaty were typical.\u003c/p\u003e\u003cp\u003e“Bauxite waste contains heavy metals and acid; in cases of pollution, it is sedimentation linked to drainage during the rainy season,” he said.\u003c/p\u003e\u003cp\u003eJust transition?\u003c/p\u003e\u003cp\u003eGuinea exports some 3.7 million tons of bauxite per week and produced about 146 million tons last year.\u003c/p\u003e\u003cp\u003eThe country ships most of its exported bauxite to China.\u003c/p\u003e\u003cp\u003eThe military-led government, which took power in a 2021 coup, is pushing foreign mining companies to add more value to bauxite before shipping the ore overseas for processing.\u003c/p\u003e\u003cp\u003eAs part of this drive, it has revoked licences and pressed mining companies to build alumina refineries, joining countries from gold producer Mali to oil-rich Nigeria that are looking to boost domestic refining capacity in recent years.\u003c/p\u003e\u003cp\u003eDespite a push by several African countries at last month’s COP30 UN climate talks, the issue of a just transition for communities in resource-rich countries was not addressed in the final text.\u003c/p\u003e\u003cp\u003eChina and Russia, among others, opposed any explicit reference to minerals, participants said.\u003c/p\u003e\u003cp\u003e“Talk of a just transition rings hollow so long as governments ignore the minerals required by the energy systems of the future,” said Antonio Hill, an advisor at the policy organization Natural Resource Governance Institute.\u003c/p\u003e\u003cp\u003e“By looking the other way, governments are feeding delay, forfeiting leadership and forsaking the chance to anchor equity and justice at the heart of the global energy transition,” he said in a statement after the talks.\u003c/p\u003e\u003cp\u003eIn the meantime, Guinea is taking unilateral action.\u003c/p\u003e\u003cp\u003eMamady Doumbouya, the general who led the coup and is running for president in an election on Dec. 28, has acted to force companies to add value to bauxite in Guinea.\u003c/p\u003e\u003cp\u003eMines Minister Bouna Sylla said in November the country would fast-track the development of alumina refineries and iron ore pellet plants to end decades of raw ore exports.\u003c/p\u003e\u003cp\u003eNew approach\u003cbr\u003eBauxite mines, which involve surface level or “strip” mining, can contaminate rivers and streams by removing vegetation and facilitating erosion, Human Rights Watch said in a 2021 report on aluminum production and mining that also referenced Guinea.\u003c/p\u003e\u003cp\u003eBarry said the noxious consequences of mining is a factor driving young Guineans to migrate, many opting for risky boat journeys to Spain’s Canary Islands.\u003c/p\u003e\u003cp\u003e“(Guinea is) rich in resources, but has not managed to turn them into national wealth, rather into a tool used to consolidate state power,” he said, adding that mining revenues are used to pay policemen, soldiers and civil servants.\u003c/p\u003e\u003cp\u003eHe said legislation is needed to guarantee Guinean citizens a decent standard of living.\u003c/p\u003e\u003cp\u003eThe employment benefits are limited too, as many young people do not have the training needed to secure permanent jobs.\u003c/p\u003e\u003cp\u003eThe women of Allawalli, a farmers’ association in Bembou Silaty and Koussadji, said pollution from the nearby mines has decreased food production.\u003c/p\u003e\u003cp\u003eRice production in Telimele plunged by 90% between 2018 and 2022, according to data from Guinea’s national institute of statistics.\u003c/p\u003e\u003cp\u003eBinta Boye, 35, grows rice, groundnuts and cassava in Bembou Silaty and is a member of Allawalli.\u003c/p\u003e\u003cp\u003e“What I produced before was enough to feed my family. Now it’s not enough anymore. We’re in God’s hands, if we want this to change,” she said.\u003c/p\u003e\u003cp\u003e(By Jaume Portell Cano; Editing by Clar Ni Chonghaile and Jon Hemming)\u003c/p\u003e","category":{"id":56,"name":"Mining","urlAlias":"/news/category/mining"},"title":"Bauxite boom pollutes water and crops in Guinea","teaserHeadline":null,"teaserSnippet":"Tala Oury Sow has to wash her kitchen utensils and clothes in brown, murky water in the village of Koussadji in Guinea’s western Kindia region.“Do you think we can cook and wash with this? We have no other choice,” the 28-year-old farmer said, gesturing to the water she collected from a nearby river, 500 metres (550 yards) from her home in the Telimele prefecture of the West African nation.Sow blames the state of the water on the Indian mining company Ashapura Minechem, which opened a bauxite mine about 2 km from Koussadji in 2019.","urlAlias":"/news/off-the-wire/2025-12-23/bauxite-boom-pollutes-water-and-crops-guinea","source":{"name":"Reuters","subtitle":null,"description":null},"createdAt":"2025-12-23T13:20:13-0500","updatedAt":"2025-12-23T13:25:02-0500","imageUrl":null,"image":{"detail":{"default":{"srcset":"https://image-api.prod.kitco.com/image/39e0fc07-1cf6-43e8-8bf4-281fe7b2e276.jpeg?top=15.494430693069\u0026left=0\u0026width=464\u0026height=261.01113861386\u0026scale_width=1920\u0026token=324ff9d9d5b54b3aebfbc690d5b9b63442f447f973896258dfa93d74c68497a6"},"sources":{"teaser_small":{"srcset":"https://image-api.prod.kitco.com/image/39e0fc07-1cf6-43e8-8bf4-281fe7b2e276.jpeg?top=15.494430693069\u0026left=0\u0026width=464\u0026height=261.01113861386\u0026scale_width=200\u0026token=3257fcdc2d8bef5913f2c34dd75d2a84ff2e2363049ad7a5ea6e1de5bcf6a0d3","media":"all and (min-width: 0px)"},"teaser_medium":{"srcset":"https://image-api.prod.kitco.com/image/39e0fc07-1cf6-43e8-8bf4-281fe7b2e276.jpeg?top=15.494430693069\u0026left=0\u0026width=464\u0026height=261.01113861386\u0026scale_width=400\u0026token=9c35cf5a51682b03d744febcba8b727c3cd1d9ebadafa819d26f183805409f8a","media":"all and (min-width: 0px)"},"desktop":{"media":"all and (min-width: 1024px)","srcset":"https://image-api.prod.kitco.com/image/39e0fc07-1cf6-43e8-8bf4-281fe7b2e276.jpeg?top=15.494430693069\u0026left=0\u0026width=464\u0026height=261.01113861386\u0026scale_width=1920\u0026token=324ff9d9d5b54b3aebfbc690d5b9b63442f447f973896258dfa93d74c68497a6"},"mobile":{"media":"all and (min-width: 0px)","srcset":"https://image-api.prod.kitco.com/image/39e0fc07-1cf6-43e8-8bf4-281fe7b2e276.jpeg?top=0\u0026left=86.006230529595\u0026width=291.98753894081\u0026height=292\u0026scale_width=768\u0026token=0e34b139ecea24e935b9e0721b18e29867ed3329860279ce5df2997efbcf5809"},"tablet":{"media":"all and (min-width: 768px)","srcset":"https://image-api.prod.kitco.com/image/39e0fc07-1cf6-43e8-8bf4-281fe7b2e276.jpeg?top=15.494430693069\u0026left=0\u0026width=464\u0026height=261.01113861386\u0026scale_width=1024\u0026token=d83971bb78ee99cde15eafdafa2e5475da7cd5ab9221e7d03e57d8e6499cea84"}}}},"featured":true,"legacyThumbnailImageUrl":null},{"id":214514,"__typename":"OffTheWire","body":"\u003cp\u003eDemocratic Republic of Congo has begun collecting samples in preparation for Chinese company CMOC’s first cobalt shipment under a new quota system, expected to take place in the coming days, two government sources told Reuters.\u003c/p\u003e\u003cp\u003eCongo accounts for more than 70% of global mined cobalt production that is estimated by analysts at around 280,000 metric tons this year. But a months-long export ban has driven cobalt prices sharply higher and squeezed availability of the metal needed for electric vehicles.\u003c/p\u003e\u003cp\u003eThe new system, launched on October 16, has allocated a quota of 18,125 metric tons for the fourth quarter and will cap annual exports at 96,600 tons from 2026.\u003c/p\u003e\u003cp\u003eReuters reported this month that Glencore would be the first miner to export cobalt under the new quotas, sending a small initial shipment to test the system.\u003c/p\u003e\u003cp\u003eCMOC and Glencore, the world’s two largest cobalt-producing companies, received the largest allocations. CMOC’s quota for the fourth quarter is 6,650 tons and Glencore’s 3,925 tons.\u003c/p\u003e\u003cp\u003eThe two government sources did not disclose the volume or exact timing of the first shipment by CMOC’s Tenke Fungurume Mining.\u003c/p\u003e\u003cp\u003eA source at Tenke Fungurume Mining confirmed sampling had begun but said shipment was not likely until January. The source said it would be a small shipment under the 2025 quota.\u003c/p\u003e\u003cp\u003eLike Glencore, CMOC will pay a 10% royalty, the Congolese government sources said.\u003c/p\u003e\u003cp\u003e“We are currently at the site visit stage to collect samples and facilitate sampling before moving on to the next step,” one of the sources said, adding that CMOC’s export request had already been submitted.\u003c/p\u003e\u003cp\u003eThe sample results “arrive in three or four days… then loading begins”, the source said.\u003c/p\u003e\u003cp\u003eCMOC spokesperson Vincent Zhou said on Monday that CMOC has “already implemented a range of export arrangements in accordance with the procedures of the Congolese government,” without elaborating.\u003c/p\u003e\u003cp\u003eReuters previously reported that the country’s mining lobby called for urgent talks to clarify legal ambiguities and compliance hurdles.\u003c/p\u003e\u003cp\u003eIt said the new requirements – including a 10% royalty prepayment within 48 hours and a compliance certificate before any cargo moves – could delay exports and disrupt global battery supply chains.\u003c/p\u003e\u003cp\u003eRepresentatives of Congo’s Chamber of Mines and the mining ministry met at the end of last week in Kinshasa to discuss the concerns, according to two attendees who said there was not much progress.\u003c/p\u003e\u003cp\u003e(By Ange Kasongo, Tom Daly and Robbie Corey-Boulet; Editing by Kirsten Donovan)\u003c/p\u003e","category":{"id":56,"name":"Mining","urlAlias":"/news/category/mining"},"title":"Congo collects samples for CMOC’s first cobalt shipment","teaserHeadline":null,"teaserSnippet":"Democratic Republic of Congo has begun collecting samples in preparation for Chinese company CMOC’s first cobalt shipment under a new quota system, expected to take place in the coming days, two government sources told Reuters.Congo accounts for more than 70% of global mined cobalt production that is estimated by analysts at around 280,000 metric tons this year. But a months-long export ban has driven cobalt prices sharply higher and squeezed availability of the metal needed for electric vehicles.","urlAlias":"/news/off-the-wire/2025-12-23/congo-collects-samples-cmocs-first-cobalt-shipment","source":{"name":"Reuters","subtitle":null,"description":null},"createdAt":"2025-12-23T12:11:14-0500","updatedAt":"2025-12-23T12:12:30-0500","imageUrl":null,"image":{"detail":{"default":{"srcset":"https://image-api.prod.kitco.com/image/cf2a754c-2f7b-4633-828d-9d0183b77b9e.png?top=15.494430693069\u0026left=0\u0026width=464\u0026height=261.01113861386\u0026scale_width=1920\u0026token=1a865c9e34e8dc82ee22a01cf25d9cf65e65fcd8ffda8ee6e644951399b159f6"},"sources":{"teaser_small":{"srcset":"https://image-api.prod.kitco.com/image/cf2a754c-2f7b-4633-828d-9d0183b77b9e.png?top=15.494430693069\u0026left=0\u0026width=464\u0026height=261.01113861386\u0026scale_width=200\u0026token=e0cd0d03c26d5ac806dcc30f7090b5fcf98636fd6b16ab116597600d3f0e2da3","media":"all and (min-width: 0px)"},"teaser_medium":{"srcset":"https://image-api.prod.kitco.com/image/cf2a754c-2f7b-4633-828d-9d0183b77b9e.png?top=15.494430693069\u0026left=0\u0026width=464\u0026height=261.01113861386\u0026scale_width=400\u0026token=c55bf5d2e02b8e80566e5a5382885656d5e198d022876f7f2486e13a569344d9","media":"all and (min-width: 0px)"},"desktop":{"media":"all and (min-width: 1024px)","srcset":"https://image-api.prod.kitco.com/image/cf2a754c-2f7b-4633-828d-9d0183b77b9e.png?top=15.494430693069\u0026left=0\u0026width=464\u0026height=261.01113861386\u0026scale_width=1920\u0026token=1a865c9e34e8dc82ee22a01cf25d9cf65e65fcd8ffda8ee6e644951399b159f6"},"mobile":{"media":"all and (min-width: 0px)","srcset":"https://image-api.prod.kitco.com/image/cf2a754c-2f7b-4633-828d-9d0183b77b9e.png?top=0\u0026left=86.006230529595\u0026width=291.98753894081\u0026height=292\u0026scale_width=768\u0026token=a3313819838ee721ae4d9533970192141405f231d610118ae55cfa5b2acb2ce9"},"tablet":{"media":"all and (min-width: 768px)","srcset":"https://image-api.prod.kitco.com/image/cf2a754c-2f7b-4633-828d-9d0183b77b9e.png?top=15.494430693069\u0026left=0\u0026width=464\u0026height=261.01113861386\u0026scale_width=1024\u0026token=75892ae88bf05cb90a9ee1ad4dace9f3486f7b31ff2e14200630ddc615cf35a2"}}}},"featured":false,"legacyThumbnailImageUrl":null},{"id":214513,"__typename":"OffTheWire","body":"\u003cp\u003eRussian diamond producer Alrosa said on Tuesday that its 2025 output would amount to 29.7 million carats, beating its previous forecast but down 10% on last year.\u003c/p\u003e\u003cp\u003eCEO Pavel Marinychev said in a statement that the company remained profitable despite Western sanctions and a downturn in the global diamond market. He did not specify the level of profits.\u003c/p\u003e\u003cp\u003eAlrosa is the world’s largest producer of diamonds, accounting for around a third of global output. In March, it had said it would temporarily shut down low-margin assets with output of less than 1 million carats, and maintained its 2025 production target at 29 million carats.\u003c/p\u003e\u003cp\u003eAlrosa said it continues to develop its gold mining operations and aims to reach its design capacity of 3.3 tons of gold per year by 2030 at the Degdekan project in the far eastern region of Magadan.\u003c/p\u003e\u003cp\u003e(By Anastasia Lyrchikova and Mark Trevelyan; Editing by Frances Kerry)\u003c/p\u003e","category":{"id":56,"name":"Mining","urlAlias":"/news/category/mining"},"title":"Alrosa flags smaller-than-expected decline in annual diamond output","teaserHeadline":null,"teaserSnippet":"Russian diamond producer Alrosa said on Tuesday that its 2025 output would amount to 29.7 million carats, beating its previous forecast but down 10% on last year.CEO Pavel Marinychev said in a statement that the company remained profitable despite Western sanctions and a downturn in the global diamond market. He did not specify the level of profits.","urlAlias":"/news/off-the-wire/2025-12-23/alrosa-flags-smaller-expected-decline-annual-diamond-output","source":{"name":"Reuters","subtitle":null,"description":null},"createdAt":"2025-12-23T12:08:25-0500","updatedAt":"2025-12-23T12:10:40-0500","imageUrl":null,"image":{"detail":{"default":{"srcset":"https://image-api.prod.kitco.com/image/39ad573a-d6d2-4bb3-88f6-ead53851a4e6.png?top=15.494430693069\u0026left=0\u0026width=464\u0026height=261.01113861386\u0026scale_width=1920\u0026token=972c28b96500380cbbfc85df085fab4f1b385c3be1bae7fd570ef52fc3f48aeb"},"sources":{"teaser_small":{"srcset":"https://image-api.prod.kitco.com/image/39ad573a-d6d2-4bb3-88f6-ead53851a4e6.png?top=15.494430693069\u0026left=0\u0026width=464\u0026height=261.01113861386\u0026scale_width=200\u0026token=e4271874b0e9d17c48063d66c448b6e040437a43ccd3eca0b0634cafaf551330","media":"all and (min-width: 0px)"},"teaser_medium":{"srcset":"https://image-api.prod.kitco.com/image/39ad573a-d6d2-4bb3-88f6-ead53851a4e6.png?top=15.494430693069\u0026left=0\u0026width=464\u0026height=261.01113861386\u0026scale_width=400\u0026token=07fd669108c40107eac8474c5673fc408e3a00b4af95d323b13af2ede100b2fa","media":"all and (min-width: 0px)"},"desktop":{"media":"all and (min-width: 1024px)","srcset":"https://image-api.prod.kitco.com/image/39ad573a-d6d2-4bb3-88f6-ead53851a4e6.png?top=15.494430693069\u0026left=0\u0026width=464\u0026height=261.01113861386\u0026scale_width=1920\u0026token=972c28b96500380cbbfc85df085fab4f1b385c3be1bae7fd570ef52fc3f48aeb"},"mobile":{"media":"all and (min-width: 0px)","srcset":"https://image-api.prod.kitco.com/image/39ad573a-d6d2-4bb3-88f6-ead53851a4e6.png?top=0\u0026left=86.006230529595\u0026width=291.98753894081\u0026height=292\u0026scale_width=768\u0026token=3d1eef0847ce3293e009e4a2e259911dfcf75394fd1ed946abf2f9d747ec2dd4"},"tablet":{"media":"all and (min-width: 768px)","srcset":"https://image-api.prod.kitco.com/image/39ad573a-d6d2-4bb3-88f6-ead53851a4e6.png?top=15.494430693069\u0026left=0\u0026width=464\u0026height=261.01113861386\u0026scale_width=1024\u0026token=7d23929142393b1b3c2cf3829d22bd493cea5e0ae09c339a3b62ef73b047ac7f"}}}},"featured":false,"legacyThumbnailImageUrl":null},{"id":214512,"__typename":"OffTheWire","body":"\u003cp\u003eSupply disruption and tariff dislocation have defined the London Metal Exchange (LME) base metals complex this year.\u003c/p\u003e\u003cp\u003eThe demand picture is far from rosy, but supply-chain stress has still lifted the LME Index, a basket of the exchange’s six base metals contracts, to its highest level since the all-time peak in 2022.\u003c/p\u003e\u003cp\u003eThat was the year Russia invaded Ukraine.\u003c/p\u003e\u003cp\u003eThis year’s turbulence has come from a different direction, as markets navigate US President Donald Trump’s topsy-turvy tariff world.\u003c/p\u003e\u003cp\u003eFinancial markets have recovered from their “Liberation Day” swoon in April, but targeted US aluminum tariffs and the threat of copper tariffs are causing tectonic shifts in trading patterns.\u003c/p\u003e\u003cp\u003eTariff dislocation adds complexity to the spectrum of supply risk facing individual metals and helps explain the wide divergence in performance this year.\u003c/p\u003e\u003cp\u003eDoctor Copper’s split personality\u003c/p\u003e\u003cp\u003eLME three-month copper has been punching out fresh all-time highs this month as it challenges the $12,000 per metric ton level.\u003c/p\u003e\u003cp\u003eThe CME’s US copper contract is trading higher still because it’s pricing in possible tariffs on imports of refined metal. The Trump administration has deferred a decision until the middle of next year, but the threat of tariffs has proved as disruptive as the reality.\u003c/p\u003e\u003cp\u003eThe world’s surplus copper has gravitated towards the US, lifting CME stocks to multi-year highs and leaving everyone else short of metal.\u003c/p\u003e\u003cp\u003eFeast or famine? Copper is currently both depending on where you are.\u003c/p\u003e\u003cp\u003eThe arbitrage between CME and LME copper has been a wild ride this year as tariffs were on, then off, then on again maybe. Until Trump makes up his mind, it will continue to define global flows of refined copper.\u003c/p\u003e\u003cp\u003eTin has new fund friends\u003c/p\u003e\u003cp\u003eWhile copper has grabbed the headlines, this year’s star turn has come from tin, a market grappling with multiple supply threats.\u003c/p\u003e\u003cp\u003eTin’s problem is too much mine supply is concentrated in too few countries, including high-risk jurisdictions such as the Democratic Republic of Congo and the semi-autonomous Wa State in Myanmar.\u003c/p\u003e\u003cp\u003eExtra volatility is coming from increased fund participation in the smallest of the LME’s core contracts.\u003c/p\u003e\u003cp\u003eTin appears to be moving onto the investment radar as the world wakes up to the fact that, in the form of circuit-board solder, the Bronze Age metal has a bright future in the coming Internet-Of-Things Age.\u003c/p\u003e\u003cp\u003eAluminum – mind the cap…and the gap\u003cbr\u003eAluminum has been the third strongest LME performer this year, reflecting a growing awareness that production in China, the world’s largest producer, is now bumping against the government’s mandated capacity cap.\u003c/p\u003e\u003cp\u003eNot everyone agrees with Citi’s call that aluminum is “sleep-walking into the biggest (supply) deficits in 20 years”, but it’s certainly a long time since the market has paid so much attention to new smelter projects outside of China.\u003c/p\u003e\u003cp\u003eAluminum trade flows, already dislocated by sanctions on Russian metal, have been further fractured by the doubling of US import tariffs.\u003c/p\u003e\u003cp\u003eThe premium for US delivery stands at a record 89 cents per lb. ($1,967 per ton) over the LME price. That’s also a premium over the implied 50% tariff rate, suggesting that the US is now running short of metal.\u003c/p\u003e\u003cp\u003eZinc surprise\u003cbr\u003eAnd talking of sleep-walking into a deficit, the LME zinc market was rocked by a ferocious squeeze in October.\u003c/p\u003e\u003cp\u003eThe cash premium over three-month delivery flexed out to over $300 per ton backwardation, a record level, as LME stocks fell to just 50,000 tons.\u003c/p\u003e\u003cp\u003eThis was supposed to be a year of zinc surplus as a wave of new mine supply washed through the supply chain.\u003c/p\u003e\u003cp\u003eBut the surplus has all ended up in China.\u003c/p\u003e\u003cp\u003eGlobal mine production rose by a robust 6.5% year-on-year and refined output by 2.9% year-on-year in January-October, according to the International Lead and Zinc Study Group.\u003c/p\u003e\u003cp\u003eHowever, Western production of refined zinc actually fell by 2.2%, reflecting a mix of closures, suspensions and unforeseen smelter hits.\u003c/p\u003e\u003cp\u003eThis month’s implosion of the LME spread structure suggests Chinese surplus is on the move to satiate Western hunger.\u003c/p\u003e\u003cp\u003eToo much lead\u003c/p\u003e\u003cp\u003eThere’s no shortage of lead. Nor is there likely to be one any time soon.\u003c/p\u003e\u003cp\u003eWarehousing the stuff is as profitable as trying to sell it in the physical market, which is why traders have spent the year arm-wresting units off each other to profit from warehouse incentives.\u003c/p\u003e\u003cp\u003eOver a million tons of lead have been delivered in and out of LME warehouses this year for a net rise of just 16,425 tons in registered inventory.\u003c/p\u003e\u003cp\u003eThe noise masks the signal coming from the underlying uptrend in combined LME registered and off-market stocks, which have risen from 21,500 tons at the start of 2023 to over 440,000 tons.\u003c/p\u003e\u003cp\u003eIndonesian boom, nickel bust\u003c/p\u003e\u003cp\u003eNickel stocks have also mushroomed thanks to Indonesia’s continued production boom, which has caused global supply growth to far outstrip demand.\u003c/p\u003e\u003cp\u003eThe good news is that exchange stocks would be even higher had there not been what Macquarie Bank describes as “large unreported strategic stockpiling” in China.\u003c/p\u003e\u003cp\u003eThe bad news is that the LME has just approved a new Indonesian nickel brand, produced by PT Eternal Industry at a rate of 50,000 tons per year.\u003c/p\u003e\u003cp\u003eNickel is currently enjoying an end-of-year bounce on renewed hope that Indonesia can tame its production growth in 2026, which says everything you need to know about the nickel market right now.\u003c/p\u003e\u003cp\u003e(The opinions expressed here are those of the author, Andy Home, a columnist for Reuters.)\u003c/p\u003e\u003cp\u003e(Editing by Marguerita Choy)\u003c/p\u003e","category":{"id":56,"name":"Mining","urlAlias":"/news/category/mining"},"title":"Disruption and dislocation: LME metals’ year in seven charts","teaserHeadline":null,"teaserSnippet":"Supply disruption and tariff dislocation have defined the London Metal Exchange (LME) base metals complex this year.The demand picture is far from rosy, but supply-chain stress has still lifted the LME Index, a basket of the exchange’s six base metals contracts, to its highest level since the all-time peak in 2022.That was the year Russia invaded Ukraine.This year’s turbulence has come from a different direction, as markets navigate US President Donald Trump’s topsy-turvy tariff world.","urlAlias":"/news/off-the-wire/2025-12-23/disruption-and-dislocation-lme-metals-year-seven-charts","source":{"name":"Reuters","subtitle":null,"description":null},"createdAt":"2025-12-23T12:03:50-0500","updatedAt":"2025-12-23T12:08:14-0500","imageUrl":null,"image":{"detail":{"default":{"srcset":"https://image-api.prod.kitco.com/image/a3d81be5-e36e-47b2-9ade-5031724a1cd4.png?top=15.494430693069\u0026left=0\u0026width=464\u0026height=261.01113861386\u0026scale_width=1920\u0026token=abe6f4a300cae934f5c2250d1f4cae75a50653656dbdab0019bc722711e0044d"},"sources":{"teaser_small":{"srcset":"https://image-api.prod.kitco.com/image/a3d81be5-e36e-47b2-9ade-5031724a1cd4.png?top=15.494430693069\u0026left=0\u0026width=464\u0026height=261.01113861386\u0026scale_width=200\u0026token=d0ab7035eac2011be049c9d2f4529508dcb2de4b54a371d79a709b1fdd360911","media":"all and (min-width: 0px)"},"teaser_medium":{"srcset":"https://image-api.prod.kitco.com/image/a3d81be5-e36e-47b2-9ade-5031724a1cd4.png?top=15.494430693069\u0026left=0\u0026width=464\u0026height=261.01113861386\u0026scale_width=400\u0026token=28bef5fb9ec73aa21a5f8ae50fad3da619387ffe1b738aa4247112e76e96c4bf","media":"all and (min-width: 0px)"},"desktop":{"media":"all and (min-width: 1024px)","srcset":"https://image-api.prod.kitco.com/image/a3d81be5-e36e-47b2-9ade-5031724a1cd4.png?top=15.494430693069\u0026left=0\u0026width=464\u0026height=261.01113861386\u0026scale_width=1920\u0026token=abe6f4a300cae934f5c2250d1f4cae75a50653656dbdab0019bc722711e0044d"},"mobile":{"media":"all and (min-width: 0px)","srcset":"https://image-api.prod.kitco.com/image/a3d81be5-e36e-47b2-9ade-5031724a1cd4.png?top=0\u0026left=86.006230529595\u0026width=291.98753894081\u0026height=292\u0026scale_width=768\u0026token=1fb88b48d4f0eae77bd6e0ebbb89a27773b38a56cc279a39dcbfb80103e4e6a6"},"tablet":{"media":"all and (min-width: 768px)","srcset":"https://image-api.prod.kitco.com/image/a3d81be5-e36e-47b2-9ade-5031724a1cd4.png?top=15.494430693069\u0026left=0\u0026width=464\u0026height=261.01113861386\u0026scale_width=1024\u0026token=2c0e16717430d830a9ccd0e7cc90b63c89c9b19b5ad530833ea489b826f28a81"}}}},"featured":false,"legacyThumbnailImageUrl":null},{"id":214421,"__typename":"OffTheWire","body":"\u003cp\u003eChile’s comptroller on Friday approved, with some guidelines, an agreement between state copper giant Codelco and local miner SQM to operate a joint lithium venture in the Atacama salt flat.\u003c/p\u003e\u003cp\u003eThe resolution comes hours after the top regulator announced it would launch an “unprecedented audit in response to complaints from members of parliament regarding the Codelco-SQM agreement.”\u003c/p\u003e\u003cp\u003eThe regulator said that it was prevented from ruling on most of the claims due to previous court rulings, but listed some guidelines in its official approval, including that Codelco must maintain a stake of more than 50% in the joint venture.\u003c/p\u003e\u003cp\u003eThe companies had requested the comptroller’s approval as the final step needed to finalize the agreement after several other national and international regulators cleared the deal.\u003c/p\u003e\u003cp\u003eChile regulator approves Codelco-SQM lithium tie-up\u003cbr\u003eCodelco and SQM want to create a joint venture to produce lithium in the Atacama salt flat, as part of President Gabriel Boric’s plan to expand state control over the industry and increase production.\u003c/p\u003e\u003cp\u003eLegislators have questioned why the agreement was reached in direct negotiations rather than a public bidding process. They also questioned why Codelco picked SQM, which has pending lawsuits with the tax authorities, among other things.\u003c/p\u003e\u003cp\u003eSQM declined to comment on the audit.\u003c/p\u003e\u003cp\u003eIn a statement, Codelco said it would “approach the process with complete transparency and professionalism” and that the audit would help “reaffirm the integrity” of the agreement with SQM.\u003c/p\u003e\u003cp\u003e“The audit will confirm the integrity, rigor, and soundness of the process, especially including the hiring and work carried out by Morgan Stanley, the financial advisor who has played a fundamental role in structuring the partnership,” the statement said.\u003c/p\u003e\u003cp\u003eCodelco said it was still waiting for the Comptroller’s Office to approve the lease agreements for the properties in the salt flats between the state development agency Corfo and its subsidiary, a process that began in September.\u003c/p\u003e\u003cp\u003eChina’s Tianqi, a major investor in SQM, has sought to block, so far unsuccessfully, the deal in Chilean courts arguing it should have required shareholders’ approval.\u003c/p\u003e\u003cp\u003e(By Fabian Cambero and Alexander Villegas; Editing by David Goodman, Gabriel Araujo, Tomasz Janowski and Diane Craft)\u003c/p\u003e","category":{"id":56,"name":"Mining","urlAlias":"/news/category/mining"},"title":"Chile regulator approves Codelco-SQM lithium deal hours after announcing audit","teaserHeadline":null,"teaserSnippet":"Chile’s comptroller on Friday approved, with some guidelines, an agreement between state copper giant Codelco and local miner SQM to operate a joint lithium venture in the Atacama salt flat.The resolution comes hours after the top regulator announced it would launch an “unprecedented audit in response to complaints from members of parliament regarding the Codelco-SQM agreement.”","urlAlias":"/news/off-the-wire/2025-12-22/chile-regulator-approves-codelco-sqm-lithium-deal-hours-after","source":{"name":"Reuters","subtitle":null,"description":null},"createdAt":"2025-12-22T12:51:30-0500","updatedAt":"2025-12-22T12:55:21-0500","imageUrl":null,"image":{"detail":{"default":{"srcset":"https://image-api.prod.kitco.com/image/ded60eae-093a-47a2-8b46-246f50d7e548.png?top=15.494430693069\u0026left=0\u0026width=464\u0026height=261.01113861386\u0026scale_width=1920\u0026token=9a863745f5448bbf5f405376e2b65095bcc680eff1fc8cc1b8e1e2f2dfaa78e1"},"sources":{"teaser_small":{"srcset":"https://image-api.prod.kitco.com/image/ded60eae-093a-47a2-8b46-246f50d7e548.png?top=15.494430693069\u0026left=0\u0026width=464\u0026height=261.01113861386\u0026scale_width=200\u0026token=a467fba05aaa67a6f24a5f79ebef585cb19145218572f0b9105b5fca3ba7ec7f","media":"all and (min-width: 0px)"},"teaser_medium":{"srcset":"https://image-api.prod.kitco.com/image/ded60eae-093a-47a2-8b46-246f50d7e548.png?top=15.494430693069\u0026left=0\u0026width=464\u0026height=261.01113861386\u0026scale_width=400\u0026token=3393e3bdf96ae1f0164144d6ee482b769b91fe8775a925693a9205486e9b12c3","media":"all and (min-width: 0px)"},"desktop":{"media":"all and (min-width: 1024px)","srcset":"https://image-api.prod.kitco.com/image/ded60eae-093a-47a2-8b46-246f50d7e548.png?top=15.494430693069\u0026left=0\u0026width=464\u0026height=261.01113861386\u0026scale_width=1920\u0026token=9a863745f5448bbf5f405376e2b65095bcc680eff1fc8cc1b8e1e2f2dfaa78e1"},"mobile":{"media":"all and (min-width: 0px)","srcset":"https://image-api.prod.kitco.com/image/ded60eae-093a-47a2-8b46-246f50d7e548.png?top=0\u0026left=86.006230529595\u0026width=291.98753894081\u0026height=292\u0026scale_width=768\u0026token=19ef1825c2df9063652c2a4f6bc2bc837171afeee6b6925e9f4ae00c1eb45262"},"tablet":{"media":"all and (min-width: 768px)","srcset":"https://image-api.prod.kitco.com/image/ded60eae-093a-47a2-8b46-246f50d7e548.png?top=15.494430693069\u0026left=0\u0026width=464\u0026height=261.01113861386\u0026scale_width=1024\u0026token=8839c76c24a5ab2795563abbb88cedd9f95a15ecc7909b010d5d81011f3e8e3e"}}}},"featured":false,"legacyThumbnailImageUrl":null},{"id":214420,"__typename":"OffTheWire","body":"\u003cp\u003eMining group Eurasian Resources Group has signed a long-term deal to supply gallium to Mitsubishi Corporation RtM Japan Ltd, a subsidiary of Japanese trading house Mitsubishi Corp, it said on Saturday.\u003c/p\u003e\u003cp\u003eKazakhstan, which currently produces no gallium, is set to become the world’s second-largest producer of this critical mineral after China once ERG starts production in the third quarter of 2026.\u003c/p\u003e\u003cp\u003eGallium is on the US and European Union’s lists of critical minerals. It is needed for the manufacture of semiconductors for electronics and radar systems and missile guidance electronics in aerospace and defence.\u003c/p\u003e\u003cp\u003e“Gallium is crucially important as it is an integral part of modern technologies, especially electronics,” Shukhrat Ibragimov, ERG board chairman and CEO, said in a statement.\u003c/p\u003e\u003cp\u003e“By developing domestic operations, we can transform strategic resources into competitive products and strengthen Kazakhstan’s position on the market for high-technology materials.”\u003c/p\u003e\u003cp\u003eLast month, China said it had suspended a ban on exports of gallium, antimony and germanium to the United States following a meeting between Presidents Xi Jinping and Donald Trump, but the metals remain subject to broader export controls requiring shippers to first obtain licences from Beijing.\u003c/p\u003e\u003cp\u003eLuxembourg-headquartered ERG will be producing 15 metric tons of gallium per year from the bauxite ore it processes to produce alumina in Kazakhstan. Those two products are part of the aluminum production chain.\u003c/p\u003e\u003cp\u003eERG did not disclose the amount of planned gallium supply to Mitsubishi. It said in June that the product would go to OECD countries.\u003c/p\u003e\u003cp\u003eGlobal gallium production totalled 760 tons last year, according to the US Geological Survey. The bulk of it came from China with very small amounts from Japan, Korea and Russia.\u003c/p\u003e\u003cp\u003e(By Polina Devitt; Editing by Rosalba O’Brien)\u003c/p\u003e","category":{"id":56,"name":"Mining","urlAlias":"/news/category/mining"},"title":"ERG signs long-term gallium supply deal with Mitsubishi","teaserHeadline":null,"teaserSnippet":"Mining group Eurasian Resources Group has signed a long-term deal to supply gallium to Mitsubishi Corporation RtM Japan Ltd, a subsidiary of Japanese trading house Mitsubishi Corp, it said on Saturday.Kazakhstan, which currently produces no gallium, is set to become the world’s second-largest producer of this critical mineral after China once ERG starts production in the third quarter of 2026.","urlAlias":"/news/off-the-wire/2025-12-22/erg-signs-long-term-gallium-supply-deal-mitsubishi","source":{"name":"Reuters","subtitle":null,"description":null},"createdAt":"2025-12-22T12:50:07-0500","updatedAt":"2025-12-22T12:51:12-0500","imageUrl":null,"image":{"detail":{"default":{"srcset":"https://image-api.prod.kitco.com/image/8f82c384-25d7-4b34-9374-6924b5de021a.png?top=15.494430693069\u0026left=0\u0026width=464\u0026height=261.01113861386\u0026scale_width=1920\u0026token=34f656b0351efa2e1785c5f3c53e59b698f4d058936744640c3a4f3817a48662"},"sources":{"teaser_small":{"srcset":"https://image-api.prod.kitco.com/image/8f82c384-25d7-4b34-9374-6924b5de021a.png?top=15.494430693069\u0026left=0\u0026width=464\u0026height=261.01113861386\u0026scale_width=200\u0026token=857cab6e58e42dc2f35ff15af4d59f87e6c2ae3ebdf652dd53041754df36cf67","media":"all and (min-width: 0px)"},"teaser_medium":{"srcset":"https://image-api.prod.kitco.com/image/8f82c384-25d7-4b34-9374-6924b5de021a.png?top=15.494430693069\u0026left=0\u0026width=464\u0026height=261.01113861386\u0026scale_width=400\u0026token=f18b4884f6891b6cd8fce268e49c3742e34290b2c8aecc7975637c2dff601cbe","media":"all and (min-width: 0px)"},"desktop":{"media":"all and (min-width: 1024px)","srcset":"https://image-api.prod.kitco.com/image/8f82c384-25d7-4b34-9374-6924b5de021a.png?top=15.494430693069\u0026left=0\u0026width=464\u0026height=261.01113861386\u0026scale_width=1920\u0026token=34f656b0351efa2e1785c5f3c53e59b698f4d058936744640c3a4f3817a48662"},"mobile":{"media":"all and (min-width: 0px)","srcset":"https://image-api.prod.kitco.com/image/8f82c384-25d7-4b34-9374-6924b5de021a.png?top=0\u0026left=86.006230529595\u0026width=291.98753894081\u0026height=292\u0026scale_width=768\u0026token=d842cd6e3e809eea34decef0a2e5d00efe6b07fa7b08547ad9dc0d9704cf0600"},"tablet":{"media":"all and (min-width: 768px)","srcset":"https://image-api.prod.kitco.com/image/8f82c384-25d7-4b34-9374-6924b5de021a.png?top=15.494430693069\u0026left=0\u0026width=464\u0026height=261.01113861386\u0026scale_width=1024\u0026token=37d05c43817a04a6e06638112e58e15c87fa40c83d2369501de611ac1eeaf88b"}}}},"featured":false,"legacyThumbnailImageUrl":null},{"id":214415,"__typename":"OffTheWire","body":"\u003cp\u003eDalian iron ore futures extended gains to a fifth session on Monday on tight supply of BHP’s Jimblebar and Jingbao fines, while firmer blast furnace hot metal production in China also lent support.\u003c/p\u003e\u003cp\u003eThe most-traded May iron ore contract on China’s Dalian Commodity Exchange (DCE) DCIOcv1 gained 0.58% to 781.5 yuan($111.01) a metric ton.\u003c/p\u003e\u003cp\u003eThe benchmark January iron ore SZZFF6 on the Singapore Exchange was 0.05% lower at $104.65 a ton, as of 0710 GMT.\u003c/p\u003e\u003cp\u003ePrices rose further on restricted supply of BHP’s (ASX: BHP) Jimblebar and Jingbao fines, leaving most Chinese mills represented by state-owned China Mineral Resources Group with little option but to procure larger volumes of Rio Tinto’s (ASX: RIO) Pilbara fines, said Atilla Widnell, managing director at Navigate Commodities in Singapore.\u003c/p\u003e\u003cp\u003ePilbara fines are a core component of the underlying iron ore index that futures are benchmarked against, dragging the whole complex higher, Widnell said.\u003c/p\u003e\u003cp\u003eIn China, hot metal production, a gauge of iron ore demand, has increased since mid-September 2025, data from Navigate Commodities showed.\u003c/p\u003e\u003cp\u003eSteel mill profitability has recovered gradually, with some mills resuming production, said Chinese broker Everbright Futures.\u003c/p\u003e\u003cp\u003eElevated iron ore prices in recent years have accelerated global investment in new mining capacity, pushing the global iron ore market into a decisive phase of supply expansion, said consultancy Mysteel.\u003c/p\u003e\u003cp\u003eTotal iron ore stockpiles across ports in China climbed 1.19% week-on-week to about 145.5 million tons, as of December 19, according to SteelHome data.\u003c/p\u003e\u003cp\u003eOther steelmaking ingredients on the DCE gained ground, with coking coal DJMcv1 and coke DCJcv1 up 0.36% and 0.78%, respectively.\u003c/p\u003e\u003cp\u003eSteel benchmarks on the Shanghai Futures Exchange climbed. Rebar SRBcv1 rose 0.39%, hot-rolled coil SHHCcv1 gained 0.28%, wire rod SWRcv1 strengthened 2.94% and stainless steel SHSScv1 firmed 1.82%.\u003c/p\u003e\u003cp\u003e($1 = 7.0400 Chinese yuan)\u003c/p\u003e\u003cp\u003e(Reporting by Lucas Liew; Editing by Subhranshu Sahu)\u003c/p\u003e","category":{"id":56,"name":"Mining","urlAlias":"/news/category/mining"},"title":"Dalian iron ore extends gains on tight BHP supply, firmer hot metal production","teaserHeadline":null,"teaserSnippet":"Dalian iron ore futures extended gains to a fifth session on Monday on tight supply of BHP’s Jimblebar and Jingbao fines, while firmer blast furnace hot metal production in China also lent support.The most-traded May iron ore contract on China’s Dalian Commodity Exchange (DCE) DCIOcv1 gained 0.58% to 781.5 yuan($111.01) a metric ton.The benchmark January iron ore SZZFF6 on the Singapore Exchange was 0.05% lower at $104.65 a ton, as of 0710 GMT.","urlAlias":"/news/off-the-wire/2025-12-22/dalian-iron-ore-extends-gains-tight-bhp-supply-firmer-hot-metal","source":{"name":"Reuters","subtitle":null,"description":null},"createdAt":"2025-12-22T12:31:17-0500","updatedAt":"2025-12-22T12:32:29-0500","imageUrl":null,"image":{"detail":{"default":{"srcset":"https://image-api.prod.kitco.com/image/09f9a582-c381-4149-a068-c60c820c6529.jpeg?top=15.494430693069\u0026left=0\u0026width=464\u0026height=261.01113861386\u0026scale_width=1920\u0026token=d333b27a70aa366ed14fe9976f8e05403566191d1ed3786a2d53f668af65548f"},"sources":{"teaser_small":{"srcset":"https://image-api.prod.kitco.com/image/09f9a582-c381-4149-a068-c60c820c6529.jpeg?top=15.494430693069\u0026left=0\u0026width=464\u0026height=261.01113861386\u0026scale_width=200\u0026token=eb7541ae9293ddcf25ccc98dbfc1d731a13cec8a2e78063af8946c16843211df","media":"all and (min-width: 0px)"},"teaser_medium":{"srcset":"https://image-api.prod.kitco.com/image/09f9a582-c381-4149-a068-c60c820c6529.jpeg?top=15.494430693069\u0026left=0\u0026width=464\u0026height=261.01113861386\u0026scale_width=400\u0026token=f63b86add71c019a7dd6d3531f101b2b628eaf458d8e7a1820dced077f22cc4b","media":"all and (min-width: 0px)"},"desktop":{"media":"all and (min-width: 1024px)","srcset":"https://image-api.prod.kitco.com/image/09f9a582-c381-4149-a068-c60c820c6529.jpeg?top=15.494430693069\u0026left=0\u0026width=464\u0026height=261.01113861386\u0026scale_width=1920\u0026token=d333b27a70aa366ed14fe9976f8e05403566191d1ed3786a2d53f668af65548f"},"mobile":{"media":"all and (min-width: 0px)","srcset":"https://image-api.prod.kitco.com/image/09f9a582-c381-4149-a068-c60c820c6529.jpeg?top=0\u0026left=86.006230529595\u0026width=291.98753894081\u0026height=292\u0026scale_width=768\u0026token=e448d014659d7ba0265313d7bf3821e210e3908e9570e1b92bfb76755d627356"},"tablet":{"media":"all and (min-width: 768px)","srcset":"https://image-api.prod.kitco.com/image/09f9a582-c381-4149-a068-c60c820c6529.jpeg?top=15.494430693069\u0026left=0\u0026width=464\u0026height=261.01113861386\u0026scale_width=1024\u0026token=4582032f6e7cdf5a4e58dfb8660009d1c9db3277d72c5954d1a6560ede9d8616"}}}},"featured":false,"legacyThumbnailImageUrl":null},{"id":214414,"__typename":"OffTheWire","body":"\u003cp\u003eGlobal commodities trader and miner Glencore (LON: GLEN) has agreed to acquire a majority stake in Dutch fuel supplier FincoEnergies for an undisclosed sum, the Dutch company said on Monday.\u003c/p\u003e\u003cp\u003eGlencore will use the deal to expand its footprint in Northwest European fuel markets, industry sources said. Finco is a major player in the Dutch wholesale fuel market and in the region’s biofuels and low-carbon fuel sectors.\u003c/p\u003e\u003cp\u003eGlobal trading houses such as Glencore seek to add strategic assets across the oil supply chain to create trading opportunities. Rival trader Trafigura acquired UK-based road fuel and biofuel supplier Greenergy last year in a similar move.\u003c/p\u003e\u003cp\u003eGlencore will become the majority shareholder in Finco alongside Dutch investment firm Coloured Finches, which will shift from majority to minority shareholder after the deal closes. Current minority shareholder Pontex, also a Dutch investment company, will sell its shareholding in the deal, Finco said.\u003c/p\u003e\u003cp\u003eColoured Finches will continue to oversee day-to-day operations and management of Finco after the transaction, according to an industry source.\u003c/p\u003e\u003cp\u003eGlencore’s investment will enable Finco to grow its presence in Northwest Europe and expand in renewable fuel markets, the Dutch firm said. Finco also supplies marine fuels and marine biodiesel.\u003c/p\u003e\u003cp\u003eThe deal is subject to EU antitrust approval and could close in the second quarter of 2026, Finco said.\u003c/p\u003e\u003cp\u003e(Reporting by Robert Harvey and Enes Tunagur in London. Editing by Alex Lawler and Mark Potter)\u003c/p\u003e","category":{"id":56,"name":"Mining","urlAlias":"/news/category/mining"},"title":"Glencore buys majority stake in Dutch fuel company FincoEnergies","teaserHeadline":null,"teaserSnippet":"Global commodities trader and miner Glencore (LON: GLEN) has agreed to acquire a majority stake in Dutch fuel supplier FincoEnergies for an undisclosed sum, the Dutch company said on Monday.Glencore will use the deal to expand its footprint in Northwest European fuel markets, industry sources said. Finco is a major player in the Dutch wholesale fuel market and in the region’s biofuels and low-carbon fuel sectors.","urlAlias":"/news/off-the-wire/2025-12-22/glencore-buys-majority-stake-dutch-fuel-company-fincoenergies","source":{"name":"Reuters","subtitle":null,"description":null},"createdAt":"2025-12-22T12:23:59-0500","updatedAt":"2025-12-22T12:24:52-0500","imageUrl":null,"image":{"detail":{"default":{"srcset":"https://image-api.prod.kitco.com/image/ca458089-4622-4872-b3b6-ae4cef6af90a.png?top=15.494430693069\u0026left=0\u0026width=464\u0026height=261.01113861386\u0026scale_width=1920\u0026token=5355e4494608b5ab0ba90a9445d27200f085a5aea1e7b1fbac874d5540111e7b"},"sources":{"teaser_small":{"srcset":"https://image-api.prod.kitco.com/image/ca458089-4622-4872-b3b6-ae4cef6af90a.png?top=15.494430693069\u0026left=0\u0026width=464\u0026height=261.01113861386\u0026scale_width=200\u0026token=1b50f8ae1b2c15e7d474a66d2b9844d0c1742bc8994659a3bcc42077248a14ca","media":"all and (min-width: 0px)"},"teaser_medium":{"srcset":"https://image-api.prod.kitco.com/image/ca458089-4622-4872-b3b6-ae4cef6af90a.png?top=15.494430693069\u0026left=0\u 003c/p\u003e\u003cp\u003eTalks between Antofagasta and smelters in China, the world’s biggest copper consumer, have been “tough and challenging” this year, one of the sources said.\u003c/p\u003e\u003cp\u003eThe sources declined to be identified or to name the smelter that agreed the deal because the negotiations were private.\u003c/p\u003e\u003cp\u003eJiangxi Copper, one of China’s biggest copper smelters and often the first to strike an annual TC/RC deal, had been due to meet with Antofagasta on Friday evening, three separate sources familiar with the matter said earlier.\u003c/p\u003e\u003cp\u003eThe two sides failed to reach agreement on the sidelines of the Asia Copper Week gathering in Shanghai last month, when an official from the China Nonferrous Metals Industry Association pushed back against “free and negative processing of copper concentrate.”\u003c/p\u003e\u003cp\u003eAntofagasta did not immediately respond to a request for comment.\u003c/p\u003e\u003cp\u003e(By Tom Daly, Pratima Desai, Amy Lv and Lewis Jackson; Editing by Kevin Liffey and Louise Heavens)\u003c/p\u003e","category":{"id":56,"name":"Mining","urlAlias":"/news/category/mining"},"title":"Antofagasta agrees zero copper processing charges for 2026 with Chinese smelter","teaserHeadline":null,"teaserSnippet":"Chilean miner Antofagasta has agreed treatment and refining charges (TC/RCs) for 2026 of $0 per ton and 0 cents per pound with a Chinese smelter, two sources with knowledge of the matter said on Friday.The deal, reached after protracted negotiations, compares to charges of $21.25 a ton and 2.125 cents per lb. for 2025 agreed last December and matches a mid-year deal between Antofagasta and some Chinese smelters at zero levels.","urlAlias":"/news/off-the-wire/2025-12-19/antofagasta-agrees-zero-copper-processing-charges-2026-chinese-smelter","source":{"name":"Reuters","subtitle":null,"description":null},"createdAt":"2025-12-19T15:42:02-0500","updatedAt":"2025-12-19T16:18:06-0500","imageUrl":null,"image":{"detail":{"default":{"srcset":"https://image-api.prod.kitco.com/image/7c613bc2-aa95-41fe-8c1c-16af9b51d040.png?top=15.494430693069\u0026left=0\u0026width=464\u0026height=261.01113861386\u0026scale_width=1920\u0026token=8a8fd0f329a5f096723c974e0c34fe4aa0c76565b2f8079483200be022f4d4ec"},"sources":{"teaser_small":{"srcset":"https://image-api.prod.kitco.com/image/7c613bc2-aa95-41fe-8c1c-16af9b51d040.png?top=15.494430693069\u0026left=0\u0026width=464\u0026height=261.01113861386\u0026scale_width=200\u0026token=e2124311b250b253c050999a2034c6c347f7829f291472c4117a6cbf0a9bfb24","media":"all and (min-width: 0px)"},"teaser_medium":{"srcset":"https://image-api.prod.kitco.com/image/7c613bc2-aa95-41fe-8c1c-16af9b51d040.png?top=15.494430693069\u0026left=0\u0026width=464\u0026height=261.01113861386\u0026scale_width=400\u0026token=4f7286d0134f4c0c4dcb9cfb79033f33ca692ed4441571d0803f2aac92b55bb0","media":"all and (min-width: 0px)"},"desktop":{"media":"all and (min-width: 1024px)","srcset":"https://image-api.prod.kitco.com/image/7c613bc2-aa95-41fe-8c1c-16af9b51d040.png?top=15.494430693069\u0026left=0\u0026width=464\u0026height=261.01113861386\u0026scale_width=1920\u0026token=8a8fd0f329a5f096723c974e0c34fe4aa0c76565b2f8079483200be022f4d4ec"},"mobile":{"media":"all and (min-width: 0px)","srcset":"https://image-api.prod.kitco.com/image/7c613bc2-aa95-41fe-8c1c-16af9b51d040.png?top=0\u0026left=86.006230529595\u0026width=291.98753894081\u0026height=292\u0026scale_width=768\u0026token=a12e103be7351dfb30ea48fc77a4d3aefb0328ee2d17901d1b6d8f51313742f2"},"tablet":{"media":"all and (min-width: 768px)","srcset":"https://image-api.prod.kitco.com/image/7c613bc2-aa95-41fe-8c1c-16af9b51d040.png?top=15.494430693069\u0026left=0\u0026width=464\u0026height=261.01113861386\u0026scale_width=1024\u0026token=1c65f0a140993f4e1c8becfcdc997b0a125961e4db3f825707644ea38f51e8cc"}}}},"featured":false,"legacyThumbnailImageUrl":null},{"id":214234,"__typename":"OffTheWire","body":"\u003cp\u003eRobust investment demand for silver, its inclusion on the US critical minerals list, and a wave of momentum buying have propelled the white metal to a fresh record high, setting prices up to close out 2025 at more than double the level at which they began.\u003c/p\u003e\u003cp\u003eSilver, which surpassed the $65 per ounce threshold for the first time on Wednesday, has gained more than 120% this year and is poised for its best annual performance on record per LSEG data, which dates back to 1982. The metal is outperforming safe-haven gold, which is on track to climb 64% in 2025.\u003c/p\u003e\u003cp\u003eSpot prices hit a record high of $66.87/oz on Wednesday.\u003c/p\u003e\u003cp\u003e“(The rally) is very much investment-driven at the moment. It’s got that strong fundamental background behind it … but these prices are being driven by investment and by speculation,” said Rhona O’Connell, head of market analysis at StoneX.\u003c/p\u003e\u003cp\u003eSilver’s robust fundamental backdrop includes a persistent supply deficit, and healthy demand prospects from the artificial intelligence data center, solar cell and electric vehicle industries.\u003c/p\u003e\u003cp\u003eThe metal also benefits from the same macroeconomic factors supporting gold, as well as safe-haven flows due to geopolitical and trade tensions.\u003c/p\u003e\u003cp\u003eLooking ahead, these factors, as well as less plentiful inventories outside the US, create “quite a supportive environment,” said Nitesh Shah, commodities strategist at WisdomTree.\u003c/p\u003e\u003cp\u003e“Silver prices could gain to something close to $75/oz for the end of next year,” he added.\u003c/p\u003e\u003cp\u003eThe metal’s inclusion on the US critical minerals list has also supported prices. Concerns that silver could be hit by tariffs prompted a wave of outflows to the US earlier this year, leading to tight liquidity in the London spot market.\u003c/p\u003e\u003cp\u003eDemand from India and China, coupled with momentum buying, have added to this perfect storm for the metal, analysts said.\u003c/p\u003e\u003cp\u003e“When there is a strong price performance, this really lures Chinese traders into the market, as evidenced by increasing trading volumes and increasing open interest on the exchanges,” said Julius Baer analyst Carsten Menke.\u003c/p\u003e\u003cp\u003eSome analysts remain bullish on silver, expecting the metal to break the $70/oz milestone next year, especially if US interest rate cuts support the appetite for precious metals.\u003c/p\u003e\u003cp\u003eHowever, others cautioned that the historically volatile metal remains vulnerable to steep corrections, especially in correlation to gold.\u003c/p\u003e\u003cp\u003e“If gold moves in either direction by x%, one should expect silver to move in the same direction by 2x% or 2.5x% because it’s a smaller market, it’s more volatile,” said O’Connell.\u003c/p\u003e\u003cp\u003e(By Kavya Balaraman, Noel John and Arunima Kumar; Editing by Rod Nickel)\u003c/p\u003e","category":{"id":56,"name":"Mining","urlAlias":"/news/category/mining"},"title":"Perfect storm of factors propels silver price to record high","teaserHeadline":null,"teaserSnippet":"Robust investment demand for silver, its inclusion on the US critical minerals list, and a wave of momentum buying have propelled the white metal to a fresh record high, setting prices up to close out 2025 at more than double the level at which they began.Silver, which surpassed the $65 per ounce threshold for the first time on Wednesday, has gained more than 120% this year and is poised for its best annual performance on record per LSEG data, which dates back to 1982. The metal is outperforming safe-haven gold, which is on track to climb 64% in 2025.","urlAlias":"/news/off-the-wire/2025-12-18/perfect-storm-factors-propels-silver-price-record-high","source":{"name":"Reuters","subtitle":null,"description":null},"createdAt":"2025-12-18T14:37:39-0500","updatedAt":"2025-12-18T14:39:57-0500","imageUrl":null,"image":{"det
